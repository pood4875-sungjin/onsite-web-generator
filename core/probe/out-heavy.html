<!doctype html>
<html lang="ko" data-motion="subtle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온사이트 — 볼륨 데모</title>
<style>
:root{
  --accent: #0066FF;
  --ink: #16181d;
  --ink-2: #5b6270;
  --bg: #ffffff;
  --bg-2: #f5f7fa;
  --line: #e6e9ef;
  --radius: 12px;
  --fs-h1: 44px;
  --fs-h2: 30px;
  --fs-body: 16px;
  --sp-2: 8px;
  --sp-4: 16px;
  --sp-6: 24px;
  --container: 1120px;
}
/* base scaffold — pack-agnostic minimal layout so probe is viewable */
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Apple SD Gothic Neo",sans-serif}
.container{max-width:var(--container);margin:0 auto;padding:0 24px}
.band{padding:64px 0} .band.alt{background:var(--bg-2)}
.center{text-align:center} h1{font-size:var(--fs-h1);margin:0 0 16px} .h-sec{font-size:var(--fs-h2)}
.btn{display:inline-block;padding:10px 18px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;margin-top:32px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:64px 0}
.hero.center{grid-template-columns:1fr;text-align:center}
.hero-media{width:100%;aspect-ratio:4/3;background:var(--bg-2);border-radius:var(--radius)}
.gnb{display:flex;align-items:center;gap:24px;padding:16px 24px;border-bottom:1px solid var(--line)}
.gnb nav{display:flex;gap:16px;flex:1} .gnb a{text-decoration:none;color:var(--ink-2)}
.footer{background:var(--bg-2);padding:48px 0;margin-top:48px} .row{display:flex;gap:12px}
</style>
</head>
<body>
<section class="sx" data-sec="nav"><div class="gnb "><div class="logo">ONSITE</div><nav><a href="#">제품</a><a href="#">요금</a></nav><a class="btn primary" href="/start">무료로 시작</a></div></section>
<section class="sx" data-sec="hero"><div class="container"><div class="hero "><div><div class="eyebrow">현장 업무 플랫폼</div><h1>현장의 모든 일, 하나로 연결됩니다</h1><p class="lead">메시지·일정·문서를 한 곳에서.</p><div class="row"><a class="btn primary" href="/start">무료로 시작하기</a></div></div><div class="hero-media placeholder"></div></div></div></section>
<section class="sx" data-sec="feature"><div class="band"><div class="container"><div class="center"><div class="eyebrow">Features</div><h2 class="h-sec">현장에 필요한 모든 것</h2></div><div class="grid"><div class="card"><h3>실시간 메시지</h3><p class="muted">읽음 확인까지.</p></div><div class="card"><h3>일정 관리</h3><p class="muted">팀 일정 공유.</p></div><div class="card"><h3>문서 보관</h3><p class="muted">안전하게.</p></div></div></div></div></section>
<section class="sx" data-sec="cta"><div class="band alt"><div class="container center"><h2 class="h-sec">지금 바로 시작하세요</h2><p class="sub">설치 없이 웹에서.</p><div class="row"><a class="btn primary" href="/contact">도입 문의하기</a></div></div></div></section>
<section class="sx" data-sec="footer"><div class="footer "><div class="container"><div class="fbrand">ONSITE</div><div class="fcols"><div class="fcol"><b>제품</b><a href="#">기능</a></div><div class="fcol"><b>회사</b><a href="#">소개</a></div></div></div></div></section>
</body>
</html>
