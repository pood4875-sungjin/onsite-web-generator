<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONSITE — Section Taxonomy Explorer</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
:root{
  --f-canvas:#0d0d0f;--f-s1:#1a1a1d;--f-s2:#26262a;
  --f-ink:#f5f5f7;--f-mut:#8a8a90;--f-line:rgba(255,255,255,.09);--f-line2:rgba(255,255,255,.16);
  --f-accent:#0099ff;--f-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --p0:#4ade80;--p1:#facc15;--p2:#8a8a90;
}
*{box-sizing:border-box}
body{margin:0;background:var(--f-canvas);color:var(--f-ink);
  font-family:"Inter",-apple-system,system-ui,"Apple SD Gothic Neo","Pretendard JP",sans-serif;
  font-feature-settings:"cv01","cv05","cv09","cv11","ss03","ss07";letter-spacing:-.011em}
a{color:inherit;text-decoration:none}

.top{position:sticky;top:0;z-index:20;background:var(--f-canvas);border-bottom:1px solid var(--f-line);padding:16px 24px}
.top .row1{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.brand{font-weight:700;font-size:16px}.brand span{color:var(--f-mut);font-weight:500;margin-left:8px;font-size:14px}
.links{display:flex;gap:8px}
.tbtn{border:1px solid var(--f-line);background:var(--f-s1);color:var(--f-ink);border-radius:100px;padding:7px 16px;font-size:14px;font-weight:500;cursor:pointer}
.tbtn:hover{background:var(--f-s2)}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;background:var(--f-s1);border:1px solid var(--f-line);color:var(--f-ink);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit}
.search::placeholder{color:var(--f-mut)}
.seg{display:flex;background:var(--f-s1);border:1px solid var(--f-line);border-radius:8px;padding:2px}
.seg button{border:none;background:none;padding:6px 12px;font-size:13px;font-weight:500;color:var(--f-mut);border-radius:6px;cursor:pointer}
.seg button.on{background:var(--f-s2);color:var(--f-ink)}
.count{color:var(--f-mut);font-size:13px;margin-left:auto;font-family:var(--f-mono)}

.wrap{padding:20px 24px 120px}
.catbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{border:1px solid var(--f-line);background:var(--f-s1);color:var(--f-mut);border-radius:100px;padding:5px 12px;font-size:12px;cursor:pointer}
.chip.on{background:var(--f-accent);color:#fff;border-color:transparent}
.chip:hover{color:var(--f-ink)}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;text-align:left;color:var(--f-mut);font-weight:600;font-size:12px;
  padding:10px 12px;border-bottom:1px solid var(--f-line2);background:var(--f-canvas)}
tbody td{padding:11px 12px;border-bottom:1px solid var(--f-line);vertical-align:top}
tbody tr:hover{background:var(--f-s1)}
.id{font-family:var(--f-mono);font-size:12px;color:var(--f-accent);white-space:nowrap;cursor:pointer}
.type{font-weight:600}
.cat{font-size:12px;color:var(--f-mut)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--f-mono);font-size:11px;color:var(--f-mut);background:var(--f-s1);border:1px solid var(--f-line);border-radius:5px;padding:2px 6px}
.vlist{color:var(--f-mut);font-size:12px}
.pri{font-weight:700;font-size:12px;font-family:var(--f-mono)}
.pri.P0{color:var(--p0)}.pri.P1{color:var(--p1)}.pri[class*="P0-manual"]{color:var(--p0)}
.fit{font-family:var(--f-mono);font-size:12px;color:var(--f-mut);white-space:nowrap}
.fit b{color:var(--f-ink)}
.exp{display:none}
.exp.show{display:table-row}
.exp td{background:var(--f-s1);color:var(--f-mut);font-size:12px;line-height:1.7}
.exp .kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px}
.exp .k{color:var(--f-mut)}.exp .v{color:var(--f-ink)}
.err{padding:40px;color:var(--f-mut);text-align:center}
.err code{color:var(--f-accent)}
@media(max-width:800px){.col-hide{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="row1">
    <div class="brand">ONSITE <span>Section Taxonomy Explorer</span></div>
    <div class="links">
      <a class="tbtn" href="../app/gallery.html">갤러리</a>
      <a class="tbtn" href="../app/builder.html">빌더</a>
    </div>
  </div>
  <div class="controls">
    <input class="search" id="search" placeholder="검색 — 타입·태그·목적…">
    <div class="seg" id="priSeg">
      <button class="on" data-p="all">전체</button>
      <button data-p="P0">P0</button>
      <button data-p="P1">P1</button>
    </div>
    <div class="seg" id="fitSeg">
      <button class="on" data-f="all">전체 적합도</button>
      <button data-f="product">제품소개</button>
      <button data-f="manual">매뉴얼</button>
      <button data-f="blog">블로그</button>
    </div>
    <span class="count" id="count"></span>
  </div>
</div>

<div class="wrap">
  <div class="catbar" id="catbar"></div>
  <table id="tbl">
    <thead><tr>
      <th>ID</th><th>Section Type</th><th class="col-hide">Variants</th>
      <th class="col-hide">Layout</th><th class="col-hide">Purpose</th>
      <th>Pri</th><th>Fit (P/M/B)</th><th class="col-hide">AI Tags</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="err" id="err" style="display:none"></div>
</div>

<script>
let DATA=null, cats=[], filterCat='all', filterPri='all', filterFit='all', query='';
const FITMAP={High:'H',Medium:'M',Low:'L'};

fetch('../sections/sections.json').then(r=>r.json()).then(d=>{DATA=d;init();})
.catch(e=>{
  document.getElementById('tbl').style.display='none';
  const el=document.getElementById('err');el.style.display='block';
  el.innerHTML='sections.json 로드 실패. <code>file://</code>로 열면 fetch가 막힙니다 — 로컬 서버로 여세요:<br><br><code>cd ~/onsite-web-generator && python3 -m http.server</code><br>→ <code>/docs/taxonomy.html</code>';
});

function init(){
  cats=DATA.categories;
  document.getElementById('catbar').innerHTML=
    `<div class="chip on" data-c="all">전체</div>`+
    cats.map(c=>`<div class="chip" data-c="${c.id}">${c.label}</div>`).join('');
  document.getElementById('catbar').addEventListener('click',e=>{
    const c=e.target.closest('.chip');if(!c)return;
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
    filterCat=c.dataset.c;render();
  });
  document.getElementById('priSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    document.querySelectorAll('#priSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filterPri=b.dataset.p;render();});
  document.getElementById('fitSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    document.querySelectorAll('#fitSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');filterFit=b.dataset.f;render();});
  document.getElementById('search').addEventListener('input',e=>{query=e.target.value.toLowerCase();render();});
  render();
}

function catLabel(id){return (cats.find(c=>c.id===id)||{}).label||id;}
function priBase(p){return p.startsWith('P0')?'P0':p;}
function match(s){
  if(filterCat!=='all'&&s.category!==filterCat)return false;
  if(filterPri!=='all'&&priBase(s.priority)!==filterPri)return false;
  if(filterFit!=='all'&&(s.fit[filterFit]!=='High'))return false;
  if(query){const hay=(s.id+' '+s.type+' '+s.purpose+' '+s.aiTags.join(' ')+' '+s.variants.join(' ')).toLowerCase();
    if(!hay.includes(query))return false;}
  return true;
}
function render(){
  const rows=DATA.sections.filter(match);
  document.getElementById('count').textContent=`${rows.length} / ${DATA.sections.length} 섹션`;
  document.getElementById('tbody').innerHTML=rows.map((s,i)=>{
    const f=s.fit;const fit=`<b>${FITMAP[f.product]}</b>/${FITMAP[f.manual]}/${FITMAP[f.blog]}`;
    const tags=s.aiTags.map(t=>`<span class="tag">#${t}</span>`).join('');
    return `<tr data-i="${i}">
      <td class="id" data-exp="${i}">${s.id}</td>
      <td><div class="type">${s.type}</div><div class="cat">${catLabel(s.category)}</div></td>
      <td class="col-hide vlist">${s.variants.join(', ')}</td>
      <td class="col-hide vlist">${s.layouts.join(', ')}</td>
      <td class="col-hide vlist">${s.purpose}</td>
      <td><span class="pri ${priBase(s.priority)}">${s.priority}</span></td>
      <td class="fit">${fit}</td>
      <td class="col-hide"><div class="tags">${tags}</div></td>
    </tr>
    <tr class="exp" id="exp-${i}"><td colspan="8">
      <div class="kv">
        <span class="k">Variants</span><span class="v">${s.variants.join(' · ')}</span>
        <span class="k">Layout</span><span class="v">${s.layouts.join(' · ')}</span>
        <span class="k">Purpose</span><span class="v">${s.purpose}</span>
        <span class="k">Content</span><span class="v">${s.contentElements.join(', ')}</span>
        <span class="k">UI</span><span class="v">${s.uiComponents.join(', ')||'—'}</span>
        <span class="k">Required</span><span class="v">${s.required.join(', ')}</span>
        <span class="k">Optional</span><span class="v">${s.optional.join(', ')||'—'}</span>
        <span class="k">적합도</span><span class="v">제품소개 ${s.fit.product} · 매뉴얼 ${s.fit.manual} · 블로그 ${s.fit.blog}</span>
        <span class="k">재사용 / 난이도</span><span class="v">${s.reuse} / ${s.difficulty}</span>
        <span class="k">AI Tags</span><span class="v">${s.aiTags.map(t=>'#'+t).join(' ')}</span>
      </div>
    </td></tr>`;
  }).join('')||`<tr><td colspan="8" style="padding:32px;color:var(--f-mut);text-align:center">결과 없음</td></tr>`;
  document.querySelectorAll('.id[data-exp]').forEach(el=>el.addEventListener('click',()=>{
    document.getElementById('exp-'+el.dataset.exp).classList.toggle('show');
  }));
}
</script>
</body>
</html>
