<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Happy Family Day — 장표 템플릿</title>
<!-- 팩 라이브 카탈로그 — packs.hfd.js를 직접 로드해 전 타입을 렌더한다.
     팩을 고치면 새로고침만 하면 최신. 우상단 컬러칩으로 4테마 전환. -->
</head>
<body>
<script src="../packs/ppt/packs.hfd.js"></script>
<script>
(function () {
  var d = hfdTemplateDeck();   // 13타입 1장씩
  // 포토 앨범 나머지 변형 2장
  d.slides.push({ type: 'photos', variant: 'grid', year: '2026년', title: '체험 부스\n미리 보기', caption: '포토존 · 플레이존 · 만들기 부스.\n연령별 프로그램을 준비했습니다.', foot: 'MIDAS', items: [{ label: '포토존' }, { label: '플레이존' }, { label: '만들기 부스' }] });
  d.slides.push({ type: 'photos', variant: 'frame', year: '2026년', title: '올해의 한 컷', items: [{ label: '대표 사진' }] });
  d.slides.push({ type: 'photos', variant: 'side', year: '2026년', title: '5월에 함께한\n해피 패밀리 데이', caption: '가족과 함께한 하루의 기록.\n포토존과 체험 부스의 순간들.', foot: 'MIDAS', items: [{ label: '대표 사진' }] });

  var labels = d.slides.map(function (s, i) {
    var lb = (window.HFD_TYPE_LABEL && HFD_TYPE_LABEL[s.type]) || s.type;
    if (s.type === 'photos') lb += ' · ' + (s.variant || 'wide');
    return (i + 1) + '. ' + lb + '  (' + s.type + ')';
  });

  var html = renderHfdDeck(d);
  var extra =
    '<style>' +
    '.ppt-stack{padding-top:70px!important}' +
    '.tpl-tag{width:1280px;align-self:center;margin:14px 0 -12px;font:700 13.5px/1 Pretendard,sans-serif;color:#4E5B55;letter-spacing:.02em}' +
    '.tplbar{position:fixed;left:16px;top:14px;z-index:41;font:800 14px/1.4 Pretendard,sans-serif;color:#17211C;' +
    'background:rgba(255,255,255,.9);backdrop-filter:blur(8px);padding:9px 14px;box-shadow:0 4px 18px rgba(10,20,15,.14)}' +
    '.tplbar small{display:block;font-weight:500;color:#8B968F;margin-top:2px}' +
    '</style>' +
    '<div class="tplbar">Happy Family Day — 장표 템플릿 ' + d.slides.length + '종<small>우상단 칩으로 컬러 전환 · 팩 수정 후 새로고침</small></div>' +
    '<scr' + 'ipt>(function(){var L=' + JSON.stringify(labels) + ';' +
    'var sl=document.querySelectorAll(".ppt-stack > .slide");' +
    'for(var i=0;i<sl.length;i++){var t=document.createElement("div");t.className="tpl-tag";t.textContent=L[i]||"";sl[i].parentNode.insertBefore(t,sl[i]);}})();</scr' + 'ipt>';
  html = html.replace('</body>', extra + '</body>');
  document.open(); document.write(html); document.close();
})();
</script>
</body>
</html>
