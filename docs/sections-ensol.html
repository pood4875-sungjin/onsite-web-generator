{background:var(--btng);background-size:220% 100%;background-position:0% 50%;color:#fff;transition:background-position .6s ease}\n.gbtn .lime:hover{background-position:100% 50%}\n.gbtn .ghost{border:1px solid var(--ink);color:var(--ink)}\n.gbtn .ghost:hover{background:var(--ink);color:#fff}\n.gbtn .white{background:#fff;color:var(--ink)}\n.gbtn .white:hover{background:var(--btng);background-size:220% 100%;color:#fff}\n.gbtn .wghost{border:1px solid #fff;color:#fff}\n.gbtn .wghost:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.7)}\n/* 리빌 */\n.rv{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}\n.rv.on{opacity:1;transform:none}\n/* 그라데이션 강조 어구 — 여러 단어가 하나의 그라로 연결 */\n.gt{background:var(--txtg);-webkit-background-clip:text;background-clip:text;color:transparent}\n.agenda .gt,.register .gt,.free .gt,.kv .gt{background-image:var(--txtgB)}\n/* gt는 단어 분해 없이 통째로 등장 — 자식 레이어 승격 시 그라 클립이 안 그려지는 문제 회피 */\nh2.wt .gt{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\nh2.wt.active .gt{opacity:1;transform:translate3d(0,0,0)}\n/* 타이틀 단어 스태거 등장(toss.im 참고) */\nh2.wt .w{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\nh2.wt.active .w{opacity:1;transform:translate3d(0,0,0)}\n\n/* ── 좌측 섹션 인디케이터(toss.im 대시 내비) ── */\n.snav{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .4s}\n.snav.vis{opacity:1;pointer-events:auto}\n.snav a{display:block;width:14px;height:2px;background:rgba(4,3,8,.25);transition:width .3s,background .3s}\n.snav a.on{width:26px;background:var(--ink)}\n.snav.ondark a{background:rgba(255,255,255,.4)}\n.snav.ondark a.on{background:#fff}\n\n/* ── GNB ─────────────────────────────── */\n.gnb{position:fixed;top:0;left:0;right:0;z-index:100;transition:background .35s,box-shadow .35s}\n.gnb .in{max-width:none;margin:0;padding:0 56px;height:72px;display:flex;align-items:center;gap:24px}\n.gnb .logo{font-size:21px;font-weight:700;color:#fff;letter-spacing:-.01em}\n.gnb nav{display:flex;gap:6px;margin-left:auto}\n.gnb nav a{padding:9px 14px;font-size:16px;font-weight:600;color:rgba(255,255,255,.85);transition:background .2s,color .2s}\n.gnb nav a:hover{color:var(--lime)}\n.gnb .cta{border-radius:0;background:var(--btng);background-size:220% 100%;background-position:0% 50%;color:#fff;font-size:16px;font-weight:700;padding:16px 22px;transition:background-position .6s ease}\n.gnb .cta:hover{background-position:100% 50%}\n.gnb.solid{background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}\n.gnb.solid .logo{color:var(--ink)}\n.gnb.solid nav a{color:var(--g)}\n.gnb.solid nav a:hover{color:var(--lime2)}\n\n/* ── 1. 히어로 KV — 풀블리드 영상 스크럽(원본 invite + 씨드 KV) ── */\n.kv{position:relative;height:320vh}\n.kv .stick{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--dark)}\n.kv .ph{position:absolute;inset:0}\n.kv .ph video{width:100%;height:100%;object-fit:cover}\n.kv .ov{position:absolute;inset:0;background:rgba(4,3,8,.66)}\n/* 라이트 스윕 — 프라이머리(라임·시안) 광선이 이따금 은은하게 지나감 */\n.kv .sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen}\n.kv .sheen i{position:absolute;top:-20%;bottom:-20%;left:0;width:44%;background:linear-gradient(100deg,transparent 0%,color-mix(in srgb,var(--lime) 6%,transparent) 35%,color-mix(in srgb,var(--sub) 10%,transparent) 50%,color-mix(in srgb,var(--lime) 5%,transparent) 65%,transparent 100%);filter:blur(36px);transform:translateX(-160%) skewX(-14deg);animation:sheenSweep 7.5s ease-in-out infinite;will-change:transform}\n.kv .sheen i.s2{width:24%;opacity:.7;animation-delay:3.8s}\n@keyframes sheenSweep{0%{transform:translateX(-160%) skewX(-14deg)}34%{transform:translateX(440%) skewX(-14deg)}100%{transform:translateX(440%) skewX(-14deg)}}\n.kv .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 24px;transform:translateY(-50px)}\n.kv h1{margin:0 0 34px;font-size:min(14.5vw,232px);font-weight:700;line-height:1.02;letter-spacing:-.02em;text-shadow:0 1px 10px rgba(0,0,0,.15)}\n.kv .klead{margin-bottom:56px;font-size:clamp(19px,2.4vw,40px);font-weight:500;color:rgba(255,255,255,.95);text-shadow:0 1px 6px rgba(0,0,0,.2)}\n.kv h1 .l{display:block}\n.kv .ent{opacity:0;transform:translateY(16px);transition:opacity .8s cubic-bezier(.2,.6,.2,1),transform .8s cubic-bezier(.2,.6,.2,1)}\n.kv.ready .ent{opacity:1;transform:none}\n.kv.ready .kvmeta{opacity:.7}\n.kv.ready .klead{opacity:.8}\n.kv.ready .d2{transition-delay:.35s}\n.kv.ready .d4{transition-delay:.6s}\n.kv h1 .w{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\n.kv.ready h1 .w{opacity:1;transform:translate3d(0,0,0)}\n.kv .gbtn{justify-content:center}\n.kv .kvmeta{position:absolute;left:0;right:0;bottom:32px;display:flex;justify-content:space-between;align-items:center;padding:0 56px;color:rgba(255,255,255,.85);font-size:18px;font-weight:500;letter-spacing:.01em}\n.kv .kvmeta .mid{position:absolute;left:50%;transform:translateX(-50%)}\n.kv .sub2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;opacity:0;pointer-events:none;padding:0 24px}\n\n/* ── 1.5 KV 후반 — 어두워지며 미션 멘트 툭(toss insurance 미션 스테이지 참고) ── */\n.kv .sub2 .tx{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;text-align:center;height:100%}\n.kv .sub2 .eb{font-size:20px;font-weight:600}\n.kv .sub2 p{color:#fff;font-size:34px;font-weight:600;line-height:1.55;text-shadow:0 1px 10px rgba(0,0,0,.15)}\n\n/* ── 3. 앤서 — 흰 배경·그래픽 카드 3 + 하단 텍스트(토스증권 카드 리스트 스타일) ── */\n.answer{position:relative;z-index:2;margin-top:-100vh;min-height:100vh;padding:160px 0;background:#fff}\n.answer h2{text-align:center;color:var(--ink);margin-bottom:60px}\n.answer .cards{display:flex;gap:0}\n.answer .card{position:relative;flex:1;height:520px;overflow:hidden;cursor:pointer;background:var(--dark);opacity:0;transform:translateY(90px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}\n.answer .cards.active .card{opacity:1;transform:none}\n.answer .cards.active .card:nth-child(2){transition-delay:.45s}\n.answer .cards.active .card:nth-child(3){transition-delay:.9s}\n.answer .card > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .5s,transform .7s cubic-bezier(.2,.6,.2,1);animation:kvIdle 14s ease-in-out infinite alternate;will-change:transform}\n.answer .card:nth-child(2) > img{animation-duration:18s;animation-delay:-6s}\n.answer .card:nth-child(3) > img{animation-duration:22s;animation-delay:-11s}\n.answer .card:hover > img{filter:brightness(1.15);animation-play-state:paused;transform:scale(1.08)}\n@keyframes kvIdle{from{transform:scale(1.06) translate(1.2%,1%)}to{transform:scale(1.13) translate(-1.5%,-1.5%)}}\n.answer .go{position:absolute;right:26px;bottom:26px;width:52px;height:52px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);color:#fff;font-size:19px;font-weight:700;transition:background .25s;z-index:2;will-change:transform;pointer-events:none}\n.answer .card:hover .go{background:rgba(255,255,255,.26)}\n.answer .ctx{position:absolute;left:40px;right:96px;top:40px;z-index:1;text-align:left}\n.answer .ctx b{display:block;margin-bottom:14px;color:#fff;font-size:32px;font-weight:600;line-height:1.3}\n.answer .ctx p{color:rgba(255,255,255,.72);font-size:15px;line-height:1.6}\n\n/* ── 6. 스킬 탭 5종(원본 이식: 좌 텍스트 500px 소프트 + 우 이미지) ── */\n.skill{padding:160px 0;background:linear-gradient(180deg,#fff 0%,#F2F7FF 55%,#EDF4FF 100%)}\n.skill h2{text-align:center}\n.skill .tabs{display:flex;margin:4.5vw 0 30px;width:100%}\n.skill .tabs button{position:relative;flex:1;padding-bottom:14px;border:0;border-bottom:2px solid #F0F1F3;background:none;color:#C6CCD4;font-family:inherit;font-size:18px;font-weight:500;cursor:pointer;transition:color .2s,border-color .2s}\n.skill .tabs button.active{border-color:#F0F1F3;color:var(--ink);font-weight:600}\n.skill .tabs button .prog{position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--bgray)}\n#skillPanes{position:relative;height:400px}\n.skill .pane{position:absolute;inset:0;display:flex;height:400px;opacity:0;transform:translateY(10px);transition:opacity .45s cubic-bezier(.2,.6,.2,1),transform .45s cubic-bezier(.2,.6,.2,1);pointer-events:none}\n.skill .pane.onv{opacity:1;transform:none;pointer-events:auto}\n.skill .tb{display:flex;flex-direction:column;justify-content:center;width:500px;flex:none;padding:0 48px 0 60px;background:#fff}\n.skill .tb .badge{width:max-content;margin-bottom:12px;padding:0 8px;background:var(--lime);color:var(--onp);font-size:14px;font-weight:600;height:25px;line-height:25px;letter-spacing:-.28px}\n.skill .tb strong{margin-bottom:26px;font-size:30px;font-weight:600;line-height:40px}\n.skill .tb p{color:var(--g);font-size:16px;line-height:26px;letter-spacing:-.32px}\n.skill .pane img{width:calc(100% - 500px);height:100%;object-fit:cover}\n\n/* ── 7. 피처 — 좌 고정 타이틀 + 우 카드 3 스크롤(toss insurance 패턴) ── */\n.feature{padding:180px 0 200px;background:linear-gradient(180deg,#EDF4FF 0%,#E8F1FF 50%,#F4F9FF 100%)}\n.feature .fgrid{display:flex;gap:110px;align-items:flex-start}\n.feature .fleft{width:430px;flex:none;position:sticky;top:130px}\n.feature .fleft h2{font-size:36px}\n.feature .fleft p.sub{margin:20px 0 0;color:var(--g2);font-size:18px;line-height:1.6}\n.feature .fright{flex:1;display:flex;flex-direction:column;gap:96px;min-width:0}\n.feature .fitem{border-top:1px solid #d9e4f3;padding-top:30px}\n.feature .fitem b{display:block;font-size:25px;font-weight:600;line-height:1.4}\n.feature .fitem > p{margin:12px 0 38px;color:var(--g2);font-size:17px;line-height:1.65}\n.feature .fcard{overflow:hidden;background:var(--bgsoft)}\n.feature .fcard img{width:100%;height:360px;object-fit:cover;display:block}\n\n/* ── 7.5 어젠다 — 다크 리스트 + 클릭 시 우측 상세 드로어 ── */\n.agenda{padding:160px 0;background:var(--dark)}\n.agenda h2{color:#fff;text-align:center}\n.agenda .asub{margin:16px 0 56px;text-align:center;color:rgba(255,255,255,.55);font-size:17px}\n.agenda .alist{max-width:1060px;margin:0 auto}\n.agenda .alist li{display:flex;align-items:center;gap:28px;padding:26px 18px;border-bottom:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background .25s,padding .25s}\n.agenda .alist.rv li{opacity:0;transform:translateY(26px);transition:opacity .6s cubic-bezier(.2,.6,.2,1),transform .6s cubic-bezier(.2,.6,.2,1),background .25s,padding .25s}\n.agenda .alist.rv.on li{opacity:1;transform:none}\n.agenda .alist.rv.on li:nth-child(2){transition-delay:.08s}\n.agenda .alist.rv.on li:nth-child(3){transition-delay:.16s}\n.agenda .alist.rv.on li:nth-child(4){transition-delay:.24s}\n.agenda .alist.rv.on li:nth-child(5){transition-delay:.32s}\n.agenda .alist li:first-child{border-top:1px solid rgba(255,255,255,.12)}\n.agenda .alist li:hover{background:rgba(255,255,255,.06);padding-left:26px}\n.agenda .at{flex:none;width:128px;color:rgba(255,255,255,.75);font-size:17px;font-weight:600;white-space:nowrap}\n.agenda .am{flex:1}\n.agenda .am b{display:block;color:#fff;font-size:19px;font-weight:600;line-height:1.4;transition:color .25s}\n.agenda .am span{display:block;margin-top:4px;color:rgba(255,255,255,.5);font-size:14px}\n. 220% 100%;background-position:0% 50%;color:#fff;transition:background-position .6s ease}\n.gbtn .lime:hover{background-position:100% 50%}\n.gbtn .ghost{border:1px solid var(--ink);color:var(--ink)}\n.gbtn .ghost:hover{background:var(--ink);color:#fff}\n.gbtn .white{background:#fff;color:var(--ink)}\n.gbtn .white:hover{background:var(--btng);background-size:220% 100%;color:#fff}\n.gbtn .wghost{border:1px solid #fff;color:#fff}\n.gbtn .wghost:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.7)}\n/* 리빌 */\n.rv{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}\n.rv.on{opacity:1;transform:none}\n/* 그라데이션 강조 어구 — 여러 단어가 하나의 그라로 연결 */\n.gt{background:var(--txtg);-webkit-background-clip:text;background-clip:text;color:transparent}\n.agenda .gt,.register .gt,.free .gt,.kv .gt{background-image:var(--txtgB)}\n/* gt는 단어 분해 없이 통째로 등장 — 자식 레이어 승격 시 그라 클립이 안 그려지는 문제 회피 */\nh2.wt .gt{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\nh2.wt.active .gt{opacity:1;transform:translate3d(0,0,0)}\n/* 타이틀 단어 스태거 등장(toss.im 참고) */\nh2.wt .w{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\nh2.wt.active .w{opacity:1;transform:translate3d(0,0,0)}\n\n/* ── 좌측 섹션 인디케이터(toss.im 대시 내비) ── */\n.snav{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .4s}\n.snav.vis{opacity:1;pointer-events:auto}\n.snav a{display:block;width:14px;height:2px;background:rgba(4,3,8,.25);transition:width .3s,background .3s}\n.snav a.on{width:26px;background:var(--ink)}\n.snav.ondark a{background:rgba(255,255,255,.4)}\n.snav.ondark a.on{background:#fff}\n\n/* ── GNB ─────────────────────────────── */\n.gnb{position:fixed;top:0;left:0;right:0;z-index:100;transition:background .35s,box-shadow .35s}\n.gnb .in{max-width:none;margin:0;padding:0 56px;height:72px;display:flex;align-items:center;gap:24px}\n.gnb .logo{font-size:21px;font-weight:700;color:#fff;letter-spacing:-.01em}\n.gnb nav{display:flex;gap:6px;margin-left:auto}\n.gnb nav a{padding:9px 14px;font-size:16px;font-weight:600;color:rgba(255,255,255,.85);transition:background .2s,color .2s}\n.gnb nav a:hover{color:var(--lime)}\n.gnb .cta{border-radius:0;background:var(--btng);background-size:220% 100%;background-position:0% 50%;color:#fff;font-size:16px;font-weight:700;padding:16px 22px;transition:background-position .6s ease}\n.gnb .cta:hover{background-position:100% 50%}\n.gnb.solid{background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}\n.gnb.solid .logo{color:var(--ink)}\n.gnb.solid nav a{color:var(--g)}\n.gnb.solid nav a:hover{color:var(--lime2)}\n\n/* ── 1. 히어로 KV — 풀블리드 영상 스크럽(원본 invite + 씨드 KV) ── */\n.kv{position:relative;height:320vh}\n.kv .stick{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--dark)}\n.kv .ph{position:absolute;inset:0}\n.kv .ph video{width:100%;height:100%;object-fit:cover}\n.kv .ov{position:absolute;inset:0;background:rgba(4,3,8,.66)}\n/* 라이트 스윕 — 프라이머리(라임·시안) 광선이 이따금 은은하게 지나감 */\n.kv .sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen}\n.kv .sheen i{position:absolute;top:-20%;bottom:-20%;left:0;width:44%;background:linear-gradient(100deg,transparent 0%,color-mix(in srgb,var(--lime) 6%,transparent) 35%,color-mix(in srgb,var(--sub) 10%,transparent) 50%,color-mix(in srgb,var(--lime) 5%,transparent) 65%,transparent 100%);filter:blur(36px);transform:translateX(-160%) skewX(-14deg);animation:sheenSweep 7.5s ease-in-out infinite;will-change:transform}\n.kv .sheen i.s2{width:24%;opacity:.7;animation-delay:3.8s}\n@keyframes sheenSweep{0%{transform:translateX(-160%) skewX(-14deg)}34%{transform:translateX(440%) skewX(-14deg)}100%{transform:translateX(440%) skewX(-14deg)}}\n.kv .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 24px;transform:translateY(-50px)}\n.kv h1{margin:0 0 34px;font-size:min(14.5vw,232px);font-weight:700;line-height:1.02;letter-spacing:-.02em;text-shadow:0 1px 10px rgba(0,0,0,.15)}\n.kv .klead{margin-bottom:56px;font-size:clamp(19px,2.4vw,40px);font-weight:500;color:rgba(255,255,255,.95);text-shadow:0 1px 6px rgba(0,0,0,.2)}\n.kv h1 .l{display:block}\n.kv .ent{opacity:0;transform:translateY(16px);transition:opacity .8s cubic-bezier(.2,.6,.2,1),transform .8s cubic-bezier(.2,.6,.2,1)}\n.kv.ready .ent{opacity:1;transform:none}\n.kv.ready .kvmeta{opacity:.7}\n.kv.ready .klead{opacity:.8}\n.kv.ready .d2{transition-delay:.35s}\n.kv.ready .d4{transition-delay:.6s}\n.kv h1 .w{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\n.kv.ready h1 .w{opacity:1;transform:translate3d(0,0,0)}\n.kv .gbtn{justify-content:center}\n.kv .kvmeta{position:absolute;left:0;right:0;bottom:32px;display:flex;justify-content:space-between;align-items:center;padding:0 56px;color:rgba(255,255,255,.85);font-size:18px;font-weight:500;letter-spacing:.01em}\n.kv .kvmeta .mid{position:absolute;left:50%;transform:translateX(-50%)}\n.kv .sub2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;opacity:0;pointer-events:none;padding:0 24px}\n\n/* ── 1.5 KV 후반 — 어두워지며 미션 멘트 툭(toss insurance 미션 스테이지 참고) ── */\n.kv .sub2 .tx{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;text-align:center;height:100%}\n.kv .sub2 .eb{font-size:20px;font-weight:600}\n.kv .sub2 p{color:#fff;font-size:34px;font-weight:600;line-height:1.55;text-shadow:0 1px 10px rgba(0,0,0,.15)}\n\n/* ── 3. 앤서 — 흰 배경·그래픽 카드 3 + 하단 텍스트(토스증권 카드 리스트 스타일) ── */\n.answer{position:relative;z-index:2;margin-top:-100vh;min-height:100vh;padding:160px 0;background:#fff}\n.answer h2{text-align:center;color:var(--ink);margin-bottom:60px}\n.answer .cards{display:flex;gap:0}\n.answer .card{position:relative;flex:1;height:520px;overflow:hidden;cursor:pointer;background:var(--dark);opacity:0;transform:translateY(90px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}\n.answer .cards.active .card{opacity:1;transform:none}\n.answer .cards.active .card:nth-child(2){transition-delay:.45s}\n.answer .cards.active .card:nth-child(3){transition-delay:.9s}\n.answer .card > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .5s,transform .7s cubic-bezier(.2,.6,.2,1);animation:kvIdle 14s ease-in-out infinite alternate;will-change:transform}\n.answer .card:nth-child(2) > img{animation-duration:18s;animation-delay:-6s}\n.answer .card:nth-child(3) > img{animation-duration:22s;animation-delay:-11s}\n.answer .card:hover > img{filter:brightness(1.15);animation-play-state:paused;transform:scale(1.08)}\n@keyframes kvIdle{from{transform:scale(1.06) translate(1.2%,1%)}to{transform:scale(1.13) translate(-1.5%,-1.5%)}}\n.answer .go{position:absolute;right:26px;bottom:26px;width:52px;height:52px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);color:#fff;font-size:19px;font-weight:700;transition:background .25s;z-index:2;will-change:transform;pointer-events:none}\n.answer .card:hover .go{background:rgba(255,255,255,.26)}\n.answer .ctx{position:absolute;left:40px;right:96px;top:40px;z-index:1;text-align:left}\n.answer .ctx b{display:block;margin-bottom:14px;color:#fff;font-size:32px;font-weight:600;line-height:1.3}\n.answer .ctx p{color:rgba(255,255,255,.72);font-size:15px;line-height:1.6}\n\n/* ── 6. 스킬 탭 5종(원본 이식: 좌 텍스트 500px 소프트 + 우 이미지) ── */\n.skill{padding:160px 0;background:linear-gradient(180deg,#fff 0%,#F2F7FF 55%,#EDF4FF 100%)}\n.skill h2{text-align:center}\n.skill .tabs{display:flex;margin:4.5vw 0 30px;width:100%}\n.skill .tabs button{position:relative;flex:1;padding-bottom:14px;border:0;border-bottom:2px solid #F0F1F3;background:none;color:#C6CCD4;font-family:inherit;font-size:18px;font-weight:500;cursor:pointer;transition:color .2s,border-color .2s}\n.skill .tabs button.active{border-color:#F0F1F3;color:var(--ink);font-weight:600}\n.skill .tabs button .prog{position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--bgray)}\n#skillPanes{position:relative;height:400px}\n.skill .pane{position:absolute;inset:0;display:flex;height:400px;opacity:0;transform:translateY(10px);transition:opacity .45s cubic-bezier(.2,.6,.2,1),transform .45s cubic-bezier(.2,.6,.2,1);pointer-events:none}\n.skill .pane.onv{opacity:1;transform:none;pointer-events:auto}\n.skill .tb{display:flex;flex-direction:column;justify-content:center;width:500px;flex:none;padding:0 48px 0 60px;background:#fff}\n.skill .tb .badge{width:max-content;margin-bottom:12px;padding:0 8px;background:var(--lime);color:var(--onp);font-size:14px;font-weight:600;height:25px;line-height:25px;letter-spacing:-.28px}\n.skill .tb strong{margin-bottom:26px;font-size:30px;font-weight:600;line-height:40px}\n.skill .tb p{color:var(--g);font-size:16px;line-height:26px;letter-spacing:-.32px}\n.skill .pane img{width:calc(100% - 500px);height:100%;object-fit:cover}\n\n/* ── 7. 피처 — 좌 고정 타이틀 + 우 카드 3 스크롤(toss insurance 패턴) ── */\n.feature{padding:180px 0 200px;background:linear-gradient(180deg,#EDF4FF 0%,#E8F1FF 50%,#F4F9FF 100%)}\n.feature .fgrid{display:flex;gap:110px;align-items:flex-start}\n.feature .fleft{width:430px;flex:none;position:sticky;top:130px}\n.feature .fleft h2{font-size:36px}\n.feature .fleft p.sub{margin:20px 0 0;color:var(--g2);font-size:18px;line-height:1.6}\n.feature .fright{flex:1;display:flex;flex-direction:column;gap:96px;min-width:0}\n.feature .fitem{border-top:1px solid #d9e4f3;padding-top:30px}\n.feature .fitem b{display:block;font-size:25px;font-weight:600;line-height:1.4}\n.feature .fitem > p{margin:12px 0 38px;color:var(--g2);font-size:17px;line-height:1.65}\n.feature .fcard{overflow:hidden;background:var(--bgsoft)}\n.feature .fcard img{width:100%;height:360px;object-fit:cover;display:block}\n\n/* ── 7.5 어젠다 — 다크 리스트 + 클릭 시 우측 상세 드로어 ── */\n.agenda{padding:160px 0;background:var(--dark)}\n.agenda h2{color:#fff;text-align:center}\n.agenda .asub{margin:16px 0 56px;text-align:center;color:rgba(255,255,255,.55);font-size:17px}\n.agenda .alist{max-width:1060px;margin:0 auto}\n.agenda .alist li{display:flex;align-items:center;gap:28px;padding:26px 18px;border-bottom:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background .25s,padding .25s}\n.agenda .alist.rv li{opacity:0;transform:translateY(26px);transition:opacity .6s cubic-bezier(.2,.6,.2,1),transform .6s cubic-bezier(.2,.6,.2,1),background .25s,padding .25s}\n.agenda .alist.rv.on li{opacity:1;transform:none}\n.agenda .alist.rv.on li:nth-child(2){transition-delay:.08s}\n.agenda .alist.rv.on li:nth-child(3){transition-delay:.16s}\n.agenda .alist.rv.on li:nth-child(4){transition-delay:.24s}\n.agenda .alist.rv.on li:nth-child(5){transition-delay:.32s}\n.agenda .alist li:first-child{border-top:1px solid rgba(255,255,255,.12)}\n.agenda .alist li:hover{background:rgba(255,255,255,.06);padding-left:26px}\n.agenda .at{flex:none;width:128px;color:rgba(255,255,255,.75);font-size:17px;font-weight:600;white-space:nowrap}\n.agenda .am{flex:1}\n.agenda .am b{display:block;color:#fff;font-size:19px;font-weight:600;line-height:1.4;transition:color .25s}\n.agenda .am span{display:block;margin-top:4px;color:rgba(255,255,255,.5);font-size:14px}\n.agenda .chev{color:rgba(255,255,255,.45) -blue2:#00479E; --navy:#00054D;\n  --dark:#040308; --ink:#222; --bgray:#4E5968; --g:#444; --g2:#666; --g3:#999; --line:#DEDEDE; --bgsoft:#F6F9FE;\n}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Apple SD Gothic Neo\",sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow-x:clip}\nimg,video{display:block;max-width:100%}\na{text-decoration:none;color:inherit}\nul{list-style:none}\n.df{font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Apple SD Gothic Neo\",sans-serif}\n.wrap{max-width:1320px;margin:0 auto;padding:0 28px}\nh2.tt{font-size:clamp(44px,4.8vw,84px);line-height:1.2;letter-spacing:-.02em}\nh2 .lw{font-weight:500}\nh2 .hw{font-weight:700}\n/* 공용 버튼 — 원본 group_btn a: 225~286×64, 각진, 라임/아웃라인 */\n.gbtn{display:flex;gap:20px}\n.gbtn a{border-radius:0;display:flex;align-items:center;justify-content:center;gap:8px;width:auto;height:56px;padding:0 34px;font-size:18px;font-weight:600;letter-spacing:-.36px;transition:.3s;cursor:pointer}\n.gbtn a .arr{font-weight:700;transition:transform .3s}\n.gbtn a:hover .arr{transform:translateX(4px)}\n.gbtn .lime{background:var(--btng);background-size:220% 100%;background-position:0% 50%;color:#fff;transition:background-position .6s ease}\n.gbtn .lime:hover{background-position:100% 50%}\n.gbtn .ghost{border:1px solid var(--ink);color:var(--ink)}\n.gbtn .ghost:hover{background:var(--ink);color:#fff}\n.gbtn .white{background:#fff;color:var(--ink)}\n.gbtn .white:hover{background:var(--btng);background-size:220% 100%;color:#fff}\n.gbtn .wghost{border:1px solid #fff;color:#fff}\n.gbtn .wghost:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.7)}\n/* 리빌 */\n.rv{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}\n.rv.on{opacity:1;transform:none}\n/* 그라데이션 강조 어구 — 여러 단어가 하나의 그라로 연결 */\n.gt{background:var(--txtg);-webkit-background-clip:text;background-clip:text;color:transparent}\n.agenda .gt,.register .gt,.free .gt,.kv .gt{background-image:var(--txtgB)}\n/* gt는 단어 분해 없이 통째로 등장 — 자식 레이어 승격 시 그라 클립이 안 그려지는 문제 회피 */\nh2.wt .gt{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\nh2.wt.active .gt{opacity:1;transform:translate3d(0,0,0)}\n/* 타이틀 단어 스태거 등장(toss.im 참고) */\nh2.wt .w{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\nh2.wt.active .w{opacity:1;transform:translate3d(0,0,0)}\n\n/* ── 좌측 섹션 인디케이터(toss.im 대시 내비) ── */\n.snav{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .4s}\n.snav.vis{opacity:1;pointer-events:auto}\n.snav a{display:block;width:14px;height:2px;background:rgba(4,3,8,.25);transition:width .3s,background .3s}\n.snav a.on{width:26px;background:var(--ink)}\n.snav.ondark a{background:rgba(255,255,255,.4)}\n.snav.ondark a.on{background:#fff}\n\n/* ── GNB ─────────────────────────────── */\n.gnb{position:fixed;top:0;left:0;right:0;z-index:100;transition:background .35s,box-shadow .35s}\n.gnb .in{max-width:none;margin:0;padding:0 56px;height:72px;display:flex;align-items:center;gap:24px}\n.gnb .logo{font-size:21px;font-weight:700;color:#fff;letter-spacing:-.01em}\n.gnb nav{display:flex;gap:6px;margin-left:auto}\n.gnb nav a{padding:9px 14px;font-size:16px;font-weight:600;color:rgba(255,255,255,.85);transition:background .2s,color .2s}\n.gnb nav a:hover{color:var(--lime)}\n.gnb .cta{border-radius:0;background:var(--btng);background-size:220% 100%;background-position:0% 50%;color:#fff;font-size:16px;font-weight:700;padding:16px 22px;transition:background-position .6s ease}\n.gnb .cta:hover{background-position:100% 50%}\n.gnb.solid{background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}\n.gnb.solid .logo{color:var(--ink)}\n.gnb.solid nav a{color:var(--g)}\n.gnb.solid nav a:hover{color:var(--lime2)}\n\n/* ── 1. 히어로 KV — 풀블리드 영상 스크럽(원본 invite + 씨드 KV) ── */\n.kv{position:relative;height:320vh}\n.kv .stick{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--dark)}\n.kv .ph{position:absolute;inset:0}\n.kv .ph video{width:100%;height:100%;object-fit:cover}\n.kv .ov{position:absolute;inset:0;background:rgba(4,3,8,.66)}\n/* 라이트 스윕 — 프라이머리(라임·시안) 광선이 이따금 은은하게 지나감 */\n.kv .sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen}\n.kv .sheen i{position:absolute;top:-20%;bottom:-20%;left:0;width:44%;background:linear-gradient(100deg,transparent 0%,color-mix(in srgb,var(--lime) 6%,transparent) 35%,color-mix(in srgb,var(--sub) 10%,transparent) 50%,color-mix(in srgb,var(--lime) 5%,transparent) 65%,transparent 100%);filter:blur(36px);transform:translateX(-160%) skewX(-14deg);animation:sheenSweep 7.5s ease-in-out infinite;will-change:transform}\n.kv .sheen i.s2{width:24%;opacity:.7;animation-delay:3.8s}\n@keyframes sheenSweep{0%{transform:translateX(-160%) skewX(-14deg)}34%{transform:translateX(440%) skewX(-14deg)}100%{transform:translateX(440%) skewX(-14deg)}}\n.kv .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 24px;transform:translateY(-50px)}\n.kv h1{margin:0 0 34px;font-size:min(14.5vw,232px);font-weight:700;line-height:1.02;letter-spacing:-.02em;text-shadow:0 1px 10px rgba(0,0,0,.15)}\n.kv .klead{margin-bottom:56px;font-size:clamp(19px,2.4vw,40px);font-weight:500;color:rgba(255,255,255,.95);text-shadow:0 1px 6px rgba(0,0,0,.2)}\n.kv h1 .l{display:block}\n.kv .ent{opacity:0;transform:translateY(16px);transition:opacity .8s cubic-bezier(.2,.6,.2,1),transform .8s cubic-bezier(.2,.6,.2,1)}\n.kv.ready .ent{opacity:1;transform:none}\n.kv.ready .kvmeta{opacity:.7}\n.kv.ready .klead{opacity:.8}\n.kv.ready .d2{transition-delay:.35s}\n.kv.ready .d4{transition-delay:.6s}\n.kv h1 .w{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\n.kv.ready h1 .w{opacity:1;transform:translate3d(0,0,0)}\n.kv .gbtn{justify-content:center}\n.kv .kvmeta{position:absolute;left:0;right:0;bottom:32px;display:flex;justify-content:space-between;align-items:center;padding:0 56px;color:rgba(255,255,255,.85);font-size:18px;font-weight:500;letter-spacing:.01em}\n.kv .kvmeta .mid{position:absolute;left:50%;transform:translateX(-50%)}\n.kv .sub2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;opacity:0;pointer-events:none;padding:0 24px}\n\n/* ── 1.5 KV 후반 — 어두워지며 미션 멘트 툭(toss insurance 미션 스테이지 참고) ── */\n.kv .sub2 .tx{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;text-align:center;height:100%}\n.kv .sub2 .eb{font-size:20px;font-weight:600}\n.kv .sub2 p{color:#fff;font-size:34px;font-weight:600;line-height:1.55;text-shadow:0 1px 10px rgba(0,0,0,.15)}\n\n/* ── 3. 앤서 — 흰 배경·그래픽 카드 3 + 하단 텍스트(토스증권 카드 리스트 스타일) ── */\n.answer{position:relative;z-index:2;margin-top:-100vh;min-height:100vh;padding:160px 0;background:#fff}\n.answer h2{text-align:center;color:var(--ink);margin-bottom:60px}\n.answer .cards{display:flex;gap:0}\n.answer .card{position:relative;flex:1;height:520px;overflow:hidden;cursor:pointer;background:var(--dark);opacity:0;transform:translateY(90px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}\n.answer .cards.active .card{opacity:1;transform:none}\n.answer .cards.active .card:nth-child(2){transition-delay:.45s}\n.answer .cards.active .card:nth-child(3){transition-delay:.9s}\n.answer .card > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .5s,transform .7s cubic-bezier(.2,.6,.2,1);animation:kvIdle 14s ease-in-out infinite alternate;will-change:transform}\n.answer .card:nth-child(2) > img{animation-duration:18s;animation-delay:-6s}\n.answer .card:nth-child(3) > img{animation-duration:22s;animation-delay:-11s}\n.answer .card:hover > img{filter:brightness(1.15);animation-play-state:paused;transform:scale(1.08)}\n@keyframes kvIdle{from{transform:scale(1.06) translate(1.2%,1%)}to{transform:scale(1.13) translate(-1.5%,-1.5%)}}\n.answer .go{position:absolute;right:26px;bottom:26px;width:52px;height:52px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);color:#fff;font-size:19px;font-weight:700;transition:background .25s;z-index:2;will-change:transform;pointer-events:none}\n.answer .card:hover .go{background:rgba(255,255,255,.26)}\n.answer .ctx{position:absolute;left:40px;right:96px;top:40px;z-index:1;text-align:left}\n.answer .ctx b{display:block;margin-bottom:14px;color:#fff;font-size:32px;font-weight:600;line-height:1.3}\n.answer .ctx p{color:rgba(255,255,255,.72);font-size:15px;line-height:1.6}\n\n/* ── 6. 스킬 탭 5종(원본 이식: 좌 텍스트 500px 소프트 + 우 이미지) ── */\n.skill{padding:160px 0;background:linear-gradient(180deg,#fff 0%,#F2F7FF 55%,#EDF4FF 100%)}\n.skill h2{text-align:center}\n.skill .tabs{display:flex;margin:4.5vw 0 30px;width:100%}\n.skill .tabs button{position:relative;flex:1;padding-bottom:14px;border:0;border-bottom:2px solid #F0F1F3;background:none;color:#C6CCD4;font-family:inherit;font-size:18px;font-weight:500;cursor:pointer;transition:color .2s,border-color .2s}\n.skill .tabs button.active{border-color:#F0F1F3;color:var(--ink);font-weight:600}\n.skill .tabs button .prog{position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--bgray)}\n#skillPanes{position:relative;height:400px}\n.skill .pane{position:absolute;inset:0;display:flex;height:400px;opacity:0;transform:translateY(10px);transition:opacity .45s cubic-bezier(.2,.6,.2,1),transform .45s cubic-bezier(.2,.6,.2,1);pointer-events:none}\n.skill .pane.onv{opacity:1;transform:none;pointer-events:auto}\n.skill .tb{display:flex;flex-direction:column;justify-content:center;width:500px;flex:none;padding:0 48px 0 60px;background:#fff}\n.skill .tb .badge{width:max-content;margin-bottom:12px;padding:0 8px;background:var(--lime);color:var(--onp);font-size:14px;font-weight:600;height:25px;line-height:25px;letter-spacing:-.28px}\n.skill .tb strong{margin-bottom:26px;font-size:30px;font-weight:600;line-height:40px}\n.skill .tb p{color:var(--g);font-size:16px;line-height:26px;letter-spacing:-.32px}\n.skill .pane img{width:calc(100% - 500px);height:100%;object-fit:cover}\n\n/* ── 7. 피처 — 좌 고정 타이틀 + 우 카드 3 스크롤(toss insurance 패턴) ── */\n.feature{padding:180px 0 200px;background:linear-gradient(180deg,#EDF4FF 0%,#E8F1FF 50%,#F4F9FF 100%)}\n.feature .fgrid{display:flex;gap:110px;align-items:flex-start}\n.feature .fleft{width:430px;flex:none;position:sticky;top:130px}\n.feature .fleft h2{font-size:36px}\n.feature .fleft p.sub{margin:20px 0 0;color:var(--g2);font-size:18px;line-height:1.6}\n.feature .fright{flex:1;display:flex;flex-direction:column;gap:96px;min-width:0}\n.feature .fitem{border-top:1px solid #d9e4f3;padding-top:30px}\n.feature .fitem b{display:block;font-size:25px;font-weight:600;line-height:1.4}\n.feature .fitem > p{margin:12px 0 38px;color:var(--g2);font-size:17px;line-height:1.65}\n.feature .fcard{overflow:hidden;background:var(--bgsoft)}\n.feature .fcard img{width:100%;height:360px;object-fit:cover;display:block}\n\n/* ── 7.5 어젠다 — 다크 리스트 + 클릭 시 우측 상세 드로어 ── */\n.agenda{padding:160px 0;background:var(--dark)}\n.agenda h2{color:#fff;text-align:center}\n.agenda .asub{margin:16px 0 56px;text-align:center;col "alist rv\" id=\"alist\"><li><span class=\"at df\">9:00 ~ 9:10<\/span><div class=\"am\"><b>Opening — CIVIL NX 2026 with HYPER-S<\/b><span>MIDAS CIVIL Product Team<\/span><\/div><span class=\"chev\">→<\/span><\/li><li><span class=\"at df\">9:10 ~ 9:25<\/span><div class=\"am\"><b>Incomparable Speed — up to 6× Faster<\/b><span>HYPER-S Engine Team<\/span><\/div><span class=\"chev\">→<\/span><\/li><li><span class=\"at df\">9:25 ~ 9:45<\/span><div class=\"am\"><b>Boundless Capabilities Deep-Dive<\/b><span>Structural Solution Engineer<\/span><\/div><span class=\"chev\">→<\/span><\/li><li><span class=\"at df\">9:45 ~ 9:55<\/span><div class=\"am\"><b>Roadmap — Advanced Analysis +<\/b><span>MIDAS CIVIL Product Team<\/span><\/div><span class=\"chev\">→<\/span><\/li><li><span class=\"at df\">9:55 ~ 10:00<\/span><div class=\"am\"><b>Q&A & Closing<\/b><span>All Speakers<\/span><\/div><span class=\"chev\">→<\/span><\/li><\/ul>\n  <\/div>\n<\/section><\/body><\/html>", "h": 900, "live": "../packs/web/packs.ensol.sample.html#agenda"}, {"g": "g6", "code": "agenda:timetable", "desc": "3열 시간표형 (카탈로그 전용)", "mo": null, "doc": "<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>\n:root{\n  --lime:#3186ff; --lime2:#346bf0; --onp:#fff; --sub:#4ea0ff; --onsub:#fff;\n  --btng:linear-gradient(89.58deg,#3186ff 0%,#346bf0 30%,#4ea0ff 55%,#346bf0 78%,#3186ff 100%);\n  --txtg:linear-gradient(89.58deg,#3186ff .28%,#346bf0 44.45%,#4ea0ff 99.55%);\n  --txtgB:linear-gradient(89.58deg,#5AA7FF 0%,#4E8FF5 45%,#8FC6FF 100%);\n  --blue1:#2CADD5; --blue2:#00479E; --navy:#00054D;\n  --dark:#040308; --ink:#222; --bgray:#4E5968; --g:#444; --g2:#666; --g3:#999; --line:#DEDEDE; --bgsoft:#F6F9FE;\n}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Apple SD Gothic Neo\",sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow-x:clip}\nimg,video{display:block;max-width:100%}\na{text-decoration:none;color:inherit}\nul{list-style:none}\n.df{font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Apple SD Gothic Neo\",sans-serif}\n.wrap{max-width:1320px;margin:0 auto;padding:0 28px}\nh2.tt{font-size:clamp(44px,4.8vw,84px);line-height:1.2;letter-spacing:-.02em}\nh2 .lw{font-weight:500}\nh2 .hw{font-weight:700}\n/* 공용 버튼 — 원본 group_btn a: 225~286×64, 각진, 라임/아웃라인 */\n.gbtn{display:flex;gap:20px}\n.gbtn a{border-radius:0;display:flex;align-items:center;justify-content:center;gap:8px;width:auto;height:56px;padding:0 34px;font-size:18px;font-weight:600;letter-spacing:-.36px;transition:.3s;cursor:pointer}\n.gbtn a .arr{font-weight:700;transition:transform .3s}\n.gbtn a:hover .arr{transform:translateX(4px)}\n.gbtn .lime{background:var(--btng);background-size:220% 100%;background-position:0% 50%;color:#fff;transition:background-position .6s ease}\n.gbtn .lime:hover{background-position:100% 50%}\n.gbtn .ghost{border:1px solid var(--ink);color:var(--ink)}\n.gbtn .ghost:hover{background:var(--ink);color:#fff}\n.gbtn .white{background:#fff;color:var(--ink)}\n.gbtn .white:hover{background:var(--btng);background-size:220% 100%;color:#fff}\n.gbtn .wghost{border:1px solid #fff;color:#fff}\n.gbtn .wghost:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.7)}\n/* 리빌 */\n.rv{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}\n.rv.on{opacity:1;transform:none}\n/* 그라데이션 강조 어구 — 여러 단어가 하나의 그라로 연결 */\n.gt{background:var(--txtg);-webkit-background-clip:text;background-clip:text;color:transparent}\n.agenda .gt,.register .gt,.free .gt,.kv .gt{background-image:var(--txtgB)}\n/* gt는 단어 분해 없이 통째로 등장 — 자식 레이어 승격 시 그라 클립이 안 그려지는 문제 회피 */\nh2.wt .gt{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\nh2.wt.active .gt{opacity:1;transform:translate3d(0,0,0)}\n/* 타이틀 단어 스태거 등장(toss.im 참고) */\nh2.wt .w{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\nh2.wt.active .w{opacity:1;transform:translate3d(0,0,0)}\n\n/* ── 좌측 섹션 인디케이터(toss.im 대시 내비) ── */\n.snav{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .4s}\n.snav.vis{opacity:1;pointer-events:auto}\n.snav a{display:block;width:14px;height:2px;background:rgba(4,3,8,.25);transition:width .3s,background .3s}\n.snav a.on{width:26px;background:var(--ink)}\n.snav.ondark a{background:rgba(255,255,255,.4)}\n.snav.ondark a.on{background:#fff}\n\n/* ── GNB ─────────────────────────────── */\n.gnb{position:fixed;top:0;left:0;right:0;z-index:100;transition:background .35s,box-shadow .35s}\n.gnb .in{max-width:none;margin:0;padding:0 56px;height:72px;display:flex;align-items:center;gap:24px}\n.gnb .logo{font-size:21px;font-weight:700;color:#fff;letter-spacing:-.01em}\n.gnb nav{display:flex;gap:6px;margin-left:auto}\n.gnb nav a{padding:9px 14px;font-size:16px;font-weight:600;color:rgba(255,255,255,.85);transition:background .2s,color .2s}\n.gnb nav a:hover{color:var(--lime)}\n.gnb .cta{border-radius:0;background:var(--btng);background-size:220% 100%;background-position:0% 50%;color:#fff;font-size:16px;font-weight:700;padding:16px 22px;transition:background-position .6s ease}\n.gnb .cta:hover{background-position:100% 50%}\n.gnb.solid{background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}\n.gnb.solid .logo{color:var(--ink)}\n.gnb.solid nav a{color:var(--g)}\n.gnb.solid nav a:hover{color:var(--lime2)}\n\n/* ── 1. 히어로 KV — 풀블리드 영상 스크럽(원본 invite + 씨드 KV) ── */\n.kv{position:relative;height:320vh}\n.kv .stick{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--dark)}\n.kv .ph{position:absolute;inset:0}\n.kv .ph video{width:100%;height:100%;object-fit:cover}\n.kv .ov{position:absolute;inset:0;background:rgba(4,3,8,.66)}\n/* 라이트 스윕 — 프라이머리(라임·시안) 광선이 이따금 은은하게 지나감 */\n.kv .sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen}\n.kv .sheen i{position:absolute;top:-20%;bottom:-20%;left:0;width:44%;background:linear-gradient(100deg,transparent 0%,color-mix(in srgb,var(--lime) 6%,transparent) 35%,color-mix(in srgb,var(--sub) 10%,transparent) 50%,color-mix(in srgb,var(--lime) 5%,transparent) 65%,transparent 100%);filter:blur(36px);transform:translateX(-160%) skewX(-14deg);animation:sheenSweep 7.5s ease-in-out infinite;will-change:transform}\n.kv .sheen i.s2{width:24%;opacity:.7;animation-delay:3.8s}\n@keyframes sheenSweep{0%{transform:translateX(-160%) skewX(-14deg)}34%{transform:translateX(440%) skewX(-14deg)}100%{transform:translateX(440%) skewX(-14deg)}}\n.kv .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 24px;transform:translateY(-50px)}\n.kv h1{margin:0 0 34px;font-size:min(14.5vw,232px);font-weight:700;line-height:1.02;letter-spacing:-.02em;text-shadow:0 1px 10px rgba(0,0,0,.15)}\n.kv .klead{margin-bottom:56px;font-size:clamp(19px,2.4vw,40px);font-weight:500;color:rgba(255,255,255,.95);text-shadow:0 1px 6px rgba(0,0,0,.2)}\n.kv h1 .l{display:block}\n.kv .ent{opacity:0;transform:translateY(16px);transition:opacity .8s cubic-bezier(.2,.6,.2,1),transform .8s cubic-bezier(.2,.6,.2,1)}\n.kv.ready .ent{opacity:1;transform:none}\n.kv.ready .kvmeta{opacity:.7}\n.kv.ready .klead{opacity:.8}\n.kv.ready .d2{transition-delay:.35s}\n.kv.ready .d4{transition-delay:.6s}\n.kv h1 .w{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\n.kv.ready h1 .w{opacity:1;transform:translate3d(0,0,0)}\n.kv .gbtn{justify-content:center}\n.kv .kvmeta{position:absolute;left:0;right:0;bottom:32px;display:flex;justify-content:space-between;align-items:center;padding:0 56px;color:rgba(255,255,255,.85);font-size:18px;font-weight:500;letter-spacing:.01em}\n.kv .kvmeta .mid{position:absolute;left:50%;transform:translateX(-50%)}\n.kv .sub2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;opacity:0;pointer-events:none;padding:0 24px}\n\n/* ── 1.5 KV 후반 — 어두워지며 미션 멘트 툭(toss insurance 미션 스테이지 참고) ── */\n.kv .sub2 .tx{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;text-align:center;height:100%}\n.kv .sub2 .eb{font-size:20px;font-weight:600}\n.kv .sub2 p{color:#fff;font-size:34px;font-weight:600;line-height:1.55;text-shadow:0 1px 10px rgba(0,0,0,.15)}\n\n/* ── 3. 앤서 — 흰 배경·그래픽 카드 3 + 하단 텍스트(토스증권 카드 리스트 스타일) ── */\n.answer{position:relative;z-index:2;margin-top:-100vh;min-height:100vh;padding:160px 0;background:#fff}\n.answer h2{text-align:center;color:var(--ink);margin-bottom:60px}\n.answer .cards{display:flex;gap:0}\n.answer .card{position:relative;flex:1;height:520px;overflow:hidden;cursor:pointer;background:var(--dark);opacity:0;transform:translateY(90px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}\n.answer .cards.active .card{opacity:1;transform:none}\n.answer .cards.active .card:nth-child(2){transition-delay:.45s}\n.answer .cards.active .card:nth-child(3){transition-delay:.9s}\n.answer .card > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .5s,transform .7s cubic-bezier(.2,.6,.2,1);animation:kvIdle 14s ease-in-out infinite alternate;will-change:transform}\n.answer .card:nth-child(2) > img{animation-duration:18s;animation-delay:-6s}\n.answer .card:nth-child(3) > img{animation-duration:22s;animation-delay:-11s}\n.answer .card:hover > img{filter:brightness(1.15);animation-play-state:paused;transform:scale(1.08)}\n@keyframes kvIdle{from{transform:scale(1.06) translate(1.2%,1%)}to{transform:scale(1.13) translate(-1.5%,-1.5%)}}\n.answer .go{position:absolute;right:26px;bottom:26px;width:52px;height:52px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);color:#fff;font-size:19px;font-weight:700;transition:background .25s;z-index:2;will-change:transform;pointer-events:none}\n.answer .card:hover .go{background:rgba(255,255,255,.26)}\n.answer .ctx{position:absolute;left:40px;right:96px;top:40px;z-index:1;text-align:left}\n.answer .ctx b{display:block;margin-bottom:14px;color:#fff;font-size:32px;font-weight:600;line-height:1.3}\n.answer .ctx p{color:rgba(255,255,255,.72);font-size:15px;line-height:1.6}\n\n/* ── 6. 스킬 탭 5종(원본 이식: 좌 텍스트 500px 소프트 + 우 이미지) ── */\n.skill{padding:160px 0;background:linear-gradient(180deg,#fff 0%,#F2F7FF 55%,#EDF4FF 100%)}\n.skill h2{text-align:center}\n.skill .tabs{display:flex;margin:4.5vw 0 30px;width:100%}\n.skill .tabs button{position:relative;flex:1;padding-bottom:14px;border:0;border-bottom:2px solid #F0F1F3;background:none;color:#C6CCD4;font-family:inherit;font-size:18px;font-weight:500;cursor:pointer;transition:color .2s,border-color .2s}\n.skill .tabs button.active{border-color:#F0F1F3;color:var(--ink);font-weight:600}\n.skill .tabs button .prog{position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--bgray)}\n#skillPanes{position:relative;height:400px}\n.skill .pane{position:absolute;inset:0;display:flex;height:400px;opacity:0;transform:translateY(10px);transition:opacity .45s cubic-bezier(.2,.6,.2,1),transform .45s cubic-bezier(.2,.6,.2,1);pointer-events:none}\n.skill .pane.onv{opacity:1;transform:none;pointer-events:auto}\n.skill .tb{display:flex;flex-direction:column;justify-content:center;width:500px;flex:none;padding:0 48px 0 60px;background:#fff}\n.skill .tb .badge{width:max-content;margin-bottom:12px;padding:0 8px;background:var(--lime);color:var(--onp);font-size:14px;font-weight:600;height:25px;line-height:25px;letter-spacing:-.28px}\n.skill .tb strong{margin-bottom:26px;font-size:30px;font-weight:600;line-height:40px}\n.skill .tb p{color:var(--g);font-size:16px;line-height:26px;letter-spacing:-.32px}\n.skill .pane img{width:calc(100% - 500px);height:100%;object-fit:cover}\n\n/* ── 7. 피처 — 좌 고정 타이틀 + 우 카드 3 스크롤(toss insurance 패턴) ── */\n.feature{padding:180px 0 200px;background:linear-gradient(180deg,#EDF4FF 0%,#E8F1FF 50%,#F4F9FF 100%)}\n.feature .fgrid{display:flex;gap:110px;align-items:flex-start}\n.feature .fleft{width:430px;flex:none;position:sticky;top:130px}\n.feature .fleft h2{font-size:36px}\n.feature .fleft p.sub{margin:20px 0 0;color:var(--g2);font-size:18px;line-height:1.6}\n.feature .fright{flex:1;display:flex;flex-direction:column;gap:96px;min-width:0}\n.feature .fitem{border-top:1px solid #d9e4f3;padding-top:30px}\n.feature .fitem b{display:block;font-size:25px;font-weight:600;line-height:1.4}\n.feature .fitem > p{margin:12px 0 38px;color:var(--g2);font-size:17px;line-height:1.65}\n.feature .fcard{overflow:hidden;background:var(--bgsoft)}\n.feature .fcard img{width:100%;height:360px;object-fit:cover;display:block}\n\n/* ── 7.5 어젠다 — 다크 리스트 + 클릭 시 우측 상세 드로어 ── */\n.agenda{padding:160px 0;background:var(--dark)}\n.agenda h2{color:#fff;text-align:center}\n.agenda .asub{margin:16px 0 56px;text-align:center;color:rgba(255,255,255,.55);font-size:17px}\n.agenda .alist{max-width:1060px;margin:0 auto}\n.agenda .alist li{display:flex;align-items:center;gap:28px;padding:26px 18px;border-bottom:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background .25s,padding .25s}\n.agenda .alist.rv li{opacity:0;transform:translateY(26px);transition:opacity .6s cubic-bezier(.2,.6,.2,1),transform .6s ilities Deep-Dive<\/b><span class=\"s\">Structural Solution Engineer<\/span><\/div><div class=\"eg-tt2\"><span class=\"t df\">9:45 ~ 9:55<\/span><b>Roadmap — Advanced Analysis +<\/b><span class=\"s\">MIDAS CIVIL Product Team<\/span><\/div><div class=\"eg-tt2\"><span class=\"t df\">9:55 ~ 10:00<\/span><b>Q&A & Closing<\/b><span class=\"s\">All Speakers<\/span><\/div><\/div><\/section><\/body><\/html>", "h": 800, "live": null}, {"g": "g6", "code": "agenda:cards", "mo": null, "live": null, "h": 700, "desc": "다크 카드 그리드형 (카탈로그 전용)", "doc": "<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>\n:root{\n  --lime:#3186ff; --lime2:#346bf0; --onp:#fff; --sub:#4ea0ff; --onsub:#fff;\n  --btng:linear-gradient(89.58deg,#3186ff 0%,#346bf0 30%,#4ea0ff 55%,#346bf0 78%,#3186ff 100%);\n  --txtg:linear-gradient(89.58deg,#3186ff .28%,#346bf0 44.45%,#4ea0ff 99.55%);\n  --txtgB:linear-gradient(89.58deg,#5AA7FF 0%,#4E8FF5 45%,#8FC6FF 100%);\n  --blue1:#2CADD5; --blue2:#00479E; --navy:#00054D;\n  --dark:#040308; --ink:#222; --bgray:#4E5968; --g:#444; --g2:#666; --g3:#999; --line:#DEDEDE; --bgsoft:#F6F9FE;\n}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Apple SD Gothic Neo\",sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overflow-x:clip}\nimg,video{display:block;max-width:100%}\na{text-decoration:none;color:inherit}\nul{list-style:none}\n.df{font-family:\"Pretendard Variable\",Pretendard,-apple-system,\"Apple SD Gothic Neo\",sans-serif}\n.wrap{max-width:1320px;margin:0 auto;padding:0 28px}\nh2.tt{font-size:clamp(44px,4.8vw,84px);line-height:1.2;letter-spacing:-.02em}\nh2 .lw{font-weight:500}\nh2 .hw{font-weight:700}\n/* 공용 버튼 — 원본 group_btn a: 225~286×64, 각진, 라임/아웃라인 */\n.gbtn{display:flex;gap:20px}\n.gbtn a{border-radius:0;display:flex;align-items:center;justify-content:center;gap:8px;width:auto;height:56px;padding:0 34px;font-size:18px;font-weight:600;letter-spacing:-.36px;transition:.3s;cursor:pointer}\n.gbtn a .arr{font-weight:700;transition:transform .3s}\n.gbtn a:hover .arr{transform:translateX(4px)}\n.gbtn .lime{background:var(--btng);background-size:220% 100%;background-position:0% 50%;color:#fff;transition:background-position .6s ease}\n.gbtn .lime:hover{background-position:100% 50%}\n.gbtn .ghost{border:1px solid var(--ink);color:var(--ink)}\n.gbtn .ghost:hover{background:var(--ink);color:#fff}\n.gbtn .white{background:#fff;color:var(--ink)}\n.gbtn .white:hover{background:var(--btng);background-size:220% 100%;color:#fff}\n.gbtn .wghost{border:1px solid #fff;color:#fff}\n.gbtn .wghost:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.7)}\n/* 리빌 */\n.rv{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}\n.rv.on{opacity:1;transform:none}\n/* 그라데이션 강조 어구 — 여러 단어가 하나의 그라로 연결 */\n.gt{background:var(--txtg);-webkit-background-clip:text;background-clip:text;color:transparent}\n.agenda .gt,.register .gt,.free .gt,.kv .gt{background-image:var(--txtgB)}\n/* gt는 단어 분해 없이 통째로 등장 — 자식 레이어 승격 시 그라 클립이 안 그려지는 문제 회피 */\nh2.wt .gt{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\nh2.wt.active .gt{opacity:1;transform:translate3d(0,0,0)}\n/* 타이틀 단어 스태거 등장(toss.im 참고) */\nh2.wt .w{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\nh2.wt.active .w{opacity:1;transform:translate3d(0,0,0)}\n\n/* ── 좌측 섹션 인디케이터(toss.im 대시 내비) ── */\n.snav{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .4s}\n.snav.vis{opacity:1;pointer-events:auto}\n.snav a{display:block;width:14px;height:2px;background:rgba(4,3,8,.25);transition:width .3s,background .3s}\n.snav a.on{width:26px;background:var(--ink)}\n.snav.ondark a{background:rgba(255,255,255,.4)}\n.snav.ondark a.on{background:#fff}\n\n/* ── GNB ─────────────────────────────── */\n.gnb{position:fixed;top:0;left:0;right:0;z-index:100;transition:background .35s,box-shadow .35s}\n.gnb .in{max-width:none;margin:0;padding:0 56px;height:72px;display:flex;align-items:center;gap:24px}\n.gnb .logo{font-size:21px;font-weight:700;color:#fff;letter-spacing:-.01em}\n.gnb nav{display:flex;gap:6px;margin-left:auto}\n.gnb nav a{padding:9px 14px;font-size:16px;font-weight:600;color:rgba(255,255,255,.85);transition:background .2s,color .2s}\n.gnb nav a:hover{color:var(--lime)}\n.gnb .cta{border-radius:0;background:var(--btng);background-size:220% 100%;background-position:0% 50%;color:#fff;font-size:16px;font-weight:700;padding:16px 22px;transition:background-position .6s ease}\n.gnb .cta:hover{background-position:100% 50%}\n.gnb.solid{background:rgba(255,255,255,.72);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}\n.gnb.solid .logo{color:var(--ink)}\n.gnb.solid nav a{color:var(--g)}\n.gnb.solid nav a:hover{color:var(--lime2)}\n\n/* ── 1. 히어로 KV — 풀블리드 영상 스크럽(원본 invite + 씨드 KV) ── */\n.kv{position:relative;height:320vh}\n.kv .stick{position:sticky;top:0;height:100vh;overflow:hidden;background:var(--dark)}\n.kv .ph{position:absolute;inset:0}\n.kv .ph video{width:100%;height:100%;object-fit:cover}\n.kv .ov{position:absolute;inset:0;background:rgba(4,3,8,.66)}\n/* 라이트 스윕 — 프라이머리(라임·시안) 광선이 이따금 은은하게 지나감 */\n.kv .sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:screen}\n.kv .sheen i{position:absolute;top:-20%;bottom:-20%;left:0;width:44%;background:linear-gradient(100deg,transparent 0%,color-mix(in srgb,var(--lime) 6%,transparent) 35%,color-mix(in srgb,var(--sub) 10%,transparent) 50%,color-mix(in srgb,var(--lime) 5%,transparent) 65%,transparent 100%);filter:blur(36px);transform:translateX(-160%) skewX(-14deg);animation:sheenSweep 7.5s ease-in-out infinite;will-change:transform}\n.kv .sheen i.s2{width:24%;opacity:.7;animation-delay:3.8s}\n@keyframes sheenSweep{0%{transform:translateX(-160%) skewX(-14deg)}34%{transform:translateX(440%) skewX(-14deg)}100%{transform:translateX(440%) skewX(-14deg)}}\n.kv .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 24px;transform:translateY(-50px)}\n.kv h1{margin:0 0 34px;font-size:min(14.5vw,232px);font-weight:700;line-height:1.02;letter-spacing:-.02em;text-shadow:0 1px 10px rgba(0,0,0,.15)}\n.kv .klead{margin-bottom:56px;font-size:clamp(19px,2.4vw,40px);font-weight:500;color:rgba(255,255,255,.95);text-shadow:0 1px 6px rgba(0,0,0,.2)}\n.kv h1 .l{display:block}\n.kv .ent{opacity:0;transform:translateY(16px);transition:opacity .8s cubic-bezier(.2,.6,.2,1),transform .8s cubic-bezier(.2,.6,.2,1)}\n.kv.ready .ent{opacity:1;transform:none}\n.kv.ready .kvmeta{opacity:.7}\n.kv.ready .klead{opacity:.8}\n.kv.ready .d2{transition-delay:.35s}\n.kv.ready .d4{transition-delay:.6s}\n.kv h1 .w{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\n.kv.ready h1 .w{opacity:1;transform:translate3d(0,0,0)}\n.kv .gbtn{justify-content:center}\n.kv .kvmeta{position:absolute;left:0;right:0;bottom:32px;display:flex;justify-content:space-between;align-items:center;padding:0 56px;color:rgba(255,255,255,.85);font-size:18px;font-weight:500;letter-spacing:.01em}\n.kv .kvmeta .mid{position:absolute;left:50%;transform:translateX(-50%)}\n.kv .sub2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;opacity:0;pointer-events:none;padding:0 24px}\n\n/* ── 1.5 KV 후반 — 어두워지며 미션 멘트 툭(toss insurance 미션 스테이지 참고) ── */\n.kv .sub2 .tx{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;text-align:center;height:100%}\n.kv .sub2 .eb{font-size:20px;font-weight:600}\n.kv .sub2 p{color:#fff;font-size:34px;font-weight:600;line-height:1.55;text-shadow:0 1px 10px rgba(0,0,0,.15)}\n\n/* ── 3. 앤서 — 흰 배경·그래픽 카드 3 + 하단 텍스트(토스증권 카드 리스트 스타일) ── */\n.answer{position:relative;z-index:2;margin-top:-100vh;min-height:100vh;padding:160px 0;background:#fff}\n.answer h2{text-align:center;color:var(--ink);margin-bottom:60px}\n.answer .cards{display:flex;gap:0}\n.answer .card{position:relative;flex:1;height:520px;overflow:hidden;cursor:pointer;background:var(--dark);opacity:0;transform:translateY(90px);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1)}\n.answer .cards.active .card{opacity:1;transform:none}\n.answer .cards.active .card:nth-child(2){transition-delay:.45s}\n.answer .cards.active .card:nth-child(3){transition-delay:.9s}\n.answer .card > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .5s,transform .7s cubic-bezier(.2,.6,.2,1);animation:kvIdle 14s ease-in-out infinite alternate;will-change:transform}\n.answer .card:nth-child(2) > img{animation-duration:18s;animation-delay:-6s}\n.answer .card:nth-child(3) > img{animation-duration:22s;animation-delay:-11s}\n.answer .card:hover > img{filter:brightness(1.15);animation-play-state:paused;transform:scale(1.08)}\n@keyframes kvIdle{from{transform:scale(1.06) translate(1.2%,1%)}to{transform:scale(1.13) translate(-1.5%,-1.5%)}}\n.answer .go{position:absolute;right:26px;bottom:26px;width:52px;height:52px;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);color:#fff;font-size:19px;font-weight:700;transition:background .25s;z-index:2;will-change:transform;pointer-events:none}\n.answer .card:hover .go{background:rgba(255,255,255,.26)}\n.answer .ctx{position:absolute;left:40px;right:96px;top:40px;z-index:1;text-align:left}\n.answer .ctx b{display:block;margin-bottom:14px;color:#fff;font-size:32px;font-weight:600;line-height:1.3}\n.answer .ctx p{color:rgba(255,255,255,.72);font-size:15px;line-height:1.6}\n\n/* ── 6. 스킬 탭 5종(원본 이식: 좌 텍스트 500px 소프트 + 우 이미지) ── */\n.skill{padding:160px 0;background:linear-gradient(180deg,#fff 0%,#F2F7FF 55%,#EDF4FF 100%)}\n.skill h2{text-align:center}\n.skill .tabs{display:flex;margin:4.5vw 0 30px;width:100%}\n.skill .tabs button{position:relative;flex:1;padding-bottom:14px;border:0;border-bottom:2px solid #F0F1F3;background:none;color:#C6CCD4;font-family:inherit;font-size:18px;font-weight:500;cursor:pointer;transition:color .2s,border-color .2s}\n.skill .tabs button.active{border-color:#F0F1F3;color:var(--ink);font-weight:600}\n.skill .tabs button .prog{position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--bgray)}\n#skillPanes{position:relative;height:400px}\n.skill .pane{position:absolute;inset:0;display:flex;height:400px;opacity:0;transform:translateY(10px);transition:opacity .45s cubic-bezier(.2,.6,.2,1),transform .45s cubic-bezier(.2,.6,.2,1);pointer-events:none}\n.skill .pane.onv{opacity:1;transform:none;pointer-events:auto}\n.skill .tb{display:flex;flex-direction:column;justify-content:center;width:500px;flex:none;padding:0 48px 0 60px;background:#fff}\n.skill .tb .badge{width:max-content;margin-bottom:12px;padding:0 8px;background:var(--lime);color:var(--onp);font-size:14px;font-weight:600;height:25px;line-height:25px;letter-spacing:-.28px}\n.skill .tb strong{margin-bottom:26px;font-size:30px;font-weight:600;line-height:40px}\n.skill .tb p{color:var(--g);font-size:16px;line-height:26px;letter-spacing:-.32px}\n.skill .pane img{width:calc(100% - 500px);height:100%;object-fit:cover}\n\n/* ── 7. 피처 — 좌 고정 타이틀 + 우 카드 3 스크롤(toss insurance 패턴) ── */\n.feature{padding:180px 0 200px;background:linear-gradient(180deg,#EDF4FF 0%,#E8F1FF 50%,#F4F9FF 100%)}\n.feature .fgrid{display:flex;gap:110px;align-items:flex-start}\n.feature .fleft{width:430px;flex:none;position:sticky;top:130px}\n.feature .fleft h2{font-size:36px}\n.feature .fleft p.sub{margin:20px 0 0;color:var(--g2);font-size:18px;line-height:1.6}\n.feature .fright{flex:1;display:flex;flex-direction:column;gap:96px;min-width:0}\n.feature .fitem{border-top:1px solid #d9e4f3;padding-top:30px}\n.feature .fitem b{display:block;font-size:25px;font-weight:600;line-height:1.4}\n.feature .fitem > p{margin:12px 0 38px;color:var(--g2);font-size:17px;line-height:1.65}\n.feature .fcard{overflow:hidden;background:var(--bgsoft)}\n.feature .fcard img{width:100%;height:360px;object-fit:cover;display:block}\n\n/* ── 7.5 어젠다 — 다크 리스트 + 클릭 시 우측 상세 드로어 ── */\n.agenda{padding:160px 0;background:var(--dark)}\n.agenda h2{color:#fff;text-align:center}\n.agenda .asub{margin:16px 0 56px;text-align:center;color:rgba(255,255,255,.55);font-size:17px}\n.agenda .alist{max-width:1060px;margin:0 auto}\n.agenda .alist li{display:flex;align-items:center;gap:28px;padding:26px 18px;border-bottom:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background .25s,padding .25s}\n.agenda .alist.rv li{opacity:0;transform:translateY(26px);transition:opacity .6s cubic-bezier(.2,.6,.2,1),transform .6s cubic-bezier(.2,.6,.2,1),background .25s,padding .25s}\n.agenda .alist.rv.on li{opacity:1;transform:none}\n.agenda .alist.rv.on li:nth-child(2){transition-delay:.08s}\n.agenda .alist.rv.on li:nth-child(3){transition-delay:.16s}\n.agenda .alist.rv.on li:nth-child(4){transition-delay:.24s}\n.agenda .alist.rv.on li:nth-child(5){transition-delay:.32s}\n.agenda .alist li:first-child{border-top:1px solid rgba(255,255,255,.12)}\n.agenda .alist li:hover{background:rgba(255,255,255,.06);padding-left:26px}\n.agenda .at{flex:none;width:128px;color:rgba(255,255,255,.75);font-size:17px;font-weight:600;white-space:nowrap}\n.agenda .am{flex:1}\n.agenda .am b{display:block;color:#fff;font-size:19px;font-weight:600;line-height:1.4;transition:color .25s}\n.agenda .am span{display:block;margin-top:4px;color:rgba(255,255,255,.5);font-size:14px}\n.agenda .chev{color:rgba(255,255,255,.45);font-size:18px;font-weight:700;transition:transform .25s,color .25s}\n.agenda .alist li:hover .am b{color:var(--sub)}\n.agenda .alist li:hover .chev{transform:translateX(4px);color:var(--sub)}\n/* 드로어 */\n.adim{position:fixed;inset:0;z-index:190;background:rgba(4,3,8,.55);opacity:0;pointer-events:none;transition:opacity .35s}\n.adim.on{opacity:1;pointer-events:auto}\n.adrawer{position:fixed;top:0;right:0;bottom:0;z-index:200;width:min(480px,92vw);background:#fff;padding:56px 44px 0;overflow-y:auto;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .45s cubic-bezier(.22,1,.36,1)}\n.adrawer.on{transform:none}\n.adrawer .dclose{position:absolute;top:18px;right:18px;width:40px;height:40px;border:0;background:none;color:var(--g3);font-size:26px;line-height:1;cursor:pointer;transition:color .2s}\n.adrawer .dclose:hover{color:var(--ink)}\n.adrawer .dtime{display:inline-block;align-self:flex-start;background:var(--lime);color:var(--onp);font-size:14px;font-weight:700;padding:5px 10px}\n.adrawer h4{margin:18px 0 6px;font-size:26px;font-weight:600;line-height:1.35;color:var(--ink)}\n.adrawer .dspk{display:block;color:var(--g3);font-size:14px;margin-bottom:22px}\n.adrawer .dmedia{flex:none;height:220px;margin-bottom:24px;background:var(--bgsoft);overflow:hidden}\n.adrawer .dmedia img,.adrawer .dmedia video{width:100%;height:100%;object-fit:cover;display:block}\n.adrawer .dtxt{color:var(--g);font-size:16px;line-height:1.65;margin-bottom:26px}\n.adrawer .dpoints li{position:relative;padding:12px 0 12px 22px;border-bottom:1px solid var(--line);color:var(--ink);font-size:15px;line-height:1.5}\n.adrawer .dpoints li:before{content:\"\";position:absolute;left:0;top:19px;width:8px;height:8px;background:var(--lime)}\n.adrawer .dnav{display:flex;align-items:center;justify-content:space-between;margin-top:auto;position:sticky;bottom:0;background:#fff;padding:20px 0 24px}\n.adrawer .dn{border:0;background:none;padding:10px 6px;color:var(--ink);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:color .2s}\n.adrawer .dn:hover:not(:disabled){color:var(--lime2)}\n.adrawer .dn:disabled{opacity:.3;cursor:default}\n.adrawer #adidx{color:var(--g3);font-size:14px;font-variant-numeric:tabular-nums}\n.adrawer.swap .dtime,.adrawer.swap h4,.adrawer.swap .dspk,.adrawer.swap .dmedia,.adrawer.swap .dtxt,.adrawer.swap .dpoints{animation:dfade .35s ease}\n@keyframes dfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n\n/* ── 8. 레지스터 — All-Access Pass + 신청 폼(원본 카피 복원) ── */\n.register{position:relative;padding:160px 0;background:radial-gradient(90% 45% at 50% 108%,rgba(120,190,255,.5) 0%,rgba(120,190,255,0) 62%),radial-gradient(150% 75% at 50% 115%,rgba(49,134,255,.65) 0%,rgba(49,134,255,0) 72%),linear-gradient(180deg,#040308 0%,#060D24 34%,#0C2470 66%,#1257ff 100%);overflow:hidden}\n.register .wrap{position:relative;z-index:1}\n.register h2{text-align:center;color:#fff}\n.register .time{display:flex;align-items:center;justify-content:center;gap:16px;margin:34px 0 56px;font-size:22px;font-weight:600;color:#fff}\n.register .bar{width:1px;height:18px;background:rgba(255,255,255,.25)}\n.register form{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.register .fld{position:relative}\n.register .fld.full{grid-column:1/-1}\n.register input{width:100%;height:60px;padding:24px 18px 8px;border-radius:0;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:16px;font-family:inherit}\n.register input:focus{outline:2px solid #fff;outline-offset:-1px;border-color:#fff}\n.register .fld label{position:absolute;left:19px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.75);font-size:16px;pointer-events:none;transition:top .18s ease,transform .18s ease,font-size .18s ease,color .18s ease;white-space:nowrap;max-width:calc(100% - 38px);overflow:hidden;text-overflow:ellipsis}\n.register input:focus + label,.register input:not(:placeholder-shown) + label{top:10px;transform:none;font-size:12px;color:#fff}\n.register input:not(:placeholder-shown):not(:focus) + label{color:rgba(255,255,255,.75)}\n.register button{grid-column:1/-1;height:58px;border:0;border-radius:0;background:linear-gradient(89.58deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.72) 45%,rgba(255,255,255,.95) 100%);background-size:220% 100%;background-position:0% 50%;color:#1257ff;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;transition:background-position .6s ease}\n.register button:hover{background-position:100% 50%}\n.register button .bt{background:var(--txtg);-webkit-background-clip:text;background-clip:text;color:transparent}\n.register .done{display:none;max-width:760px;margin:0 auto;text-align:center}\n.register .done h4{font-size:34px;font-weight:600;margin-bottom:18px;color:#fff}\n.register .done p{color:rgba(255,255,255,.7);font-size:17px;line-height:1.65}\n.register.submitted form{display:none}\n.register.submitted .done{display:block}\n\n/* ── 9. FAQ 아코디언 ── */\n.faq{padding:160px 0;background:#fff}\n.faq .in{max-width:1060px;margin:0 auto;padding:0 28px}\n.faq h2{text-align:center;margin-bottom:26px}\n.faq .item{border-bottom:1px solid var(--line)}\n#faqList.rv .item{opacity:0;transform:translateY(24px);transition:opacity .6s cubic-bezier(.2,.6,.2,1),transform .6s cubic-bezier(.2,.6,.2,1)}\n#faqList.rv.on .item{opacity:1;transform:none}\n#faqList.rv.on .item:nth-child(2){transition-delay:.06s}\n#faqList.rv.on .item:nth-child(3){transition-delay:.12s}\n#faqList.rv.on .item:nth-child(4){transition-delay:.18s}\n#faqList.rv.on .item:nth-child(5){transition-delay:.24s}\n#faqList.rv.on .item:nth-child(6){transition-delay:.3s}\n.faq .item:first-child{border-top:1px solid var(--line)}\n.faq .q{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:88px;padding:0;border:0;background:none;color:var(--ink);font-family:inherit;font-size:20px;font-weight:600;line-height:28px;text-align:left;cursor:pointer;transition:color .25s}\n.faq .q:hover,.faq .item.open .q{color:var(--lime)}\n.faq .q .ar{flex:none;display:grid;place-items:center;color:var(--g2);transition:transform .3s,color .25s}\n.faq .q:hover .ar,.faq .item.open .ar{color:var(--lime)}\n.faq .item.open .q .ar{transform:rotate(180deg)}\n.faq .a{height:0;overflow:hidden;color:var(--g2);font-size:16px;line-height:26px;text-align:left;transition:height .3s ease,padding .3s ease}\n\n/* ── 10. 프리 CTA — 데이터 지형 웨이브 캔버스(점 그리드 시뮬레이션·마우스 반응) ── */\n.free{position:relative;padding:200px 0 220px;background:var(--dark);text-align:center;overflow:hidden}\n.free canvas{position:absolute;inset:0;display:block;opacity:.9}\n.free .wrap{position:relative;z-index:1}\n.free h2{color:#fff}\n.free p{margin:22px 0 56px;color:rgba(255,255,255,.72);font-size:22px;line-height:1.55}\n.free .gbtn{justify-content:center}\n\n/* ── 푸터 ── */\nfooter{background:var(--dark);color:#fff;padding:34px 0}\nfooter .row{display:flex;align-items:center;justify-content:space-between;gap:20px}\nfooter .row b{font-size:19px;font-weight:700}\nfooter .row span{color:rgba(255,255,255,.45);font-size:13px}\nfooter .wrap{max-width:none;margin:0;padding:0 56px}\n\n/* ── 플로팅 독(원본 registerToast 번안) ── */\n.dock{position:fixed;left:50%;bottom:28px;z-index:60;border-radius:0;display:flex;align-items:center;gap:22px;width:720px;padding:20px 14px 20px 26px;background:rgba(255,255,255,.6);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 30px rgba(4,3,8,.12),0 1px 4px rgba(4,3,8,.05);opacity:0;transform:translate(-50%,140%);pointer-events:none;transition:transform .55s cubic-bezier(.22,1,.36,1),opacity .4s ease}\n.dock.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}\n.dock .tx b{display:block;font-size:17px;font-weight:700}\n.dock .tx i{display:block;margin-top:7px;font-style:normal;color:var(--g2);font-size:13px}\n.dock .go{margin-left:auto;flex:none;border-radius:0;background:var(--btng);background-size:220% 100%;background-position:0% 50%;color:#fff;font-size:15px;font-weight:700;padding:13px 24px;transition:background-position .6s ease}\n.dock .go:hover{background-position:100% 50%}\n\n/* ── 모바일 ── */\n@media (max-width:900px){\n  .gnb nav{display:none}\n  .snav{display:none}\n  h2.tt{font-size:36px}\n  .kv h1{font-size:18vw}\n  .kv .klead{font-size:17px}\n  .kv .gbtn{flex-direction:column;align-items:center;gap:12px}\n  .kv .kvmeta{font-size:11px;padding:0 20px}\n  .kv .sub2 p{font-size:20px}\n  .answer .cards{flex-direction:column;gap:28px}\n  .answer .card{flex:none;height:110vw}\n  .answer .ctx{left:24px;right:80px;bottom:26px}\n  .answer .ctx b{font-size:24px}\n  .skill .tabs{flex-wrap:wrap;gap:10px}\n  .skill .tabs button{flex:none;width:calc(50% - 5px)}\n  #skillPanes{height:auto}\n  .skill .pane{position:static;display:none;height:auto;flex-direction:column;opacity:1;transform:none;pointer-events:auto;transition:none}\n  .skill .pane.onv{display:flex}\n  .skill .tb{width:100%;padding:32px 24px}\n  .skill .pane img{width:100%;height:56vw}\n  .feature .fgrid{flex-direction:column;gap:56px}\n  .feature .fleft{width:100%;position:static}\n  .feature .fcard img{height:54vw}\n  .free .gbtn{flex-direction:column;align-items:center}\n  .agenda .alist li{gap:14px;padding:20px 6px}\n  .agenda .at{width:92px;font-size:13px}\n  .agenda .am b{font-size:16px}\n  .adrawer{padding:48px 26px}\n  .register form{grid-template-columns:1fr}\n  footer .wrap{padding:0 20px}\n  .dock{display:none}\n}\n@media (prefers-reduced-motion:reduce){\n  .kv .sheen i{animation:none;opacity:0}\n  .answer .card > img{animation:none;transform:none}\n  .rv,.kv .ent,.kv h1 .w,.answer .card,h2.wt .w,h2.wt .gt,.agenda .alist.rv li,#faqList.rv .item{opacity:1 !important;transform:none !important;transition:none !important;filter:none !important}\n}\n\n.rv,.kv .ent,.answer .card,h2.wt .w,h2.wt .gt,.agenda .alist.rv li,#faqList.rv .item{opacity:1!important;transform:none!important;transition:none!important;filter:none!important}\n.kv{height:100vh!important}\n.kv .sub2{display:none!important}\n.kv .in{opacity:1!important;transform:translateY(-20px)!important}\n.kv .ph .vsub{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}\n.kv .ov{opacity:.66}\n.snav,.adrawer,.adim{display:none!important}\nbody{overflow-x:hidden}\nhtml{scroll-behavior:auto}\n\n.eg-hero{position:relative;height:100vh;min-height:520px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;overflow:hidden;background:var(--dark)}\n.eg-hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}\n.eg-hero .shade{position:absolute;inset:0;background:rgba(4,3,8,.42)}\n.eg-hero .in{position:relative;z-index:1}\n.eg-hero h1{font-size:min(9vw,120px);font-weight:700;line-height:1.05;letter-spacing:-.02em}\n.eg-hero p{margin-top:20px;font-size:20px;opacity:.85}\n.eg-split{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;min-height:100vh;padding:120px 0}\n.eg-split h1{font-size:64px;font-weight:700;line-height:1.1;letter-spacing:-.02em}\n.eg-split h1 .lw{font-weight:500;display:block}\n.eg-split p{margin:22px 0 30px;font-size:18px;line-height:1.6;color:var(--g2)}\n.eg-split .vis{height:520px;overflow:hidden}\n.eg-split .vis img{width:100%;height:100%;object-fit:cover}\n.eg-mission{padding:180px 0;text-align:center}\n.eg-mission .eb{display:block;margin-bottom:26px;font-size:18px;font-weight:600;background:var(--txtg);-webkit-background-clip:text;background-clip:text;color:transparent}\n.eg-mission p{font-size:34px;font-weight:600;line-height:1.5;letter-spacing:-.02em}\n. nt 100%);filter:blur(36px);transform:translateX(-160%) skewX(-14deg);animation:sheenSweep 7.5s ease-in-out infinite;will-change:transform}\n.kv .sheen i.s2{width:24%;opacity:.7;animation-delay:3.8s}\n@keyframes sheenSweep{0%{transform:translateX(-160%) skewX(-14deg)}34%{transform:translateX(440%) skewX(-14deg)}100%{transform:translateX(440%) skewX(-14deg)}}\n.kv .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 24px;transform:translateY(-50px)}\n.kv h1{margin:0 0 34px;font-size:min(14.5vw,232px);font-weight:700;line-height:1.02;letter-spacing:-.02em;text-shadow:0 1px 10px rgba(0,0,0,.15)}\n.kv .klead{margin-bottom:56px;font-size:clamp(19px,2.4vw,40px);font-weight:500;color:rgba(255,255,255,.95);text-shadow:0 1px 6px rgba(0,0,0,.2)}\n.kv h1 .l{display:block}\n.kv .ent{opacity:0;transform:translateY(16px);transition:opacity .8s cubic-bezier(.2,.6,.2,1),transform .8s cubic-bezier(.2,.6,.2,1)}\n.kv.ready .ent{opacity:1;transform:none}\n.kv.ready .kvmeta{opacity:.7}\n.kv.ready .klead{opacity:.8}\n.kv.ready .d2{transition-delay:.35s}\n.kv.ready .d4{transition-delay:.6s}\n.kv h1 .w{display:inline-block;opacity:0;transform:translate3d(0,14px,0);transition:opacity .7s cubic-bezier(.2,.6,.2,1),transform .7s cubic-bezier(.2,.6,.2,1);will-change:opacity,transform}\n.kv.ready h1 .w{opacity:1;transform:translate3d(0,0,0)}\n.kv .gbtn{justify-content:center}\n.kv .kvmeta{position:absolute;left:0;right:0;bottom:32px;display:flex;justify-content:space-between;align-items:center;padding:0 56px;color:rgba(255,255,255,.85);font-size:18px;font-weight:500;letter-spacing:.01em}\n.kv .kvmeta .mid{position:absolute;left:50%;transform:translateX(-50%)}\n.kv .sub2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;opacity:0;pointer-events:none;padding:0 24px}\n\n/* ── 1.5 KV 후반 — 어두워지며 미션 멘트 툭(toss insurance 미션 스테이지 참고) background:rgba(255,255,255,.26)}\n.answer .ctx{position:absolute;left:40px;right:96px;top:40px;z-index:1;text-align:left}\n.answer .ctx b{display:block;margin-bottom:14px;color:#fff;font-size:32px;font-weight:600;line-height:1.3}\n.answer .ctx p{color:rgba(255,255,255,.72);font-size:15px;line-height:1.6}\n\n/* ── 6. 스킬 탭 5종(원본 이식: 좌 텍스트 500px 소프트 + 우 이미지) ── */\n.skill{padding:160px 0;background:linear-gradient(180deg,#fff 0%,#F2F7FF 55%,#EDF4FF 100%)}\n.skill h2{text-align:center}\n.skill .tabs{display:flex;margin:4.5vw 0 30px;width:100%}\n.skill .tabs button{position:relative;flex:1;padding-bottom:14px;border:0;border-bottom:2px solid #F0F1F3;background:none;color:#C6CCD4;font-family:inherit;font-size:18px;font-weight:500;cursor:pointer;transition:color .2s,border-color .2s}\n.skill .tabs button.active{border-color:#F0F1F3;color:var(--ink);font-weight:600}\n.skill .tabs button .prog{position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--bgray)}\n#skillPanes{position:relative;height:400px}\n.skill .pane{position:absolute;inset:0;display:flex;height:400px;opacity:0;transform:translateY(10px);transition:opacity .45s cubic-bezier(.2,.6,.2,1),transform .45s cubic-bezier(.2,.6,.2,1);pointer-events:none}\n.skill .pane.onv{opacity:1;transform:none;pointer-events:auto}\n.skill .tb{display:flex;flex-direction:column;justify-content:center;width:500px;flex:none;padding:0 48px 0 60px;background:#fff}\n.skill .tb .badge{width:max-content;margin-bottom:12px;padding:0 8px;background:var(--lime);color:var(--onp);font-size:14px;font-weight:600;height:25px;line-height:25px;letter-spacing:-.28px}\n.skill .tb strong{margin-bottom:26px;font-size:30px;font-weight:600;line-height:40px}\n.skill .tb p{color:var(--g);font-size:16px;line-height:26px;letter-spacing:-.32px}\n.skill .pane img{width:calc(100% - 500px);height:100%;object-fit:cover}\n\n/* ── 7. 피처 — 좌 고정 타이틀 + 우 카드 3 스크롤(toss insurance 패턴) ── */\n.feature{padding:180px 0 200px;background:linear-gradient(180deg,
