<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONSITE — Section Taxonomy (Visual)</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
:root{
  --f-canvas:#0d0d0f;--f-s1:#17171a;--f-s2:#222226;--f-ink:#f5f5f7;--f-mut:#8a8a90;--f-dim:#5f5f66;
  --f-line:rgba(255,255,255,.08);--f-line2:rgba(255,255,255,.15);--f-accent:#0099ff;--p0:#4ade80;--p1:#facc15;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  /* wireframe (라이트) */
  --w:#e6e7ec;--w-d:#d4d7df;--w-a:#c3d4ff;--w-t:#cdd0d9;--w-bg:#fff;--w-card:#f2f3f6;--w-cardline:#e6e7ec;
}
*{box-sizing:border-box}
body{margin:0;background:var(--f-canvas);color:var(--f-ink);
  font-family:"Inter",-apple-system,system-ui,"Apple SD Gothic Neo","Pretendard JP",sans-serif;
  font-feature-settings:"cv01","cv05","cv09","cv11","ss03","ss07";letter-spacing:-.011em}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;background:var(--f-canvas);border-bottom:1px solid var(--f-line);padding:14px 24px;display:flex;align-items:center;gap:16px}
.brand{font-weight:700;font-size:16px}.brand span{color:var(--f-mut);font-weight:500;margin-left:8px;font-size:14px}
.search{flex:1;max-width:340px;background:var(--f-s1);border:1px solid var(--f-line);color:var(--f-ink);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit}
.search::placeholder{color:var(--f-mut)}
.links{display:flex;gap:8px;margin-left:auto}
.tbtn{border:1px solid var(--f-line);background:var(--f-s1);color:var(--f-ink);border-radius:100px;padding:7px 15px;font-size:13px;font-weight:500;cursor:pointer}
.tbtn:hover{background:var(--f-s2)}
.tbtn.on{background:#fff;color:#0d0d0f;border-color:transparent}

.body{display:flex}
.idx{width:220px;flex:0 0 220px;position:sticky;top:57px;align-self:flex-start;height:calc(100vh - 57px);overflow-y:auto;border-right:1px solid var(--f-line);padding:14px 10px}
.idx a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--f-mut);font-size:13px;cursor:pointer}
.idx a:hover{background:var(--f-s1);color:var(--f-ink)}.idx a.on{background:var(--f-s2);color:var(--f-ink)}
.idx a .no{font-family:var(--mono);font-size:11px;color:var(--f-dim);width:16px}
.idx a .pd{width:6px;height:6px;border-radius:50%;margin-left:auto}
.main{flex:1;min-width:0;padding:22px 30px 140px}

.cat{padding:20px 0 8px;border-top:1px solid var(--f-line);scroll-margin-top:66px}
.cat-h{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.cat-h .no{font-family:var(--mono);font-size:13px;color:var(--f-dim)}
.cat-h h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em}
.pill{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px}
.pill.P0{color:var(--p0);background:rgba(74,222,128,.12)}.pill.P1{color:var(--p1);background:rgba(250,204,21,.12)}
.cat-desc{color:var(--f-mut);font-size:13px;margin:0 0 14px}
.group-h{font-size:12.5px;font-weight:600;color:var(--f-ink);margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.group-h .gn{font-family:var(--mono);font-size:11px;color:var(--f-dim)}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.gitem{}
.lbl{font-size:11.5px;color:var(--f-mut);margin-top:7px;line-height:1.35}
.gitem:hover .lbl{color:var(--f-ink)}
.gitem.hit .lbl{color:var(--f-accent)}

/* ===== 와이어프레임 썸네일 ===== */
.tb{aspect-ratio:16/10;background:var(--w-bg);border:1px solid #e6e7ec;border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:5px;overflow:hidden;position:relative}
.gitem:hover .tb{border-color:var(--f-line2);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.tb .row{display:flex;gap:5px;flex:1;min-height:0}
.tb .col{display:flex;flex-direction:column;gap:4px;min-height:0}
.tb .bk{background:var(--w);border-radius:3px;flex:1}
.tb .bk.d{background:var(--w-d)}.tb .bk.a{background:var(--w-a)}
.tb .ln{height:4px;background:var(--w);border-radius:2px}
.tb .ln.t{height:6px;background:var(--w-t);width:72%}
.tb .ln.s{width:52%}.tb .ln.xs{width:34%}
.tb .btn{height:9px;width:30px;background:var(--w-a);border-radius:5px}
.tb .btn.g{background:var(--w-d);width:24px}
.tb .cir{width:13px;height:13px;border-radius:50%;background:var(--w-d);flex:none}
.tb .card{background:var(--w-card);border:1px solid var(--w-cardline);border-radius:4px;padding:5px;display:flex;flex-direction:column;gap:3px;flex:1;min-height:0}
.tb .navb{display:flex;align-items:center;gap:5px;height:11px;flex:none}
.tb .tri{position:absolute;left:50%;top:50%;width:0;height:0;border-left:11px solid #b7bcc7;border-top:7px solid transparent;border-bottom:7px solid transparent;transform:translate(-35%,-50%)}
.tb .arw{color:#b7bcc7;font-size:11px;display:flex;align-items:center}
.tb.pad0{padding:0}
.tb .full{position:absolute;inset:0;background:var(--w-d);border-radius:8px}
.tb .ov{position:absolute;left:9px;right:9px;bottom:9px;display:flex;flex-direction:column;gap:4px}
.tb .ov .ln{background:#fff;opacity:.85}
.empty{padding:40px;color:var(--f-mut)}
@media(max-width:820px){.idx{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">ONSITE <span>Taxonomy · Visual</span></div>
  <input class="search" id="search" placeholder="유형 검색…">
  <div class="links">
    <a class="tbtn" href="taxonomy.html">텍스트 뷰</a>
    <a class="tbtn on">비주얼 뷰</a>
    <a class="tbtn" href="../app/gallery.html">갤러리</a>
  </div>
</div>
<div class="body">
  <nav class="idx" id="idx"></nav>
  <main class="main"><div id="cats"></div></main>
</div>

<script src="taxonomy-data.js"></script>
<script>
/* ===== 와이어프레임 프리미티브 ===== */
const card=(inner)=>`<div class="card">${inner}</div>`;
const gridN=(n,mk)=>`<div class="row">${Array.from({length:n},(_,i)=>mk(i)).join('')}</div>`;
const P={
  nav:()=>`<div class="navb"><span class="cir" style="width:8px;height:8px"></span><span class="ln xs"></span><span class="ln xs"></span><span class="ln xs"></span><span class="btn" style="margin-left:auto"></span></div><div class="row"><div class="bk" style="opacity:.35"></div></div>`,
  breadcrumb:()=>`<div class="navb" style="height:8px"><span class="ln xs" style="width:20px"></span><span class="arw">›</span><span class="ln xs" style="width:20px"></span><span class="arw">›</span><span class="ln xs" style="width:26px"></span></div><div class="row"><div class="bk" style="opacity:.3"></div></div>`,
  sidebar:()=>`<div class="row"><div class="col" style="flex:0 0 30%"><span class="ln"></span><span class="ln s"></span><span class="ln"></span><span class="ln s"></span></div><div class="bk"></div></div>`,
  heroSplit:()=>`<div class="row" style="align-items:center"><div class="col" style="flex:1;gap:5px"><span class="ln t"></span><span class="ln"></span><span class="ln s"></span><span class="btn" style="margin-top:3px"></span></div><div class="bk d"></div></div>`,
  heroCenter:()=>`<div class="col" style="flex:1;align-items:center;justify-content:center;gap:5px"><span class="ln t" style="width:60%"></span><span class="ln s"></span><span class="btn"></span></div>`,
  heroBg:()=>`<div class="full"></div><div class="ov"><span class="ln t"></span><span class="ln s"></span></div>`,
  heroVideo:()=>`<div class="full"></div><div class="tri"></div>`,
  heroBanner:()=>`<div class="col" style="flex:1;justify-content:center;gap:4px"><span class="ln t" style="width:45%"></span><span class="ln s"></span></div>`,
  imgtext:()=>`<div class="row" style="align-items:center"><div class="bk d"></div><div class="col" style="flex:1;gap:4px"><span class="ln t"></span><span class="ln"></span><span class="ln s"></span></div></div>`,
  zigzag:()=>`<div class="row"><div class="bk d"></div><div class="col" style="flex:1;gap:3px"><span class="ln"></span><span class="ln s"></span></div></div><div class="row"><div class="col" style="flex:1;gap:3px"><span class="ln"></span><span class="ln s"></span></div><div class="bk d"></div></div>`,
  grid2:()=>gridN(2,()=>card(`<span class="ln t"></span><span class="ln s"></span>`)),
  grid3:()=>gridN(3,()=>card(`<span class="ln t"></span><span class="ln s"></span>`)),
  grid4:()=>gridN(4,()=>card(`<span class="ln t"></span>`)),
  iconCard:()=>gridN(3,()=>card(`<span class="cir" style="margin:0 auto 2px"></span><span class="ln t" style="width:80%;margin:0 auto"></span>`)),
  imageCard:()=>gridN(3,()=>card(`<span class="bk d" style="height:14px;flex:none"></span><span class="ln t"></span>`)),
  bento:()=>`<div class="row"><div class="bk d" style="flex:2"></div><div class="col" style="flex:1;gap:5px"><div class="bk"></div><div class="bk"></div></div></div><div class="row" style="flex:.7"><div class="bk"></div><div class="bk"></div><div class="bk"></div></div>`,
  carousel:()=>`<div class="row" style="align-items:center"><span class="arw">‹</span><div class="card" style="flex:0 0 40%"><span class="ln t"></span><span class="ln s"></span></div><div class="card" style="flex:1"><span class="ln t"></span><span class="ln s"></span></div><div class="card" style="flex:0 0 15%"></div><span class="arw">›</span></div>`,
  masonry:()=>`<div class="row"><div class="col" style="flex:1;gap:5px"><div class="bk" style="flex:1.5"></div><div class="bk"></div></div><div class="col" style="flex:1;gap:5px"><div class="bk"></div><div class="bk" style="flex:1.5"></div></div><div class="col" style="flex:1;gap:5px"><div class="bk" style="flex:1.3"></div><div class="bk"></div></div></div>`,
  list:()=>`<div class="col" style="flex:1;gap:6px;justify-content:center"><span class="ln"></span><span class="ln s"></span><span class="ln"></span><span class="ln s"></span><span class="ln"></span></div>`,
  listThumb:()=>`<div class="col" style="flex:1;gap:6px;justify-content:center">${Array(3).fill(`<div class="row" style="flex:none;gap:5px;align-items:center"><span class="bk d" style="width:16px;height:12px;flex:none"></span><span class="ln"></span></div>`).join('')}</div>`,
  step:()=>`<div class="row" style="align-items:center;justify-content:space-between">${[1,2,3,4].map((n,i)=>`${i?'<span class="arw">–</span>':''}<div class="col" style="flex:none;align-items:center;gap:3px"><span class="cir"></span><span class="ln xs" style="width:20px"></span></div>`).join('')}</div>`,
  timeline:()=>`<div class="row" style="align-items:center"><div style="width:2px;background:var(--w-d);align-self:stretch;margin:2px 10px 2px 6px"></div><div class="col" style="flex:1;gap:8px"><span class="ln s"></span><span class="ln"></span><span class="ln s"></span></div></div>`,
  flow:()=>`<div class="row" style="align-items:center;justify-content:center;gap:4px"><div class="bk d" style="flex:0 0 26%"></div><span class="arw">→</span><div class="bk d" style="flex:0 0 26%"></div><span class="arw">→</span><div class="bk d" style="flex:0 0 26%"></div></div>`,
  diagram:()=>`<div class="row" style="align-items:center;justify-content:center;position:relative"><div class="bk d" style="flex:none;width:34px;height:24px"></div><span class="cir" style="position:absolute;left:14%;top:20%"></span><span class="cir" style="position:absolute;right:14%;top:20%"></span><span class="cir" style="position:absolute;left:14%;bottom:20%"></span><span class="cir" style="position:absolute;right:14%;bottom:20%"></span></div>`,
  table:()=>`<div class="col" style="flex:1;gap:0;border:1px solid var(--w);border-radius:4px;overflow:hidden">${Array(4).fill(`<div class="row" style="gap:0;border-bottom:1px solid var(--w)"><span style="flex:1;border-right:1px solid var(--w)"></span><span style="flex:1;border-right:1px solid var(--w)"></span><span style="flex:1"></span></div>`).join('')}</div>`,
  compare:()=>`<div class="row"><div class="card" style="flex:1"><span class="ln t"></span><span class="ln s"></span><span class="ln s"></span></div><div class="card a" style="flex:1;background:#eef3ff;border-color:#c3d4ff"><span class="ln t"></span><span class="ln s"></span><span class="ln s"></span></div></div>`,
  stat:()=>gridN(4,()=>`<div class="col" style="flex:1;align-items:center;gap:3px"><span class="bk d" style="height:14px;width:70%;flex:none"></span><span class="ln xs"></span></div>`),
  chart:()=>`<div class="row" style="align-items:flex-end;gap:5px;padding:2px">${[40,70,50,90,60].map(h=>`<div class="bk a" style="height:${h}%;flex:1"></div>`).join('')}</div>`,
  kpi:()=>gridN(3,()=>card(`<span class="bk d" style="height:12px;width:60%;flex:none"></span><span class="ln s"></span>`)),
  quote:()=>`<div class="col" style="flex:1;align-items:center;justify-content:center;gap:5px"><div style="font-size:22px;color:var(--w-d);line-height:.6">&ldquo;</div><span class="ln s"></span><span class="ln"></span><span class="ln xs"></span></div>`,
  logowall:()=>`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:1">${Array(8).fill(`<div class="bk"></div>`).join('')}</div>`,
  accordion:()=>`<div class="col" style="flex:1;gap:5px">${Array(3).fill(`<div class="row" style="flex:none;align-items:center;background:var(--w-card);border:1px solid var(--w-cardline);border-radius:4px;padding:4px 6px;gap:6px"><span class="ln"></span><span class="arw" style="margin-left:auto">⌄</span></div>`).join('')}</div>`,
  tab:()=>`<div class="navb" style="gap:4px"><span class="btn g"></span><span class="btn g" style="background:var(--w-a)"></span><span class="btn g"></span></div><div class="row"><div class="bk d"></div></div>`,
  form:()=>`<div class="col" style="flex:1;gap:6px;justify-content:center"><div class="bk" style="height:11px;flex:none;border:1px solid var(--w-d);background:#fafbfc;border-radius:3px"></div><div class="bk" style="height:11px;flex:none;border:1px solid var(--w-d);background:#fafbfc;border-radius:3px"></div><span class="btn" style="align-self:flex-start"></span></div>`,
  cta:()=>`<div class="col" style="flex:1;align-items:center;justify-content:center;gap:5px;background:var(--w-card);border-radius:5px"><span class="ln t" style="width:50%"></span><span class="btn"></span></div>`,
  footer:()=>`<div class="row" style="align-items:flex-start"><div class="col" style="flex:1;gap:3px"><span class="ln s"></span></div>${Array(3).fill(`<div class="col" style="flex:1;gap:3px"><span class="ln xs"></span><span class="ln xs"></span><span class="ln xs"></span></div>`).join('')}</div>`,
  mediaGrid:()=>`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:1">${Array(6).fill(`<div class="bk d"></div>`).join('')}</div>`,
  device:()=>`<div class="row" style="align-items:center;justify-content:center"><div style="width:26px;height:80%;background:var(--w-d);border-radius:5px;border:2px solid #c3c6cf"></div></div>`,
  text:()=>`<div class="col" style="flex:1;gap:5px;justify-content:center"><span class="ln t"></span><span class="ln"></span><span class="ln"></span><span class="ln s"></span></div>`,
};

/* ===== 유형 매핑 ===== */
function typeFor(catKey, gh, item, gn){
  const s=(gh+' '+item).toLowerCase();
  const has=(...k)=>k.some(x=>s.includes(x));
  if(has('breadcrumb'))return 'breadcrumb';
  if(has('sidebar'))return 'sidebar';
  if(has('marquee','logo'))return 'logowall';
  if(has('carousel','캐러셀'))return 'carousel';
  if(has('masonry'))return 'masonry';
  if(has('bento'))return 'bento';
  if(has('timeline','연혁'))return 'timeline';
  if(has('accordion'))return 'accordion';
  if(has('tab'))return 'tab';
  if(has('비교표','matrix','비교','지원환경','사양','requirement','check'))return catKey==='comparison'?(has('좌우','before','after','as-is','기존','자사','문제')?'compare':'table'):(catKey==='comparison'?'table':undefined)||_next();
  function _next(){return null;}
  if(has('video','영상','tutorial','demo 영상'))return 'heroVideo';
  if(has('device','mockup','디바이스','browser frame'))return 'device';
  if(has('quote','인용','후기'))return catKey==='case'?'quote':undefined || (catKey==='case'?'quote':null);
  if(has('form','문의','신청','견적','뉴스레터','상담','다단계'))return 'form';
  if(has('chart','progress','gauge','donut','bar chart','line'))return 'chart';
  if(has('kpi'))return 'kpi';
  if(has('flow','흐름','input/process'))return 'flow';
  if(has('step','단계'))return 'step';
  if(has('diagram','구조','architecture','생태계','ecosystem','integration map','api','연결','cloud'))return 'diagram';
  if(has('4단','4열','5단','6단','grid 2/3/4'))return 'grid4';
  if(has('3단','3열'))return 'grid3';
  if(has('2단','2열'))return 'grid2';
  if(has('썸네일','thumbnail'))return 'listThumb';
  if(has('list','리스트'))return catKey==='list'?'list':'list';
  if(has('split','분할','좌','우','50:50','40:60','60:40'))return catKey==='hero'?'heroSplit':'imgtext';
  // 카테고리·그룹 기본값
  const def={
    nav:'nav', text:'text', imgtext:gn&&gn.startsWith('4.2')?'zigzag':'imgtext',
    card: gn==='5.3'?'iconCard':(gn==='5.4'||gn==='5.9'?'imageCard':'grid3'),
    list:'list',
    feature: gn==='7.3'?'iconCard':(gn==='7.1'?'imageCard':'grid3'),
    product:'grid3', process:'step', diagram:'diagram', media:'mediaGrid',
    stat: gn==='12.2'?'chart':(gn==='12.3'?'kpi':'stat'),
    comparison:'table', case: gn==='14.3'?'logowall':(gn==='14.2'?'quote':'grid3'),
    blog: gn&&gn.startsWith('15.2')?'listThumb':'grid3', faq:'accordion',
    form:'form', cta:'cta', notice:'heroBanner', footer:'footer',
  };
  if(catKey==='hero'){
    const m={'2.1':'heroCenter','2.2':'heroBg','2.3':'heroVideo','2.4':'heroSplit','2.5':'device','2.6':'heroBanner','2.7':'heroCenter'};
    return m[gn]||'heroSplit';
  }
  return def[catKey]||'grid3';
}
function safeType(t){return P[t]?t:'grid3';}

/* ===== 렌더 ===== */
const idx=document.getElementById('idx'),cats=document.getElementById('cats'),search=document.getElementById('search');
idx.innerHTML=TAX.map(c=>`<a href="#c-${c.key}"><span class="no">${c.no}</span><span>${c.name}</span><span class="pd" style="background:${c.pri==='P1'?'var(--p1)':'var(--p0)'}"></span></a>`).join('');

function render(q=''){
  cats.innerHTML=TAX.map(c=>{
    const groups=c.groups.map(g=>{
      const its=g.items.map((it,i)=>({it,i}));
      const shown=q? its.filter(o=>o.it.toLowerCase().includes(q)||g.h.toLowerCase().includes(q)) : its;
      if(!shown.length)return '';
      const tiles=shown.map(o=>{
        const t=safeType(typeFor(c.key,g.h,o.it,g.n));
        const hit=q&&o.it.toLowerCase().includes(q);
        return `<div class="gitem ${hit?'hit':''}"><div class="tb">${P[t]()}</div><div class="lbl">${o.it}</div></div>`;
      }).join('');
      return `<div class="group-h"><span class="gn">${g.n}</span>${g.h}</div><div class="tgrid">${tiles}</div>`;
    }).join('');
    if(!groups.trim())return '';
    return `<section class="cat" id="c-${c.key}"><div class="cat-h"><span class="no">${c.no}</span><h2>${c.name}</h2><span class="pill ${c.pri}">${c.pri}</span>${c.badge?`<span class="pill" style="color:var(--f-accent);background:rgba(0,153,255,.12)">${c.badge}</span>`:''}</div><p class="cat-desc">${c.desc}</p>${groups}</section>`;
  }).join('')||'<div class="empty">결과 없음</div>';
}
render();
search.addEventListener('input',e=>render(e.target.value.toLowerCase().trim()));
const io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){document.querySelectorAll('.idx a').forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id);});}});},{rootMargin:'-12% 0px -78% 0px'});
function obs(){document.querySelectorAll('.cat').forEach(s=>io.observe(s));}
obs();const _r=render;render=function(q){_r(q);obs();};
</script>
</body>
</html>
