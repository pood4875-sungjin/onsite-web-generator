<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pack Inspector — 스타일팩 풀 DS 확인</title>
<style>
  :root{ --ui-bg:#0f1216; --ui-panel:#161a20; --ui-line:#262c35; --ui-fg:#e7ecf3; --ui-dim:#94a0b0; --ui-acc:#5b9dff; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--ui-bg); color:var(--ui-fg);
    font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; }
  .topbar{ position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 22px; background:rgba(15,18,22,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--ui-line); }
  .topbar h1{ font-size:15px; font-weight:700; margin:0; }
  .tag{ font-size:11px; color:var(--ui-dim); border:1px solid var(--ui-line); border-radius:999px; padding:3px 9px; }
  select,button.rz{ background:var(--ui-panel); color:var(--ui-fg); border:1px solid var(--ui-line); border-radius:8px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  button.rz.on{ background:var(--ui-acc); border-color:var(--ui-acc); color:#04121f; }
  .meta{ font-size:12px; color:var(--ui-dim); max-width:560px; line-height:1.5; }
  .wrap{ max-width:1340px; margin:0 auto; padding:26px 22px 120px; }
  .sec{ margin-top:40px; }
  .sec > h2{ font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ui-dim); margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--ui-line); }
  .panel{ background:var(--ui-panel); border:1px solid var(--ui-line); border-radius:14px; padding:20px; }
  .swgroup{ margin-bottom:18px; } .swgroup>b{ font-size:12px; color:var(--ui-dim); }
  .swrow{ display:flex; flex-wrap:wrap; gap:10px; margin-top:9px; }
  .sw{ width:150px; border:1px solid var(--ui-line); border-radius:10px; overflow:hidden; background:#0c0f13; }
  .sw .chip{ height:52px; } .sw .info{ padding:8px 10px; }
  .sw .var{ font-size:11px; font-weight:600; } .sw .hex{ font-size:11px; color:var(--ui-dim); font-family:ui-monospace,monospace; text-transform:uppercase; }
  .type-row{ display:flex; align-items:baseline; gap:16px; padding:9px 0; border-bottom:1px dashed var(--ui-line); }
  .type-row .lbl{ width:150px; flex:none; font-size:11px; color:var(--ui-dim); font-family:ui-monospace,monospace; }
  .type-row .spec{ width:70px; flex:none; font-size:11px; color:var(--ui-dim); }
  .type-row .demo{ color:#fff; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .scale{ display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; }
  .scale .item{ text-align:center; font-size:11px; color:var(--ui-dim); }
  .scale .bar{ background:var(--ui-acc); border-radius:3px; margin:0 auto 6px; }
  .scale.rad .box{ background:#26456f; border:1px solid var(--ui-acc); width:60px; height:60px; margin:0 auto 6px; }
  .framewrap{ border:1px solid var(--ui-line); border-radius:14px; overflow:hidden; background:#fff; margin:0 auto; transition:max-width .25s ease; }
  iframe.render{ width:100%; border:0; display:block; background:#fff; }
  .rztools{ display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .rztools .w{ font-size:11px; color:var(--ui-dim); margin-left:6px; }
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .cols h3{ font-size:12px; color:var(--ui-dim); margin:0 0 10px; }
  .refcard{ background:#fff; border:1px solid var(--ui-line); border-radius:12px; padding:12px; margin:0 0 14px; }
  .refcard img{ width:100%; height:auto; display:block; border-radius:6px; border:1px solid #eceff3; margin-bottom:10px; }
  .refcard figcaption{ font-size:11px; color:#5b6270; }
  .note{ font-size:12px; color:var(--ui-dim); line-height:1.6; }
  .empty{ font-size:12px; color:var(--ui-dim); font-style:italic; }
</style>
</head>
<body>
<div class="topbar">
  <h1>Pack Inspector</h1><span class="tag">스타일팩 풀 DS 확인</span>
  <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ui-dim)">팩
    <select id="packSel"></select></label>
  <span class="meta" id="packMeta"></span>
</div>

<div class="wrap">
  <div class="sec"><h2>① 파운데이션 · 컬러</h2><div class="panel" id="swatches"></div></div>
  <div class="sec"><h2>① 파운데이션 · 타입 / 스페이싱 / Radius</h2><div class="panel" id="scales"></div></div>
  <div class="sec"><h2>③ 컴포넌트 갤러리</h2><div class="panel"><div class="framewrap" style="max-width:100%"><iframe id="fComp" class="render" title="components"></iframe></div></div></div>

  <div class="sec"><h2>④ 섹션 · 실제 페이지 조립 (renderPage) + 반응형</h2>
    <div class="rztools">
      <button class="rz" data-w="390">Mobile 390</button>
      <button class="rz" data-w="768">Tablet 768</button>
      <button class="rz on" data-w="1280">Desktop 1280</button>
      <span class="w" id="wLabel"></span>
    </div>
    <div class="framewrap" id="stageWrap" style="max-width:1280px"><iframe id="fPage" class="render" title="page"></iframe></div>
  </div>

  <div class="sec"><h2>KRDS 원본 대조 (side-by-side)</h2>
    <div class="panel"><div class="cols">
      <div><h3>KRDS 원본 (Figma v1.0.0)</h3><div id="refCol"></div></div>
      <div><h3>이 팩이 재현한 것 (판정 기준)</h3><div class="note" id="reproNote"></div></div>
    </div></div>
  </div>
</div>

<script type="module">
import { PACKS, renderPage, buildDemoPageDoc } from '../core/packs/index.js';
import { validatePack } from '../core/packs/spec.js';
import { templatePack } from '../core/packs/_template/pack.js';

const ALL = [...PACKS, templatePack];              // 스캐폴드도 확인용으로 노출
const PACK_BY_ID = Object.fromEntries(ALL.map((p) => [p.meta.id, p]));
const $ = (s) => document.querySelector(s);
const REFS = [
  { src:'refs/krds/side-nav.png', cap:'Side navigation · Pretendard GOV · 정부블루 강조' },
  { src:'refs/krds/palette-blue.png', cap:'System / Blue 램프' },
  { src:'refs/krds/palette-red.png', cap:'System / Red 램프' },
];

const sel = $('#packSel');
ALL.forEach((p) => { const o = document.createElement('option'); o.value = p.meta.id; o.textContent = p.meta.name; sel.appendChild(o); });
sel.value = PACK_BY_ID.krds ? 'krds' : PACKS[0].meta.id;
sel.addEventListener('change', () => applyPack(sel.value));

// iframe 자동 높이
function autosize(f){ try{
  // 인스펙터는 최종 상태 표시 — rise 모션 요소 즉시 노출(IO in-iframe 타이밍 회피)
  f.contentDocument.querySelectorAll('.rise').forEach((el) => el.classList.add('in'));
  f.style.height = (f.contentDocument.body.scrollHeight + 2) + 'px';
}catch(e){} }
function loadFrame(f, html, cb){ f.onload = () => { autosize(f); setTimeout(() => autosize(f), 60); cb && cb(); }; f.srcdoc = html; }

function applyPack(id){
  const pack = PACK_BY_ID[id];
  const v = validatePack(pack);
  const badge = v.ok
    ? `<span style="color:#2ec07a;font-weight:700">✓ 표준 준수</span>`
    : `<span style="color:#ff8a8a;font-weight:700" title="${(v.errors[0]||'').replace(/"/g,'')}">✗ 표준 위반 (${v.errors.length})</span>`;
  $('#packMeta').innerHTML = `${badge} · ${pack.meta.desc}${pack.meta.source ? '  ·  ' + pack.meta.source : ''}`;
  renderFoundation(pack);
  renderComponents(pack);
  renderStage(pack);
  renderRepro(pack);
}

// ── ① 파운데이션 ──
function fval(pack, k){ return pack.foundation ? pack.foundation[k] : ''; }
function renderFoundation(pack){
  const groups = pack.docs?.swatchGroups || [];
  $('#swatches').innerHTML = groups.map((g) => `
    <div class="swgroup"><b>${g.label}</b><div class="swrow">${g.keys.map((k) => {
      const v = fval(pack, k) || '';
      return `<div class="sw"><div class="chip" style="background:${v}"></div><div class="info"><div class="var">${k}</div><div class="hex">${v||'—'}</div></div></div>`;
    }).join('')}</div></div>`).join('') || '<div class="empty">스와치 정보 없음</div>';

  const font = fval(pack, '--font') || 'system-ui';
  const ramp = pack.docs?.typeRamp;
  const rampHtml = ramp ? ramp.map((t) => `
    <div class="type-row"><span class="lbl">${t.name}</span><span class="spec">${t.px}px · ${t.weight}</span>
      <span class="demo" style="font-family:${font};font-size:${t.px}px;font-weight:${t.weight}">다람쥐 헌 쳇바퀴 AaGg 123</span></div>`).join('') : '<div class="empty">타입 램프 정보 없음</div>';

  const space = pack.docs?.spaceScale || [];
  const rad = pack.docs?.radiusScale || [];
  $('#scales').innerHTML = `
    ${rampHtml}
    <div style="font-size:12px;color:var(--ui-dim);margin:22px 0 10px">스페이싱 (px)</div>
    <div class="scale">${space.map((v) => `<div class="item"><div class="bar" style="width:${v}px;height:${Math.max(v,6)}px"></div>${v}</div>`).join('') || '—'}</div>
    <div style="font-size:12px;color:var(--ui-dim);margin:22px 0 10px">Radius (px)</div>
    <div class="scale rad">${rad.map((r) => `<div class="item"><div class="box" style="border-radius:${r.v}px"></div>${r.name}·${r.v}</div>`).join('') || '—'}</div>`;
}

// ── ③ 컴포넌트 갤러리 (iframe 격리) ──
function renderComponents(pack){
  const gal = pack.docs?.gallery;
  const f = $('#fComp');
  if(!gal){ loadFrame(f, `<!doctype html><body style="margin:0;padding:20px;font:13px system-ui;color:#889">이 팩은 컴포넌트 갤러리 미정의</body>`); return; }
  const ctx = { f: pack.foundation, layout: pack.layout, motion:'static', components: pack.components, data:{}, esc:(x)=>x };
  const body = gal.map((g) => `<div style="margin:0 0 26px"><div style="font:600 11px system-ui;letter-spacing:.08em;text-transform:uppercase;color:#8a93a0;margin-bottom:12px">${g.name}</div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${g.html()}</div></div>`).join('');
  const html = `<!doctype html><html><head><meta charset="utf-8"><style>${pack.globalCss(ctx)}\nbody{margin:0;padding:24px}</style></head><body><div class="${pack.rootClass||''}">${body}</div></body></html>`;
  loadFrame(f, html);
}

// ── ④ 섹션 = 실제 renderPage 출력 (iframe) ──
let currentPack;
function renderStage(pack){
  currentPack = pack;
  const doc = buildDemoPageDoc({ volume:'heavy' });
  const html = renderPage(doc, pack, { motion:'subtle' });
  loadFrame($('#fPage'), html);
}
document.querySelectorAll('.rz').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.rz').forEach((x) => x.classList.remove('on'));
  b.classList.add('on');
  const w = b.dataset.w;
  $('#stageWrap').style.maxWidth = w + 'px';
  $('#wLabel').textContent = w + 'px';
  setTimeout(() => autosize($('#fPage')), 320);
}));

// ── 원본 대조 ──
function renderRepro(pack){
  $('#refCol').innerHTML = REFS.map((r) => `<figure class="refcard"><img src="${r.src}" alt="" onerror="this.style.display='none'"><figcaption>${r.cap}</figcaption></figure>`).join('');
  $('#reproNote').innerHTML = pack.meta.id === 'krds'
    ? `왼쪽 KRDS 원본과 위 <b>컴포넌트/섹션</b>·<b>컬러 스와치</b> 비교:<br>
       ① 스와치 hex = KRDS 실측(brand #256ef4, ink #131416, line #cdd1d5)<br>
       ② 컴포넌트(버튼·뱃지·카드)가 정부블루·radius 8·1px 헤어라인·Pretendard GOV<br>
       ③ 섹션이 KRDS 컴포넌트로 조립 + 반응형(위 버튼)<br>→ 부합하면 <b>탑재 성공</b>.`
    : `${pack.meta.name} — KRDS 대조 대상 아님. 드롭다운을 KRDS로 바꿔 비교.`;
}

applyPack(sel.value);
</script>
</body>
</html>
