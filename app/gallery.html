<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONSITE Web Generator — Section Gallery</title>
<!-- 출력 토큰 + 섹션 렌더 킷 (빌더·갤러리 공용) -->
<link rel="stylesheet" href="../styles/sections.css">
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
:root{
  --f-canvas:#0d0d0f; --f-s1:#1a1a1d; --f-s2:#26262a;
  --f-ink:#f5f5f7; --f-mut:#8a8a90;
  --f-line:rgba(255,255,255,.09); --f-line2:rgba(255,255,255,.16);
  --f-accent:#0099ff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--f-canvas);color:var(--f-ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Pretendard JP",sans-serif;
  font-feature-settings:"cv01","cv05","cv09","cv11","ss03","ss07";letter-spacing:-.011em;overflow:hidden}
a{color:inherit;text-decoration:none}

.app{display:flex;flex-direction:column;height:100vh}
.topbar{height:52px;flex:0 0 52px;background:var(--f-canvas);border-bottom:1px solid var(--f-line);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:10}
.brand{font-weight:700;font-size:16px}.brand span{color:var(--f-mut);font-weight:500;margin-left:8px;font-size:14px}
.seg{display:flex;background:var(--f-s1);border:1px solid var(--f-line);border-radius:8px;padding:2px}
.seg button{border:none;background:none;padding:6px 14px;font-size:14px;font-weight:500;color:var(--f-mut);border-radius:6px;cursor:pointer}
.seg button.on{background:var(--f-s2);color:var(--f-ink)}
.tbtn{border:1px solid var(--f-line);background:var(--f-s1);color:var(--f-ink);border-radius:100px;padding:7px 16px;font-size:14px;font-weight:500;cursor:pointer}
.tbtn:hover{background:var(--f-s2)}

.body{flex:1;display:flex;min-height:0}
/* 좌측 네비 */
.nav{width:260px;flex:0 0 260px;background:var(--f-canvas);border-right:1px solid var(--f-line);overflow-y:auto;padding:16px}
.nav .search{width:100%;background:var(--f-s1);border:1px solid var(--f-line);color:var(--f-ink);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:16px;font-family:inherit}
.nav .search::placeholder{color:var(--f-mut)}
.nav .cat{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--f-mut);margin:18px 0 8px 4px}
.nav a.item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:var(--f-ink);font-size:14px;cursor:pointer}
.nav a.item:hover{background:var(--f-s1)}
.nav a.item.on{background:var(--f-s2)}
.nav a.item .vn{color:var(--f-mut);font-size:12px;font-family:"SF Mono",monospace}

/* 메인 갤러리 */
.gal{flex:1;overflow-y:auto;padding:28px 32px 120px;scroll-behavior:smooth}
.gal .cat-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--f-mut);
  margin:36px 0 4px;padding-bottom:12px;border-bottom:1px solid var(--f-line)}
.gal .cat-title:first-child{margin-top:0}

.sec{padding:32px 0;border-bottom:1px solid var(--f-line);scroll-margin-top:20px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sec-head h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.sec-head .type{font-family:"SF Mono",monospace;font-size:12px;color:var(--f-mut);background:var(--f-s1);padding:3px 8px;border-radius:6px}
.sec-head .vcount{font-size:13px;color:var(--f-mut)}

.variants{display:flex;flex-direction:column;gap:20px}
.vcard{border:1px solid var(--f-line);border-radius:14px;overflow:hidden;background:var(--f-s1)}
.vbar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--f-line)}
.vbar .dot{width:8px;height:8px;border-radius:50%;background:var(--f-accent)}
.vbar .vlabel{font-size:13px;font-weight:600}
.vbar .vid{font-family:"SF Mono",monospace;font-size:12px;color:var(--f-mut)}
.vbar .copy{margin-left:auto;font-size:12px;color:var(--f-mut);border:1px solid var(--f-line);background:none;
  border-radius:7px;padding:4px 10px;cursor:pointer}
.vbar .copy:hover{color:var(--f-ink);border-color:var(--f-line2)}
.vframe{background:#fff;max-height:520px;overflow:auto}
.vframe .sx{min-height:100%}

.empty-note{color:var(--f-mut);padding:40px;text-align:center}
@media(max-width:900px){.nav{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">ONSITE Generator <span>Section Gallery</span></div>
    <div class="seg" id="filter">
      <button class="on" data-cat="all">전체</button>
      <button data-cat="common">공통</button>
      <button data-cat="product">제품소개</button>
      <button data-cat="manual">매뉴얼</button>
    </div>
    <a class="tbtn" href="builder.html">빌더로 →</a>
  </div>
  <div class="body">
    <aside class="nav">
      <input class="search" id="search" placeholder="섹션 검색…">
      <div id="navList"></div>
    </aside>
    <main class="gal" id="gal"></main>
  </div>
</div>

<script src="../sections/registry.js"></script>
<script>
let filterCat='all', query='';
const CATS=['common','product','manual'];

function catsToShow(){return filterCat==='all'?CATS:[filterCat];}
function matches(s){return !query || s.label.toLowerCase().includes(query) || s.type.toLowerCase().includes(query)
  || s.variants.some(v=>v.label.toLowerCase().includes(query));}

function buildNav(){
  const el=document.getElementById('navList');
  el.innerHTML=catsToShow().map(cat=>{
    const secs=SECTIONS[cat].filter(matches);
    if(!secs.length)return '';
    return `<div class="cat">${CAT_LABEL[cat]}</div>`+secs.map(s=>
      `<a class="item" href="#sec-${cat}-${s.type}"><span>${s.label}</span><span class="vn">${s.variants.length}</span></a>`
    ).join('');
  }).join('');
}
function buildGallery(){
  const el=document.getElementById('gal');
  let html=catsToShow().map(cat=>{
    const secs=SECTIONS[cat].filter(matches);
    if(!secs.length)return '';
    return `<div class="cat-title">${CAT_LABEL[cat]} · ${secs.length}</div>`+secs.map(s=>`
      <section class="sec" id="sec-${cat}-${s.type}">
        <div class="sec-head">
          <h2>${s.label}</h2>
          <span class="type">${s.type}</span>
          <span class="vcount">${s.variants.length}개 케이스</span>
        </div>
        <div class="variants">
          ${s.variants.map(v=>`
            <div class="vcard">
              <div class="vbar">
                <span class="dot"></span>
                <span class="vlabel">${v.label}</span>
                <span class="vid">${v.id}</span>
                <button class="copy" data-cat="${cat}" data-type="${s.type}" data-v="${v.id}">HTML 복사</button>
              </div>
              <div class="vframe"><div class="sx">${s.render(v.id)}</div></div>
            </div>`).join('')}
        </div>
      </section>`).join('');
  }).join('');
  el.innerHTML=html||'<div class="empty-note">검색 결과 없음</div>';
  // 복사 버튼
  el.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>{
    const s=findSection(b.dataset.cat,b.dataset.type);
    const code=`<section class="sx">${s.render(b.dataset.v)}</section>`;
    navigator.clipboard?.writeText(code);
    const t=b.textContent;b.textContent='복사됨 ✓';setTimeout(()=>b.textContent=t,1200);
  }));
}
function rebuild(){buildNav();buildGallery();}

/* 네비 클릭 활성화 */
document.getElementById('navList').addEventListener('click',e=>{
  const a=e.target.closest('a.item');if(!a)return;
  document.querySelectorAll('.nav a.item').forEach(x=>x.classList.remove('on'));a.classList.add('on');
});
/* 필터 */
document.getElementById('filter').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#filter button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  filterCat=b.dataset.cat;rebuild();
});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.toLowerCase();rebuild();});

/* 스크롤 시 네비 하이라이트 */
const io=new IntersectionObserver((es)=>{
  es.forEach(e=>{if(e.isIntersecting){
    const id=e.target.id;
    document.querySelectorAll('.nav a.item').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+id));
  }});
},{rootMargin:'-10% 0px -80% 0px'});

function observe(){document.querySelectorAll('.sec').forEach(s=>io.observe(s));}
const _bg=buildGallery;buildGallery=function(){_bg();observe();};

rebuild();
</script>
</body>
</html>
