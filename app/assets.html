<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리소스 · MIDAS DRS</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('midas-theme')||'light')</script>
<script>
// 캐시 버스터 로더 — python http.server 휴리스틱 캐시 방지
['bundle.js','charts.js','graphics.js','i18n.js','icons.js','shell.js','modal.js'].forEach(function(s){ document.write('<scr'+'ipt src="'+s+'?v='+Date.now()+'"></scr'+'ipt>'); });
</script>
<link rel="stylesheet" href="ds.css">
<style>
  /* 리소스(자산) 라이브러리 — 아이콘·그래픽·마이다스(브랜드)·기타. 적재는 파일로(업로드 UI 없음 — 사용자 요청) */
  .tabs{display:flex;gap:8px;margin:18px 0 22px}
  .tab{padding:9px 18px;border-radius:var(--r-pill,999px);border:1px solid var(--hairline,#e4e4e7);background:var(--surface,#fff);color:var(--body,#555);font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .tab.on{background:var(--ink,#111);color:var(--canvas,#fff);border-color:var(--ink,#111)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .cell{position:relative;background:var(--surface,#fff);border:1px solid var(--hairline,#e4e4e7);border-radius:12px;padding:14px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:.15s}
  .cell:hover{border-color:var(--hairline-strong,#c9c9cf);transform:translateY(-2px)}
  .cell .pv{width:44px;height:44px;display:grid;place-items:center;color:var(--ink,#111)}
  .cell .pv svg{width:26px;height:26px}
  .cell .pv img{max-width:44px;max-height:44px;object-fit:contain}
  .cell.big .pv{width:64px;height:64px}
  .cell.big .pv img{max-width:64px;max-height:64px}
  .cell .nm{font-size:11.5px;color:var(--body-mid,#777);text-align:center;word-break:break-all;line-height:1.3}
  .empty{color:var(--mute,#999);font-size:13.5px;padding:28px 4px}
  .hint{font-size:12.5px;color:var(--mute,#999);margin:-10px 0 16px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink,#111);color:var(--canvas,#fff);font-size:13px;border-radius:999px;padding:9px 18px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.on{opacity:1}
  .seg{display:inline-flex;gap:6px;margin:0 0 14px}
  .seg button{padding:6px 14px;border-radius:999px;border:1px solid var(--hairline,#e4e4e7);background:none;color:var(--body,#555);font-size:12.5px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--brand-weak,#eee);color:var(--ink,#111);border-color:var(--hairline-strong,#c9c9cf)}
  .chlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--body,#555);text-decoration:none;border:1px solid var(--hairline,#e4e4e7);border-radius:10px;padding:8px 14px;margin:0 0 16px 10px}
  .chlink:hover{color:var(--ink,#111)}
</style>
</head>
<body class="ds-body app-grid">
<div data-snb></div>
<div class="content">
  <div data-gnb></div>
  <div class="page">
    <h1 data-i18n="리소스">리소스</h1>
    <p class="lead" data-i18n="아이콘·그래픽·브랜드 자산을 모아두고 어디서든 갖다 씁니다. 클릭하면 복사돼요.">아이콘·그래픽·브랜드 자산을 모아두고 어디서든 갖다 씁니다. 클릭하면 복사돼요.</p>
    <div class="tabs" id="tabs"></div>
    <div id="body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  mountShell('assets');
  var CATS=[['icons','아이콘'],['graphics','그래픽'],['midas','마이다스'],['etc','기타']];
  var cur='icons';
  var tabs=document.getElementById('tabs'), body=document.getElementById('body'), toastEl=document.getElementById('toast');
  var L=window.L||function(s){return s};
  function toast(m){ toastEl.textContent=m; toastEl.classList.add('on'); setTimeout(function(){toastEl.classList.remove('on')},1400); }
  function copyText(t){ (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast(L('복사됨'))},function(){toast(L('복사 실패'))}); }

  function renderIcons(){
    var names=Object.keys(window.ICON||{});
    var h='<p class="hint">'+L('앱 공용 아이콘')+' '+names.length+L('종 — 클릭하면 SVG 코드가 복사돼요.')+'</p><div class="grid">';
    h+=names.map(function(n){ return '<div class="cell" data-ic="'+n+'"><span class="pv">'+window.ICON[n]+'</span><span class="nm">'+n+'</span></div>'; }).join('');
    body.innerHTML=h+'</div>';
    body.querySelectorAll('[data-ic]').forEach(function(c){ c.onclick=function(){ copyText(window.ICON[c.getAttribute('data-ic')]); }; });
  }
  /* 그래픽 — Figma 39:53715 컬러 그래픽 셋(graphics.js 레지스트리). 그린/블루 토글 */
  var gColor='green';
  function renderGraphics(){
    var G=window.GRAPHICS||[];
    if(!G.length){ body.innerHTML='<p class="empty">'+L('그래픽 자산 적재 중이에요. 잠시 후 새로고침 해주세요.')+'</p>'; return; }
    var h='<div class="seg">'+['green','blue'].map(function(c){ return '<button data-c="'+c+'"'+(c===gColor?' class="on"':'')+'>'+(c==='green'?L('그린'):L('블루'))+'</button>'; }).join('')+'</div>'
      +'<a class="chlink" href="chart-inspector.html">📊 '+L('차트 라이브러리')+' →</a>';
    h+='<div class="grid">'+G.filter(function(g){return g.color===gColor}).map(function(g){
      return '<div class="cell big" data-src="'+g.src+'"><span class="pv"><img src="'+g.src+'" alt="'+g.name+'" loading="lazy"></span><span class="nm">'+g.name+'</span></div>';
    }).join('')+'</div>';
    body.innerHTML=h;
    body.querySelectorAll('.seg button').forEach(function(b){ b.onclick=function(){ gColor=b.getAttribute('data-c'); renderGraphics(); }; });
    body.querySelectorAll('[data-src]').forEach(function(c){ c.onclick=function(){ copyText(location.origin+location.pathname.replace(/[^\/]*$/,'')+c.getAttribute('data-src')); }; });
  }
  /* 마이다스(브랜드 로고)·기타 — 파일 적재식(window.BRAND_ASSETS / ETC_ASSETS 레지스트리가 생기면 자동 표시) */
  function renderStatic(listName, emptyMsg){
    var list=window[listName]||[];
    if(!list.length){ body.innerHTML='<p class="empty">'+emptyMsg+'</p>'; return; }
    body.innerHTML='<div class="grid">'+list.map(function(a){
      return '<div class="cell big" data-src="'+a.src+'"><span class="pv"><img src="'+a.src+'" alt="'+a.name+'"></span><span class="nm">'+a.name+'</span></div>';
    }).join('')+'</div>';
    body.querySelectorAll('[data-src]').forEach(function(c){ c.onclick=function(){ copyText(c.getAttribute('data-src')); }; });
  }
  function show(cat){
    cur=cat;
    tabs.innerHTML=CATS.map(function(c){ return '<button class="tab'+(c[0]===cur?' on':'')+'" data-t="'+c[0]+'">'+L(c[1])+'</button>'; }).join('');
    tabs.querySelectorAll('.tab').forEach(function(b){ b.onclick=function(){show(b.getAttribute('data-t'))}; });
    if(cat==='icons') renderIcons();
    else if(cat==='graphics') renderGraphics();
    else if(cat==='midas') renderStatic('BRAND_ASSETS', L('브랜드 로고·심볼 자리예요. 파일을 주시면 여기에 적재됩니다.'));
    else renderStatic('ETC_ASSETS', L('기타 그래픽 자산 자리예요. 파일을 주시면 여기에 적재됩니다.'));
  }
  show('icons');
})();
</script>
</body>
</html>
