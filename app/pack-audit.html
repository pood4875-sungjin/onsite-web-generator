<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팩 검수 — 원본 대조 · MIDAS DRS</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;background:#0f1219;color:#e8eaf0}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#151a24;position:sticky;top:0;z-index:5}
  header b{font-size:14px}
  header .hint{font-size:12px;color:#8a90a0}
  select,input{background:#1e2432;color:#e8eaf0;border:1px solid #2a3142;border-radius:6px;padding:6px 10px;font-size:13px}
  input{width:340px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;height:calc(100vh - 52px)}
  .col{display:flex;flex-direction:column;background:#151a24;border-radius:8px;overflow:hidden}
  .col h3{margin:0;padding:8px 12px;font-size:12px;letter-spacing:.08em;color:#8a90a0;text-transform:uppercase}
  .col iframe{flex:1;border:0;width:100%;background:#fff}
</style>
</head>
<body>
<header>
  <b>팩 검수 — 원본 대조</b>
  <select id="pk"></select>
  <input id="src" placeholder="원본 문서 URL (예: /_src-naver/네이버 스타일_02.dc.html)">
  <span class="hint">좌=원본 · 우=팩 템플릿 덱. 각자 스크롤하며 타입별 대조. 새 팩 검수 시 소스 폴더를 /_src-&lt;팩&gt;/에 두고 URL만 바꾸면 됨</span>
</header>
<div class="cols">
  <div class="col"><h3>원본</h3><iframe id="fa"></iframe></div>
  <div class="col"><h3>팩 렌더</h3><iframe id="fb"></iframe></div>
</div>
<script src="charts.js"></script>
<script src="packs.pitch.js"></script>
<script src="packs.honors.js"></script>
<script src="packs.naver.js"></script>
<script src="packs.rams.js"></script>
<script src="packs.pastel.js"></script>
<script src="packs.sfmi.js"></script>
<script>
  var PACKS = [
    { id: 'sfmi', label: 'SFMI Report', deck: function(){ return sfmiTemplateDeck(); }, render: function(d){ return renderSfmiDeck(d); }, src: '/_src-pastel/' + encodeURIComponent('디자인AX 보고 - SFMI Multi.dc.html') },
    { id: 'pastel', label: 'Pastel Gradient', deck: function(){ return pastelTemplateDeck(); }, render: function(d){ return renderPastelDeck(d); }, src: '/_src-pastel/' + encodeURIComponent('디자인AX 보고 - Pastel.dc.html') },
    { id: 'rams', label: 'Rams Report', deck: function(){ return ramsTemplateDeck(); }, render: function(d){ return renderRamsDeck(d); }, src: '/_src-rams/' + encodeURIComponent('Rams Report Template.dc.html') },
    { id: 'naver', label: 'Design AX Line', deck: function(){ return naverTemplateDeck(); }, render: function(d){ return renderNaverDeck(d); }, src: '/_src-naver/' + encodeURIComponent('네이버 스타일_02.dc.html') },
    { id: 'honors', label: 'MIDAS Honors', deck: function(){ return honorsTemplateDeck(); }, render: function(d){ return renderHonorsDeck(d); }, src: '' },
    { id: 'pitch', label: 'Creatable Pitch', deck: function(){ return pitchTemplateDeck(); }, render: function(d){ return renderPitchDeck(d); }, src: '' }
  ];
  var pk = document.getElementById('pk'), srcIn = document.getElementById('src');
  PACKS.forEach(function(p){ var o=document.createElement('option'); o.value=p.id; o.textContent=p.label; pk.appendChild(o); });
  function load(){
    var p = PACKS.filter(function(x){ return x.id===pk.value; })[0] || PACKS[0];
    if (!srcIn.value) srcIn.value = p.src || '';
    document.getElementById('fa').src = srcIn.value || 'about:blank';
    var fb = document.getElementById('fb');
    try { fb.srcdoc = p.render(p.deck()); } catch(e) { fb.srcdoc = '<pre>'+e.message+'</pre>'; }
    fb.onload = fit;
  }
  // 팩 렌더(1280px 고정)를 칸 폭에 맞게 축소 — 원본은 deck-stage가 스스로 맞춘다
  function fit(){
    var fb = document.getElementById('fb');
    try { var d = fb.contentDocument; if (d && d.body) d.body.style.zoom = Math.min(1, fb.clientWidth / 1300); } catch(e) {}
  }
  window.addEventListener('resize', fit);
  pk.onchange = function(){ srcIn.value=''; load(); };
  srcIn.onchange = load;
  var q = new URLSearchParams(location.search);
  if (q.get('pack')) pk.value = q.get('pack');
  if (q.get('src')) srcIn.value = q.get('src');
  load();
</script>
</body>
</html>
