<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 프로젝트 · ONSITE Studio</title>
<style>
  :root{ --ink:#14151a; --ink2:#5b6270; --ink3:#8a8f9c; --line:#e9ebf0; --accent:#5b5bf5; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;color:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1000px 560px at 20% 0%,rgba(120,110,255,.10),transparent 60%),
               radial-gradient(900px 620px at 90% 100%,rgba(255,120,190,.10),transparent 55%),#fbfcfe}
  .stepper{width:640px;max-width:92vw;text-align:center;position:relative;padding:40px 24px 80px}
  .mark{width:40px;height:40px;border-radius:12px;margin:0 auto 22px;background:linear-gradient(135deg,#22d3ee,#818cf8)}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--ink2);font-size:14px;margin:0 0 30px}
  .step{display:none;animation:fade .3s ease}
  .step.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .cards{display:flex;gap:14px;justify-content:center}
  .kc{width:200px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:22px 18px;cursor:pointer;text-align:left;transition:.15s}
  .kc:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(20,24,29,.08)}
  .kc.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,245,.14)}
  .kc .ic{width:34px;height:34px;border-radius:9px;background:#f1f2f7;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:18px}
  .kc b{display:block;font-size:15px;margin-bottom:3px}.kc span{font-size:12px;color:var(--ink3)}
  .fields{max-width:420px;margin:0 auto;text-align:left;display:flex;flex-direction:column;gap:12px}
  .fields label{font-size:12px;color:var(--ink2);margin:6px 0 -6px}
  .inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;font-family:inherit;outline:none}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,245,.12)}
  .styles{display:flex;gap:14px;justify-content:center}
  .sc{width:170px;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;background:#fff;transition:.15s}
  .sc:hover{transform:translateY(-2px)}.sc.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,245,.14)}
  .sc .sw{height:96px}.sc .cap{padding:10px 12px;font-size:13px;font-weight:600;text-align:left}
  .nav{margin-top:32px;display:flex;gap:10px;justify-content:center}
  .btn{border:1px solid var(--line);background:#fff;border-radius:100px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.ghost{border:none;background:none;color:var(--ink2)}
  .dots{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;gap:7px}
  .dots i{width:7px;height:7px;border-radius:999px;background:#d3d8e0;transition:.2s}.dots i.on{width:22px;border-radius:10px;background:var(--ink)}
</style>
</head>
<body>
<div class="stepper">
  <div class="mark"></div>

  <div class="step on" id="st1">
    <h1>어떤 걸 만들까요?</h1>
    <p class="sub">단일 페이지 하나, 아니면 여러 페이지 사이트.</p>
    <div class="cards" id="kinds">
      <div class="kc sel" data-k="single"><div class="ic">📄</div><b>단일 페이지</b><span>랜딩 · 공지 등 한 장</span></div>
      <div class="kc" data-k="multi"><div class="ic">🗂️</div><b>다중 사이트</b><span>메인·기능·요금… 여러 장</span></div>
    </div>
    <div class="nav"><button class="btn primary" onclick="go(2)">다음 →</button></div>
  </div>

  <div class="step" id="st2">
    <h1>기본 정보를 알려주세요</h1>
    <p class="sub">모든 페이지가 공유할 값이에요. 나중에 바꿀 수 있어요.</p>
    <div class="fields">
      <label>프로젝트 이름</label><input class="inp" id="pname" placeholder="예: 온사이트 제품사이트">
      <label>제품명</label><input class="inp" id="product" placeholder="예: Onsite">
      <label>태그라인 (한 줄 소개)</label><input class="inp" id="tagline" placeholder="예: 현장의 모든 일을 하나로">
      <label>주 버튼(CTA)</label><input class="inp" id="cta" placeholder="예: 무료로 시작하기">
    </div>
    <div class="nav"><button class="btn ghost" onclick="go(1)">← 이전</button><button class="btn primary" onclick="go(3)">다음 →</button></div>
  </div>

  <div class="step" id="st3">
    <h1>스타일을 선택하세요</h1>
    <p class="sub">생성될 페이지의 룩앤필. 나중에 바꿀 수 있어요.</p>
    <div class="styles" id="styles"></div>
    <div class="nav"><button class="btn ghost" onclick="go(2)">← 이전</button><button class="btn primary" onclick="finish()">시작하기 →</button></div>
  </div>

  <div class="dots"><i class="on"></i><i></i><i></i></div>
</div>

<script type="module">
  import { createProject, addPage } from './store.js';
  import { DARK_PACKS } from '../core/packs/darkglow/packs.js';

  let kind='single', stylePack='aether', step=1;
  window.go=(n)=>{ document.querySelectorAll('.step').forEach(s=>s.classList.remove('on')); document.getElementById('st'+n).classList.add('on');
    document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===n-1)); step=n; };

  document.getElementById('kinds').onclick=(e)=>{ const c=e.target.closest('.kc'); if(!c)return;
    document.querySelectorAll('.kc').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); kind=c.dataset.k; };

  const sz=document.getElementById('styles');
  DARK_PACKS.forEach((p,i)=>{ const c=document.createElement('div'); c.className='sc'+(i===0?' sel':'');
    c.innerHTML=`<div class="sw" style="background:${p.swatch}"></div><div class="cap">${p.name} · ${p.desc}</div>`;
    c.onclick=()=>{ sz.querySelectorAll('.sc').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); stylePack=p.id; }; sz.append(c); });

  window.finish=()=>{
    const shared={ productName:document.getElementById('product').value.trim(), tagline:document.getElementById('tagline').value.trim(), primaryCta:document.getElementById('cta').value.trim() };
    const name=document.getElementById('pname').value.trim() || shared.productName || '무제 프로젝트';
    const p=createProject({ kind, name, shared, stylePack });
    let pg = p.pages[0];
    if(!pg){ pg = addPage(p.id, 'main'); } // 다중: 첫 페이지 하나 생성 (워크스페이스는 다음 단계)
    location.href=`studio/studio.html?p=${p.id}&page=${pg.id}`;
  };
</script>
</body>
</html>
