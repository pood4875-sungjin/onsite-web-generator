<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 프로젝트 · MIDAS Web Generator</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('midas-theme')||'light')</script>
<script src="bundle.js"></script>
<link rel="stylesheet" href="ds.css">
<style>
  body{min-height:100vh}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 32px}
  .nav .r{display:flex;align-items:center;gap:10px}
  .newbtn{border:none;border-radius:var(--r-sm);background:var(--primary);color:var(--on-primary);font-weight:var(--fw-med);font-size:var(--fs-body-sm);padding:9px 16px;cursor:pointer;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 32px 90px}
  h1{font-size:var(--fs-display-sm);font-weight:var(--fw-semi);letter-spacing:var(--tr-display);margin:8px 0 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
  .card{border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden;background:var(--surface);transition:var(--dur) var(--ease);cursor:pointer}
  .card:hover{border-color:var(--hairline-strong);box-shadow:var(--shadow-2);transform:translateY(-2px)}
  .thumb{height:158px;position:relative;overflow:hidden;background:var(--canvas-2);border-bottom:1px solid var(--hairline)}
  .thumb iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;pointer-events:none;background:#070a12}
  .meta{padding:13px 15px;display:flex;align-items:flex-start;gap:8px}
  .meta .info{flex:1;min-width:0}
  .meta .nm{font-size:var(--fs-body-sm);font-weight:var(--fw-semi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .sb{font-size:var(--fs-caption);color:var(--mute);margin-top:2px}
  .acts{display:flex;gap:2px;opacity:0;transition:var(--dur)}
  .card:hover .acts{opacity:1}
  .acts button{width:26px;height:26px;border:none;background:none;border-radius:var(--r-sm);color:var(--mute);cursor:pointer;display:grid;place-items:center}
  .acts button:hover{background:var(--canvas-2);color:var(--ink)}
  .acts .sty:hover{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .acts .del:hover{color:var(--a-red);background:color-mix(in srgb,var(--a-red) 12%,transparent)}
  .empty{grid-column:1/-1;color:var(--mute);font-size:var(--fs-body);padding:60px;text-align:center;border:1px dashed var(--hairline);border-radius:var(--r-md)}
  /* 필터 */
  .filters{display:flex;gap:8px;margin:0 0 22px;flex-wrap:wrap}
  /* 종류 태그 (썸네일 오버레이) */
  .tag{position:absolute;top:8px;left:8px;z-index:2;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--r-pill);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .tag.single{color:#fff;background:color-mix(in srgb,var(--a-blue) 80%,transparent)}
  .tag.multi{color:#fff;background:color-mix(in srgb,var(--a-purple) 80%,transparent)}
  /* 스타일 변경 팝오버 */
  .stymenu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--r-md);padding:10px;box-shadow:var(--shadow-3);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
  .stymenu .t{font-size:11px;color:var(--mute);padding:0 4px 8px}
  .stymenu .sw{display:flex;gap:8px}
  .stymenu .swi{width:56px;cursor:pointer;border-radius:10px;overflow:hidden;border:2px solid transparent;background:none;padding:0}
  .stymenu .swi.on{border-color:var(--accent)}
  .stymenu .swi .c{height:36px}
  .stymenu .swi .n{font-size:10px;text-align:center;padding:4px 0;color:var(--body)}
</style>
</head>
<body class="ds-body">
<div class="nav">
  <div class="brand"><b class="ds-wordmark">MIDAS <span>Web Generator</span></b></div>
  <div class="r"><button id="themeBtn"></button><a class="newbtn" href="index.html">+ 새로 만들기</a></div>
</div>
<div class="wrap">
  <h1>내 프로젝트</h1>
  <div class="filters" id="filters"></div>
  <div class="grid" id="projects"></div>
</div>

<script>
  mountThemeToggle(document.getElementById('themeBtn'));

  const PTL={main:'메인홈',features:'기능소개',pricing:'요금',landing:'랜딩',notice:'공지'};
  const box=document.getElementById('projects');
  const FILTERS=[['all','전체'],['single','단일 페이지'],['multi','다중 페이지']];
  let filter='all';

  function thumbnail(project){
    const wrap=document.createElement('div'); wrap.className='thumb';
    const isMulti=project.kind==='multi';
    const tag=document.createElement('span'); tag.className='tag '+(isMulti?'multi':'single'); tag.textContent=isMulti?'다중 페이지':'단일 페이지'; wrap.append(tag);
    const pg=project.pages[0];
    if(pg){
      const pack=DARK_PACK_BY_ID[project.stylePack]||DARK_PACK_BY_ID.aether;
      const html=renderComposed(pg.data||{}, pack, 'static', pg.pageType, pg.volume);
      const f=document.createElement('iframe'); f.setAttribute('scrolling','no'); f.srcdoc=html; wrap.append(f);
      requestAnimationFrame(()=>{ const s=wrap.clientWidth/1280; f.style.width='1280px'; f.style.height=(wrap.clientHeight/s)+'px'; f.style.transform='scale('+s+')'; });
    }
    return wrap;
  }

  function open(p){ const pg=p.pages[0]; if(!pg){ location.href='index.html'; return; } location.href=`studio/studio.html?p=${p.id}&page=${pg.id}`; }
  function rename(p){ const nn=prompt('프로젝트 이름', p.name); if(nn==null) return; const t=nn.trim(); if(!t) return; const all=getProjects(); const t2=all.find(x=>x.id===p.id); if(t2){ t2.name=t; saveProjects(all); render(); } }

  // 스타일 변경 팝오버 — 프로젝트 전체에 일관 적용 (스튜디오선 변경 불가)
  function closeStyle(){ document.querySelectorAll('.stymenu').forEach(m=>m.remove()); }
  function openStyle(p, btn){
    closeStyle();
    const m=document.createElement('div'); m.className='stymenu';
    m.innerHTML='<div class="t">스타일 변경</div>';
    const sw=document.createElement('div'); sw.className='sw';
    DARK_PACKS.forEach(pk=>{ const b=document.createElement('button'); b.className='swi'+(pk.id===p.stylePack?' on':''); b.title=pk.name;
      b.innerHTML=`<div class="c" style="background:${pk.swatch}"></div><div class="n">${pk.name}</div>`;
      b.onclick=(e)=>{ e.stopPropagation(); const all=getProjects(); const t=all.find(x=>x.id===p.id); if(t){ t.stylePack=pk.id; saveProjects(all); } closeStyle(); render(); };
      sw.append(b); });
    m.append(sw); document.body.append(m);
    const r=btn.getBoundingClientRect();
    m.style.top=(r.bottom+6)+'px';
    m.style.left=Math.max(8, Math.min(r.left-40, window.innerWidth-m.offsetWidth-8))+'px';
    m.onclick=(e)=>e.stopPropagation();
  }
  document.addEventListener('click',closeStyle);

  function renderFilters(){
    const fb=document.getElementById('filters'); fb.innerHTML='';
    const ps=getProjects();
    const counts={all:ps.length, single:ps.filter(p=>p.kind!=='multi').length, multi:ps.filter(p=>p.kind==='multi').length};
    FILTERS.forEach(([id,label])=>{ const b=document.createElement('button'); b.className='ds-chip'+(filter===id?' on':''); b.textContent=`${label} ${counts[id]}`;
      b.onclick=()=>{ filter=id; render(); }; fb.append(b); });
  }

  function render(){
    renderFilters();
    let ps=getProjects();
    if(filter==='single') ps=ps.filter(p=>p.kind!=='multi');
    else if(filter==='multi') ps=ps.filter(p=>p.kind==='multi');
    box.innerHTML='';
    if(!getProjects().length){ box.innerHTML='<div class="empty">아직 프로젝트가 없어요. <b>새로 만들기</b>로 시작해보세요.</div>'; return; }
    if(!ps.length){ box.innerHTML='<div class="empty">이 필터에 해당하는 프로젝트가 없어요.</div>'; return; }
    ps.forEach(p=>{
      const d=new Date(p.createdAt); const date=`${d.getMonth()+1}/${d.getDate()}`;
      const detail=p.kind==='multi'?`${p.pages.length}개 페이지`:(PTL[p.pages[0]?.pageType]||'페이지');
      const styName=(DARK_PACK_BY_ID[p.stylePack]||DARK_PACK_BY_ID.aether).name;
      const card=document.createElement('div'); card.className='card';
      card.append(thumbnail(p));
      const meta=document.createElement('div'); meta.className='meta';
      meta.innerHTML=`<div class="info"><div class="nm">${p.name}</div><div class="sb">${detail} · ${styName} · ${date}</div></div>
        <div class="acts"><button class="sty" title="스타일 변경"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.3"/><circle cx="17.5" cy="10.5" r="1.3"/><circle cx="8.5" cy="7.5" r="1.3"/><circle cx="6.5" cy="12.5" r="1.3"/><path d="M12 2a10 10 0 0 0 0 20c1.1 0 1.8-.9 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.4-.5-.8-.5-1.3 0-1 .8-1.7 1.8-1.7H16a6 6 0 0 0 6-6c0-4.9-4.5-8-10-8Z"/></svg></button>
        <button class="ren" title="이름 변경"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2 2 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        <button class="del" title="삭제"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button></div>`;
      meta.querySelector('.sty').onclick=(e)=>{ e.stopPropagation(); openStyle(p, e.currentTarget); };
      meta.querySelector('.ren').onclick=(e)=>{ e.stopPropagation(); rename(p); };
      meta.querySelector('.del').onclick=(e)=>{ e.stopPropagation(); if(confirm(`"${p.name}" 삭제할까요?`)){ deleteProject(p.id); render(); } };
      card.append(meta);
      card.onclick=()=>open(p);
      box.append(card);
    });
  }
  render();
</script>
</body>
</html>
