<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 프로젝트 · ONSITE Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap');
  :root{ --ink:#160211; --ink2:#5b5566; --ink3:#948e9e; --line:#eceaf0; --accent:#5b5bf5; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Manrope',-apple-system,"Pretendard",system-ui,sans-serif;color:var(--ink);min-height:100vh;
    background:radial-gradient(1200px 700px at 85% -5%,rgba(180,120,255,.08),transparent 60%),#fff}
  .top{display:flex;align-items:center;justify-content:space-between;padding:20px 28px}
  .brand{display:flex;align-items:center;gap:10px}.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#22d3ee,#818cf8)}
  .brand b{font-size:15px;font-weight:700}
  .newbtn{border:none;border-radius:100px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:9px 18px;cursor:pointer;text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 24px 80px}
  h1{font-size:22px;font-weight:700;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
  .card{cursor:pointer;text-align:left;border:none;background:none;padding:0;position:relative}
  .thumb{height:150px;border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;transition:.18s;background:linear-gradient(135deg,#0b0f1a,#1b2740)}
  .card:hover .thumb{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,24,29,.12)}
  .mini{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;gap:8px}
  .mini .mh{height:8px;width:40%;border-radius:4px;background:rgba(255,255,255,.85)}
  .mini .mt{height:14px;width:70%;border-radius:5px;background:rgba(255,255,255,.95)}
  .mini .mb{height:8px;width:55%;border-radius:4px;background:rgba(255,255,255,.6)}
  .mini .mrow{display:flex;gap:6px;margin-top:auto}.mini .mrow i{flex:1;height:34px;border-radius:8px;background:rgba(255,255,255,.5)}
  .tt{font-size:14px;font-weight:600;margin:12px 2px 2px}.ts{font-size:12px;color:var(--ink3);margin:0 2px}
  .del{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:8px;border:none;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;opacity:0;transition:.15s;font-size:13px}
  .card:hover .del{opacity:1}.del:hover{background:rgba(220,38,38,.85)}
  .empty{color:var(--ink3);font-size:14px;padding:40px;text-align:center;border:1px dashed var(--line);border-radius:14px}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="logo"></div><b>ONSITE Studio</b></div>
  <a class="newbtn" href="index.html">+ 새로 만들기</a>
</div>
<div class="wrap">
  <h1>내 프로젝트</h1>
  <div class="grid" id="projects"></div>
</div>
<script type="module">
  import { getProjects, deleteProject, PT_LABEL } from './store.js';
  const mini=`<div class="mini"><div class="mh"></div><div class="mt"></div><div class="mb"></div><div class="mrow"><i></i><i></i><i></i></div></div>`;
  function open(p){ const pg=p.pages[0]; if(!pg){ location.href=`index.html`; return; } location.href=`studio/studio.html?p=${p.id}&page=${pg.id}`; }
  function render(){
    const box=document.getElementById('projects'); const ps=getProjects();
    if(!ps.length){ box.style.display='block'; box.innerHTML='<div class="empty">아직 프로젝트가 없어요. 새로 만들어보세요.</div>'; return; }
    box.style.display='grid'; box.innerHTML='';
    ps.forEach(p=>{
      const d=new Date(p.createdAt); const date=`${d.getMonth()+1}/${d.getDate()}`;
      const kindLabel=p.kind==='multi'?`사이트 · ${p.pages.length}페이지`:(PT_LABEL[p.pages[0]?.pageType]||'페이지');
      const c=document.createElement('button'); c.className='card';
      c.innerHTML=`<div class="thumb"><button class="del" title="삭제">✕</button>${mini}</div><div class="tt">${p.name}</div><div class="ts">${kindLabel} · ${date}</div>`;
      c.querySelector('.del').onclick=(e)=>{ e.stopPropagation(); if(confirm(`"${p.name}" 삭제할까요?`)){ deleteProject(p.id); render(); } };
      c.onclick=()=>open(p);
      box.append(c);
    });
  }
  render();
</script>
</body>
</html>
