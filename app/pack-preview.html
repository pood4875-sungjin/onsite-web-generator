<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>팩 템플릿 미리보기 · MIDAS DRS</title>
<script>
/* 팩 스크립트 로드 — 캐시버스터 */
['bundle.js','charts.js','packs.ppt.js','packs.pitch.js','packs.honors.js','packs.naver.js','packs.rams.js','packs.pastel.js','packs.sfmi.js'].forEach(function(s){ document.write('<scr'+'ipt src="'+s+'?v='+Date.now()+'"></scr'+'ipt>'); });
</script>
<style>
  :root{--bg:#0b0e16;--panel:#151827;--tx:#fff;--tx2:rgba(255,255,255,.6)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Pretendard,-apple-system,system-ui,sans-serif;color:var(--tx);display:flex;flex-direction:column;height:100vh}
  header{flex:none;display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:1px solid rgba(255,255,255,.08)}
  header b{font-size:15px}
  header .sub{font-size:12.5px;color:var(--tx2)}
  select,button.zb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
  .sp{margin-left:auto;display:flex;align-items:center;gap:8px}
  iframe{flex:1;border:0;width:100%}
</style>
</head>
<body>
<header>
  <b>팩 템플릿 미리보기</b>
  <select id="packSel"></select>
  <span class="sub" id="cnt"></span>
  <div class="sp">
    <span class="sub">배율</span>
    <button class="zb" data-z="0.5">50%</button>
    <button class="zb" data-z="0.75">75%</button>
    <button class="zb" data-z="1">100%</button>
  </div>
</header>
<iframe id="fr"></iframe>
<script>
(function(){
  /* 팩별 템플릿 덱 + 렌더러 매핑 — 새 PPT 팩 추가 시 여기 한 줄 */
  var PACKS = [
    { id:'rams',   name:'Rams Report',     deck:function(){ return ramsTemplateDeck(); },   render:function(d){ return renderRamsDeck(d); } },
    { id:'pastel', name:'Pastel Gradient', deck:function(){ return pastelTemplateDeck(); }, render:function(d){ return renderPastelDeck(d); } },
    { id:'sfmi', name:'SFMI Report', deck:function(){ return sfmiTemplateDeck(); }, render:function(d){ return renderSfmiDeck(d); } },
    { id:'naver',  name:'Design AX Line',  deck:function(){ return naverTemplateDeck(); },  render:function(d){ return renderNaverDeck(d); } },
    { id:'honors', name:'MIDAS Honors',    deck:function(){ return honorsTemplateDeck(); }, render:function(d){ return renderHonorsDeck(d); } },
    { id:'pitch',  name:'Creatable Pitch', deck:function(){ return pitchTemplateDeck(); },  render:function(d){ return renderPitchDeck(d); } },
    { id:'ppt',    name:'MIDAS AX',        deck:function(){ return (window.pptTemplateDeck? pptTemplateDeck('ax') : window.PPT_DEFAULT_DECK); }, render:function(d){ return renderPptDeck(d); } },
  ].filter(function(p){ try{ return !!p.render && (p.id!=='naver' || window.renderNaverDeck); }catch(e){ return false; } });

  var sel=document.getElementById('packSel'), fr=document.getElementById('fr'), cnt=document.getElementById('cnt');
  PACKS.forEach(function(p){ var o=document.createElement('option'); o.value=p.id; o.textContent=p.name; sel.appendChild(o); });
  var q=new URLSearchParams(location.search); if(q.get('pack')) sel.value=q.get('pack');
  var zoom=0.75;
  function show(){
    var p=PACKS.find(function(x){ return x.id===sel.value; })||PACKS[0];
    var deck=p.deck(); var html=p.render(deck);
    html=html.replace('</head>','<style>body{zoom:'+zoom+'}</style></head>');
    fr.srcdoc=html;
    cnt.textContent=(deck.slides||[]).length+'개 타입 · 위에서부터 전부 스크롤로 확인';
    try{ history.replaceState(null,'','?pack='+p.id); }catch(e){}
  }
  sel.onchange=show;
  document.querySelectorAll('.zb').forEach(function(b){ b.onclick=function(){ zoom=+b.dataset.z; show(); }; });
  show();
})();
</script>
</body>
</html>
