<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설정 · MIDAS Web Generator</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('midas-theme')||'light')</script>
<script src="bundle.js"></script>
<script src="packs.krds.js"></script>
<script src="packs.midas.js"></script>
<script src="packs.edm.js"></script>
<script src="packs.aether.js"></script>
<script src="packs.ppt.js"></script>
<script src="llm.js"></script>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
<script src="modal.js"></script>
<link rel="stylesheet" href="ds.css">
<style>
  html,body{background:var(--canvas)}
  .page h1{font-family:var(--font-display);font-size:var(--fs-display-sm);font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
  .lead{color:var(--mute);font-size:15px;margin:0 0 26px}
  .card{border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface-solid);padding:22px 24px;margin:0 0 20px;max-width:760px}
  .card h2{font-size:16px;font-weight:var(--fw-semi);margin:0 0 4px}
  .card .sub{font-size:13px;color:var(--mute);margin:0 0 18px}
  /* 용량 바 */
  .bar{height:12px;border-radius:var(--r-pill);background:var(--canvas-2);overflow:hidden;border:1px solid var(--hairline)}
  .bar > i{display:block;height:100%;background:var(--primary);transition:width .4s var(--ease)}
  .bar.warn > i{background:var(--a-orange,#ff8a00)}
  .bar.full > i{background:var(--a-red)}
  .usage-row{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px}
  .usage-row .big{font-family:var(--font-display);font-size:24px;font-weight:600}
  .usage-row .pct{font-size:14px;color:var(--mute)}
  /* 프로젝트 목록 */
  .plist{margin:16px 0 0;display:flex;flex-direction:column;gap:8px}
  .prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--hairline);border-radius:var(--r-sm)}
  .prow .nm{flex:1;min-width:0;font-size:14px;font-weight:var(--fw-med);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-pill);background:var(--canvas-2);color:var(--mute)}
  .prow .tag.draft{background:color-mix(in srgb,var(--a-orange,#ff8a00) 16%,transparent);color:var(--a-orange,#ff8a00)}
  .prow .sz{font-size:13px;color:var(--body);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
  .prow .del{width:28px;height:28px;border:1px solid var(--hairline);background:none;border-radius:var(--r-sm);color:var(--mute);cursor:pointer;display:grid;place-items:center}
  .prow .del:hover{color:var(--a-red);border-color:var(--a-red)}
  .acts{display:flex;gap:10px;margin:18px 0 0;flex-wrap:wrap}
  .empty{color:var(--mute);font-size:14px;padding:16px 0}
  .note{font-size:12.5px;color:var(--mute);line-height:1.6;margin:14px 0 0}
  .ai-fields{display:flex;flex-direction:column;gap:8px;max-width:520px}
  .ai-fields label{font-size:13px;font-weight:600;color:var(--body);margin-top:6px}
  .ai-keyrow{display:flex;gap:8px}
  .ai-keyrow .ds-input{flex:1}
  .orgchips{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body class="ds-body app-grid">
<div data-snb></div>
<div class="content">
  <div data-gnb></div>
  <div class="page">
    <h1 data-i18n="설정">설정</h1>
    <p class="lead" data-i18n="저장 용량과 프로젝트를 관리합니다.">저장 용량과 프로젝트를 관리합니다.</p>

    <div class="card">
      <h2 data-i18n="저장 용량">저장 용량</h2>
      <p class="sub" data-i18n="이 브라우저에 저장된 프로젝트 용량입니다. 한도를 넘으면 새 프로젝트를 만들 수 없어요.">이 브라우저에 저장된 프로젝트 용량입니다. 한도를 넘으면 새 프로젝트를 만들 수 없어요.</p>
      <div class="usage-row"><span class="big" id="uUsed">–</span><span class="pct" id="uPct"></span></div>
      <div class="bar" id="uBar"><i style="width:0%"></i></div>
      <p class="note" id="uNote"></p>
    </div>

    <div class="card">
      <h2 data-i18n="AI 생성 (선택)">AI 생성 (선택)</h2>
      <p class="sub" data-i18n="내 Anthropic API 키를 등록하면 PPT 내용을 AI가 실제 문장으로 채워줘요. 키는 이 브라우저에만 저장되고 서버로 전송되지 않아요.">내 Anthropic API 키를 등록하면 PPT 내용을 AI가 실제 문장으로 채워줘요. 키는 이 브라우저에만 저장되고 서버로 전송되지 않아요.</p>
      <div class="ai-fields">
        <label data-i18n="API 키">API 키</label>
        <div class="ai-keyrow">
          <input class="ds-input" id="aiKey" type="password" placeholder="sk-ant-…" autocomplete="off">
          <button class="ds-btn" id="aiKeySave" data-i18n="저장">저장</button>
          <button class="ds-btn" id="aiKeyDel" data-i18n="삭제" style="display:none">삭제</button>
        </div>
        <p class="note" id="aiKeyState"></p>
        <label data-i18n="모델">모델</label>
        <div class="orgchips" id="aiModels"></div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="프로젝트 관리">프로젝트 관리</h2>
      <p class="sub" data-i18n="용량이 큰 순으로 정렬됩니다. 미구축(생성 전) 프로젝트는 한 번에 정리할 수 있어요.">용량이 큰 순으로 정렬됩니다. 미구축(생성 전) 프로젝트는 한 번에 정리할 수 있어요.</p>
      <div class="acts">
        <button class="ds-btn" id="cleanDraft" data-i18n="미구축 프로젝트 정리">미구축 프로젝트 정리</button>
      </div>
      <div class="plist" id="plist"></div>
    </div>
  </div>
</div>

<script>
  mountShell('settings', {});
  const LL=(ko)=>window.L?L(ko):ko;
  const QUOTA_KB = 5120; // localStorage 표준 한도(브라우저별 5~10MB, 보수적 5MB 기준)

  /* ---- AI 생성 (BYOK) — 키는 이 브라우저 localStorage에만 저장 ---- */
  (function(){
    const inp=document.getElementById('aiKey'), st=document.getElementById('aiKeyState');
    const bSave=document.getElementById('aiKeySave'), bDel=document.getElementById('aiKeyDel');
    const chips=document.getElementById('aiModels');
    // 팀 공용 프록시 모드: 개인 키 불필요 — 입력 UI 대신 상태만 안내
    if(window.LLM && LLM.usingProxy()){
      document.querySelector('.ai-fields').innerHTML =
        '<p class="note">✅ '+LL('팀 공용 AI가 연결되어 있어요. 개인 API 키 없이 PPT AI 생성을 쓸 수 있어요.')+'<br>'
        +LL('모델')+': Sonnet 5 · '+LL('일일 한도')+': 9'+LL('회')+' · '+LLM.proxyUrl()+'</p>';
      return;
    }
    function refresh(){
      const has=LLM.hasKey();
      st.textContent = has ? LL('등록됨')+' · '+LLM.maskKey() : LL('키가 없으면 AI 생성 없이 기본 조립으로 동작해요.');
      bDel.style.display = has?'':'none';
      inp.value=''; inp.placeholder = has ? LLM.maskKey() : 'sk-ant-…';
    }
    bSave.onclick=()=>{ const v=inp.value.trim(); if(!v){ st.textContent=LL('키를 입력해주세요.'); return; } LLM.setKey(v); refresh(); };
    inp.onkeydown=(e)=>{ if(e.isComposing || e.keyCode===229) return; if(e.key==='Enter') bSave.onclick(); };
    bDel.onclick=()=>{ uiConfirm(LL('저장된 API 키를 삭제할까요?'),{title:LL('키 삭제'),okText:LL('삭제'),danger:true}).then(ok=>{ if(ok){ LLM.setKey(''); refresh(); } }); };
    LLM.MODELS.forEach(m=>{ const b=document.createElement('button'); b.className='ds-chip'+(m.id===LLM.getModel()?' on':''); b.textContent=m.name;
      b.onclick=()=>{ LLM.setModel(m.id); chips.querySelectorAll('.ds-chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }; chips.append(b); });
    refresh();
  })();

  function lsUsedKB(){ let n=0; try{ for(const k in localStorage){ if(Object.prototype.hasOwnProperty.call(localStorage,k)) n+=(k.length+(localStorage.getItem(k)||'').length); } }catch(e){} return n/1024; }
  function projKB(p){ try{ return JSON.stringify(p).length/1024; }catch(e){ return 0; } }
  // 구축 여부: '생성 완료(chat.generated)'된 페이지가 하나라도 있어야 구축. (콘텐츠 조금 있어도 미완성이면 미구축)
  function isBuilt(p){ return (p.pages||[]).some(pg=> pg.chat && pg.chat.generated === true); }

  function styleLabel(sp){ if(sp==='edm')return 'eDM'; if(sp==='aglass'&&window.AETHER_STYLE)return AETHER_STYLE.name; if(sp==='krds'&&window.KRDS_STYLE)return KRDS_STYLE.name; if(sp==='midas'&&window.MIDAS_STYLE)return MIDAS_STYLE.name; try{ return (DARK_PACK_BY_ID[sp]||DARK_PACK_BY_ID.aether).name; }catch(e){ return sp; } }

  function fmt(mb){ return mb>=1024 ? (mb/1024).toFixed(1)+' GB' : mb.toFixed(1)+' MB'; }
  function renderUsage(){
    const setBar=(usedMB, quotaMB)=>{
      const pct=quotaMB>0?Math.min(100,Math.round(usedMB/quotaMB*100)):0;
      document.getElementById('uUsed').textContent = fmt(usedMB);
      document.getElementById('uPct').textContent = pct+'% / '+fmt(quotaMB);
      const bar=document.getElementById('uBar'); bar.querySelector('i').style.width=pct+'%';
      bar.className='bar'+(pct>=90?' full':pct>=75?' warn':'');
      document.getElementById('uNote').textContent = pct>=90
        ? LL('용량이 거의 찼어요. 아래에서 프로젝트를 정리해주세요.')
        : LL('여유 있어요. (이제 IndexedDB에 저장되어 용량이 넉넉해요.)');
    };
    // 최신 브라우저: 오리진 전체(IndexedDB 포함) 사용량/한도
    if(navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(e=>{ setBar((e.usage||0)/1048576, (e.quota||0)/1048576); }).catch(()=>setBar(lsUsedKB()/1024, QUOTA_KB/1024));
    } else { setBar(lsUsedKB()/1024, QUOTA_KB/1024); }
  }
  function renderList(){
    const box=document.getElementById('plist'); box.innerHTML='';
    const ps=getProjects().slice().map(p=>({p, kb:projKB(p), built:isBuilt(p)})).sort((a,b)=>b.kb-a.kb);
    if(!ps.length){ box.innerHTML='<div class="empty">'+LL('저장된 프로젝트가 없어요.')+'</div>'; return; }
    ps.forEach(({p,kb,built})=>{
      const row=document.createElement('div'); row.className='prow';
      row.innerHTML='<span class="nm">'+ (p.name||LL('무제')) +'</span>'
        +'<span class="tag">'+ styleLabel(p.stylePack) +'</span>'
        + (built?'':'<span class="tag draft">'+LL('미구축')+'</span>')
        +'<span class="sz">'+ kb.toFixed(0) +' KB</span>'
        +'<button class="del" title="'+LL('삭제')+'"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M6 6l1 14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-14"/></svg></button>';
      row.querySelector('.del').onclick=()=>{
        (window.uiConfirm?uiConfirm(LL('이 프로젝트를 삭제할까요?'),{title:p.name,okText:LL('삭제'),danger:true}):Promise.resolve(confirm(LL('이 프로젝트를 삭제할까요?'))))
          .then(ok=>{ if(ok){ deleteProject(p.id); renderAll(); } });
      };
      box.append(row);
    });
  }
  function renderAll(){ renderUsage(); renderList(); }

  document.getElementById('cleanDraft').onclick=()=>{
    const drafts=getProjects().filter(p=>!isBuilt(p));
    if(!drafts.length){ (window.uiAlert?uiAlert(LL('정리할 미구축 프로젝트가 없어요.')):alert(LL('정리할 미구축 프로젝트가 없어요.'))); return; }
    (window.uiConfirm?uiConfirm(LL('미구축(생성 전) 프로젝트 {n}개를 삭제할까요?').replace('{n}',drafts.length),{title:LL('미구축 프로젝트 정리'),okText:LL('삭제'),danger:true}):Promise.resolve(confirm(LL('미구축 프로젝트를 삭제할까요?'))))
      .then(ok=>{ if(!ok)return; drafts.forEach(p=>deleteProject(p.id)); renderAll(); });
  };

  if(window.I18N) I18N.apply(document);
  storeReady().then(renderAll);

</script>
</body>
</html>
