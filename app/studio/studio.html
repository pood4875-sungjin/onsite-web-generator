<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AX 웹 제너레이터</title>
<style>
  /* 제너레이터 셸 — 다크 글로우 (사용자 Figma Make App.tsx/ChatPanel 포팅) */
  :root{
    --bg:#070a12; --accent:#22d3ee; --accent2:#818cf8;
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
    --surf:rgba(255,255,255,.05); --surf2:rgba(255,255,255,.035);
    --tx:rgba(255,255,255,.9); --tx2:rgba(255,255,255,.55); --tx3:rgba(255,255,255,.35);
    --cta:linear-gradient(135deg,#22d3ee,#38bdf8,#818cf8);
    --font:'Inter','Pretendard',-apple-system,system-ui,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .orb{position:fixed;border-radius:999px;filter:blur(130px);z-index:0;pointer-events:none}
  .app{position:relative;z-index:1;display:flex;height:100vh}
  /* 좌측 페이지 레일 (다중) */
  .rail{width:212px;flex:0 0 212px;border-right:1px solid var(--line);background:rgba(255,255,255,.02);backdrop-filter:blur(20px);display:flex;flex-direction:column;padding:14px 12px;position:relative}
  .rtop{display:flex;align-items:center;gap:8px;padding:2px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .rtop .rhome{color:var(--tx2);text-decoration:none;font-size:16px;line-height:1}
  .rtop b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .prow2{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--tx2);font-size:13px}
  .prow2:hover{background:rgba(255,255,255,.06);color:var(--tx)}
  .prow2.on{background:rgba(34,211,238,.12);color:var(--tx)}
  .prow2 .pt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow2 .x{opacity:0;color:var(--tx3);font-size:12px;flex:0 0 auto}
  .prow2:hover .x{opacity:1} .prow2 .x:hover{color:#f87171}
  .raddbtn{margin-top:10px;border:1px dashed var(--line2);background:none;color:var(--tx2);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
  .raddbtn:hover{color:var(--tx);border-color:var(--accent)}
  .ptmenu{position:absolute;left:12px;right:12px;bottom:56px;background:rgba(18,22,32,.98);border:1px solid var(--line2);border-radius:12px;padding:6px;display:none;z-index:40;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .ptmenu.open{display:block;animation:rise .18s var(--ease)}
  .ptmenu button{display:block;width:100%;text-align:left;border:none;background:none;color:var(--tx);padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
  .ptmenu button:hover{background:rgba(255,255,255,.08)}

  /* 좌: 챗 */
  .chat{width:440px;flex:0 0 440px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surf2);backdrop-filter:blur(20px)}
  .chead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--cta);box-shadow:0 4px 16px rgba(34,211,238,.3)}
  .brand b{font-weight:600;font-size:14px;color:rgba(255,255,255,.9);display:block;line-height:1.2}
  .brand span{font-size:11px;color:var(--tx3)}
  .reset{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surf);color:var(--tx2);border-radius:999px;padding:6px 12px;font-size:12px}
  .reset:hover{background:rgba(255,255,255,.1)}
  .msgs{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
  .row{display:flex}.row.me{justify-content:flex-end}
  .bub{max-width:85%;border-radius:16px;padding:10px 15px;font-size:14px;line-height:1.5;animation:rise .35s var(--ease)}
  .bub.bot{border:1px solid var(--line);background:var(--surf);color:rgba(255,255,255,.85);border-bottom-left-radius:6px}
  .bub.me{background:var(--cta);color:#04141a;font-weight:500;border-bottom-right-radius:6px}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .widget{animation:rise .3s var(--ease) .1s both}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:9px 15px;text-align:left;color:var(--tx)}
  .chip:hover{border-color:rgba(34,211,238,.5);background:rgba(255,255,255,.09)}
  .chip b{display:block;font-size:14px;font-weight:600}
  .chip span{font-size:10px;color:var(--tx3)}
  .card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surf);border-radius:16px;padding:14px}
  .packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pk{overflow:hidden;border-radius:14px;border:1px solid var(--line);text-align:left;background:none}
  .pk.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(34,211,238,.3)}
  .pk .sw{height:52px}
  .pk .meta{background:var(--surf);padding:8px 10px}
  .pk .meta b{display:block;font-size:12px;font-weight:600}.pk .meta span{font-size:10px;color:var(--tx3)}
  .mopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mo{border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:11px;text-align:left;color:var(--tx)}
  .mo.sel{border-color:var(--accent);background:rgba(34,211,238,.1)}
  .mo b{display:block;font-size:13px;font-weight:600}.mo span{font-size:10px;color:var(--tx3)}
  .inp{width:100%;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:9px 12px;font-size:13px;color:rgba(255,255,255,.9);font-family:inherit;outline:none}
  .inp::placeholder{color:var(--tx3)} .inp:focus{border-color:rgba(34,211,238,.6);box-shadow:0 0 0 2px rgba(34,211,238,.15)}
  textarea.inp{min-height:52px;resize:vertical}
  .item{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.04);border-radius:12px;padding:8px}
  .item .hd{display:flex;align-items:center;gap:6px}
  .num{display:grid;place-items:center;width:20px;height:20px;flex:0 0 20px;border-radius:999px;background:rgba(34,211,238,.15);color:#67e8f9;font-size:10px}
  .next{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;background:var(--cta);color:#04141a;padding:9px 18px;font-size:14px;font-weight:600}
  .next:hover{filter:brightness(1.05)}
  .row2{display:flex;gap:8px}

  /* 우: 프리뷰 */
  .preview{flex:1;display:flex;flex-direction:column;padding:16px;min-width:0}
  .pvhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px}
  .pvhead .l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2)}
  .badge{margin-left:4px;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:2px 10px;font-size:11px}
  .dots{display:flex;gap:6px}
  .dot{width:24px;height:24px;border-radius:999px;border:2px solid rgba(255,255,255,.2);cursor:pointer;transition:.2s;padding:0}
  .dot.sel{border-color:#fff;transform:scale(1.1)}
  .pvbox{position:relative;flex:1;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:var(--bg);box-shadow:0 20px 60px rgba(34,211,238,.10)}
  .pvbox iframe{position:absolute;top:0;left:0;border:0;background:var(--bg);transform-origin:0 0}
  .empty{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:rgba(7,10,18,.7);backdrop-filter:blur(3px);transition:.4s}
  .empty.hide{opacity:0;pointer-events:none}
  .empty .big{display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--cta);box-shadow:0 8px 30px rgba(34,211,238,.4)}
  .empty b{font-weight:600;color:rgba(255,255,255,.9)} .empty span{font-size:13px;color:var(--tx2)}
  .dl{border:1px solid var(--line);background:var(--surf);color:var(--tx);border-radius:999px;padding:5px 13px;font-size:12px}
  .dl:hover{background:rgba(255,255,255,.1)}
  .preview{position:relative}
  .panel{position:absolute;top:44px;right:16px;z-index:30;width:300px;max-height:60vh;overflow-y:auto;
    border:1px solid var(--line2);border-radius:14px;background:rgba(16,20,30,.96);backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,.5);padding:12px;display:none}
  .panel.open{display:block;animation:rise .2s var(--ease)}
  .phd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .phd b{font-size:13px}
  .pact{display:flex;gap:6px}
  .pact button{border:1px solid var(--line);background:var(--surf);color:var(--tx2);border-radius:8px;padding:4px 9px;font-size:11px;cursor:pointer}
  .pact button:hover{color:var(--tx);background:rgba(255,255,255,.08)}
  .plist{display:flex;flex-direction:column;gap:6px}
  .prow{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surf);cursor:pointer}
  .prow:hover{background:rgba(255,255,255,.08);border-color:var(--line2)}
  .prow .pmeta{flex:1;min-width:0}
  .prow .pmeta b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .pmeta span{font-size:10px;color:var(--tx3)}
  .prow .del{flex:0 0 auto;border:none;background:none;color:var(--tx3);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px}
  .prow .del:hover{color:#f87171;background:rgba(248,113,113,.12)}
  .pempty{color:var(--tx3);font-size:12px;text-align:center;padding:16px}
</style>
</head>
<body>
<div class="orb" style="left:-160px;top:-160px;width:520px;height:520px;background:rgba(6,182,212,.20)"></div>
<div class="orb" style="right:-160px;top:80px;width:520px;height:520px;background:rgba(99,102,241,.20)"></div>
<div class="orb" style="left:33%;bottom:-160px;width:480px;height:480px;background:rgba(139,92,246,.15)"></div>

<div class="app">
  <aside class="rail" id="rail" style="display:none">
    <div class="rtop"><a class="rhome" href="../index.html" title="홈">←</a><b id="rname"></b></div>
    <div class="rlist" id="rlist"></div>
    <button class="raddbtn" id="addPage">+ 페이지 추가</button>
    <div class="ptmenu" id="ptmenu"></div>
  </aside>
  <aside class="chat">
    <div class="chead">
      <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" width="15" height="15" fill="#04141a"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8Z"/></svg></div><div><b>AX 웹 제너레이터</b><span>대화로 만드는 웹페이지</span></div></div>
      <div style="display:flex;gap:8px"><a class="reset" href="../index.html">← 홈</a><button class="reset" id="reset">↺ 다시</button></div>
    </div>
    <div class="msgs" id="msgs"></div>
  </aside>

  <main class="preview">
    <div class="pvhead">
      <div class="l">▦ 실시간 프리뷰 <span class="badge" id="badge">에테르 · 은은</span></div>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="dots" id="dots"></div>
        <button class="dl" id="save">저장</button>
        <button class="dl" id="expBtn">JSON</button>
        <button class="dl" id="dl">HTML</button>
      </div>
    </div>
    <div class="pvbox">
      <div class="empty" id="empty"><div class="big"></div><b>왼쪽 대화를 채우면</b><span>이곳에 페이지가 실시간으로 완성됩니다</span></div>
      <iframe id="frame" title="preview"></iframe>
    </div>
  </main>
</div>

<script type="module">
  import { renderComposed } from '../../core/darkglow/render.js';
  import { DARK_PACKS } from '../../core/packs/darkglow/packs.js';
  import { getProject, upsertProject, addPage, deletePage } from '../store.js';

  const MOT = { static:'정적', subtle:'은은', rich:'리치' };
  const PAGETYPE = { '메인홈':'main', '제품 기능소개':'features', '요금 비교':'pricing', '랜딩':'landing' };
  const EMPTY = { productName:'', tagline:'', subcopy:'', primaryCta:'', features:[], stats:[], bannerText:'', bannerCta:'' };
  let data = structuredClone(EMPTY), pack = DARK_PACKS[0], motion = 'subtle', generated = false;
  let pageType = 'main', volume = 'heavy';

  // 프로젝트 컨텍스트 (대시보드에서 열림)
  const params = new URLSearchParams(location.search);
  const projectId = params.get('p'), pageId = params.get('page');
  let project = projectId ? getProject(projectId) : null;
  let pageRef = project ? (project.pages.find(pg => pg.id === pageId) || project.pages[0]) : null;

  function persist(){
    if(!project || !pageRef) return;
    pageRef.data = structuredClone(data); pageRef.pageType = pageType; pageRef.volume = volume;
    project.stylePack = pack.id; project.motion = motion;
    if((!project.name || project.name==='무제 프로젝트') && data.productName) project.name = data.productName;
    upsertProject(project);
  }

  const STEPS = ['kind','pageType','volume','pack','motion','facts','features','stats','banner','done'];
  const PROMPT = {
    kind:'안녕하세요 👋 어떤 종류의 프로젝트를 만들까요?',
    pageType:'좋아요! 어떤 페이지 타입으로 시작할까요?',
    volume:'페이지 볼륨(섹션 수)을 골라주세요.',
    pack:'스타일 팩을 선택하세요. 프리뷰가 즉시 리스킨됩니다 ✨',
    motion:'모션 레벨은 어떻게 할까요?',
    facts:'이제 공유 사실을 입력할게요. 제품명과 태그라인을 알려주세요.',
    features:'핵심 기능 3가지를 입력해주세요.',
    stats:'신뢰를 더할 지표 3개를 알려주세요.',
    banner:'마지막으로 하단 링크 배너 문구를 입력해주세요.',
    done:'🎉 모든 입력이 끝났어요. 오른쪽에서 완성된 페이지를 확인하세요!',
  };
  let idx = 0;
  const msgs = document.getElementById('msgs');
  const frame = document.getElementById('frame');
  const empty = document.getElementById('empty');
  const badge = document.getElementById('badge');

  function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
  function botBubble(txt){const r=el('div','row');r.append(el('div','bub bot',txt));msgs.append(r);}
  function meBubble(txt){const r=el('div','row me');r.append(el('div','bub me',txt));msgs.append(r);}
  function scroll(){msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'});}

  const VW = 1280; // 가상 데스크탑 폭 — 페이지를 이 폭으로 렌더 후 프리뷰 칸에 맞게 축소
  function fitPreview(){
    const box = frame.parentElement;
    const s = box.clientWidth / VW;
    frame.style.width = VW + 'px';
    frame.style.height = (box.clientHeight / s) + 'px';
    frame.style.transform = 'scale(' + s + ')';
  }
  function render(){
    frame.srcdoc = renderComposed(data, pack, motion, pageType, volume);
    badge.textContent = `${pack.name} · ${MOT[motion]}`;
    empty.classList.toggle('hide', generated);
    fitPreview();
  }
  window.addEventListener('resize', fitPreview);

  function advance(userText){
    if(userText) meBubble(userText);
    idx++;
    const step = STEPS[idx];
    botBubble(PROMPT[step]);
    mountWidget(step);
    if(step==='done'){ generated=true; persist(); render(); }
    scroll();
  }

  function mountWidget(step){
    const old = document.getElementById('activeWidget'); if(old) old.remove();
    const w = el('div','widget'); w.id='activeWidget';
    w.append(buildWidget(step));
    msgs.append(w); scroll();
  }

  function chips(opts, pick){
    const c = el('div','chips');
    opts.forEach(o=>{ const b=el('button','chip',`<b>${o.label}</b>${o.hint?`<span>${o.hint}</span>`:''}`); b.onclick=()=>pick(o); c.append(b); });
    return c;
  }
  function nextBtn(label, fn){ const b=el('button','next',label||'다음 →'); b.onclick=fn; return b; }

  function buildWidget(step){
    if(step==='kind') return chips([{id:'single',label:'단일 페이지',hint:'랜딩 · 공지'},{id:'multi',label:'다중 사이트',hint:'여러 페이지 구축'}], o=>advance(o.label));
    if(step==='pageType') return chips(['메인홈','제품 기능소개','요금 비교','랜딩'].map(p=>({id:p,label:p})), o=>{ pageType=PAGETYPE[o.label]||'main'; render(); advance(o.label); });
    if(step==='volume') return chips([{id:'compact',label:'컴팩트',hint:'핵심만'},{id:'mid',label:'중간',hint:'균형'},{id:'heavy',label:'헤비',hint:'풍성'}], o=>{ volume=o.id; render(); advance(o.label); });
    if(step==='pack'){
      const wrap=el('div','card');
      const g=el('div','packs');
      DARK_PACKS.forEach(p=>{ const b=el('button','pk'+(p.id===pack.id?' sel':''),`<div class="sw" style="background:${p.swatch}"></div><div class="meta"><b>${p.name}</b><span>${p.desc}</span></div>`);
        b.onclick=()=>{ pack=p; render(); g.querySelectorAll('.pk').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); syncDots(); }; g.append(b); });
      wrap.append(g, nextBtn(`${pack.name} 팩`, ()=>advance(`${pack.name} 팩`)));
      return wrap;
    }
    if(step==='motion'){
      const wrap=el('div','card'); const g=el('div','mopts');
      [{id:'static',label:'정적',hint:'애니 없음'},{id:'subtle',label:'은은',hint:'스크롤 페이드'},{id:'rich',label:'리치',hint:'스태거'}].forEach(m=>{
        const b=el('button','mo'+(m.id===motion?' sel':''),`<b>${m.label}</b><span>${m.hint}</span>`);
        b.onclick=()=>{ motion=m.id; render(); g.querySelectorAll('.mo').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); }; g.append(b); });
      wrap.append(g, nextBtn(`모션: ${MOT[motion]}`, ()=>advance(`모션: ${MOT[motion]}`)));
      return wrap;
    }
    if(step==='facts'){
      const wrap=el('div','card');
      const f=[['productName','제품명 — 예: Onsite'],['tagline','태그라인 — 예: 대화만으로 완성되는 웹페이지'],['subcopy','서브 카피 — 한 줄 설명'],['primaryCta','주 CTA — 예: 무료로 시작하기']];
      f.forEach(([k,ph])=>{ const i=el('input','inp'); i.placeholder=ph; i.value=data[k]; i.oninput=()=>{data[k]=i.value;render();}; wrap.append(i); });
      wrap.append(nextBtn('다음 →', ()=>advance(`${data.productName||'제품명'} · ${data.tagline||'태그라인'}`)));
      return wrap;
    }
    if(step==='features') return listWidget('features',[['title','기능명 — 예: 대화형 입력'],['desc','한 줄 설명']], it=>`기능 ${it.length}개 입력`);
    if(step==='stats') return listWidget('stats',[['value','수치 — 예: 3분'],['label','라벨 — 예: 평균 생성 시간']], it=>`지표 ${it.length}개 입력`, true);
    if(step==='banner'){
      const wrap=el('div','card');
      [['bannerText','배너 문구 — 예: 지금 바로 첫 페이지를 만들어보세요'],['bannerCta','배너 버튼 — 예: 무료로 시작하기']].forEach(([k,ph])=>{
        const i=el('input','inp'); i.placeholder=ph; i.value=data[k]; i.oninput=()=>{data[k]=i.value;render();}; wrap.append(i); });
      wrap.append(nextBtn('✓ 생성하기', ()=>advance(data.bannerText||'배너 문구 입력')));
      return wrap;
    }
    // done
    const d=el('div','card'); d.style.textAlign='center';
    d.append(el('div','',`<span style="color:var(--tx2);font-size:13px">스타일 팩 점을 눌러 리스킨을 확인해보세요.</span>`));
    d.append(nextBtn('↺ 새로 만들기', reset));
    return d;
  }

  function listWidget(key, fields, summarize, twoCol){
    const wrap=el('div','card');
    if(!data[key].length) data[key]=[0,1,2].map(()=>Object.fromEntries(fields.map(([k])=>[k,''])));
    data[key].forEach((it,i)=>{
      const item=el('div','item');
      if(twoCol){ const r=el('div','row2'); fields.forEach(([k,ph],j)=>{ const inp=el('input','inp'); if(j===0)inp.style.flex='0 0 35%'; inp.placeholder=ph; inp.value=it[k]; inp.oninput=()=>{it[k]=inp.value;render();}; r.append(inp); }); item.append(r); }
      else { const hd=el('div','hd'); hd.append(el('span','num',i+1)); const i0=el('input','inp'); i0.placeholder=fields[0][1]; i0.value=it[fields[0][0]]; i0.oninput=()=>{it[fields[0][0]]=i0.value;render();}; hd.append(i0); item.append(hd);
        const i1=el('input','inp'); i1.placeholder=fields[1][1]; i1.value=it[fields[1][0]]; i1.oninput=()=>{it[fields[1][0]]=i1.value;render();}; item.append(i1); }
      wrap.append(item);
    });
    wrap.append(nextBtn('다음 →', ()=>advance(summarize(data[key]))));
    return wrap;
  }

  function syncDots(){ document.querySelectorAll('#dots .dot').forEach(d=>d.classList.toggle('sel', d.dataset.p===pack.id)); }
  function buildDots(){
    const dz=document.getElementById('dots'); dz.innerHTML='';
    DARK_PACKS.forEach(p=>{ const b=el('button','dot'+(p.id===pack.id?' sel':'')); b.dataset.p=p.id; b.style.background=p.swatch; b.title=p.name;
      b.onclick=()=>{ pack=p; render(); syncDots(); }; dz.append(b); });
  }

  function reset(){
    data=structuredClone(EMPTY); generated=false; volume='heavy';
    if(project && pageRef){ pageType=pageRef.pageType||'main'; idx=STEPS.indexOf('volume'); msgs.innerHTML=''; botBubble(PROMPT.volume); mountWidget('volume'); }
    else { pack=DARK_PACKS[0]; motion='subtle'; pageType='main'; idx=0; msgs.innerHTML=''; botBubble(PROMPT.kind); mountWidget('kind'); }
    buildDots(); render();
  }

  document.getElementById('reset').onclick=reset;
  document.getElementById('dl').onclick=()=>{ const b=new Blob([renderComposed(data,pack,motion,pageType,volume)],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='page.html'; a.click(); URL.revokeObjectURL(a.href); };

  /* ---- 저장: 현재 페이지를 프로젝트에 저장 ---- */
  function saveCurrent(){
    persist();
    const b=document.getElementById('save'); const o=b.textContent;
    b.textContent = project ? '저장됨 ✓' : '메모리 저장'; setTimeout(()=>b.textContent=o,1200);
  }
  document.getElementById('save').onclick=saveCurrent;
  document.getElementById('expBtn').onclick=()=>{
    const snap={ name:data.productName||'page', pageType, volume, motion, pack:pack.id, data };
    const b=new Blob([JSON.stringify(snap,null,2)],{type:'application/json'}); const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=(data.productName||'page')+'.json'; a.click(); URL.revokeObjectURL(a.href);
  };

  /* ---- 좌측 페이지 레일 (다중 프로젝트) ---- */
  const PT_MENU=[['main','메인홈'],['features','제품 기능소개'],['pricing','요금 비교'],['landing','랜딩']];
  function renderRail(){
    if(!project || project.kind!=='multi') return;
    document.getElementById('rail').style.display='flex';
    document.getElementById('rname').textContent=project.name;
    const rl=document.getElementById('rlist'); rl.innerHTML='';
    project.pages.forEach(pg=>{
      const r=el('div','prow2'+(pg.id===(pageRef&&pageRef.id)?' on':''),`<span class="pt">${pg.name}</span><span class="x" title="삭제">✕</span>`);
      r.querySelector('.pt').onclick=()=>{ persist(); location.href='?p='+project.id+'&page='+pg.id; };
      r.querySelector('.x').onclick=(e)=>{ e.stopPropagation(); if(project.pages.length<=1){alert('마지막 페이지는 삭제할 수 없어요');return;} if(!confirm(`"${pg.name}" 삭제할까요?`))return; deletePage(project.id,pg.id); const rest=getProject(project.id).pages; location.href='?p='+project.id+'&page='+rest[0].id; };
      rl.append(r);
    });
    const menu=document.getElementById('ptmenu'); menu.innerHTML='';
    PT_MENU.forEach(([id,label])=>{ const b=document.createElement('button'); b.textContent=label; b.onclick=()=>{ persist(); const pg=addPage(project.id,id); location.href='?p='+project.id+'&page='+pg.id; }; menu.append(b); });
    document.getElementById('addPage').onclick=(e)=>{ e.stopPropagation(); menu.classList.toggle('open'); };
    document.addEventListener('click',(e)=>{ if(!menu.contains(e.target) && e.target.id!=='addPage') menu.classList.remove('open'); });
  }

  /* ---- init ---- */
  buildDots(); renderRail();
  if(project && pageRef){
    pageType = pageRef.pageType || 'main'; volume = pageRef.volume || 'heavy';
    data = structuredClone(pageRef.data || EMPTY);
    pack = DARK_PACKS.find(x=>x.id===project.stylePack) || DARK_PACKS[0];
    motion = project.motion || 'subtle';
    const hasContent = !!((data.features && data.features.length) || (data.stats && data.stats.length) || data.bannerText); // 페이지 고유 콘텐츠 기준(공유 시드 제외)
    if(hasContent){ generated=true; idx=STEPS.indexOf('done'); botBubble(`📂 ${project.name} · ${pageRef.name} — 편집 중`); mountWidget('done'); }
    else { idx=STEPS.indexOf('volume'); botBubble(PROMPT.volume); mountWidget('volume'); } // 종류·타입은 대시보드서 결정 → 볼륨부터
    render();
  } else {
    botBubble(PROMPT.kind); mountWidget('kind'); render();
  }
</script>
</body>
</html>
