<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDAS Web Generator</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('midas-theme')||'light')</script>
<script src="../bundle.js"></script>
<script src="../packs.krds.js"></script>
<script src="../packs.midas.js"></script>
<script src="../packs.edm.js"></script>
<script src="../packs.aether.js"></script>
<script src="../edm/promo01.js"></script>
<script src="../modal.js"></script>
<script src="../i18n.js"></script>
<link rel="stylesheet" href="../ds.css">
<style>
  /* 제너레이터 셸 — 다크 글로우 (사용자 Figma Make App.tsx/ChatPanel 포팅) */
  :root{
    /* DS 매핑 — 라이트/다크 자동 (ds.css) */
    --bg:var(--canvas); --surf:var(--surface); --surf2:var(--canvas-2);
    --line:var(--hairline); --line2:var(--hairline-strong);
    --tx:var(--ink); --tx2:var(--body-mid); --tx3:var(--mute);
    --cta:var(--primary); --accent2:var(--accent);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:transparent;color:var(--tx);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--scrim);pointer-events:none}
  button{font-family:inherit;cursor:pointer}
  .orb{display:none}
  .app{position:relative;z-index:1;display:flex;height:100vh}
  /* 좌측 페이지 레일 (다중) */
  .rail{width:212px;flex:0 0 212px;border-right:1px solid var(--line);background:var(--surf2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;flex-direction:column;padding:0 12px 14px;position:relative}
  /* 레일 타이틀 헤더 높이를 챗 헤더(.chead 60px)와 맞춤 — 두 타이틀 수직 정렬 */
  .rtop{display:flex;align-items:center;gap:8px;height:60px;box-sizing:border-box;padding:0 4px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .rtop .rhome{color:var(--tx2);text-decoration:none;font-size:16px;line-height:1}
  .rtop b{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:5px 7px;margin:-5px -7px;border-radius:8px;transition:background var(--dur) var(--ease)}
  .rtop b:hover{background:var(--surf)}
  .rtop input.rinp{font-size:16px;font-weight:700;width:100%}
  .rlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .pnode{position:relative}
  .prow2{position:relative;display:flex;align-items:center;gap:6px;padding:8px 8px;border-radius:10px;cursor:pointer;color:var(--tx2);font-size:13px;transition:background var(--dur) var(--ease)}
  .prow2:hover{background:color-mix(in srgb,var(--tx) 8%,transparent);color:var(--tx)}
  .prow2.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--tx)}
  .prow2 .dh{flex:0 0 auto;cursor:grab;color:var(--tx3);font-size:11px;line-height:1;opacity:0;transition:var(--dur)}
  .prow2:hover .dh{opacity:.65} .prow2 .dh:active{cursor:grabbing}
  .prow2 .tw{flex:0 0 auto;color:var(--tx3);font-size:10px;width:10px;text-align:center}
  .prow2 .pt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
  .prow2 .ren,.prow2 .addc,.prow2 .x{flex:0 0 auto;opacity:0;color:var(--tx3);font-size:12px;line-height:1;width:18px;height:18px;display:grid;place-items:center;border-radius:6px;transition:var(--dur)}
  .prow2:hover .ren,.prow2:hover .addc,.prow2:hover .x{opacity:.75}
  .prow2 .ren:hover,.prow2 .addc:hover{opacity:1;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .prow2 .x:hover{opacity:1;color:#f87171;background:color-mix(in srgb,#f87171 14%,transparent)}
  /* DnD 상태 */
  .prow2.dragging{opacity:.35}
  .prow2.din{background:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .prow2.dbefore::before,.prow2.dafter::after{content:'';position:absolute;left:6px;right:6px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .prow2.dbefore::before{top:-2px}.prow2.dafter::after{bottom:-2px}
  .rlist.droproot{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 40%,transparent);border-radius:10px}
  .rhint{font-size:10.5px;color:var(--tx3);padding:2px 8px 8px;line-height:1.4}
  .raddbtn{margin-top:10px;border:1px dashed var(--line2);background:none;color:var(--tx2);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
  .raddbtn:hover{color:var(--tx);border-color:var(--accent)}
  .rinp{flex:1;min-width:0;background:var(--surf);border:1px solid var(--accent);border-radius:7px;color:var(--tx);font-family:inherit;font-size:13px;padding:5px 8px;outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
  .ptmenu{position:absolute;left:12px;right:12px;bottom:56px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:6px;display:none;z-index:40;box-shadow:var(--shadow-3)}
  .ptmenu.open{display:block;animation:rise .18s var(--ease)}
  .ptmenu button{display:block;width:100%;text-align:left;border:none;background:none;color:var(--tx);padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
  .ptmenu button:hover{background:rgba(255,255,255,.08)}

  /* 좌: 챗 */
  .chat{width:var(--chat-w,440px);flex:0 0 var(--chat-w,440px);display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surf2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
  /* 대화창↔프리뷰 리사이저 */
  .splitter{flex:0 0 10px;cursor:col-resize;position:relative;z-index:15;align-self:stretch;background:transparent}
  /* 라인·grip을 시각적 거터(chat 끝 ~ 프리뷰 카드 시작) 중앙에 맞춤 — 프리뷰 좌패딩(16px) 절반만큼 오른쪽으로 */
  .splitter::before{content:'';position:absolute;top:0;bottom:0;left:calc(50% + 8px);transform:translateX(-50%);width:2px;border-radius:2px;background:transparent;transition:background var(--dur) var(--ease)}
  .splitter:hover::before,.splitter.drag::before{background:var(--accent)}
  .splitter::after{content:'';position:absolute;top:50%;left:calc(50% + 8px);transform:translate(-50%,-50%);width:10px;height:36px;border-radius:6px;background:var(--surface);border:1px solid var(--line2);opacity:0;transition:opacity var(--dur) var(--ease)}
  .splitter:hover::after,.splitter.drag::after{opacity:1}
  body.resizing{cursor:col-resize;user-select:none}
  body.resizing iframe{pointer-events:none}
  .chead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .hbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--tx2);text-decoration:none;transition:var(--dur) var(--ease)}
  .hbtn:hover{color:var(--tx);border-color:var(--line2);background:var(--brand-weak)}
  .logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--grad-brand);box-shadow:var(--cta-glow)}
  .brand b{font-size:16px;color:var(--tx);line-height:1.2}
  .brand .wg{font-size:16px;color:var(--tx);font-weight:var(--fw-semi)}
  .reset{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surf);color:var(--tx2);border-radius:999px;padding:6px 12px;font-size:12px}
  .reset:hover{background:rgba(255,255,255,.1)}
  .msgs{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.2) transparent}
  .msgs::-webkit-scrollbar{width:10px}
  .msgs::-webkit-scrollbar-track{background:transparent}
  .msgs::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
  .msgs:hover::-webkit-scrollbar-thumb{background:rgba(0,0,0,.28);background-clip:padding-box}
  :root[data-theme="dark"] .msgs{scrollbar-color:rgba(255,255,255,.16) transparent}
  :root[data-theme="dark"] .msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);background-clip:padding-box}
  :root[data-theme="dark"] .msgs:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);background-clip:padding-box}
  .row{display:flex}.row.me{justify-content:flex-end}
  .bub{max-width:85%;border-radius:16px;padding:10px 15px;font-size:14px;line-height:1.5;animation:rise .35s var(--ease)}
  .bub.bot{border:1px solid var(--line);background:var(--surf);color:var(--tx);border-bottom-left-radius:6px}
  .bub.me{background:var(--primary);color:var(--on-primary);font-weight:500;border-bottom-right-radius:6px}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .widget{animation:rise .3s var(--ease) .1s both}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:9px 15px;text-align:left;color:var(--tx)}
  .chip:hover{border-color:var(--hairline-strong);background:var(--canvas-2)}
  .chip b{display:block;font-size:14px;font-weight:600}
  .chip span{font-size:10px;color:var(--tx3)}
  .card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surf);border-radius:16px;padding:14px}
  /* 메인홈 섹션 멀티선택 */
  .seclist{gap:6px}
  .secrow{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;background:var(--surf);transition:var(--dur) var(--ease)}
  .secrow:hover{border-color:var(--hairline-strong)}
  .secrow.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .secrow.locked{cursor:default;opacity:.85}
  .secrow .cbx{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;color:#fff;background:transparent}
  .secrow .cbx.on{background:var(--accent);border-color:transparent}
  .secrow .sl{display:flex;flex-direction:column;gap:1px;min-width:0}
  .secrow .sl b{font-size:13.5px;font-weight:600;color:var(--tx)}
  .secrow .sl span{font-size:11.5px;color:var(--tx3)}
  .packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pk{overflow:hidden;border-radius:14px;border:1px solid var(--line);text-align:left;background:none}
  .pk.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
  .pk .sw{height:52px}
  .pk .meta{background:var(--surf);padding:8px 10px}
  .pk .meta b{display:block;font-size:12px;font-weight:600}.pk .meta span{font-size:10px;color:var(--tx3)}
  .mopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mo{border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:11px;text-align:left;color:var(--tx)}
  .mo.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .mo b{display:block;font-size:13px;font-weight:600}.mo span{font-size:10px;color:var(--tx3)}
  .inp{width:100%;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--tx);font-family:inherit;outline:none}
  .inp::placeholder{color:var(--tx3)} .inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
  textarea.inp{min-height:52px;resize:vertical}
  .item{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.04);border-radius:12px;padding:8px}
  .item .hd{display:flex;align-items:center;gap:6px}
  .num{display:grid;place-items:center;width:20px;height:20px;flex:0 0 20px;border-radius:999px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-size:10px}
  .next{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--r-sm);background:var(--primary);color:var(--on-primary);padding:10px 18px;font-size:14px;font-weight:500}
  .next:hover{filter:brightness(1.05)}
  .row2{display:flex;gap:8px}

  /* 우: 프리뷰 */
  .preview{flex:1;display:flex;flex-direction:column;padding:16px;min-width:0}
  .pvhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px}
  .pvhead .l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2)}
  .badge{margin-left:4px;border:1px solid var(--line);background:var(--surf);color:var(--tx2);border-radius:999px;padding:3px 11px;font-size:11px;cursor:pointer;font-family:inherit}
  .badge:hover{border-color:var(--line2);color:var(--tx)}
  .stylemenu{position:absolute;top:100%;left:70px;margin-top:6px;z-index:60;display:none;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;min-width:280px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-md);box-shadow:var(--shadow-3);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
  .stylemenu.open{display:grid}
  .stylemenu .si{cursor:pointer;border:2px solid transparent;border-radius:10px;overflow:hidden;background:none;padding:0;font-family:inherit}
  .stylemenu .si.on{border-color:var(--accent)}
  .stylemenu .si .sc{height:40px}
  .stylemenu .si .sn{font-size:10.5px;text-align:center;padding:4px 2px;color:var(--tx2);line-height:1.2}
  .dots{display:flex;gap:6px}
  .dot{width:24px;height:24px;border-radius:999px;border:2px solid var(--line2);cursor:pointer;transition:.2s;padding:0}
  .dot.sel{border-color:var(--ink);transform:scale(1.1)}
  .pvbox{position:relative;flex:1;overflow:hidden;border-radius:var(--r-md);border:1px solid var(--line);background:#070a12;box-shadow:var(--shadow-2)}
  .pvbox iframe{position:absolute;top:0;left:0;border:0;background:var(--bg);transform-origin:0 0}
  /* 디바이스 프리뷰: 태블릿·모바일은 실제 폭으로 렌더 → 반응형 확인. 레터박스 + 기기 프레임 */
  .pvbox.dev-tablet,.pvbox.dev-mobile{background:repeating-linear-gradient(45deg,#0b0e18,#0b0e18 10px,#0d1120 10px,#0d1120 20px)}
  .pvbox.dev-tablet iframe,.pvbox.dev-mobile iframe{border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06)}
  .vpseg{display:inline-flex;gap:2px;padding:2px;border-radius:999px;border:1px solid var(--line);background:var(--surf)}
  .vpseg button{width:28px;height:24px;display:grid;place-items:center;border:0;background:none;color:var(--tx2);border-radius:999px;cursor:pointer;padding:0;transition:var(--dur) var(--ease)}
  .vpseg button:hover{color:var(--tx)}
  .vpseg button.on{background:var(--point);color:#fff}
  .vpseg button svg{width:15px;height:15px}
  .empty{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;background:rgba(6,8,16,.82);backdrop-filter:blur(5px);transition:.4s}
  .empty.hide{opacity:0;pointer-events:none}
  .ai-orb{width:66px;height:66px;position:relative;display:grid;place-items:center}
  .ai-orb::after{content:'';width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#3fe0c6,#5b9dff 46%,#8a6bff 82%);box-shadow:0 0 34px rgba(90,157,255,.6);animation:orb-pulse 1.9s ease-in-out infinite}
  @keyframes orb-pulse{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.05);opacity:1}}
  /* AI 생성 오버레이 */
  .genning{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-align:center;background:rgba(7,10,18,.84);backdrop-filter:blur(8px)}
  .genning.on{display:flex;animation:rise .3s var(--ease)}
  .genning .gspin{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:#fff;animation:spin .8s linear infinite}
  .genning b{color:#fff;font-weight:600;font-size:15px}
  .genning .gtext{color:rgba(255,255,255,.58);font-size:13px;min-height:18px}
  .genning .gbar{width:200px;height:4px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .genning .gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#818cf8);border-radius:999px;transition:width .35s ease}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty .et{font-size:24px;font-weight:600;color:#fff;background:linear-gradient(90deg,#fff 25%,var(--accent) 50%,#fff 75%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:et-shimmer 2.8s linear infinite}
  .empty .et::after{content:'';display:inline-block;width:2px;height:.95em;background:var(--accent);margin-left:4px;vertical-align:-2px;animation:et-caret 1s steps(1) infinite;-webkit-text-fill-color:initial}
  .empty .es{font-family:var(--font-display);font-size:27px;font-weight:600;line-height:1.4;max-width:15em;background:linear-gradient(110deg,#37e0c2 0%,#5b9dff 42%,#a486ff 78%,#e6c6ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  @keyframes et-shimmer{to{background-position:-220% 0}}
  @keyframes et-caret{50%{opacity:0}}
  .dl{border:1px solid var(--line);background:var(--surf);color:var(--tx);border-radius:999px;padding:5px 13px;font-size:12px}
  .dl:hover{background:rgba(255,255,255,.1)}
  .dl.on{background:var(--grad-cta);color:#fff;border-color:transparent}
  .pvbox.editing{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:-2px}
  .secadd{display:none;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 4px 4px}
  .secadd.on{display:flex}
  .secadd .t{font-size:11px;color:var(--tx3)}
  .secadd .sa{border:1px dashed var(--line2);background:var(--surf);color:var(--tx2);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
  .secadd .sa:hover{color:var(--tx);border-color:var(--accent);border-style:solid}
  .preview{position:relative}
  .panel{position:absolute;top:44px;right:16px;z-index:30;width:300px;max-height:60vh;overflow-y:auto;
    border:1px solid var(--line2);border-radius:14px;background:rgba(16,20,30,.96);backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,.5);padding:12px;display:none}
  .panel.open{display:block;animation:rise .2s var(--ease)}
  .phd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .phd b{font-size:13px}
  .pact{display:flex;gap:6px}
  .pact button{border:1px solid var(--line);background:var(--surf);color:var(--tx2);border-radius:8px;padding:4px 9px;font-size:11px;cursor:pointer}
  .pact button:hover{color:var(--tx);background:rgba(255,255,255,.08)}
  .plist{display:flex;flex-direction:column;gap:6px}
  .prow{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surf);cursor:pointer}
  .prow:hover{background:rgba(255,255,255,.08);border-color:var(--line2)}
  .prow .pmeta{flex:1;min-width:0}
  .prow .pmeta b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .pmeta span{font-size:10px;color:var(--tx3)}
  .prow .del{flex:0 0 auto;border:none;background:none;color:var(--tx3);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px}
  .prow .del:hover{color:#f87171;background:rgba(248,113,113,.12)}
  .pempty{color:var(--tx3);font-size:12px;text-align:center;padding:16px}
</style>
</head>
<body>
<div class="orb" style="left:-160px;top:-160px;width:520px;height:520px;background:rgba(6,182,212,.20)"></div>
<div class="orb" style="right:-160px;top:80px;width:520px;height:520px;background:rgba(99,102,241,.20)"></div>
<div class="orb" style="left:33%;bottom:-160px;width:480px;height:480px;background:rgba(139,92,246,.15)"></div>

<div class="app">
  <aside class="rail" id="rail" style="display:none">
    <div class="rtop"><b id="rname"></b></div>
    <div class="rlist" id="rlist"></div>
    <button class="raddbtn" id="addPage" data-i18n="+ 페이지 추가">+ 페이지 추가</button>
    <div class="ptmenu" id="ptmenu"></div>
  </aside>
  <aside class="chat">
    <div class="chead">
      <div class="brand"><a class="hbtn" href="../dashboard.html" title="홈으로"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/></svg></a><b class="ds-wordmark">MIDAS <span class="wg">WEB AX</span></b></div>
      <div style="display:flex;gap:8px;align-items:center"><button class="reset" id="reset" data-i18n="↺ 다시">↺ 다시</button></div>
    </div>
    <div class="msgs" id="msgs"></div>
  </aside>

  <div class="splitter" id="split" title="드래그로 크기 조절"></div>

  <main class="preview">
    <div class="pvhead">
      <div class="l" style="position:relative"><svg class="pvicon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 20h8M12 17v3"/></svg><span data-i18n="실시간 프리뷰">실시간 프리뷰</span> <button class="badge" id="badge" data-i18n-title="스타일 변경 (프로젝트 전체 일괄)" title="스타일 변경 (프로젝트 전체 일괄)">에테르 스타일 ▾</button>
        <div class="vpseg" id="vpseg" role="group" aria-label="뷰포트">
          <button data-vp="desktop" class="on" data-i18n-title="데스크탑" title="데스크탑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg></button>
          <button data-vp="tablet" data-i18n-title="태블릿" title="태블릿"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
          <button data-vp="mobile" data-i18n-title="모바일" title="모바일"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg></button>
        </div>
        <div class="stylemenu" id="stylemenu"></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="dl" id="editBtn" title="텍스트·이미지 편집" data-i18n="편집">편집</button>
        <button class="dl" id="previewBtn" data-i18n-title="생성된 페이지를 새 창에서 미리보기" title="생성된 페이지를 새 창에서 미리보기" data-i18n="미리보기">미리보기</button>
        <button class="dl" id="save" data-i18n="저장">저장</button>
        <button class="dl" id="expBtn">JSON</button>
        <button class="dl" id="dl">HTML</button>
      </div>
    </div>
    <div class="secadd" id="secAdd"></div>
    <div class="pvbox">
      <div class="empty" id="empty"><div class="ai-orb"></div><span class="es"><span data-i18n="대화창을 통해 AI가 실시간으로">대화창을 통해 AI가 실시간으로</span><br><span data-i18n="페이지를 완성합니다">페이지를 완성합니다</span></span></div>
      <div class="genning" id="genning"><div class="gspin"></div><b data-i18n="페이지 생성 중">페이지 생성 중</b><span class="gtext" id="gtext" data-i18n="기획 내용 분석 중…">기획 내용 분석 중…</span><div class="gbar"><i></i></div></div>
      <iframe id="frame" title="preview"></iframe>
    </div>
  </main>
</div>

<script>

  const tL = (ko)=> (window.L ? window.L(ko) : ko);   // 로컬라이징 헬퍼
  const MOT = { static:'정적', subtle:'은은', rich:'리치' };
  const PAGETYPE = { '메인홈':'main', '제품 기능소개':'features', '요금 비교':'pricing', '랜딩':'landing' };
  const EMPTY = { productName:'', tagline:'', subcopy:'', primaryCta:'', features:[], stats:[], bannerText:'', bannerCta:'', footerLinks:[], footerCopyright:'', images:{}, sectionOrder:[], hiddenSections:[], shownSections:[] };
  let data = structuredClone(EMPTY), pack = DARK_PACKS[0], motion = 'subtle', generated = false;
  let pageType = 'main', volume = 'heavy';

  // 프로젝트 컨텍스트 (대시보드에서 열림)
  const params = new URLSearchParams(location.search);
  const projectId = params.get('p'), pageId = params.get('page');
  let project = projectId ? getProject(projectId) : null;
  let pageRef = project ? (project.pages.find(pg => pg.id === pageId) || project.pages[0]) : null;

  function persist(){
    if(!project || !pageRef) return;
    pageRef.data = structuredClone(data); pageRef.pageType = pageType; pageRef.volume = volume;
    pageRef.chat = { log: chatLog, idx, generated };
    project.stylePack = pack.id; project.motion = motion;
    if((!project.name || project.name==='무제 프로젝트') && data.productName) project.name = data.productName;
    upsertProject(project);
  }

  const STEPS = ['kind','pageType','mainSections','volume','facts','features','stats','banner','footer','done'];
  // 메인홈 섹션 선택지 (Header·Hero는 필수 고정). key=섹션타입, 입력스텝 매핑은 SEC_STEP.
  const MAIN_SECTIONS = [
    {type:'feature', label:'제품 핵심기능', desc:'주요 기능을 카드로 소개'},
    {type:'comparison', label:'비교 (Comparison)', desc:'기존 방식 등과 비교'},
    {type:'testimonial', label:'고객사례 (Case Study)', desc:'사용 사례·고객 신뢰'},
    {type:'blog', label:'블로그·자료 (Blog)', desc:'콘텐츠·자료 탐색'},
    {type:'faq', label:'FAQ (Accordion)', desc:'질문을 접고 펼쳐 안내'},
    {type:'cta', label:'배너 CTA', desc:'행동을 유도하는 배너'},
  ];
  const SEC_STEP = { feature:'features', stat:'stats', cta:'banner' }; // 섹션→입력스텝
  const PROMPT = {
    kind:'안녕하세요 👋 먼저 무엇을 만들지 정해볼까요? 한 장으로 끝나는 페이지인지, 여러 페이지로 이어지는 사이트인지 골라주세요.',
    pageType:'이 페이지는 어떤 유형인가요? 성격에 맞춰 알맞은 템플릿과 섹션을 자동으로 불러올게요.',
    mainSections:'메인 홈을 구성해볼게요. 헤더와 히어로는 기본으로 들어가요. 그 아래 어떤 섹션을 보여줄지 골라주세요 (여러 개 선택 가능).',
    volume:'페이지에 담을 정보량을 골라주세요. 핵심만 간결하게 갈지, 풍성하게 채울지에 따라 섹션 수가 달라져요.',
    facts:'좋아요! 이제 페이지의 얼굴을 만들 차례예요. 제품명과 한 줄 슬로건, 짧은 소개 문구를 적어주세요. 방문자가 3초 안에 “무엇인지” 감 잡게 하는 게 핵심이에요.',
    features:'핵심 기능은 딱 3가지만 보여주는 게 좋아요. 너무 많으면 오히려 안 읽히거든요. 각 기능을 큰 제목 + 짧은 설명으로 적으면 고객이 한눈에 가치를 파악해요.',
    stats:'숫자는 가장 강력한 신뢰 장치예요. 사용자 수·만족도·처리 건수처럼 자랑할 만한 지표 3개를 보여주세요.',
    banner:'행동을 유도할 한마디를 넣어볼까요? 하단 배너에 들어갈 짧고 강한 문구를 적어주세요.',
    footer:'거의 끝났어요! 마지막으로 푸터에 들어갈 링크와 저작권 문구를 정리할게요.',
    done:'🎉 완성됐어요! 오른쪽에서 페이지를 확인하고, 편집 버튼으로 자유롭게 다듬어보세요.',
  };
  Object.keys(PROMPT).forEach(k=>{ PROMPT[k]=tL(PROMPT[k]); });   // 챗 프롬프트 로컬라이징
  let idx = 0;
  const msgs = document.getElementById('msgs');
  const frame = document.getElementById('frame');
  const empty = document.getElementById('empty');
  const badge = document.getElementById('badge');

  function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
  // 대화 로그 — 나갔다 와도 대화 유지 (pageRef.chat에 저장)
  let chatLog = [];
  function addBot(txt){const r=el('div','row');r.append(el('div','bub bot',txt));msgs.append(r);}
  function addMe(txt){const r=el('div','row me');r.append(el('div','bub me',txt));msgs.append(r);}
  function saveChat(){ if(!project||!pageRef) return; pageRef.chat={log:chatLog, idx, generated}; upsertProject(project); }
  function botBubble(txt){ addBot(txt); chatLog.push({r:'bot',t:txt}); saveChat(); }
  function meBubble(txt){ addMe(txt); chatLog.push({r:'me',t:txt}); saveChat(); }
  function scroll(){msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'});}

  const VW = 1280; // 가상 데스크탑 폭 — 페이지를 이 폭으로 렌더 후 프리뷰 칸에 맞게 축소
  const DEVICE_W = { desktop: VW, tablet: 820, mobile: 390 }; // 태블릿·모바일은 실제 폭 → 미디어쿼리 반응형 발동
  let device = 'desktop';
  function fitPreview(){
    const box = frame.parentElement;
    const bw = box.clientWidth, bh = box.clientHeight;
    const targetW = DEVICE_W[device] || VW;
    let s, left, top;
    if(device === 'desktop'){
      s = bw / targetW; left = 0; top = 0;               // 폭 맞춤 축소(기존 동작)
    } else {
      s = Math.min((bw - 40) / targetW, (bh - 24) / 720, 1); // 폭·높이 여유에 맞춰, 업스케일 금지
      left = (bw - targetW * s) / 2;                     // 가로 중앙
      top = 12;                                          // 상단 여백(레터박스)
    }
    frame.style.width = targetW + 'px';
    frame.style.height = ((bh - top*2) / s) + 'px';       // 기기 뷰포트 높이(내부 스크롤)
    frame.style.left = left + 'px';
    frame.style.top = top + 'px';
    frame.style.transform = 'scale(' + s + ')';
  }
  function setDevice(d){
    device = d;
    document.querySelectorAll('#vpseg button').forEach(b=>b.classList.toggle('on', b.dataset.vp===d));
    const pv = document.querySelector('.pvbox');
    pv.classList.toggle('dev-tablet', d==='tablet');
    pv.classList.toggle('dev-mobile', d==='mobile');
    fitPreview();
  }
  // 다중 사이트: 레일 메뉴트리 → GNB nav 항목 (홈=로고라 최상위 메인홈은 제외)
  // curId 인자로 활성 페이지 지정(미리보기에서 페이지별 렌더 시 사용). 없으면 현재 pageRef.
  function buildNav(curId){
    if(!project || project.kind!=='multi') return null;
    const cur = curId || (pageRef && pageRef.id);
    const isActive = (id)=> id===cur;
    const tops = pageTree(project.pages).filter(n=> n.pageType!=='main');
    if(!tops.length) return null;
    return tops.map(n=>({
      id:n.id, name:n.name, active:isActive(n.id),
      children:(n.children||[]).map(c=>({ id:c.id, name:c.name, active:isActive(c.id) }))
    }));
  }
  // 팩별 출력 — KRDS는 계약 렌더(renderKrdsPage), 그 외는 darkglow(renderComposed)
  function renderWith(d, pt, vol, nav, mot){
    const rd = nav ? Object.assign({}, d, {nav}) : d;
    if(pack && pack.id==='edm' && typeof renderEdmPage==='function') return renderEdmPage(rd);
    if(pack && pack.id==='aglass' && typeof renderAetherPage==='function') return renderAetherPage(rd, {volume:vol, motion:mot});
    if(pack && pack.id==='krds' && typeof renderKrdsPage==='function') return renderKrdsPage(rd, {volume:vol, motion:mot});
    if(pack && pack.id==='midas' && typeof renderMidasPage==='function') return renderMidasPage(rd, {volume:vol, motion:mot});
    return renderComposed(rd, pack, mot, pt, vol);
  }
  function pageHtml(){ return renderWith(data, pageType, volume, buildNav(), motion); }
  // 프로젝트 내 임의 페이지 렌더(미리보기용) — 해당 페이지 기준 nav 활성/데이터 사용, 모션 정적
  function renderProjectPage(pg){ return renderWith(pg.data, pg.pageType, pg.volume||volume, buildNav(pg.id), 'static'); }
  function render(){
    frame.srcdoc = pageHtml();
    badge.textContent = `${pack.name} ${tL('스타일')} ▾`;
    empty.classList.toggle('hide', generated);
    fitPreview();
  }
  window.addEventListener('resize', fitPreview);
  document.querySelectorAll('#vpseg button').forEach(b=> b.onclick=()=>setDevice(b.dataset.vp));

  /* ---- 편집 모드: 프리뷰에서 텍스트 직접 편집 + 이미지 영역 첨부/교체 ---- */
  let editMode=false;
  const editBtn=document.getElementById('editBtn');
  function setField(path,val){
    const p=path.split('.');
    if(p.length===1){ data[p[0]]=val; }
    else if(p.length===2){ const [arr,i]=p; data[arr]=data[arr]||[]; data[arr][+i]=val; }   // 문자열 배열 (footerLinks 등)
    else { const [arr,i,key]=p; data[arr]=data[arr]||[]; data[arr][+i]=data[arr][+i]||{}; data[arr][+i][key]=val; }
  }
  function pickImage(key){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
      const rd=new FileReader(); rd.onload=()=>{ data.images=data.images||{}; data.images[key]=rd.result; persist();
        const doc=frame.contentDocument, slot=doc&&doc.querySelector('[data-img="'+key+'"]');
        // 이미 <img>면 src만 교체(깜빡임 없음). placeholder 등 그 외엔 팩별 마크업으로 전체 리렌더.
        if(slot && slot.tagName==='IMG'){ slot.src=rd.result; }
        else { render(); }
      }; rd.readAsDataURL(f); };
    inp.click();
  }
  const SECLABEL={hero:'히어로',features:'기능',metrics:'지표',banner:'배너'};
  // 스타일별 섹션 스펙 (darkglow=gnb/footer 고정, KRDS=nav/footer 고정)
  function sectionSpec(){
    if(pack && pack.id==='krds' && window.KRDS_SECTION_SPEC) return window.KRDS_SECTION_SPEC;
    if(pack && pack.id==='midas' && window.MIDAS_SECTION_SPEC) return window.MIDAS_SECTION_SPEC;
    return { template:(DG_TEMPLATES[pageType]||DG_TEMPLATES.main), fixed:['gnb','footer'], labels:SECLABEL };
  }
  function secLabel(type){ return tL(sectionSpec().labels[type] || type); }
  function currentMovable(){ const doc=frame.contentDocument; if(!doc) return []; const fx=sectionSpec().fixed; return [...doc.querySelectorAll('[data-section]')].map(s=>s.getAttribute('data-section')).filter(t=>fx.indexOf(t)<0); }
  function moveSection(type,dir){ const order=currentMovable(); const i=order.indexOf(type), j=i+dir; if(i<0||j<0||j>=order.length) return; const tmp=order[i]; order[i]=order[j]; order[j]=tmp; data.sectionOrder=order; persist(); render(); }
  // 섹션 숨김/추가
  function bodyPalette(){ const sp=sectionSpec(); return sp.template.filter(s=>sp.fixed.indexOf(s.type)<0).map(s=>s.type); }
  function secVisible(type){ const sp=sectionSpec(); const s=sp.template.find(x=>x.type===type); const def=s&&includesTier(volume,s.tier); const hid=(data.hiddenSections||[]).includes(type); const shw=(data.shownSections||[]).includes(type); return def?!hid:shw; }
  function hideSection(type){ data.hiddenSections=[...new Set([...(data.hiddenSections||[]),type])]; data.shownSections=(data.shownSections||[]).filter(x=>x!==type); persist(); render(); renderSectionAdd(); }
  function showSection(type){ data.shownSections=[...new Set([...(data.shownSections||[]),type])]; data.hiddenSections=(data.hiddenSections||[]).filter(x=>x!==type); persist(); render(); renderSectionAdd(); }
  function renderSectionAdd(){ const bar=document.getElementById('secAdd'); const hiddenTypes=bodyPalette().filter(t=>!secVisible(t));
    if(!editMode || !hiddenTypes.length){ bar.classList.remove('on'); bar.innerHTML=''; return; }
    bar.classList.add('on'); bar.innerHTML='<span class="t">'+tL('숨긴 섹션')+'</span>';
    hiddenTypes.forEach(tp=>{ const b=document.createElement('button'); b.className='sa'; b.textContent='+ '+secLabel(tp); b.onclick=()=>showSection(tp); bar.append(b); }); }
  function applyEdit(){
    const doc=frame.contentDocument; if(!doc||!doc.body) return;
    if(!doc.getElementById('editcss')){ const st=doc.createElement('style'); st.id='editcss';
      st.textContent='[data-editing] [data-edit]{cursor:text} [data-editing] [data-edit]:hover{outline:1px dashed rgba(108,43,255,.65);outline-offset:3px;border-radius:3px} [data-editing] [data-edit]:focus{outline:2px solid #6c2bff;outline-offset:3px;border-radius:3px} [data-editing] [data-img]{cursor:pointer} [data-editing] [data-img]:hover{outline:2px dashed #6c2bff;outline-offset:3px}'
        +'[data-editing] [data-section]{position:relative} [data-editing] [data-section]:hover{outline:1px dashed rgba(108,43,255,.4);outline-offset:-1px}'
        +'.secctl{position:absolute;top:10px;right:10px;z-index:50;display:flex;align-items:center;gap:4px;padding:3px 5px;border-radius:999px;background:rgba(108,43,255,.94);box-shadow:0 4px 16px rgba(0,0,0,.35)}'
        +'.secctl button{border:none;background:rgba(255,255,255,.22);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center}'
        +'.secctl button:hover{background:rgba(255,255,255,.42)} .secctl button:disabled{opacity:.35;cursor:default} .secctl .lbl{color:#fff;font-size:11px;font-weight:600;padding:0 4px} .secctl .hd:hover{background:rgba(255,90,90,.9)}';
      doc.head.appendChild(st);
    }
    doc.body.toggleAttribute('data-editing', editMode);
    doc.querySelectorAll('[data-edit]').forEach(elm=>{
      if(editMode) elm.setAttribute('contenteditable','true'); else elm.removeAttribute('contenteditable');
      if(!elm.__wired){ elm.__wired=1;
        elm.addEventListener('blur',()=>{ if(!editMode)return; setField(elm.getAttribute('data-edit'), elm.textContent.replace(/\s+/g,' ').trim()); persist(); });
        elm.addEventListener('keydown',(e)=>{ if(e.key==='Enter' && elm.tagName!=='P'){ e.preventDefault(); elm.blur(); } });
      }
    });
    doc.querySelectorAll('[data-img]').forEach(slot=>{ if(!slot.__wired){ slot.__wired=1;
      slot.addEventListener('click',(e)=>{ if(!editMode)return; e.preventDefault(); pickImage(slot.getAttribute('data-img')); }); }});
    // 섹션 순서 컨트롤 (gnb·footer 제외)
    const movable=currentMovable(); const fx=sectionSpec().fixed;
    doc.querySelectorAll('[data-section]').forEach(sec=>{
      const type=sec.getAttribute('data-section'); const old=sec.querySelector(':scope > .secctl'); if(old) old.remove();
      if(!editMode || fx.indexOf(type)>=0) return;
      const i=movable.indexOf(type);
      const bar=doc.createElement('div'); bar.className='secctl';
      bar.innerHTML='<button data-mv="up"'+(i<=0?' disabled':'')+' title="'+tL('위로')+'">↑</button><span class="lbl">'+secLabel(type)+'</span><button data-mv="down"'+(i>=movable.length-1?' disabled':'')+' title="'+tL('아래로')+'">↓</button><button class="hd" data-mv="hide" title="'+tL('숨기기')+'">✕</button>';

  (function(){
    const app=document.querySelector('.app'), split=document.getElementById('split');
    const KEY='midas-chat-w', MIN=320, PREVIEW_MIN=360;
    const railW=()=>{ const r=document.getElementById('rail'); return (r && r.style.display!=='none') ? r.offsetWidth : 0; };
    const maxW=()=> Math.max(MIN, app.clientWidth - railW() - 6 - PREVIEW_MIN);
    const clamp=(w)=> Math.min(maxW(), Math.max(MIN, w));
    function setW(w,save){ w=clamp(w); app.style.setProperty('--chat-w', w+'px'); fitPreview(); if(save) localStorage.setItem(KEY, w); }
    // 저장값 복원
    const saved=parseInt(localStorage.getItem(KEY),10); if(saved) setW(saved,false);
    let dragging=false;
    split.addEventListener('pointerdown',(e)=>{ dragging=true; split.setPointerCapture(e.pointerId); split.classList.add('drag'); document.body.classList.add('resizing'); e.preventDefault(); });
    split.addEventListener('pointermove',(e)=>{ if(!dragging) return; setW(e.clientX - app.getBoundingClientRect().left - railW(), false); });
    function end(e){ if(!dragging) return; dragging=false; try{split.releasePointerCapture(e.pointerId);}catch(_){} split.classList.remove('drag'); document.body.classList.remove('resizing'); localStorage.setItem(KEY, parseInt(getComputedStyle(app).getPropertyValue('--chat-w'),10)||440); }
    split.addEventListener('pointerup',end); split.addEventListener('pointercancel',end);
    // 더블클릭 = 기본폭 리셋
    split.addEventListener('dblclick',()=>{ localStorage.removeItem(KEY); app.style.removeProperty('--chat-w'); fitPreview(); });
    window.addEventListener('resize',()=>{ const w=parseInt(getComputedStyle(app).getPropertyValue('--chat-w'),10); if(w) setW(w,false); });
  })();

  /* ---- 좌측 페이지 레일 (다중 프로젝트) ---- */
  // 뎁스: 최상위=0. MAX_DEPTH=1 → 최상위(1뎁스) + 하위 1단계(2뎁스)까지만.
  // 메인홈은 하위를 가질 수 없음(로고/홈). 메뉴는 다음 페이지들부터.
  const MAX_DEPTH=1;
  let dragId=null;

  function countDesc(id){ let n=0; const stack=[id]; while(stack.length){ const cur=stack.pop(); project.pages.forEach(p=>{ if(p.parentId===cur){ n++; stack.push(p.id); } }); } return n; }
  function subtreeHeight(id){ const kids=project.pages.filter(x=>x.parentId===id); return kids.length ? 1+Math.max(...kids.map(k=>subtreeHeight(k.id))) : 0; }
  function depthOf(id){ let d=0, cur=project.pages.find(x=>x.id===id); const seen=new Set(); while(cur&&cur.parentId){ d++; if(seen.has(cur.id))break; seen.add(cur.id); cur=project.pages.find(x=>x.id===cur.parentId); } return d; }
  // 이동 허용 여부: 메인홈은 부모 불가 · 메인홈 자신은 최상위 고정 · 결과 뎁스 제한
  function canDrop(dragPageId, parentId){
    const dragged=project.pages.find(x=>x.id===dragPageId); if(!dragged) return false;
    if(dragged.pageType==='main' && parentId) return false;         // 메인홈은 항상 최상위
    if(parentId){ const par=project.pages.find(x=>x.id===parentId); if(par && par.pageType==='main') return false; } // 메인홈 하위 불가
    const newDepth = parentId ? depthOf(parentId)+1 : 0;
    return newDepth + subtreeHeight(dragPageId) <= MAX_DEPTH;
  }

  function editProjectName(bEl){

    const cur=project.name; const inp=el('input','rinp'); inp.value=cur; inp.maxLength=50;
    bEl.textContent=''; bEl.append(inp); inp.focus(); inp.select();
    let done=false;
    const finish=(commit)=>{ if(done)return; done=true; const v=inp.value.trim();
      if(commit && v && v!==cur){ project.name=v; upsertProject(project); }
      renderRail();
    };
    inp.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); finish(true); } else if(e.key==='Escape'){ finish(false); } };
    inp.onblur=()=>finish(true);
  }

  function renderRail(){
    if(!project || project.kind!=='multi') return;
    document.getElementById('rail').style.display='flex';
    const rn=document.getElementById('rname'); rn.textContent=project.name; rn.title='클릭해서 이름 수정';
    rn.onclick=()=>editProjectName(rn);
    const rl=document.getElementById('rlist'); rl.innerHTML='';

    const rowOf=(pg,depth)=>{
      const r=el('div','prow2'+(pg.id===(pageRef&&pageRef.id)?' on':''),
        `<span class="dh" title="${tL('드래그로 이동')}">⠿</span><span class="pt">${pg.name}</span><span class="ren" title="${tL('이름 변경')}">✎</span><span class="x" title="${tL('삭제')}">✕</span>`);
      r.style.paddingLeft=(8+depth*15)+'px';
      r.draggable=true; r.dataset.id=pg.id;
      r.querySelector('.pt').onclick=()=>{ persist(); location.href='?p='+project.id+'&page='+pg.id; };
      r.querySelector('.ren').onclick=(e)=>{ e.stopPropagation(); startRename(pg,r); };
      r.querySelector('.x').onclick=(e)=>{ e.stopPropagation();
        if(project.pages.length<=1){ uiAlert(tL('마지막 페이지는 삭제할 수 없어요.')); return; }
        const d=countDesc(pg.id);
        uiConfirm('"'+pg.name+'"'+(d?' (+'+d+')':'')+' · '+tL('삭제하면 되돌릴 수 없어요.'),{title:tL('페이지 삭제'),okText:tL('삭제'),danger:true}).then(ok=>{
          if(!ok) return;
          const wasCur = pageRef && (pg.id===pageRef.id || project.pages.some(x=>x.id===pageRef.id && belongs(pageRef.id,pg.id)));
          deletePage(project.id,pg.id);
          project=getProject(project.id);
          if(wasCur){ location.href='?p='+project.id+'&page='+project.pages[0].id; }
          else { renderRail(); render(); }
        });
      };

      r.addEventListener('dragstart',(e)=>{ dragId=pg.id; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',pg.id); setTimeout(()=>r.classList.add('dragging'),0); });
      r.addEventListener('dragend',()=>{ r.classList.remove('dragging'); dragId=null; clearDnd(); });
      r.addEventListener('dragover',(e)=>{ e.preventDefault(); e.stopPropagation(); if(!dragId||dragId===pg.id) return;
        clearDnd();
        const rect=r.getBoundingClientRect(); const y=(e.clientY-rect.top)/rect.height;
        // 자식으로 넣기 가능? 뎁스 제한 + 메인홈은 부모 불가 + 드래그 서브트리 높이 고려
        const insideDepthOk = (depth+1 + subtreeHeight(dragId)) <= MAX_DEPTH;
        const canInside = insideDepthOk && pg.pageType!=='main';
        const zone = canInside ? (y<0.28?'before':y>0.72?'after':'inside') : (y<0.5?'before':'after');
        r.classList.add(zone==='before'?'dbefore':zone==='after'?'dafter':'din'); r.dataset.zone=zone;
      });
      r.addEventListener('drop',(e)=>{ e.preventDefault(); e.stopPropagation(); const zone=r.dataset.zone||'after'; clearDnd();
        if(!dragId||dragId===pg.id) return;
        let parentId,index;
        if(zone==='inside'){ parentId=pg.id; index=null; }
        else { parentId=pg.parentId||null; const sibs=project.pages.filter(x=>(x.parentId||null)===parentId && x.id!==dragId); const pos=sibs.findIndex(x=>x.id===pg.id); index = zone==='before'?pos:pos+1; }
        if(!canDrop(dragId, parentId)) return;
        persist(); movePage(project.id,dragId,parentId,index); project=getProject(project.id); renderRail(); render();
      });
      return r;
    };
    // pageRef가 pg의 자손인지
    function belongs(childId,ancestorId){ let cur=project.pages.find(x=>x.id===childId); const seen=new Set(); while(cur&&cur.parentId){ if(cur.parentId===ancestorId)return true; if(seen.has(cur.id))break; seen.add(cur.id); cur=project.pages.find(x=>x.id===cur.parentId); } return false; }

    const walk=(nodes,depth)=>{ nodes.forEach(n=>{ rl.append(rowOf(n,depth)); if(n.children.length) walk(n.children,depth+1); }); };
    walk(pageTree(project.pages),0);

    // 루트 빈 영역에 드롭 = 최상위 맨 끝으로
    rl.ondragover=(e)=>{ if(dragId){ e.preventDefault(); rl.classList.add('droproot'); } };
    rl.ondragleave=(e)=>{ if(e.target===rl) rl.classList.remove('droproot'); };
    rl.ondrop=(e)=>{ e.preventDefault(); clearDnd(); if(!dragId||!canDrop(dragId,null)) return; persist(); movePage(project.id,dragId,null,null); project=getProject(project.id); renderRail(); render(); };

    document.getElementById('addPage').onclick=(e)=>{ e.stopPropagation(); persist(); const pg=addPage(project.id,'features',null,'새 페이지'); location.href='?p='+project.id+'&page='+pg.id; };
  }

  // 페이지 이름 인라인 입력 (추가) — 타입 선택 없이 이름부터. 추가 페이지 기본 타입=features
  function depthOf(id){ let d=0, cur=project.pages.find(x=>x.id===id); const seen=new Set(); while(cur&&cur.parentId){ d++; if(seen.has(cur.id))break; seen.add(cur.id); cur=project.pages.find(x=>x.id===cur.parentId); } return d; }
  function startNameEntry(parentId, afterRow){
    document.querySelectorAll('.rinp').forEach(x=>x.closest('.prow2')?.remove()); // 기존 입력 정리
    const depth = parentId!=null ? depthOf(parentId)+1 : 0;
    const row=el('div','prow2'); row.style.paddingLeft=(8+depth*15)+'px';
    row.innerHTML='<input class="rinp" maxlength="40" placeholder="페이지 이름 → Enter">';
    if(afterRow) afterRow.after(row); else document.getElementById('rlist').append(row);
    const inp=row.querySelector('.rinp'); inp.focus();
    let done=false;
    const finish=(commit)=>{ if(done) return; done=true; const v=inp.value.trim();
      if(commit && v){ persist(); const pg=addPage(project.id,'features',parentId,v); location.href='?p='+project.id+'&page='+pg.id; }
      else row.remove();
    };
    inp.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); finish(true); } else if(e.key==='Escape'){ finish(false); } };
    inp.onblur=()=>finish(true);
  }
  // 페이지 이름 인라인 수정
  function startRename(pg,row){
    const span=row.querySelector('.pt'); if(!span) return;
    const inp=el('input','rinp'); inp.value=pg.name; inp.maxLength=40;
    span.replaceWith(inp); inp.focus(); inp.select();
    row.draggable=false;
    let done=false;
    const finish=(commit)=>{ if(done) return; done=true;
      const v=inp.value.trim();
      if(commit && v && v!==pg.name){ renamePage(project.id,pg.id,v); project=getProject(project.id); if(pageRef&&pageRef.id===pg.id) pageRef=project.pages.find(x=>x.id===pg.id); render(); }
      renderRail();
    };
    inp.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); finish(true); } else if(e.key==='Escape'){ finish(false); } };
    inp.onblur=()=>finish(true);
  }

  /* ---- init ---- */
  renderRail();
  if(project && pageRef){
    pageType = pageRef.pageType || 'main'; volume = pageRef.volume || 'heavy';
    data = structuredClone(pageRef.data || EMPTY);
    pack = (project.stylePack==='edm') ? {id:'edm', name:'eDM'}
         : (project.stylePack==='aglass' && typeof AETHER_STYLE!=='undefined') ? AETHER_STYLE
         : (project.stylePack==='krds' && typeof KRDS_STYLE!=='undefined') ? KRDS_STYLE
         : (project.stylePack==='midas' && typeof MIDAS_STYLE!=='undefined') ? MIDAS_STYLE
         : (DARK_PACKS.find(x=>x.id===project.stylePack) || DARK_PACKS[0]);
    motion = project.motion || 'subtle';
    if(pageRef.chat && pageRef.chat.log && pageRef.chat.log.length){
      // 저장된 대화 복원 → 나갔다 와도 대화 살아있음
      chatLog = pageRef.chat.log.slice(); idx = pageRef.chat.idx||0; generated = !!pageRef.chat.generated;
      chatLog.forEach(m => m.r==='bot' ? addBot(m.t) : addMe(m.t));
      const step = STEPS[idx] || 'done';
      if(generated || step==='done'){ generated=true; mountWidget('done'); }
      else mountWidget(step);
      render(); scroll();
    } else if(project && project.stylePack==='edm'){
      // eDM: 생성 플로우 없이 기존 구성 그대로 편집
      generated=true; idx=STEPS.indexOf('done'); botBubble(`📧 ${project.name} — ${tL('편집 중')}`); mountWidget('done'); render();
    } else {
      const hasContent = !!((data.features && data.features.length) || (data.stats && data.stats.length) || data.bannerText); // 페이지 고유 콘텐츠 기준(공유 시드 제외)
      if(hasContent){ generated=true; idx=STEPS.indexOf('done'); botBubble(`📂 ${project.name} · ${pageRef.name} — ${tL('편집 중')}`); mountWidget('done'); }
      else if(project && project.kind==='multi' && (pageRef.pageType==='main' || (project.pages[0]&&project.pages[0].id===pageRef.id))){
        pageType='main'; idx=STEPS.indexOf('mainSections'); botBubble(PROMPT.mainSections); mountWidget('mainSections'); } // 다중=메인홈부터 섹션 선택
      else { idx=STEPS.indexOf('pageType'); botBubble(PROMPT.pageType); mountWidget('pageType'); } // 페이지 타입부터(템플릿·섹션 결정)
      render();
    }
  } else {
    botBubble(PROMPT.kind); mountWidget('kind'); render();
  }

  // 템플릿에서 시작 → 편집모드 자동 진입
  if(window.I18N) I18N.apply(document);   // 정적 마크업(data-i18n) 로컬라이징
  // eDM = 재생성 불가·편집전용: 재생성 UI 숨김 + 스타일 배지 잠금 + 편집모드 자동 진입
  const _isEdm = project && project.stylePack==='edm';
  if(_isEdm){
    generated=true;
    const rs=document.getElementById('reset'); if(rs) rs.style.display='none';
    badge.style.cursor='default';
    setTimeout(()=>{ const b=document.getElementById('editBtn'); if(b && !editMode) b.click(); }, 150);
  } else if(params.get('edit') && generated){ setTimeout(()=>{ const b=document.getElementById('editBtn'); if(b && !editMode) b.click(); }, 150); }
</script>
</body>
