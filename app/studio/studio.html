<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDAS Web Generator</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('midas-theme')||'light')</script>
<script src="../bundle.js"></script>
<script src="../packs.krds.js"></script>
<script src="../packs.midas.js"></script>
<script src="../packs.edm.js"></script>
<script src="../packs.aether.js"></script>
<script src="../packs.ppt.js"></script>
<script src="../export-pptx.js"></script>
<script src="../llm.js"></script>
<script src="../edm/promo01.js"></script>
<script src="../modal.js"></script>
<script src="../i18n.js"></script>
<link rel="stylesheet" href="../ds.css">
<style>
  /* 제너레이터 셸 — 다크 글로우 (사용자 Figma Make App.tsx/ChatPanel 포팅) */
  :root{
    /* DS 매핑 — 라이트/다크 자동 (ds.css) */
    --bg:var(--canvas); --surf:var(--surface); --surf2:var(--canvas-2);
    --line:var(--hairline); --line2:var(--hairline-strong);
    --tx:var(--ink); --tx2:var(--body-mid); --tx3:var(--mute);
    --cta:var(--primary); --accent2:var(--accent);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:transparent;color:var(--tx);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--scrim);pointer-events:none}
  button{font-family:inherit;cursor:pointer}
  .orb{display:none}
  .app{position:relative;z-index:1;display:flex;height:100vh}
  /* 좌측 페이지 레일 (다중) */
  .rail{width:212px;flex:0 0 212px;border-right:1px solid var(--line);background:var(--surf2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;flex-direction:column;padding:0 12px 14px;position:relative}
  /* 레일 타이틀 헤더 높이를 챗 헤더(.chead 60px)와 맞춤 — 두 타이틀 수직 정렬 */
  .rtop{display:flex;align-items:center;gap:8px;height:60px;box-sizing:border-box;padding:0 4px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .rtop .rhome{color:var(--tx2);text-decoration:none;font-size:16px;line-height:1}
  .rtop b{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:5px 7px;margin:-5px -7px;border-radius:8px;transition:background var(--dur) var(--ease)}
  .rtop b:hover{background:var(--surf)}
  .rtop input.rinp{font-size:16px;font-weight:700;width:100%}
  .rlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .pnode{position:relative}
  .prow2{position:relative;display:flex;align-items:center;gap:6px;padding:8px 8px;border-radius:10px;cursor:pointer;color:var(--tx2);font-size:13px;transition:background var(--dur) var(--ease)}
  .prow2:hover{background:color-mix(in srgb,var(--tx) 8%,transparent);color:var(--tx)}
  .prow2.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--tx)}
  .prow2 .dh{flex:0 0 auto;cursor:grab;color:var(--tx3);font-size:11px;line-height:1;opacity:0;transition:var(--dur)}
  .prow2:hover .dh{opacity:.65} .prow2 .dh:active{cursor:grabbing}
  .prow2 .tw{flex:0 0 auto;color:var(--tx3);font-size:10px;width:10px;text-align:center}
  .prow2 .pt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
  .prow2 .ren,.prow2 .addc,.prow2 .x{flex:0 0 auto;opacity:0;color:var(--tx3);font-size:12px;line-height:1;width:18px;height:18px;display:grid;place-items:center;border-radius:6px;transition:var(--dur)}
  .prow2:hover .ren,.prow2:hover .addc,.prow2:hover .x{opacity:.75}
  .prow2 .ren:hover,.prow2 .addc:hover{opacity:1;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .prow2 .x:hover{opacity:1;color:#f87171;background:color-mix(in srgb,#f87171 14%,transparent)}
  /* DnD 상태 */
  .prow2.dragging{opacity:.35}
  .prow2.din{background:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .prow2.dbefore::before,.prow2.dafter::after{content:'';position:absolute;left:6px;right:6px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .prow2.dbefore::before{top:-2px}.prow2.dafter::after{bottom:-2px}
  .rlist.droproot{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 40%,transparent);border-radius:10px}
  .rhint{font-size:10.5px;color:var(--tx3);padding:2px 8px 8px;line-height:1.4}
  .raddbtn{margin-top:10px;border:1px dashed var(--line2);background:none;color:var(--tx2);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
  .raddbtn:hover{color:var(--tx);border-color:var(--accent)}
  .rinp{flex:1;min-width:0;background:var(--surf);border:1px solid var(--accent);border-radius:7px;color:var(--tx);font-family:inherit;font-size:13px;padding:5px 8px;outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
  .ptmenu{position:absolute;left:12px;right:12px;bottom:56px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:6px;display:none;z-index:40;box-shadow:var(--shadow-3)}
  .ptmenu.open{display:block;animation:rise .18s var(--ease)}
  .ptmenu button{display:block;width:100%;text-align:left;border:none;background:none;color:var(--tx);padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
  .ptmenu button:hover{background:rgba(255,255,255,.08)}

  /* 좌: 챗 */
  .chat{width:var(--chat-w,440px);flex:0 0 var(--chat-w,440px);display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surf2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
  /* 대화창↔프리뷰 리사이저 */
  .splitter{flex:0 0 10px;cursor:col-resize;position:relative;z-index:15;align-self:stretch;background:transparent}
  /* 라인·grip을 시각적 거터(chat 끝 ~ 프리뷰 카드 시작) 중앙에 맞춤 — 프리뷰 좌패딩(16px) 절반만큼 오른쪽으로 */
  .splitter::before{content:'';position:absolute;top:0;bottom:0;left:calc(50% + 8px);transform:translateX(-50%);width:2px;border-radius:2px;background:transparent;transition:background var(--dur) var(--ease)}
  .splitter:hover::before,.splitter.drag::before{background:var(--accent)}
  .splitter::after{content:'';position:absolute;top:50%;left:calc(50% + 8px);transform:translate(-50%,-50%);width:10px;height:36px;border-radius:6px;background:var(--surface);border:1px solid var(--line2);opacity:0;transition:opacity var(--dur) var(--ease)}
  .splitter:hover::after,.splitter.drag::after{opacity:1}
  body.resizing{cursor:col-resize;user-select:none}
  body.resizing iframe{pointer-events:none}
  .chead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .hbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--tx2);text-decoration:none;transition:var(--dur) var(--ease)}
  .hbtn:hover{color:var(--tx);border-color:var(--line2);background:var(--brand-weak)}
  .logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--grad-brand);box-shadow:var(--cta-glow)}
  .brand b{font-size:16px;color:var(--tx);line-height:1.2}
  .brand .wg{font-size:16px;color:var(--tx);font-weight:var(--fw-semi)}
  .reset{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surf);color:var(--tx2);border-radius:999px;padding:6px 12px;font-size:12px}
  .reset:hover{background:rgba(255,255,255,.1)}
  .msgs{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.2) transparent}
  .msgs::-webkit-scrollbar{width:10px}
  .msgs::-webkit-scrollbar-track{background:transparent}
  .msgs::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
  .msgs:hover::-webkit-scrollbar-thumb{background:rgba(0,0,0,.28);background-clip:padding-box}
  :root[data-theme="dark"] .msgs{scrollbar-color:rgba(255,255,255,.16) transparent}
  :root[data-theme="dark"] .msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);background-clip:padding-box}
  :root[data-theme="dark"] .msgs:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);background-clip:padding-box}
  .row{display:flex}.row.me{justify-content:flex-end}
  .bub{max-width:85%;border-radius:16px;padding:10px 15px;font-size:14px;line-height:1.5;animation:rise .35s var(--ease)}
  .bub.bot{border:1px solid var(--line);background:var(--surf);color:var(--tx);border-bottom-left-radius:6px}
  .bub.me{background:var(--primary);color:var(--on-primary);font-weight:500;border-bottom-right-radius:6px}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .widget{animation:rise .3s var(--ease) .1s both}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:9px 15px;text-align:left;color:var(--tx)}
  .chip:hover{border-color:var(--hairline-strong);background:var(--canvas-2)}
  .chip b{display:block;font-size:14px;font-weight:600}
  .chip span{font-size:10px;color:var(--tx3)}
  .card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surf);border-radius:16px;padding:14px}
  /* 메인홈 섹션 멀티선택 */
  .seclist{gap:6px}
  .secrow{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;background:var(--surf);transition:var(--dur) var(--ease)}
  .secrow:hover{border-color:var(--hairline-strong)}
  .secrow.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .secrow.locked{cursor:default;opacity:.85}
  .secrow .cbx{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;color:#fff;background:transparent}
  .secrow .cbx.on{background:var(--accent);border-color:transparent}
  .secrow .sl{display:flex;flex-direction:column;gap:1px;min-width:0}
  .secrow .sl b{font-size:13.5px;font-weight:600;color:var(--tx)}
  .secrow .sl span{font-size:11.5px;color:var(--tx3)}
  .packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pk{overflow:hidden;border-radius:14px;border:1px solid var(--line);text-align:left;background:none}
  .pk.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
  .pk .sw{height:52px}
  .pk .meta{background:var(--surf);padding:8px 10px}
  .pk .meta b{display:block;font-size:12px;font-weight:600}.pk .meta span{font-size:10px;color:var(--tx3)}
  .mopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mo{border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:11px;text-align:left;color:var(--tx)}
  .mo.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .mo b{display:block;font-size:13px;font-weight:600}.mo span{font-size:10px;color:var(--tx3)}
  .inp{width:100%;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--tx);font-family:inherit;outline:none}
  .inp::placeholder{color:var(--tx3)} .inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
  textarea.inp{min-height:52px;resize:vertical}
  .item{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.04);border-radius:12px;padding:8px}
  .item .hd{display:flex;align-items:center;gap:6px}
  .num{display:grid;place-items:center;width:20px;height:20px;flex:0 0 20px;border-radius:999px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-size:10px}
  .next{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--r-sm);background:var(--primary);color:var(--on-primary);padding:10px 18px;font-size:14px;font-weight:500}
  .next:hover{filter:brightness(1.05)}
  .row2{display:flex;gap:8px}

  /* 우: 프리뷰 */
  .preview{flex:1;display:flex;flex-direction:column;padding:16px;min-width:0}
  .pvhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px}
  .pvhead .l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2)}
  .badge{margin-left:4px;border:1px solid var(--line);background:var(--surf);color:var(--tx2);border-radius:999px;padding:3px 11px;font-size:11px;cursor:pointer;font-family:inherit}
  .badge:hover{border-color:var(--line2);color:var(--tx)}
  .stylemenu{position:absolute;top:100%;left:70px;margin-top:6px;z-index:60;display:none;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;min-width:280px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-md);box-shadow:var(--shadow-3);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
  .stylemenu.open{display:grid}
  .stylemenu .si{cursor:pointer;border:2px solid transparent;border-radius:10px;overflow:hidden;background:none;padding:0;font-family:inherit}
  .stylemenu .si.on{border-color:var(--accent)}
  .stylemenu .si .sc{height:40px}
  .stylemenu .si .sn{font-size:10.5px;text-align:center;padding:4px 2px;color:var(--tx2);line-height:1.2}
  .dots{display:flex;gap:6px}
  .dot{width:24px;height:24px;border-radius:999px;border:2px solid var(--line2);cursor:pointer;transition:.2s;padding:0}
  .dot.sel{border-color:var(--ink);transform:scale(1.1)}
  .pvbox{position:relative;flex:1;overflow:hidden;border-radius:var(--r-md);border:1px solid var(--line);background:#070a12;box-shadow:var(--shadow-2)}
  .pvbox iframe{position:absolute;top:0;left:0;border:0;background:var(--bg);transform-origin:0 0}
  /* 디바이스 프리뷰: 태블릿·모바일은 실제 폭으로 렌더 → 반응형 확인. 레터박스 + 기기 프레임 */
  .pvbox.dev-tablet,.pvbox.dev-mobile{background:repeating-linear-gradient(45deg,#0b0e18,#0b0e18 10px,#0d1120 10px,#0d1120 20px)}
  .pvbox.dev-tablet iframe,.pvbox.dev-mobile iframe{border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06)}
  .vpseg{display:inline-flex;gap:2px;padding:2px;border-radius:999px;border:1px solid var(--line);background:var(--surf)}
  .vpseg button{width:28px;height:24px;display:grid;place-items:center;border:0;background:none;color:var(--tx2);border-radius:999px;cursor:pointer;padding:0;transition:var(--dur) var(--ease)}
  .vpseg button:hover{color:var(--tx)}
  .vpseg button.on{background:var(--point);color:#fff}
  .vpseg button svg{width:15px;height:15px}
  .empty{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;background:rgba(6,8,16,.82);backdrop-filter:blur(5px);transition:.4s}
  .empty.hide{opacity:0;pointer-events:none}
  .ai-orb{width:66px;height:66px;position:relative;display:grid;place-items:center}
  .ai-orb::after{content:'';width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#3fe0c6,#5b9dff 46%,#8a6bff 82%);box-shadow:0 0 34px rgba(90,157,255,.6);animation:orb-pulse 1.9s ease-in-out infinite}
  @keyframes orb-pulse{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.05);opacity:1}}
  /* AI 생성 오버레이 */
  .genning{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-align:center;background:rgba(7,10,18,.84);backdrop-filter:blur(8px)}
  .genning.on{display:flex;animation:rise .3s var(--ease)}
  .genning .gspin{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:#fff;animation:spin .8s linear infinite}
  .genning b{color:#fff;font-weight:600;font-size:15px}
  .genning .gtext{color:rgba(255,255,255,.58);font-size:13px;min-height:18px}
  .genning .gbar{width:200px;height:4px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .genning .gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#818cf8);border-radius:999px;transition:width .35s ease}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty .et{font-size:24px;font-weight:600;color:#fff;background:linear-gradient(90deg,#fff 25%,var(--accent) 50%,#fff 75%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:et-shimmer 2.8s linear infinite}
  .empty .et::after{content:'';display:inline-block;width:2px;height:.95em;background:var(--accent);margin-left:4px;vertical-align:-2px;animation:et-caret 1s steps(1) infinite;-webkit-text-fill-color:initial}
  .empty .es{font-family:var(--font-display);font-size:27px;font-weight:600;line-height:1.4;max-width:15em;background:linear-gradient(110deg,#37e0c2 0%,#5b9dff 42%,#a486ff 78%,#e6c6ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  @keyframes et-shimmer{to{background-position:-220% 0}}
  @keyframes et-caret{50%{opacity:0}}
  .dl{border:1px solid var(--line);background:var(--surf);color:var(--tx);border-radius:999px;padding:5px 13px;font-size:12px}
  .dl:hover{background:rgba(255,255,255,.1)}
  .dl.on{background:var(--grad-cta);color:#fff;border-color:transparent}
  .pvbox.editing{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:-2px}
  .secadd{display:none;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 4px 4px}
  .secadd.on{display:flex}
  .secadd .t{font-size:11px;color:var(--tx3)}
  .secadd .sa{border:1px dashed var(--line2);background:var(--surf);color:var(--tx2);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
  .secadd .sa:hover{color:var(--tx);border-color:var(--accent);border-style:solid}
  .preview{position:relative}
  .panel{position:absolute;top:44px;right:16px;z-index:30;width:300px;max-height:60vh;overflow-y:auto;
    border:1px solid var(--line2);border-radius:14px;background:rgba(16,20,30,.96);backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,.5);padding:12px;display:none}
  .panel.open{display:block;animation:rise .2s var(--ease)}
  .phd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .phd b{font-size:13px}
  .pact{display:flex;gap:6px}
  .pact button{border:1px solid var(--line);background:var(--surf);color:var(--tx2);border-radius:8px;padding:4px 9px;font-size:11px;cursor:pointer}
  .pact button:hover{color:var(--tx);background:rgba(255,255,255,.08)}
  .plist{display:flex;flex-direction:column;gap:6px}
  .prow{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surf);cursor:pointer}
  .prow:hover{background:rgba(255,255,255,.08);border-color:var(--line2)}
  .prow .pmeta{flex:1;min-width:0}
  .prow .pmeta b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .pmeta span{font-size:10px;color:var(--tx3)}
  .prow .del{flex:0 0 auto;border:none;background:none;color:var(--tx3);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px}
  .prow .del:hover{color:#f87171;background:rgba(248,113,113,.12)}
  .pempty{color:var(--tx3);font-size:12px;text-align:center;padding:16px}
  /* PPT 썸네일 스트립 — 프리뷰 좌측(젠스파크식). 클릭=해당 장, 현재 장 하이라이트 */

    if(device === 'desktop'){
      s = bw / targetW; left = railOff; top = 0;         // 폭 맞춤 축소(기존 동작)

      s = Math.min((bw - 40) / targetW, (bh - 24) / 720, 1); // 폭·높이 여유에 맞춰, 업스케일 금지
      left = (bw - targetW * s) / 2;                     // 가로 중앙
      top = 12;                                          // 상단 여백(레터박스)
    }
    frame.style.width = targetW + 'px';
    frame.style.height = ((bh - top*2) / s) + 'px';       // 기기 뷰포트 높이(내부 스크롤)

  function setField(path,val){

    const p=path.split('.'); let o=data;
    for(let i=0;i<p.length-1;i++){ const k=/^\d+$/.test(p[i])?+p[i]:p[i]; const nextIsIdx=/^\d+$/.test(p[i+1]); if(o[k]==null) o[k]=nextIsIdx?[]:{}; o=o[k]; }
    const last=p[p.length-1]; o[/^\d+$/.test(last)?+last:last]=val;
  }
  function pickImage(key){

  function applyEdit(){

  /* ---- 스타일 일괄 변경 (프로젝트 전체 페이지 공통) ---- */
  function allStyles(){ const l=DARK_PACKS.map(p=>({id:p.id,name:p.name,swatch:p.swatch}));
    if(window.KRDS_STYLE) l.push({id:'krds',name:KRDS_STYLE.name,swatch:KRDS_STYLE.swatch});
    if(window.MIDAS_STYLE) l.push({id:'midas',name:MIDAS_STYLE.name,swatch:MIDAS_STYLE.swatch});
    if(window.AETHER_STYLE) l.push({id:'aglass',name:AETHER_STYLE.name,swatch:AETHER_STYLE.swatch});
    if(window.PPT_STYLE) l.push({id:'ppt',name:PPT_STYLE.name,swatch:PPT_STYLE.swatch});
    return l; }
  function packById(id){ if(id==='ppt'&&window.PPT_STYLE) return PPT_STYLE; if(id==='aglass'&&window.AETHER_STYLE) return AETHER_STYLE; if(id==='krds'&&window.KRDS_STYLE) return KRDS_STYLE; if(id==='midas'&&window.MIDAS_STYLE) return MIDAS_STYLE; return DARK_PACKS.find(x=>x.id===id)||DARK_PACKS[0]; }
  function changeStyle(id){ pack=packById(id); if(project){ project.stylePack=id; upsertProject(project); } document.getElementById('stylemenu').classList.remove('open'); render(); }
  function buildStyleMenu(){ const m=document.getElementById('stylemenu'); m.innerHTML='';
    allStyles().forEach(s=>{ const b=el('button','si'+(s.id===pack.id?' on':'')); b.innerHTML='<div class="sc" style="background:'+s.swatch+'"></div><div class="sn">'+s.name+'</div>'; b.onclick=(e)=>{ e.stopPropagation(); changeStyle(s.id); }; m.append(b); }); }
  badge.onclick=(e)=>{ e.stopPropagation(); if(!curMode().styleSwitch) return; const m=document.getElementById('stylemenu'); const open=!m.classList.contains('open'); if(open) buildStyleMenu(); m.classList.toggle('open'); };
  document.addEventListener('click',(e)=>{ const m=document.getElementById('stylemenu'); if(m && !m.contains(e.target) && e.target.id!=='badge') m.classList.remove('open'); });

  /* ---- 대화창↔프리뷰 리사이저 ---- */
  (function(){
    const app=document.querySelector('.app'), split=document.getElementById('split');
    const KEY='midas-chat-w', MIN=320, PREVIEW_MIN=360;
    const railW=()=>{ const r=document.getElementById('rail'); return (r && r.style.display!=='none') ? r.offsetWidth : 0; };
    const maxW=()=> Math.max(MIN, app.clientWidth - railW() - 6 - PREVIEW_MIN);
    const clamp=(w)=> Math.min(maxW(), Math.max(MIN, w));
    function setW(w,save){ w=clamp(w); app.style.setProperty('--chat-w', w+'px'); fitPreview(); if(save) localStorage.setItem(KEY, w); }
    // 저장값 복원
    const saved=parseInt(localStorage.getItem(KEY),10); if(saved) setW(saved,false);
    let dragging=false;
    split.addEventListener('pointerdown',(e)=>{ dragging=true; split.setPointerCapture(e.pointerId); split.classList.add('drag'); document.body.classList.add('resizing'); e.preventDefault(); });
    split.addEventListener('pointermove',(e)=>{ if(!dragging) return; setW(e.clientX - app.getBoundingClientRect().left - railW(), false); });
    function end(e){ if(!dragging) return; dragging=false; try{split.releasePointerCapture(e.pointerId);}catch(_){} split.classList.remove('drag'); document.body.classList.remove('resizing'); localStorage.setItem(KEY, parseInt(getComputedStyle(app).getPropertyValue('--chat-w'),10)||440); }
    split.addEventListener('pointerup',end); split.addEventListener('pointercancel',end);
    // 더블클릭 = 기본폭 리셋
    split.addEventListener('dblclick',()=>{ localStorage.removeItem(KEY); app.style.removeProperty('--chat-w'); fitPreview(); });
    window.addEventListener('resize',()=>{ const w=parseInt(getComputedStyle(app).getPropertyValue('--chat-w'),10); if(w) setW(w,false); });
  })();

  // 완료 시 AI 생성 애니메이션 → 공개
  function runGenerate(){
    const g=document.getElementById('genning'), gt=document.getElementById('gtext'), bar=document.querySelector('#genning .gbar i');
    const steps=['기획 내용 분석 중…','섹션 구조 조립 중…','스타일 적용 중…','마무리 중…'].map(tL);
    empty.classList.add('hide'); g.classList.add('on'); bar.style.width='0'; gt.textContent=steps[0];
    requestAnimationFrame(()=>{ bar.style.width='26%'; });
    let i=0; const iv=setInterval(()=>{ i++; if(i<steps.length){ gt.textContent=steps[i]; bar.style.width=(26+i*24)+'%'; } }, 480);
    setTimeout(()=>{ clearInterval(iv); bar.style.width='100%';
      setTimeout(()=>{ g.classList.remove('on'); generated=true; persist(); render(); }, 340);
    }, 1900);
  }

  function isMainPage(){ return project && project.kind==='multi' && pageType==='main'; }
  function shouldSkip(step){
    if(!step) return false;
    if(step==='mainSections') return !isMainPage();          // 메인홈에서만 섹션 선택
    if(isMainPage()){                                        // 메인홈: 미선택 섹션 입력스텝 스킵
      const sel=new Set(data.shownSections||[]);
      if(step==='features') return !sel.has('feature');
      if(step==='stats')    return true;                     // 지표는 메인홈 선택지 아님
      if(step==='banner')   return !sel.has('cta');
    }
    return false;
  }
  function advance(userText){
    if(userText) meBubble(userText);
    idx++;
    let step = STEPS[idx];
    while(shouldSkip(step)){ idx++; step = STEPS[idx]; }
    botBubble(PROMPT[step]);
    mountWidget(step);
    if(step==='done'){ runGenerate(); }
    scroll();
  }

  function mountWidget(step){
    const old = document.getElementById('activeWidget'); if(old) old.remove();
    const w = el('div','widget'); w.id='activeWidget';
    w.append(buildWidget(step));
    msgs.append(w); scroll();
  }

  function chips(opts, pick){
    const c = el('div','chips');
    opts.forEach(o=>{ const b=el('button','chip',`<b>${tL(o.label)}</b>${o.hint?`<span>${tL(o.hint)}</span>`:''}`); b.onclick=()=>pick(o); c.append(b); });
    return c;
  }
  function nextBtn(label, fn){ const b=el('button','next',label||tL('다음 →')); b.onclick=fn; return b; }

  function applyMainSel(sel){
    data.shownSections = [...sel];
    // 메인홈 선택지에 없는 본문 섹션(stat 등)도 미선택 시 숨김
    const optional = [...MAIN_SECTIONS.map(s=>s.type), 'stat'];
    data.hiddenSections = optional.filter(t=>!sel.has(t));
    render();
  }
  function mainSectionPicker(){
    pageType='main';
    if(project&&pageRef){ pageRef.pageType='main'; if(!pageRef.name||pageRef.name==='새 페이지') pageRef.name='메인홈'; }
    const seeded = (data.shownSections&&data.shownSections.length) ? new Set(data.shownSections) : new Set(['feature','cta']);
    applyMainSel(seeded);
    const wrap=el('div','card seclist');
    // 고정: 헤더·히어로
    ['헤더','히어로'].forEach(l=>{ const r=el('label','secrow locked'); r.innerHTML=`<span class="cbx on" aria-hidden="true">✓</span><span class="sl"><b>${tL(l==='헤더'?'헤더':'히어로')}</b><span>${tL('필수')}</span></span>`; wrap.append(r); });
    MAIN_SECTIONS.forEach(s=>{
      const on=seeded.has(s.type);
      const r=el('label','secrow'+(on?' sel':''));
      r.innerHTML=`<span class="cbx${on?' on':''}">${on?'✓':''}</span><span class="sl"><b>${tL(s.label)}</b><span>${tL(s.desc)}</span></span>`;
      r.onclick=(e)=>{ e.preventDefault(); if(seeded.has(s.type)) seeded.delete(s.type); else seeded.add(s.type);
        r.classList.toggle('sel',seeded.has(s.type)); const c=r.querySelector('.cbx'); c.classList.toggle('on',seeded.has(s.type)); c.textContent=seeded.has(s.type)?'✓':'';
        applyMainSel(seeded); };
      wrap.append(r);
    });
    wrap.append(nextBtn(tL('다음 →'), ()=>{ applyMainSel(seeded); if(project&&pageRef){ upsertProject(project); renderRail(); } advance(`${tL('메인홈')} · ${seeded.size}${tL('개 섹션')}`); }));
    return wrap;
  }
  function buildWidget(step){
    if(step==='kind') return chips([{id:'single',label:'랜딩페이지',hint:'단일페이지 · 랜딩·공지'},{id:'multi',label:'웹사이트',hint:'다중페이지 · 여러 페이지'}], o=>advance(tL(o.label)));
    if(step==='pageType') return chips(['제품 기능소개','요금 비교','랜딩'].map(p=>({id:p,label:p})), o=>{ pageType=PAGETYPE[o.label]||'features'; if(project&&pageRef){ pageRef.pageType=pageType; pageRef.name=o.label; upsertProject(project); renderRail(); } render(); advance(tL(o.label)); });
    if(step==='mainSections') return mainSectionPicker();
    if(step==='volume') return chips([{id:'compact',label:'컴팩트',hint:'핵심만'},{id:'mid',label:'중간',hint:'균형'},{id:'heavy',label:'헤비',hint:'풍성'}], o=>{ volume=o.id; render(); advance(tL(o.label)); });
    if(step==='facts'){
      const wrap=el('div','card');
      const f=[['productName','제품명 — 예: Onsite'],['tagline','태그라인 — 예: 대화만으로 완성되는 웹페이지'],['subcopy','서브 카피 — 한 줄 설명'],['primaryCta','주 CTA — 예: 무료로 시작하기']];
      f.forEach(([k,ph])=>{ const i=el('input','inp'); i.placeholder=tL(ph); i.value=data[k]; i.oninput=()=>{data[k]=i.value;render();}; wrap.append(i); });
      wrap.append(nextBtn(tL('다음 →'), ()=>advance(`${data.productName||'제품명'} · ${data.tagline||'태그라인'}`)));
      return wrap;
    }
    if(step==='features') return listWidget('features',[['title','기능명 — 예: 대화형 입력'],['desc','한 줄 설명']], it=>`${tL('기능')} ${it.length}${tL('개 입력')}`);
    if(step==='stats') return listWidget('stats',[['value','수치 — 예: 3분'],['label','라벨 — 예: 평균 생성 시간']], it=>`${tL('지표')} ${it.length}${tL('개 입력')}`, true);
    if(step==='banner'){
      const wrap=el('div','card');
      [['bannerText','배너 문구 — 예: 지금 바로 첫 페이지를 만들어보세요'],['bannerCta','배너 버튼 — 예: 무료로 시작하기']].forEach(([k,ph])=>{
        const i=el('input','inp'); i.placeholder=tL(ph); i.value=data[k]; i.oninput=()=>{data[k]=i.value;render();}; wrap.append(i); });
      wrap.append(nextBtn(tL('다음 →'), ()=>advance(data.bannerText||tL('배너 문구 입력'))));
      return wrap;
    }
    if(step==='footer'){
      const wrap=el('div','card');
      const lk=el('input','inp'); lk.placeholder=tL('푸터 링크 (쉼표로 구분) — 예: 이용약관, 개인정보처리방침, 문의'); lk.value=(data.footerLinks||[]).join(', ');
      lk.oninput=()=>{ data.footerLinks=lk.value.split(',').map(s=>s.trim()).filter(Boolean); render(); };
      const cp=el('input','inp'); cp.placeholder=tL('저작권 문구 (선택) — 예: © 2026 Onsite Labs'); cp.value=data.footerCopyright||'';
      cp.oninput=()=>{ data.footerCopyright=cp.value; render(); };
      wrap.append(lk, cp, nextBtn(tL('✓ 생성하기'), ()=>advance(tL('푸터 설정 완료'))));
      return wrap;
    }
    // done
    const d=el('div','card'); d.style.textAlign='center';
    // 편집전용(이메일/PPT): 재생성 없이 편집 안내만 (packMode.doneKo)
    if(curMode().editOnly){
      d.append(el('div','',`<span style="color:var(--tx2);font-size:13px">${tL(curMode().doneKo||'우측 편집 버튼으로 수정하세요.')}</span>`));
      // 슬라이드 내비는 프리뷰 좌측 썸네일 스트립
      if(curMode().slides) refreshPptPanel();
      return d;
    }
    d.append(el('div','',`<span style="color:var(--tx2);font-size:13px">${tL('우측 편집 버튼 안내')}</span>`));
    d.append(nextBtn(tL('↺ 새로 만들기'), reset));
    return d;
  }

  /* ---- PPT 슬라이드 관리 패널 (data.slides[] 추가·삭제·순서). 편집전용 done 위젯에 삽입 ---- */
  function scrollToSlide(i){
    try{ const fw=frame.contentWindow, s=frame.contentDocument.querySelectorAll('.ppt-stack > .slide')[i]; if(!s) return;
      const r=s.getBoundingClientRect(); const y=fw.scrollY + r.top - Math.max(0,(fw.innerHeight-r.height)/2);
      fw.scrollTo({top:Math.max(0,y), behavior:'smooth'});
      setTimeout(()=>{ try{ if(Math.abs(fw.scrollY-Math.max(0,y))>40) fw.scrollTo(0,Math.max(0,y)); }catch(e){} },350);   // smooth 미동작 환경 폴백
    }catch(e){}
  }
  // AI가 방금 추가/수정한 슬라이드 인덱스 표시(패널 배지 + 프리뷰 플래시). 수동 조작 시 해제.
  let _pptMarks={};   // {idx:'new'|'mod'}
  function pptMutate(fn){ if(!Array.isArray(data.slides)) data.slides=[]; pushUndo(); _pptMarks={}; fn(data.slides); persist(); render(); refreshPptPanel(); }
  // 프리뷰에서 해당 장들로 시선 유도: 첫 변경 장으로 스크롤 + 잠시 액센트 테두리
  function flashSlides(idxs){
    if(!idxs.length) return;
    setTimeout(()=>{ try{
      const doc=frame.contentDocument, ss=doc.querySelectorAll('.ppt-stack > .slide');
      idxs.forEach(i=>{ const s=ss[i]; if(!s) return;
        s.style.transition='box-shadow .4s ease'; s.style.boxShadow='0 0 0 4px #8b5cf6, 0 12px 40px rgba(0,0,0,.4)';
        setTimeout(()=>{ s.style.boxShadow=''; }, 2600);
      });
      if(ss[idxs[0]]) ss[idxs[0]].scrollIntoView({behavior:'smooth',block:'center'});
    }catch(e){} }, 450);   // srcdoc 로드 대기
  }
  // 라이브 DOM에서 현재 패널을 찾아 교체(init 중 done 위젯이 여러 번 마운트돼 캡처 참조가 분리될 수 있음)
  let _pptFolded=true;   // 기본 접힘 — 필요할 때만 펼쳐 공간 확보
  // 생성 직후 진입: 슬라이드가 하나씩 만들어지는 듯한 순차 등장(1회)
  let _pptRevealPending=false;
  function revealSlides(){
    try{ const ss=[...frame.contentDocument.querySelectorAll('.ppt-stack > .slide')];
      ss.forEach((s,i)=>{
        s.style.opacity='0'; s.style.transform='translateY(22px)';
        s.style.transition='opacity .55s ease, transform .55s ease'; s.style.transitionDelay=(i*0.16)+'s';
        setTimeout(()=>{ s.style.opacity='1'; s.style.transform=''; }, 40);
        setTimeout(()=>{ s.style.transition=''; s.style.transitionDelay=''; }, 1300+i*160);
      });
    }catch(e){}
  }

  // 슬라이드 내비 = 프리뷰 좌측 썸네일 스트립(젠스파크식). 구조 변경 시 재빌드
  function refreshPptPanel(){ rebuildThumbRail(); }
  let _curThumb=0;
  function setCurThumb(i){ _curThumb=i; document.querySelectorAll('#thumbRail .thumb').forEach((t,k)=>t.classList.toggle('cur',k===i)); }
  function rebuildThumbRail(){
    const rail=document.getElementById('thumbRail'); if(!rail) return;
    if(!curMode().slides || typeof renderPptDeck!=='function'){ rail.style.display='none'; return; }
    rail.style.display='flex'; rail.innerHTML='';
    const W=132, sc=W/1280;
    (data.slides||[]).forEach((s,i)=>{
      const t=el('div','thumb','<span class="tnum">'+(i+1)+'</span>');
      t.style.width=W+'px'; t.style.height=Math.round(720*sc)+'px';
      const f=document.createElement('iframe'); f.setAttribute('scrolling','no');
      f.srcdoc=renderPptDeck({slides:[JSON.parse(JSON.stringify(s))], style:data.style||'ax', accent:data.accent||''});
      f.style.transform='scale('+sc+')';
      t.append(f);
      t.onclick=()=>{ setCurThumb(i); scrollToSlide(i); };
      rail.append(t);
    });
    const add=el('div','thumb-add');
    const ab=el('button','','+ '+tL('추가'));
    const menu=el('div','thumb-menu');
    (window.PPT_SLIDE_TYPES||[]).forEach(tp=>{ const b=el('button','',tp.label);
      b.onclick=(e)=>{ e.stopPropagation(); menu.classList.remove('open'); pptMutate(a=>a.push(window.pptNewSlide(tp.type))); setTimeout(()=>{ setCurThumb((data.slides||[]).length-1); scrollToSlide((data.slides||[]).length-1); },150); }; menu.append(b); });
    ab.onclick=(e)=>{ e.stopPropagation(); menu.classList.toggle('open'); };
    document.addEventListener('click',(e)=>{ if(!add.contains(e.target)) menu.classList.remove('open'); });
    add.append(ab,menu); rail.append(add);
    setCurThumb(Math.min(_curThumb,(data.slides||[]).length-1));
    fitPreview();   // 레일 노출로 줄어든 폭 반영
  }

  /* ---- PPT 내용수정 채팅 — 내용·구조(추가/분할/삭제/순서) AI 수정. 디자인만 안내로 리다이렉트 ---- */
  // AI 작업중 버블: 단계 메시지 순환 + 경과초 + 진행바. 반환 {row, done()} — done()이 버블 제거.
  function workingBubble(){
    const stages=[ ['지시 해석 중…',12], ['관련 슬라이드 찾는 중…',38], ['문장 새로 쓰는 중…',66], ['덱에 반영 준비 중…',85] ];
    // '보통 N초' = 이 기기 실측(최근 10회 중앙값 기반). 기록 없으면 시간 약속 안 함.
    const est = (window.LLM && LLM.estimateDur) ? LLM.estimateDur('edit') : null;
    const metaTail = est ? tL('초 경과 · 보통')+' '+est+tL('초 안팎') : tL('초 경과');
    const row=el('div','row');
    const bub=el('div','bub bot working',
      `<div class="wk-head"><span class="wk-spin"></span><span class="wk-stage">${tL(stages[0][0])}</span></div>`+
      `<div class="wk-meta"><span class="wk-sec">0</span><span class="wk-tail">${metaTail}</span></div>`+
      `<div class="wk-bar"><i></i></div>`);
    row.append(bub); msgs.append(row); scroll();
    const stEl=bub.querySelector('.wk-stage'), secEl=bub.querySelector('.wk-sec'), barEl=bub.querySelector('.wk-bar i'), tailEl=bub.querySelector('.wk-tail');
    let i=0, sec=0, over=false;
    barEl.style.width=stages[0][1]+'%';
    const stT=setInterval(()=>{ i++; if(i<stages.length){ stEl.textContent=tL(stages[i][0]); barEl.style.width=stages[i][1]+'%'; } else clearInterval(stT); }, 3500);
    const scT=setInterval(()=>{ sec++; secEl.textContent=sec;
      // 예상 초과 → 낡은 약속 대신 정직한 전환
      if(est && !over && sec>est){ over=true; stEl.textContent=tL('조금 더 걸리네요… 거의 다 됐어요'); tailEl.textContent=tL('초 경과'); barEl.style.width='92%'; clearInterval(stT); }
    }, 1000);
    return { row, done(){ clearInterval(stT); clearInterval(scT); row.remove(); } };
  }
  /* ---- 통합 되돌리기(PPT): 텍스트·블록이동·숨김·굵기·슬라이드조작·AI수정 전부 한 스택 ---- */
  const _undoStack=[];
  function pushUndo(prevJson){ _undoStack.push(prevJson||JSON.stringify(data.slides||[])); if(_undoStack.length>40)_undoStack.shift(); syncUndoUI(); }
  function syncUndoUI(){
    const h=document.getElementById('histBtn'); if(h){ h.style.display=curMode().slides?'':'none'; h.disabled=!_undoStack.length; }
    const u=document.getElementById('pptcUndo'); if(u) u.style.display=_undoStack.length?'':'none';
  }
  function undoAll(){ const s=_undoStack.pop(); if(!s) return; data.slides=JSON.parse(s); _pptMarks={}; persist(); render(); refreshPptPanel(); syncUndoUI(); }

  /* ---- PPT 편집 v2 — 블록(⠿이동·✕숨김) + 텍스트 굵기 툴바 + 슬라이드 호버 [↑↓✕] ----
     오프셋/숨김/굵기는 슬라이드 데이터(_pos/_hide/_fmt)에 저장 → 렌더·뷰어·PPTX 전부 반영 */
  function slideIndexOf(node){ const sl=node.closest('.ppt-stack > .slide'); return sl? [...sl.parentElement.children].indexOf(sl) : -1; }
  // 이미지 선택 → 최대 1280px·JPEG 0.85 압축 dataURL (저장 용량·PPTX 용량 관리)
  function pickPptImage(cb){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
      const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{
        const MAX=1280, sc=Math.min(1, MAX/Math.max(im.width,im.height));
        const cv=document.createElement('canvas'); cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        cb(cv.toDataURL('image/jpeg',0.85));
      }; im.src=rd.result; }; rd.readAsDataURL(f); };
    inp.click();
  }
  function relPathOf(el){ return (el.getAttribute('data-edit')||'').replace(/^slides\.\d+\./,''); }
  function decoratePpt(doc){
    if(!curMode().slides || !doc || !doc.body) return;
    if(!doc.getElementById('pptedcss')){ const st=doc.createElement('style'); st.id='pptedcss'; st.textContent=
      '[data-editing] [data-mvkey]:hover{outline:1px dashed rgba(108,43,255,.5);outline-offset:4px}'
      +'.mvctl{position:absolute;top:-14px;right:-10px;z-index:60;display:none;gap:4px}'
      +'[data-editing] [data-mvkey]:hover > .mvctl{display:flex}'
      +'.mvctl button{border:none;width:24px;height:24px;border-radius:8px;background:rgba(108,43,255,.95);color:#fff;font-size:12px;cursor:pointer;line-height:1;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.35)}'
      +'.mvctl .mvh{cursor:grab}.mvctl .mvx{background:rgba(230,60,60,.95)}'
      +'.slctl{position:absolute;top:12px;right:12px;z-index:70;display:none;gap:4px}'
      +'.ppt-stack > .slide:hover > .slctl{display:flex}'
      +'.slctl button{width:26px;height:26px;border-radius:8px;background:rgba(10,10,16,.78);color:#fff;font-size:13px;cursor:pointer;line-height:1;display:grid;place-items:center;border:1px solid rgba(255,255,255,.18)}'
      +'.slctl button:hover{background:rgba(108,43,255,.95)}.slctl .sx:hover{background:rgba(230,60,60,.95)}.slctl button:disabled{opacity:.3}'
      +'.fmtbar{position:absolute;z-index:80;display:flex;gap:3px;padding:4px;border-radius:10px;background:rgba(10,10,16,.92);box-shadow:0 8px 24px rgba(0,0,0,.45)}'
      +'.fmtbar button{border:none;min-width:26px;height:24px;border-radius:7px;background:rgba(255,255,255,.14);color:#fff;font-size:11.5px;cursor:pointer;padding:0 7px}'
      +'.fmtbar button.on{background:#6c2bff}';
      doc.head.appendChild(st); }
    // 슬라이드 호버 [↑↓✕] — 편집모드 무관, 항상
    const arr=doc.querySelectorAll('.ppt-stack > .slide');
    arr.forEach((sl,i)=>{
      const old=sl.querySelector(':scope > .slctl'); if(old) old.remove();
      const bar=doc.createElement('div'); bar.className='slctl';
      const hasImg=!!((data.slides[i]||{}).img&&data.slides[i].img.src);
      bar.innerHTML='<button class="si" title="'+tL(hasImg?'이미지 교체':'이미지 삽입')+'">🖼</button><button class="su"'+(i===0?' disabled':'')+' title="'+tL('위로')+'">↑</button><button class="sd"'+(i===arr.length-1?' disabled':'')+' title="'+tL('아래로')+'">↓</button><button class="sx" title="'+tL('삭제')+'">✕</button>';
      bar.querySelector('.si').onclick=(e)=>{ e.stopPropagation();
        pickPptImage(src=>{ pushUndo(); const s=data.slides[i]; s.img={src}; persist(); render(); refreshPptPanel(); }); };
      bar.querySelector('.su').onclick=(e)=>{ e.stopPropagation(); pptMutate(a=>{ const t=a[i]; a[i]=a[i-1]; a[i-1]=t; }); };
      bar.querySelector('.sd').onclick=(e)=>{ e.stopPropagation(); pptMutate(a=>{ const t=a[i]; a[i]=a[i+1]; a[i+1]=t; }); };
      bar.querySelector('.sx').onclick=(e)=>{ e.stopPropagation();
        if((data.slides||[]).length<=1){ uiAlert(tL('마지막 슬라이드는 삭제할 수 없어요.')); return; }
        uiConfirm(tL('이 슬라이드를 삭제할까요?'),{title:tL('슬라이드 삭제'),okText:tL('삭제'),danger:true}).then(ok=>{ if(ok) pptMutate(a=>a.splice(i,1)); }); };
      sl.appendChild(bar);
    });
    if(!editMode) return;
    // 블록 핸들 — ⠿ 드래그(오프셋 저장) · ✕ 숨김
    doc.querySelectorAll('[data-mvkey]').forEach(blk=>{
      if(blk.querySelector(':scope > .mvctl')) return;
      if(doc.defaultView.getComputedStyle(blk).position==='static') blk.style.position='relative';
      const key=blk.getAttribute('data-mvkey'); const si=slideIndexOf(blk); if(si<0) return;
      const ctl=doc.createElement('span'); ctl.className='mvctl';
      ctl.innerHTML='<button class="mvh" title="'+tL('끌어서 이동')+'">⠿</button><button class="mvx" title="'+tL('숨기기')+'">✕</button>';
      ctl.querySelector('.mvh').addEventListener('pointerdown',(e)=>{
        e.preventDefault(); e.stopPropagation();
        const before=JSON.stringify(data.slides||[]);
        const base=((data.slides[si]||{})._pos||{})[key]||[0,0];
        const sx=e.clientX, sy=e.clientY; let dx=0,dy=0;
        const mv=(ev)=>{ dx=ev.clientX-sx; dy=ev.clientY-sy; blk.style.transform='translate('+(base[0]+dx)+'px,'+(base[1]+dy)+'px)'; };
        const up=()=>{ doc.removeEventListener('pointermove',mv); doc.removeEventListener('pointerup',up);
          if(Math.abs(dx)<2&&Math.abs(dy)<2) return;
          pushUndo(before); const s=data.slides[si]; s._pos=s._pos||{}; s._pos[key]=[Math.round(base[0]+dx),Math.round(base[1]+dy)]; persist(); };
        doc.addEventListener('pointermove',mv); doc.addEventListener('pointerup',up);
      });
      ctl.querySelector('.mvx').onclick=(e)=>{ e.stopPropagation();
        pushUndo(); const s=data.slides[si]; s._hide=s._hide||{}; s._hide[key]=1; blk.style.display='none'; persist(); };
      blk.appendChild(ctl);
    });
    // 이미지 클릭 = 교체 (편집모드)
    doc.querySelectorAll('.s-imgwrap img').forEach(im=>{
      if(im.__imgw) return; im.__imgw=1; im.style.cursor='pointer'; im.title=tL('클릭해서 이미지 교체');
      im.addEventListener('click',(e)=>{ if(!editMode) return; e.preventDefault(); e.stopPropagation();
        const si=slideIndexOf(im); if(si<0) return;
        pickPptImage(src=>{ pushUndo(); data.slides[si].img={src}; im.src=src; persist(); }); });
    });
    // 굵기 툴바 — [data-edit] 포커스 시 [B|L|기본]
    let fb=doc.getElementById('fmtbar');
    if(!fb){ fb=doc.createElement('div'); fb.id='fmtbar'; fb.className='fmtbar'; fb.style.display='none';
      fb.addEventListener('mousedown',e=>e.preventDefault());   // 클릭해도 blur 안 되게
      doc.body.appendChild(fb); }
    const showFmt=(el)=>{
      const si=slideIndexOf(el), rel=relPathOf(el); if(si<0||!rel){ fb.style.display='none'; return; }
      const cur=((data.slides[si]||{})._fmt||{})[rel]||'';
      fb.innerHTML='<button data-f="b"'+(cur==='b'?' class="on"':'')+' style="font-weight:800">B</button>'
        +'<button data-f="l"'+(cur==='l'?' class="on"':'')+' style="font-weight:300">L</button>'
        +'<button data-f="">'+tL('기본')+'</button>';
      const r=el.getBoundingClientRect(), w=doc.defaultView;
      fb.style.left=Math.max(4,r.left+w.scrollX)+'px'; fb.style.top=Math.max(4,r.top+w.scrollY-34)+'px'; fb.style.display='flex';
      fb.querySelectorAll('button').forEach(b=>{ b.onclick=(e)=>{ e.stopPropagation();
        const f=b.getAttribute('data-f'); pushUndo(); const s=data.slides[si]; s._fmt=s._fmt||{};
        if(f) s._fmt[rel]=f; else delete s._fmt[rel];
        el.style.fontWeight= f==='b'?700 : f==='l'?300 : '';
        persist(); showFmt(el);
      };});
    };
    doc.querySelectorAll('.ppt-stack [data-edit]').forEach(el=>{
      if(el.__fmtw) return; el.__fmtw=1;
      el.addEventListener('focus',()=>showFmt(el));
      el.addEventListener('blur',()=>setTimeout(()=>{ if(doc.activeElement!==el) fb.style.display='none'; },150));
    });
  }
  function initPptChat(){
    if(!(window.LLM && LLM.aiAvailable())) return;   // AI 없으면 컴포저 미노출(직접 편집만)
    const box=document.getElementById('pptChat'), inp=document.getElementById('pptcInp');
    const send=document.getElementById('pptcSend'), undoB=document.getElementById('pptcUndo');
    box.style.display='';
    // 온보딩(범위 계약) — 화면에만, 로그 저장 안 함(재방문마다 1회)
    addBot(tL('✏️ 말만 하면 고쳐드려요 — 문구·수치·톤은 물론, 장표 추가·분할·삭제·순서까지. 🎨 디자인(색·글꼴·배치)만 스타일 팩이 자동 관리해요. 급하면 위 슬라이드 목록에서 드래그로도 정리돼요.'));
    const chips=[ '더 간결하게 줄여줘', '핵심 수치를 강조해줘', '마지막 장 앞에 Q&A 장 추가해줘', '표지 문구를 더 임팩트 있게' ];
    const cbox=document.getElementById('pptcChips');
    chips.forEach(c=>{ const b=el('button','pptc-chip',tL(c)); b.onclick=()=>{ inp.value=tL(c); doSend(); }; cbox.append(b); });
    async function doSend(){
      const t=inp.value.trim(); if(!t || send.disabled) return;
      meBubble(t); inp.value=''; send.disabled=true;
      const wk=workingBubble();
      const snap=JSON.stringify(data.slides||[]);
      const t0=Date.now();
      try{
        const res=await LLM.editDeck(data.slides||[], t);
        LLM.recordDur('edit', Date.now()-t0);   // 실측 기록 → 다음부터 '보통 N초' 정확해짐
        wk.done();
        if(res.slides){
          pushUndo(snap);
          // 변경 감지: 그대로/이동만 된 장은 제외, 내용 바뀐 장='수정', 완전 새 장='NEW'
          const oldArr=JSON.parse(snap);
          const oldSet=new Set(oldArr.map(s=>JSON.stringify(s)));
          const oldTitles=new Set(oldArr.map(s=>(s.type||'')+'|'+(s.title||'')));
          _pptMarks={};
          res.slides.forEach((s,i)=>{ const j=JSON.stringify(s);
            if(oldSet.has(j)) return;                                   // 동일 내용(제자리든 이동이든)
            _pptMarks[i]= oldTitles.has((s.type||'')+'|'+(s.title||'')) ? 'mod' : 'new';
          });
          data.slides=res.slides;
          persist(); render(); refreshPptPanel();
          const idxs=Object.keys(_pptMarks).map(Number);
          flashSlides(idxs); idxs.length&&scrollToSlide(idxs[0]);
          syncUndoUI();
          botBubble((res.message||tL('수정했어요.'))+' '+tL('(↺로 되돌릴 수 있어요)'));
        } else {
          botBubble(res.message||tL('요청을 이해하지 못했어요. 슬라이드 내용 수정을 말씀해주세요.'));
        }
      }catch(e){ wk.done(); botBubble(tL('수정에 실패했어요. 잠시 후 다시 시도해주세요.')+' ('+(e&&e.message||'')+')'); }
      finally{ send.disabled=false; scroll(); }
    }
    send.onclick=doSend;
    inp.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); doSend(); } };
    undoB.onclick=()=>{ if(!_undoStack.length) return; undoAll(); botBubble(tL('마지막 수정을 되돌렸어요.')); scroll(); };
  }
  function buildPptPanel(){
    const TL = window.PPT_TYPE_LABEL||{}; const TYPES = window.PPT_SLIDE_TYPES||[];
    const box=el('div','pptpanel');
    const head=el('div','pptp-head'); head.append(el('b','',tL('슬라이드')));
    const cnt=el('span','pptp-cnt', (data.slides||[]).length+''); head.append(cnt);
    const CHEV='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
    const foldLabel=()=>`<span>${_pptFolded?tL('펼치기'):tL('접기')}</span><i class="chev${_pptFolded?'':' up'}">${CHEV}</i>`;
    const fold=el('button','pptp-fold', foldLabel());
    fold.onclick=(e)=>{ e.stopPropagation(); _pptFolded=!_pptFolded; box.classList.toggle('closed',_pptFolded); fold.innerHTML=foldLabel(); };
    head.append(fold); box.append(head);
    if(_pptFolded) box.classList.add('closed');
    const list=el('div','pptp-list');
    let dragIdx=null;
    const clearSDnd=()=>list.querySelectorAll('.pptp-row').forEach(x=>x.classList.remove('dbefore','dafter'));
    (data.slides||[]).forEach((s,i)=>{
      const row=el('div','pptp-row');
      row.append(el('span','pptp-idx', String(i+1).padStart(2,'0')));
      // 행 제목 = 슬라이드 실제 제목(내용 기반). 없으면 타입 라벨 폴백. (textContent — AI/사용자 문자열 이스케이프)
      const nm=el('span','pptp-name'); const _t=(s.title||'').replace(/\n/g,' ').trim();
      nm.textContent=_t||(TL[s.type]||s.type||'슬라이드'); nm.title=_t; row.append(nm);
      if(_pptMarks[i]) row.append(el('span','pptp-mark'+(_pptMarks[i]==='new'?' new':''), _pptMarks[i]==='new'?'NEW':tL('수정')));
      // 드래그로 순서 변경 (레일과 동일 UX — 위/아래 절반에 인디케이터)
      row.draggable=true;
      row.addEventListener('dragstart',(e)=>{ dragIdx=i; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(i)); setTimeout(()=>row.classList.add('dragging'),0); });
      row.addEventListener('dragend',()=>{ row.classList.remove('dragging'); dragIdx=null; clearSDnd(); });
      row.addEventListener('dragover',(e)=>{ e.preventDefault(); if(dragIdx==null||dragIdx===i) return; clearSDnd();
        const rect=row.getBoundingClientRect(); const before=(e.clientY-rect.top)/rect.height<0.5;
        row.classList.add(before?'dbefore':'dafter'); row.dataset.szone=before?'before':'after'; });
      row.addEventListener('drop',(e)=>{ e.preventDefault(); const zone=row.dataset.szone||'after'; clearSDnd();
        if(dragIdx==null||dragIdx===i) return;
        let to = zone==='before'? i : i+1; if(dragIdx<to) to--;   // 원소 제거 후 인덱스 보정
        if(to===dragIdx) return;
        const from=dragIdx; pptMutate(a=>{ const t=a.splice(from,1)[0]; a.splice(to,0,t); });
      });
      const ops=el('div','pptp-ops');
      const up=el('button','pptp-op'+(i===0?' off':''),'↑'); up.title=tL('위로'); up.onclick=(e)=>{ e.stopPropagation(); if(i===0)return; pptMutate(a=>{ const t=a[i]; a[i]=a[i-1]; a[i-1]=t; }); };
      const dn=el('button','pptp-op'+(i===(data.slides.length-1)?' off':''),'↓'); dn.title=tL('아래로'); dn.onclick=(e)=>{ e.stopPropagation(); if(i===data.slides.length-1)return; pptMutate(a=>{ const t=a[i]; a[i]=a[i+1]; a[i+1]=t; }); };
      const del=el('button','pptp-op del','✕'); del.title=tL('삭제'); del.onclick=(e)=>{ e.stopPropagation(); if((data.slides||[]).length<=1){ uiAlert(tL('마지막 슬라이드는 삭제할 수 없어요.')); return; } uiConfirm(tL('이 슬라이드를 삭제할까요?'),{title:tL('슬라이드 삭제'),okText:tL('삭제'),danger:true}).then(ok=>{ if(ok) pptMutate(a=>a.splice(i,1)); }); };
      ops.append(up,dn,del); row.append(ops);
      row.onclick=()=>scrollToSlide(i);
      list.append(row);
    });
    box.append(list);
    // 추가 버튼 + 타입 메뉴
    const addWrap=el('div','pptp-add');
    const addBtn=el('button','pptp-addbtn','+ '+tL('슬라이드 추가'));
    const menu=el('div','pptp-menu');
    TYPES.forEach(t=>{ const b=el('button','pptp-mi',t.label); b.onclick=()=>{ menu.classList.remove('open'); pptMutate(a=>a.push(window.pptNewSlide(t.type))); setTimeout(()=>scrollToSlide((data.slides||[]).length-1),120); }; menu.append(b); });
    addBtn.onclick=(e)=>{ e.stopPropagation(); menu.classList.toggle('open'); };
    document.addEventListener('click',(e)=>{ if(!addWrap.contains(e.target)) menu.classList.remove('open'); });
    addWrap.append(addBtn,menu); box.append(addWrap);
    return box;
  }

  function listWidget(key, fields, summarize, twoCol){
    const wrap=el('div','card');
    if(!data[key].length) data[key]=[0,1,2].map(()=>Object.fromEntries(fields.map(([k])=>[k,''])));
    data[key].forEach((it,i)=>{
      const item=el('div','item');
      if(twoCol){ const r=el('div','row2'); fields.forEach(([k,ph],j)=>{ const inp=el('input','inp'); if(j===0)inp.style.flex='0 0 35%'; inp.placeholder=tL(ph); inp.value=it[k]; inp.oninput=()=>{it[k]=inp.value;render();}; r.append(inp); }); item.append(r); }
      else { const hd=el('div','hd'); hd.append(el('span','num',i+1)); const i0=el('input','inp'); i0.placeholder=tL(fields[0][1]); i0.value=it[fields[0][0]]; i0.oninput=()=>{it[fields[0][0]]=i0.value;render();}; hd.append(i0); item.append(hd);
        const i1=el('input','inp'); i1.placeholder=tL(fields[1][1]); i1.value=it[fields[1][0]]; i1.oninput=()=>{it[fields[1][0]]=i1.value;render();}; item.append(i1); }
      wrap.append(item);
    });
    wrap.append(nextBtn(tL('다음 →'), ()=>advance(summarize(data[key]))));
    return wrap;
  }

  /* ---- 미리보기: 생성된 페이지를 새 창에서 확인 (편집 UI 없는 실제 화면) ----
     다중 페이지면 모든 페이지를 한 문서에 담고 GNB 메뉴로 서로 이동 가능(정적). */
  function previewHtml(){
    persist();
    const pages = (project && project.kind==='multi' && project.pages.length) ? project.pages : [ {id:'single', data, pageType, volume} ];
    // 단일 프로젝트는 가상 id('single')라 pageRef.id와 불일치 → 첫 페이지 기준(안 그러면 전부 hidden)
    const cur = (project && project.kind==='multi' && pageRef && pageRef.id) ? pageRef.id : pages[0].id;
    const dp = new DOMParser();
    let headHTML=''; const secs=[];
    pages.forEach((pg,i)=>{ const doc=dp.parseFromString(renderProjectPage(pg),'text/html');
      if(i===0) headHTML=doc.head.innerHTML;
      secs.push('<div data-ppage="'+pg.id+'"'+(pg.id===cur?'':' hidden')+'>'+doc.body.innerHTML+'</div>'); });
    const swap='<scr'+'ipt>document.addEventListener("click",function(e){var n=e.target.closest&&e.target.closest("[data-nav-page]");if(n){e.preventDefault();var t=document.querySelector(\'[data-ppage="\'+n.getAttribute("data-nav-page")+\'"]\');if(t){document.querySelectorAll("[data-ppage]").forEach(function(s){s.hidden=true});t.hidden=false;window.scrollTo(0,0);}return;}var a=e.target.closest&&e.target.closest(\'a[href^="#"]\');if(a)e.preventDefault();},true);document.addEventListener("submit",function(e){e.preventDefault()},true);</scr'+'ipt>';
    return '<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(data.productName||'미리보기')+'</title>'+headHTML+'</head><body>'+secs.join('')+swap+'</body></html>';
  }
  /* 전체화면 오버레이로 미리보기(팝업 미사용 — 차단 무관). PPT는 발표 뷰어(←→ 넘김). */
  const pvFull=document.getElementById('pvFull'), pvfFrame=document.getElementById('pvfFrame');
  function openPreview(){
    persist();
    const isPptPack = pack && pack.id==='ppt' && typeof renderPptViewer==='function';
    document.getElementById('pvfTitle').textContent = isPptPack ? tL('발표 미리보기 — ← → 또는 클릭으로 넘기기 · F 전체화면 · ESC 닫기') : tL('미리보기');
    pvfFrame.srcdoc = isPptPack ? renderPptViewer(data) : previewHtml();
    pvFull.hidden=false;
    if(isPptPack) setTimeout(()=>{ try{ pvfFrame.contentWindow.focus(); }catch(e){} }, 250);   // 키보드 ←→ 즉시 동작
  }
  function closePreview(){ pvFull.hidden=true; pvfFrame.srcdoc=''; }
  document.getElementById('previewBtn').onclick=async ()=>{
    if(!generated){ await uiAlert(tL('먼저 페이지를 생성해주세요.')); return; }
    openPreview();
  };
  document.getElementById('pvfClose').onclick=closePreview;
  window.addEventListener('keydown',(e)=>{ if(e.key==='Escape' && !pvFull.hidden) closePreview(); });
  window.addEventListener('message',(e)=>{ if(e.data && e.data.pptViewerClose) closePreview(); });

  /* ---- 저장: 현재 페이지를 프로젝트에 저장 ---- */
  function saveCurrent(){
    persist();
    const b=document.getElementById('save'); const o=b.textContent;
    b.textContent = project ? tL('저장됨 ✓') : tL('메모리 저장'); setTimeout(()=>b.textContent=o,1200);
  }
  document.getElementById('save').onclick=saveCurrent;
  document.getElementById('expBtn').onclick=()=>{
    const snap={ name:data.productName||'page', pageType, volume, motion, pack:pack.id, data };
    const b=new Blob([JSON.stringify(snap,null,2)],{type:'application/json'}); const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=(data.productName||'page')+'.json'; a.click(); URL.revokeObjectURL(a.href);
  };

  /* ---- 좌측 페이지 레일 (다중 프로젝트) ---- */
  // 뎁스: 최상위=0. MAX_DEPTH=1 → 최상위(1뎁스) + 하위 1단계(2뎁스)까지만.
  // 메인홈은 하위를 가질 수 없음(로고/홈). 메뉴는 다음 페이지들부터.
  const MAX_DEPTH=1;
  let dragId=null;

  function countDesc(id){ let n=0; const stack=[id]; while(stack.length){ const cur=stack.pop(); project.pages.forEach(p=>{ if(p.parentId===cur){ n++; stack.push(p.id); } }); } return n; }
  function subtreeHeight(id){ const kids=project.pages.filter(x=>x.parentId===id); return kids.length ? 1+Math.max(...kids.map(k=>subtreeHeight(k.id))) : 0; }
  function depthOf(id){ let d=0, cur=project.pages.find(x=>x.id===id); const seen=new Set(); while(cur&&cur.parentId){ d++; if(seen.has(cur.id))break; seen.add(cur.id); cur=project.pages.find(x=>x.id===cur.parentId); } return d; }
  // 이동 허용 여부: 메인홈은 부모 불가 · 메인홈 자신은 최상위 고정 · 결과 뎁스 제한
  function canDrop(dragPageId, parentId){
    const dragged=project.pages.find(x=>x.id===dragPageId); if(!dragged) return false;
    if(dragged.pageType==='main' && parentId) return false;         // 메인홈은 항상 최상위
    if(parentId){ const par=project.pages.find(x=>x.id===parentId); if(par && par.pageType==='main') return false; } // 메인홈 하위 불가
    const newDepth = parentId ? depthOf(parentId)+1 : 0;
    return newDepth + subtreeHeight(dragPageId) <= MAX_DEPTH;
  }
  function clearDnd(){ document.querySelectorAll('.prow2').forEach(x=>x.classList.remove('dbefore','dafter','din')); document.getElementById('rlist').classList.remove('droproot'); }

  // 레일 상단 프로젝트명 인라인 수정
  function editProjectName(bEl){
    if(!project || bEl.querySelector('input')) return;
    const cur=project.name; const inp=el('input','rinp'); inp.value=cur; inp.maxLength=50;
    bEl.textContent=''; bEl.append(inp); inp.focus(); inp.select();
    let done=false;
    const finish=(commit)=>{ if(done)return; done=true; const v=inp.value.trim();
      if(commit && v && v!==cur){ project.name=v; upsertProject(project); }
      renderRail();
    };
    inp.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); finish(true); } else if(e.key==='Escape'){ finish(false); } };
    inp.onblur=()=>finish(true);
  }

  function renderRail(){
    if(!project || project.kind!=='multi') return;
    document.getElementById('rail').style.display='flex';
    const rn=document.getElementById('rname'); rn.textContent=project.name; rn.title='클릭해서 이름 수정';
    rn.onclick=()=>editProjectName(rn);
    const rl=document.getElementById('rlist'); rl.innerHTML='';

    const rowOf=(pg,depth)=>{
      const r=el('div','prow2'+(pg.id===(pageRef&&pageRef.id)?' on':''),
        `<span class="dh" title="${tL('드래그로 이동')}">⠿</span><span class="pt">${pg.name}</span><span class="ren" title="${tL('이름 변경')}">✎</span><span class="x" title="${tL('삭제')}">✕</span>`);
      r.style.paddingLeft=(8+depth*15)+'px';
      r.draggable=true; r.dataset.id=pg.id;
      r.querySelector('.pt').onclick=()=>{ persist(); storeFlush().then(()=>{ location.href='?p='+project.id+'&page='+pg.id; }); };
      r.querySelector('.ren').onclick=(e)=>{ e.stopPropagation(); startRename(pg,r); };
      r.querySelector('.x').onclick=(e)=>{ e.stopPropagation();
        if(project.pages.length<=1){ uiAlert(tL('마지막 페이지는 삭제할 수 없어요.')); return; }
        const d=countDesc(pg.id);
        uiConfirm('"'+pg.name+'"'+(d?' (+'+d+')':'')+' · '+tL('삭제하면 되돌릴 수 없어요.'),{title:tL('페이지 삭제'),okText:tL('삭제'),danger:true}).then(ok=>{
          if(!ok) return;
          const wasCur = pageRef && (pg.id===pageRef.id || project.pages.some(x=>x.id===pageRef.id && belongs(pageRef.id,pg.id)));
          deletePage(project.id,pg.id);
          project=getProject(project.id);
          if(wasCur){ storeFlush().then(()=>{ location.href='?p='+project.id+'&page='+project.pages[0].id; }); }
          else { renderRail(); render(); }
        });
      };

      r.addEventListener('dragstart',(e)=>{ dragId=pg.id; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',pg.id); setTimeout(()=>r.classList.add('dragging'),0); });
      r.addEventListener('dragend',()=>{ r.classList.remove('dragging'); dragId=null; clearDnd(); });
      r.addEventListener('dragover',(e)=>{ e.preventDefault(); e.stopPropagation(); if(!dragId||dragId===pg.id) return;
        clearDnd();
        const rect=r.getBoundingClientRect(); const y=(e.clientY-rect.top)/rect.height;
        // 자식으로 넣기 가능? 뎁스 제한 + 메인홈은 부모 불가 + 드래그 서브트리 높이 고려
        const insideDepthOk = (depth+1 + subtreeHeight(dragId)) <= MAX_DEPTH;
        const canInside = insideDepthOk && pg.pageType!=='main';
        const zone = canInside ? (y<0.28?'before':y>0.72?'after':'inside') : (y<0.5?'before':'after');
        r.classList.add(zone==='before'?'dbefore':zone==='after'?'dafter':'din'); r.dataset.zone=zone;
      });
      r.addEventListener('drop',(e)=>{ e.preventDefault(); e.stopPropagation(); const zone=r.dataset.zone||'after'; clearDnd();
        if(!dragId||dragId===pg.id) return;
        let parentId,index;
        if(zone==='inside'){ parentId=pg.id; index=null; }
        else { parentId=pg.parentId||null; const sibs=project.pages.filter(x=>(x.parentId||null)===parentId && x.id!==dragId); const pos=sibs.findIndex(x=>x.id===pg.id); index = zone==='before'?pos:pos+1; }
        if(!canDrop(dragId, parentId)) return;
        persist(); movePage(project.id,dragId,parentId,index); project=getProject(project.id); renderRail(); render();
      });
      return r;
    };
    // pageRef가 pg의 자손인지
    function belongs(childId,ancestorId){ let cur=project.pages.find(x=>x.id===childId); const seen=new Set(); while(cur&&cur.parentId){ if(cur.parentId===ancestorId)return true; if(seen.has(cur.id))break; seen.add(cur.id); cur=project.pages.find(x=>x.id===cur.parentId); } return false; }

    const walk=(nodes,depth)=>{ nodes.forEach(n=>{ rl.append(rowOf(n,depth)); if(n.children.length) walk(n.children,depth+1); }); };
    walk(pageTree(project.pages),0);

    // 루트 빈 영역에 드롭 = 최상위 맨 끝으로
    rl.ondragover=(e)=>{ if(dragId){ e.preventDefault(); rl.classList.add('droproot'); } };
    rl.ondragleave=(e)=>{ if(e.target===rl) rl.classList.remove('droproot'); };
    rl.ondrop=(e)=>{ e.preventDefault(); clearDnd(); if(!dragId||!canDrop(dragId,null)) return; persist(); movePage(project.id,dragId,null,null); project=getProject(project.id); renderRail(); render(); };

    document.getElementById('addPage').onclick=(e)=>{ e.stopPropagation(); persist(); const pg=addPage(project.id,'features',null,'새 페이지'); storeFlush().then(()=>{ location.href='?p='+project.id+'&page='+pg.id; }); };
  }

  // 페이지 이름 인라인 입력 (추가) — 타입 선택 없이 이름부터. 추가 페이지 기본 타입=features
  function depthOf(id){ let d=0, cur=project.pages.find(x=>x.id===id); const seen=new Set(); while(cur&&cur.parentId){ d++; if(seen.has(cur.id))break; seen.add(cur.id); cur=project.pages.find(x=>x.id===cur.parentId); } return d; }
  function startNameEntry(parentId, afterRow){
    document.querySelectorAll('.rinp').forEach(x=>x.closest('.prow2')?.remove()); // 기존 입력 정리
    const depth = parentId!=null ? depthOf(parentId)+1 : 0;
    const row=el('div','prow2'); row.style.paddingLeft=(8+depth*15)+'px';
    row.innerHTML='<input class="rinp" maxlength="40" placeholder="페이지 이름 → Enter">';
    if(afterRow) afterRow.after(row); else document.getElementById('rlist').append(row);
    const inp=row.querySelector('.rinp'); inp.focus();
    let done=false;
    const finish=(commit)=>{ if(done) return; done=true; const v=inp.value.trim();
      if(commit && v){ persist(); const pg=addPage(project.id,'features',parentId,v); storeFlush().then(()=>{ location.href='?p='+project.id+'&page='+pg.id; }); }
      else row.remove();
    };
    inp.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); finish(true); } else if(e.key==='Escape'){ finish(false); } };
    inp.onblur=()=>finish(true);
  }
  // 페이지 이름 인라인 수정
  function startRename(pg,row){
    const span=row.querySelector('.pt'); if(!span) return;
    const inp=el('input','rinp'); inp.value=pg.name; inp.maxLength=40;
    span.replaceWith(inp); inp.focus(); inp.select();
    row.draggable=false;
    let done=false;
    const finish=(commit)=>{ if(done) return; done=true;
      const v=inp.value.trim();
      if(commit && v && v!==pg.name){ renamePage(project.id,pg.id,v); project=getProject(project.id); if(pageRef&&pageRef.id===pg.id) pageRef=project.pages.find(x=>x.id===pg.id); render(); }
      renderRail();
    };
    inp.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); finish(true); } else if(e.key==='Escape'){ finish(false); } };
    inp.onblur=()=>finish(true);
  }

  /* ---- init (저장소 준비 후) ---- */
  storeReady().then(()=>{
  project = projectId ? getProject(projectId) : null;
  pageRef = project ? (project.pages.find(pg => pg.id === pageId) || project.pages[0]) : null;
  renderRail();
  if(project && pageRef){
    pageType = pageRef.pageType || 'main'; volume = pageRef.volume || 'heavy';
    data = structuredClone(pageRef.data || EMPTY);
    pack = (project.stylePack==='ppt' && typeof PPT_STYLE!=='undefined') ? PPT_STYLE
         : (project.stylePack==='edm') ? {id:'edm', name:'eDM'}
         : (project.stylePack==='aglass' && typeof AETHER_STYLE!=='undefined') ? AETHER_STYLE
         : (project.stylePack==='krds' && typeof KRDS_STYLE!=='undefined') ? KRDS_STYLE
         : (project.stylePack==='midas' && typeof MIDAS_STYLE!=='undefined') ? MIDAS_STYLE
         : (DARK_PACKS.find(x=>x.id===project.stylePack) || DARK_PACKS[0]);
    motion = project.motion || 'subtle';
    if(pageRef.chat && pageRef.chat.log && pageRef.chat.log.length){
      // 저장된 대화 복원 → 나갔다 와도 대화 살아있음
      chatLog = pageRef.chat.log.slice(); idx = pageRef.chat.idx||0; generated = !!pageRef.chat.generated;
      chatLog.forEach(m => m.r==='bot' ? addBot(m.t) : addMe(m.t));
      const step = STEPS[idx] || 'done';
      if(generated || step==='done'){ generated=true; mountWidget('done'); }
      else mountWidget(step);
      render(); scroll();
    } else if(curMode().editOnly){
      // 편집전용(이메일/PPT): 생성 플로우 없이 기존 구성 그대로 편집
      generated=true; idx=STEPS.indexOf('done'); botBubble(`${project.name} — ${tL('편집 중')}`); mountWidget('done'); render();
    } else {
      const hasContent = !!((data.features && data.features.length) || (data.stats && data.stats.length) || data.bannerText); // 페이지 고유 콘텐츠 기준(공유 시드 제외)
      if(hasContent){ generated=true; idx=STEPS.indexOf('done'); botBubble(`📂 ${project.name} · ${pageRef.name} — ${tL('편집 중')}`); mountWidget('done'); }
      else if(project && project.kind==='multi' && (pageRef.pageType==='main' || (project.pages[0]&&project.pages[0].id===pageRef.id))){
        pageType='main'; idx=STEPS.indexOf('mainSections'); botBubble(PROMPT.mainSections); mountWidget('mainSections'); } // 다중=메인홈부터 섹션 선택
      else { idx=STEPS.indexOf('pageType'); botBubble(PROMPT.pageType); mountWidget('pageType'); } // 페이지 타입부터(템플릿·섹션 결정)
      render();
    }
  } else {
    botBubble(PROMPT.kind); mountWidget('kind'); render();
  }

  // 고정 포맷(PPT 16:9 · eDM 760px): 디바이스 토글 숨김 + PC 기준 고정
  if(curMode().device==='fixed'){ const vp=document.getElementById('vpseg'); if(vp) vp.style.display='none'; setDevice('desktop'); }

  // 템플릿에서 시작 → 편집모드 자동 진입
  if(window.I18N) I18N.apply(document);   // 정적 마크업(data-i18n) 로컬라이징
  // eDM = 재생성 불가·편집전용: 재생성 UI 숨김 + 스타일 배지 잠금 + 편집모드 자동 진입
  const _isEdm = curMode().editOnly;
  if(_isEdm){
    generated=true;
    const rs=document.getElementById('reset'); if(rs) rs.style.display='none';
    badge.style.cursor='default';
    // eDM=편집전용 → 대화 패널은 그대로 유지(생성 위젯 없이 편집 안내만). 자동 편집모드.
    setTimeout(()=>{ const b=document.getElementById('editBtn'); if(b && !editMode) b.click(); }, 150);
    // PPT: 내용수정 채팅(AI 가능 시) + 통합 되돌리기 버튼 + 진입 순차 등장
    if(curMode().slides){ initPptChat(); const hb=document.getElementById('histBtn'); if(hb) hb.onclick=undoAll; syncUndoUI(); if(params.get('edit')) _pptRevealPending=true; }
  } else if(params.get('edit') && generated){ setTimeout(()=>{ const b=document.getElementById('editBtn'); if(b && !editMode) b.click(); }, 150); }

  // PPT: 내보내기 = 단일 버튼 + 형식 모달(PPTX/PDF/HTML) — 젠스파크식
  if(curMode().exportFmt.indexOf('pptx')>=0){
    ['pptxBtn','expBtn','dl'].forEach(id=>{ const b=document.getElementById(id); if(b) b.style.display='none'; });
    const xb=document.getElementById('exportBtn'), modal=document.getElementById('expModal');
    xb.style.display='';
    xb.onclick=()=>{ modal.hidden=false; };
    document.getElementById('expmClose').onclick=()=>{ modal.hidden=true; };
    modal.addEventListener('click',(e)=>{ if(e.target===modal) modal.hidden=true; });
    async function doPptx(btn){
      if(typeof exportPptx!=='function'){ await uiAlert(tL('내보내기 모듈을 불러오지 못했어요.')); return; }
      const orig=btn.innerHTML; btn.disabled=true;
      try{ await exportPptx(frame.contentDocument, (i,n)=>{ btn.textContent=i+'/'+n; }); }
      catch(e){ console.error('[pptx]',e); await uiAlert(tL('PPTX 내보내기에 실패했어요.')+' '+(e&&e.message||'')); }
      finally{ btn.disabled=false; btn.innerHTML=orig; }
    }
    function doPdf(){
      // 장별 페이지 인쇄 문서 → 숨은 iframe print (브라우저의 'PDF로 저장')
      let html=renderPptDeck(data);
      html=html.replace('</head>','<style>@page{size:13.333in 7.5in;margin:0}html,body{background:#fff}.ppt-stack{display:block;padding:0;gap:0}.ppt-stack>.slide{margin:0;box-shadow:none;page-break-after:always;break-inside:avoid}</style></head>');
      const f=document.createElement('iframe'); f.style.cssText='position:fixed;left:-99999px;width:1280px;height:720px;border:0';
      f.srcdoc=html; document.body.append(f);
      f.onload=()=>{ setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} setTimeout(()=>f.remove(),60000); },400); };
    }
    function doHtml(){ const b=new Blob([pageHtml()],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=(project&&project.name||'deck')+'.html'; a.click(); URL.revokeObjectURL(a.href); }
    modal.querySelectorAll('[data-x]').forEach(b=>{ b.onclick=async()=>{
      const x=b.getAttribute('data-x');
      if(x==='pptx'){ await doPptx(b); modal.hidden=true; }
      else if(x==='pdf'){ modal.hidden=true; doPdf(); }
      else { modal.hidden=true; doHtml(); }
    };});
  }
  });
</script>
</body>
</html>
