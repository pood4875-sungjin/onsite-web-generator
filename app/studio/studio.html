          unitsOf(si).forEach(u=>{ const q=u.getBoundingClientRect(); u.classList.toggle('u-mq', q.left<rr&&q.right>l&&q.top<bb&&q.bottom>t); }); };
        const up=(ev)=>{ doc.removeEventListener('pointermove',mv); doc.removeEventListener('pointerup',up);
          unitsOf(si).forEach(u=>u.classList.remove('u-mq'));
          if(!moved){ deselectAll(); return; }
          const l=Math.min(sx,ev.clientX), t=Math.min(sy,ev.clientY), rr=Math.max(sx,ev.clientX), bb=Math.max(sy,ev.clientY);
          box.remove();
          // 카드(c키)는 마퀴가 카드를 통째로 감쌌을 때만 — 카드 안쪽만 긁으면 내부 텍스트만 잡히게
          const hit=[]; unitsOf(si).forEach(u=>{ const q=u.getBoundingClientRect(); const k=u.getAttribute('data-mvkey');
            const inter=q.left<rr&&q.right>l&&q.top<bb&&q.bottom>t;
            const contained=q.left>=l-4&&q.right<=rr+4&&q.top>=t-4&&q.bottom<=bb+4;
            if(k&&k.charAt(0)==='c' ? contained : inter) hit.push(k); });
          if(!hit.length){ deselectAll(); return; }
          _sel.clear(); _selSi=si; _sel=new Set(dropNestedKeys(si,[...expandGroup(si,hit)])); applyCss(); showTb();
        };
        doc.addEventListener('pointermove',mv); doc.addEventListener('pointerup',up);
      }); });

    // 각 유닛: 클릭선택 + 영역 드래그 이동 + (텍스트)더블클릭 편집
    doc.querySelectorAll('[data-mvkey]').forEach(blk=>{
      if(blk.__uw) return; blk.__uw=1;
      if(W.getComputedStyle(blk).position==='static') blk.style.position='relative';
      blk.addEventListener('pointerdown',(e)=>{
        if(!editMode) return;
        if(e.target.closest('.imgrs')||e.target.closest('.utb')) return;
        if((e.target.closest&&e.target.closest('[data-mvkey]'))!==blk) return;   // 가장 안쪽 유닛만 — 카드가 자식 클릭을 가로채 선택을 덮어쓰지 않게
        if(blk.getAttribute('contenteditable')==='true') return;   // 텍스트 편집 중엔 이동 안 함
        const si=slideIndexOf(blk), key=blk.getAttribute('data-mvkey'); if(si<0) return;
        if(!(_selSi===si && _sel.has(key))) selectUnit(si,key,e.shiftKey||e.metaKey);
        // 드래그 준비 — 선택된 모든 유닛 함께 이동
        const before=JSON.stringify(data.slides||[]); const s=data.slides[si]; const start={};
        // 이동 대상에서 "선택된 카드 안의 자식"은 제외 — 카드가 움직이면 같이 오므로 2배 이동 방지
        const moveKeys=new Set(dropNestedKeys(si,[..._sel]));
        [...moveKeys].forEach(k=>{ start[k]=((s._pos||{})[k]||[0,0]).slice(); });
        const units=unitsOf(si), sx=e.clientX, sy=e.clientY; let dx=0,dy=0,moved=false;
        const mv=(ev)=>{ dx=ev.clientX-sx; dy=ev.clientY-sy; if(!moved&&Math.abs(dx)<3&&Math.abs(dy)<3) return; moved=true; hideTb();
          units.forEach(u=>{ const k=u.getAttribute('data-mvkey'); if(moveKeys.has(k)){ const b=start[k]||[0,0]; u.style.transform='translate('+(b[0]+dx)+'px,'+(b[1]+dy)+'px)'; } }); };
        const up=()=>{ doc.removeEventListener('pointermove',mv); doc.removeEventListener('pointerup',up);
          if(moved){ pushUndo(before); s._pos=s._pos||{}; [...moveKeys].forEach(k=>{ const b=start[k]||[0,0]; s._pos[k]=[Math.round(b[0]+dx),Math.round(b[1]+dy)]; }); persist(); }
          showTb(); };
        doc.addEventListener('pointermove',mv); doc.addEventListener('pointerup',up);
      });
      // 이미지 자리는 호버만 해도 선택+툴바 표시 (다른 선택이 없을 때만) — 마우스가 떠나면 잠시 후 해제
      if(blk.classList.contains('p-media') && blk.getAttribute('data-img')){
        blk.addEventListener('pointerenter',()=>{ if(!editMode) return; const key=blk.getAttribute('data-mvkey');
          if(_sel.size && !(_sel.size===1 && _sel.has(key) && window.__pmHovSel)) return;
          clearTimeout(window.__pmHovT); const si=slideIndexOf(blk); if(si<0) return;
          window.__pmHovSel=1; selectUnit(si,key,false); });
        blk.addEventListener('pointerleave',()=>{ if(!window.__pmHovSel) return;
          window.__pmHovT=setTimeout(()=>{ if(window.__pmHovSel){ window.__pmHovSel=0; window.__pptDeselect&&window.__pptDeselect(); } },350); });
        blk.addEventListener('pointerdown',()=>{ window.__pmHovSel=0; });   // 직접 클릭하면 일반 선택으로 승격
      }
      if(blk.hasAttribute('data-edit')){
        blk.addEventListener('dblclick',(e)=>{ if(!editMode) return; e.stopPropagation(); hideTb();
          blk.setAttribute('contenteditable','true'); blk.focus();
          try{ const r=doc.createRange(); r.selectNodeContents(blk); const s=W.getSelection(); s.removeAllRanges(); s.addRange(r); }catch(_){} });
      }
    });

    // 이미지: 가로(E)·세로(S)·양방향(SE) 리사이즈 핸들 (교체는 툴바 '교체' 버튼)
    doc.querySelectorAll('.s-imgwrap').forEach(wrap=>{
      const im=wrap.querySelector('img'); if(!im || wrap.__imgw) return; wrap.__imgw=1;
      ['e','s','se'].forEach(dir=>{ const h=doc.createElement('span'); h.className='imgrs '+dir;
        h.addEventListener('pointerdown',(e)=>{ e.preventDefault(); e.stopPropagation(); const si=slideIndexOf(wrap); if(si<0)return;
          // 좌상단 고정 — 초기 right 앵커를 left로 전환해 우하단 방향으로만 늘고 줄게 (offsetLeft = transform 제외 레이아웃 위치)
          wrap.style.left=wrap.offsetLeft+'px'; wrap.style.top=wrap.offsetTop+'px'; wrap.style.right='auto';
          const before=JSON.stringify(data.slides||[]); const r=im.getBoundingClientRect(); const w0=r.width,h0=r.height,sx=e.clientX,sy=e.clientY; let w=w0,ht=h0;
          const mv=(ev)=>{ if(dir!=='s'){ w=Math.max(80,Math.min(1160,w0+(ev.clientX-sx))); im.style.width=w+'px'; im.style.maxWidth='none'; } if(dir!=='e'){ ht=Math.max(60,Math.min(680,h0+(ev.clientY-sy))); im.style.height=ht+'px'; im.style.maxHeight='none'; } };
          const up=()=>{ doc.removeEventListener('pointermove',mv); doc.removeEventListener('pointerup',up);
            if(Math.abs(w-w0)<3&&Math.abs(ht-h0)<3) return;
            pushUndo(before); const e2=imgEntry(wrap,si); if(!e2) return;
            const ni=Object.assign({},e2.s.imgs[e2.k]); if(dir!=='s')ni.w=Math.round(w); if(dir!=='e')ni.h=Math.round(ht);
            ni.l=Math.round(wrap.offsetLeft); ni.t=Math.round(wrap.offsetTop);   // 좌상단 앵커 영구화 — 재렌더에도 위치 유지
            e2.s.imgs[e2.k]=ni; delete e2.s.img; persist(); };
          doc.addEventListener('pointermove',mv); doc.addEventListener('pointerup',up); });
        wrap.appendChild(h); });
    });
  }
  function initPptChat(){
    if(!(window.LLM && LLM.aiAvailable())) return;   // AI 없으면 컴포저 미노출(직접 편집만)
    const box=document.getElementById('pptChat'), inp=document.getElementById('pptcInp');
    const send=document.getElementById('pptcSend'), undoB=document.getElementById('pptcUndo');
    box.style.display='';
    // 온보딩(범위 계약) — 화면에만, 로그 저장 안 함(재방문마다 1회)
    addBot(tL('✏️ 말만 하면 고쳐드려요 — 문구·수치·톤은 물론, 장표 추가·분할·삭제·순서까지. 🎨 디자인(색·글꼴·배치)만 스타일 팩이 자동 관리해요. 급하면 위 슬라이드 목록에서 드래그로도 정리돼요.'));
    const chips=[ '더 간결하게 줄여줘', '핵심 수치를 강조해줘', '마지막 장 앞에 Q&A 장 추가해줘', '표지 문구를 더 임팩트 있게' ];
    const cbox=document.getElementById('pptcChips');
    chips.forEach(c=>{ const b=el('button','pptc-chip',tL(c)); b.onclick=()=>{ inp.value=tL(c); doSend(); }; cbox.append(b); });
    async function doSend(){
      const t=inp.value.trim(); if(!t || send.disabled) return;
      meBubble(t); inp.value=''; send.disabled=true;
      const wk=workingBubble();
      const snap=JSON.stringify(data.slides||[]);
      const t0=Date.now();
      try{
        const res=await LLM.editDeck(data.slides||[], t, project&&project.stylePack);   // 팩별 스키마(pitch/ppt)
        LLM.recordDur('edit', Date.now()-t0);   // 실측 기록 → 다음부터 '보통 N초' 정확해짐
        wk.done();
        if(res.slides){
          pushUndo(snap);
          data._userTouched=true;   // 채팅 수정 = 사용자 의지 — 표지 잠금보다 우선
          // 영구 스냅샷(1개) — 새로고침 뒤에도 ↺가 마지막 AI 수정 직전으로 복구 가능
          if(pageRef) pageRef.prevSlides = JSON.parse(snap);
          // 변경 감지: 그대로/이동만 된 장은 제외, 내용 바뀐 장='수정', 완전 새 장='NEW'
          const oldArr=JSON.parse(snap);
          const oldSet=new Set(oldArr.map(s=>JSON.stringify(s)));
          const oldTitles=new Set(oldArr.map(s=>(s.type||'')+'|'+(s.title||'')));
          _pptMarks={};
          res.slides.forEach((s,i)=>{ const j=JSON.stringify(s);
            if(oldSet.has(j)) return;                                   // 동일 내용(제자리든 이동이든)
            _pptMarks[i]= oldTitles.has((s.type||'')+'|'+(s.title||'')) ? 'mod' : 'new';
          });
          data.slides=res.slides;
          persist(); render(); refreshPptPanel();
          const idxs=Object.keys(_pptMarks).map(Number);
          flashSlides(idxs); idxs.length&&scrollToSlide(idxs[0]);
          syncUndoUI();
          botBubble((res.message||tL('수정했어요.'))+' '+tL('(↺로 되돌릴 수 있어요)'));
        } else {
          botBubble(res.message||tL('요청을 이해하지 못했어요. 슬라이드 내용 수정을 말씀해주세요.'));
        }
      }catch(e){ wk.done(); botBubble(tL('수정에 실패했어요. 잠시 후 다시 시도해주세요.')+' ('+(e&&e.message||'')+')'); }
      finally{ send.disabled=false; scroll(); }
    }
    send.onclick=doSend;
    // 조합 중(한글/일문/중문) Enter는 글자 확정 — 가드 없으면 미완성 글자만 전송된다
    inp.onkeydown=(e)=>{ if(e.isComposing || e.keyCode===229) return; if(e.key==='Enter'){ e.preventDefault(); doSend(); } };
    undoB.onclick=()=>{ if(!_undoStack.length) return; undoAll(); botBubble(tL('마지막 수정을 되돌렸어요.')); scroll(); };
  }
  function buildPptPanel(){
    const TL = slidePack().label; const TYPES = slidePack().types;
    const box=el('div','pptpanel');
    const head=el('div','pptp-head'); head.append(el('b','',tL('슬라이드')));
    const cnt=el('span','pptp-cnt', (data.slides||[]).length+''); head.append(cnt);
    const CHEV='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
    const foldLabel=()=>`<span>${_pptFolded?tL('펼치기'):tL('접기')}</span><i class="chev${_pptFolded?'':' up'}">${CHEV}</i>`;
    const fold=el('button','pptp-fold', foldLabel());
    fold.onclick=(e)=>{ e.stopPropagation(); _pptFolded=!_pptFolded; box.classList.toggle('closed',_pptFolded); fold.innerHTML=foldLabel(); };
    head.append(fold); box.append(head);
    if(_pptFolded) box.classList.add('closed');
    const list=el('div','pptp-list');
    let dragIdx=null;
    const clearSDnd=()=>list.querySelectorAll('.pptp-row').forEach(x=>x.classList.remove('dbefore','dafter'));
    (data.slides||[]).forEach((s,i)=>{
      const row=el('div','pptp-row');
      row.append(el('span','pptp-idx', String(i+1).padStart(2,'0')));
      // 행 제목 = 슬라이드 실제 제목(내용 기반). 없으면 타입 라벨 폴백. (textContent — AI/사용자 문자열 이스케이프)
      const nm=el('span','pptp-name'); const _t=(s.title||'').replace(/\n/g,' ').trim();
      nm.textContent=_t||(TL[s.type]||s.type||'슬라이드'); nm.title=_t; row.append(nm);
      if(_pptMarks[i]) row.append(el('span','pptp-mark'+(_pptMarks[i]==='new'?' new':''), _pptMarks[i]==='new'?'NEW':tL('수정')));
      // 드래그로 순서 변경 (레일과 동일 UX — 위/아래 절반에 인디케이터)
      row.draggable=true;
      row.addEventListener('dragstart',(e)=>{ dragIdx=i; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(i)); setTimeout(()=>row.classList.add('dragging'),0); });
      row.addEventListener('dragend',()=>{ row.classList.remove('dragging'); dragIdx=null; clearSDnd(); });
      row.addEventListener('dragover',(e)=>{ e.preventDefault(); if(dragIdx==null||dragIdx===i) return; clearSDnd();
        const rect=row.getBoundingClientRect(); const before=(e.clientY-rect.top)/rect.height<0.5;
        row.classList.add(before?'dbefore':'dafter'); row.dataset.szone=before?'before':'after'; });
      row.addEventListener('drop',(e)=>{ e.preventDefault(); const zone=row.dataset.szone||'after'; clearSDnd();
        if(dragIdx==null||dragIdx===i) return;
        let to = zone==='before'? i : i+1; if(dragIdx<to) to--;   // 원소 제거 후 인덱스 보정
        if(to===dragIdx) return;
        const from=dragIdx; pptMutate(a=>{ const t=a.splice(from,1)[0]; a.splice(to,0,t); });
      });
      const ops=el('div','pptp-ops');
      const up=el('button','pptp-op'+(i===0?' off':''),'↑'); up.title=tL('위로'); up.onclick=(e)=>{ e.stopPropagation(); if(i===0)return; pptMutate(a=>{ const t=a[i]; a[i]=a[i-1]; a[i-1]=t; }); };
      const dn=el('button','pptp-op'+(i===(data.slides.length-1)?' off':''),'↓'); dn.title=tL('아래로'); dn.onclick=(e)=>{ e.stopPropagation(); if(i===data.slides.length-1)return; pptMutate(a=>{ const t=a[i]; a[i]=a[i+1]; a[i+1]=t; }); };
      // 복제 — 이 장을 복사해 바로 뒤에 붙여넣기 (위치는 드래그로 조정)
      const cp=el('button','pptp-op','⧉'); cp.title=tL('복제'); cp.onclick=(e)=>{ e.stopPropagation(); pptMutate(a=>{ a.splice(i+1,0,JSON.parse(JSON.stringify(a[i]))); }); setTimeout(()=>scrollToSlide(i+1),120); };
      const del=el('button','pptp-op del','✕'); del.title=tL('삭제'); del.onclick=(e)=>{ e.stopPropagation(); if((data.slides||[]).length<=1){ uiAlert(tL('마지막 슬라이드는 삭제할 수 없어요.')); return; } uiConfirm(tL('이 슬라이드를 삭제할까요?'),{title:tL('슬라이드 삭제'),okText:tL('삭제'),danger:true}).then(ok=>{ if(ok) pptMutate(a=>a.splice(i,1)); }); };
      ops.append(up,dn,cp,del); row.append(ops);
      row.onclick=()=>scrollToSlide(i);
      list.append(row);
    });
    box.append(list);
    // 추가 버튼 + 타입 메뉴
    const addWrap=el('div','pptp-add');
    const addBtn=el('button','pptp-addbtn','+ '+tL('슬라이드 추가'));
    const menu=el('div','pptp-menu');
    TYPES.forEach(t=>{ const b=el('button','pptp-mi',t.label); b.onclick=()=>{ menu.classList.remove('open'); pptMutate(a=>a.push(slidePack().make(t.type))); setTimeout(()=>scrollToSlide((data.slides||[]).length-1),120); }; menu.append(b); });
    addBtn.onclick=(e)=>{ e.stopPropagation(); menu.classList.toggle('open'); };
    document.addEventListener('click',(e)=>{ if(!addWrap.contains(e.target)) menu.classList.remove('open'); });
    addWrap.append(addBtn,menu); box.append(addWrap);
    return box;
  }

  function listWidget(key, fields, summarize, twoCol){
    const wrap=el('div','card');
    if(!data[key].length) data[key]=[0,1,2].map(()=>Object.fromEntries(fields.map(([k])=>[k,''])));
    data[key].forEach((it,i)=>{
      const item=el('div','item');
      if(twoCol){ const r=el('div','row2'); fields.forEach(([k,ph],j)=>{ const inp=el('input','inp'); if(j===0)inp.style.flex='0 0 35%'; inp.placeholder=tL(ph); inp.value=it[k]; inp.oninput=()=>{it[k]=inp.value;render();}; r.append(inp); }); item.append(r); }
      else { const hd=el('div','hd'); hd.append(el('span','num',i+1)); const i0=el('input','inp'); i0.placeholder=tL(fields[0][1]); i0.value=it[fields[0][0]]; i0.oninput=()=>{it[fields[0][0]]=i0.value;render();}; hd.append(i0); item.append(hd);
        const i1=el('input','inp'); i1.placeholder=tL(fields[1][1]); i1.value=it[fields[1][0]]; i1.oninput=()=>{it[fields[1][0]]=i1.value;render();}; item.append(i1); }
      wrap.append(item);
    });
    wrap.append(nextBtn(tL('다음 →'), ()=>advance(summarize(data[key]))));

  }

  /* ---- 미리보기: 생성된 페이지를 새 창에서 확인 (편집 UI 없는 실제 화면) ----
     다중 페이지면 모든 페이지를 한 문서에 담고 GNB 메뉴로 서로 이동 가능(정적). */
  function previewHtml(){
    persist();
    const pages = (project && project.kind==='multi' && project.pages.length) ? project.pages : [ {id:'single', data, pageType, volume} ];
    // 단일 프로젝트는 가상 id('single')라 pageRef.id와 불일치 → 첫 페이지 기준(안 그러면 전부 hidden)
    const cur = (project && project.kind==='multi' && pageRef && pageRef.id) ? pageRef.id : pages[0].id;

    const swap='<scr'+'ipt>document.addEventListener("click",function(e){var n=e.target.closest&&e.target.closest("[data-nav-page]");if(n){e.preventDefault();var t=document.querySelector(\'[data-ppage="\'+n.getAttribute("data-nav-page")+\'"]\');if(t){document.querySelectorAll("[data-ppage]").forEach(function(s){s.hidden=true});t.hidden=false;window.scrollTo(0,0);}return;}var a=e.target.closest&&e.target.closest(\'a[href^="#"]\');if(a)e.preventDefault();},true);document.addEventListener("submit",function(e){e.preventDefault()},true);</scr'+'ipt>';
    return '<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(data.productName||'미리보기')+'</title>'+headHTML+'</head><body>'+secs.join('')+swap+linkRuntime(data)+'</body></html>';
  }
  /* 전체화면 오버레이로 미리보기(팝업 미사용 — 차단 무관). PPT는 발표 뷰어(←→ 넘김). */
  const pvFull=document.getElementById('pvFull'), pvfFrame=document.getElementById('pvfFrame');
  function openPreview(){
    persist();
    // 발표 뷰어 — PPT 계열 팩(ppt·pitch)은 한 장씩 넘기는 프레젠테이션 뷰로
    const viewerFn = pack && (pack.id==='machine' ? window.renderMachineViewer : pack.id==='sfmi' ? window.renderSfmiViewer : pack.id==='pastel' ? window.renderPastelViewer : pack.id==='rams' ? window.renderRamsViewer : pack.id==='naver' ? window.renderNaverViewer : pack.id==='honors' ? window.renderHonorsViewer : pack.id==='pitch' ? window.renderPitchViewer : pack.id==='ppt' ? window.renderPptViewer : null);
    const isPptPack = typeof viewerFn==='function';
    document.getElementById('pvfTitle').textContent = isPptPack ? tL('발표 미리보기') : tL('미리보기');   // 조작 힌트 문구 제거(사용자 요청)
    pvfFrame.srcdoc = isPptPack ? viewerFn(data, {start:_curThumb||0}) : previewHtml();   // 보고 있던 장부터 발표 시작
    pvFull.hidden=false;
    if(isPptPack) setTimeout(()=>{ try{ pvfFrame.contentWindow.focus(); }catch(e){} }, 250);   // 키보드 ←→ 즉시 동작
  }
  function closePreview(){ pvFull.hidden=true; pvfFrame.srcdoc=''; }
  document.getElementById('previewBtn').onclick=async ()=>{
    if(!generated){ await uiAlert(tL('먼저 페이지를 생성해주세요.')); return; }
    openPreview();
  };
  document.getElementById('pvfClose').onclick=closePreview;
  window.addEventListener('keydown',(e)=>{
    if(pvFull.hidden) return;
    if(e.key==='Escape'){ if(pvFull.classList.contains('pfs')){ try{ pvfFrame.contentWindow.postMessage({pptFsKey:1},'*'); }catch(_){} return; } closePreview(); }
    // F 전체화면 — 부모 keydown은 사용자 제스처가 유효하므로 여기서 직접 네이티브 요청(iframe 전체화면).
    // postMessage로 넘기면 제스처 자격이 사라져 거부됨. 네이티브 거부 시에만 뷰어의 유사 전체화면 폴백.
    else if(e.key==='f'||e.key==='F'){
      if(document.fullscreenElement){ if(document.exitFullscreen) document.exitFullscreen(); }
      else{
        const rq=pvfFrame.requestFullscreen||pvfFrame.webkitRequestFullscreen;
        let pr=null; try{ pr=rq&&rq.call(pvfFrame); }catch(_){}
        const fb=()=>{ try{ pvfFrame.contentWindow.postMessage({pptFsKey:1},'*'); }catch(_){} };
        if(pr&&pr.then) pr.then(()=>{},()=>{});
        // 프라미스가 안 끝나는 환경 대비 — 600ms 안에 전체화면 미진입이면 뷰어 유사 전체화면으로
        setTimeout(()=>{ if(!document.fullscreenElement) fb(); },600);
      }
    }
  });
  // 네이티브 전체화면 진입/이탈 시 뷰어에 UI 상태 전달(하단 바 숨김·스케일 재계산)
  document.addEventListener('fullscreenchange',()=>{ if(pvFull.hidden) return;
    try{ pvfFrame.contentWindow.postMessage({pptFsUi:document.fullscreenElement?1:0},'*'); }catch(_){} });
  // 유사 전체화면(pfs) — 뷰어가 네이티브 전체화면을 거부당했을 때: 상단바 숨겨 꽉 채움
  window.addEventListener('message',(e)=>{ if(e.data && 'pptViewerPseudoFs' in e.data) pvFull.classList.toggle('pfs', !!e.data.pptViewerPseudoFs); });
  window.addEventListener('message',(e)=>{ if(e.data && e.data.pptViewerClose) closePreview(); });

  /* ---- 저장: 현재 페이지를 프로젝트에 저장 ---- */
  function saveCurrent(){
    persist();
    const b=document.getElementById('save'); const o=b.textContent;
    b.textContent = project ? tL('저장됨 ✓') : tL('메모리 저장'); setTimeout(()=>b.textContent=o,1200);
  }
  document.getElementById('save').onclick=saveCurrent;
  document.getElementById('expBtn').onclick=()=>{
    const snap={ name:data.productName||'page', pageType, volume, motion, pack:pack.id, data };
    const b=new Blob([JSON.stringify(snap,null,2)],{type:'application/json'}); const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=(data.productName||'page')+'.json'; a.click(); URL.revokeObjectURL(a.href);
  };

  /* ---- 좌측 페이지 레일 (다중 프로젝트) ---- */
  // 뎁스: 최상위=0. MAX_DEPTH=1 → 최상위(1뎁스) + 하위 1단계(2뎁스)까지만.
  // 메인홈은 하위를 가질 수 없음(로고/홈). 메뉴는 다음 페이지들부터.
  const MAX_DEPTH=1;
  let dragId=null;

  function countDesc(id){ let n=0; const stack=[id]; while(stack.length){ const cur=stack.pop(); project.pages.forEach(p=>{ if(p.parentId===cur){ n++; stack.push(p.id); } }); } return n; }
  function subtreeHeight(id){ const kids=project.pages.filter(x=>x.parentId===id); return kids.length ? 1+Math.max(...kids.map(k=>subtreeHeight(k.id))) : 0; }
  function depthOf(id){ let d=0, cur=project.pages.find(x=>x.id===id); const seen=new Set(); while(cur&&cur.parentId){ d++; if(seen.has(cur.id))break; seen.add(cur.id); cur=project.pages.find(x=>x.id===cur.parentId); } return d; }
  // 이동 허용 여부: 메인홈은 부모 불가 · 메인홈 자신은 최상위 고정 · 결과 뎁스 제한
  function canDrop(dragPageId, parentId){
    const dragged=project.pages.find(x=>x.id===dragPageId); if(!dragged) return false;
    if(dragged.pageType==='main' && parentId) return false;         // 메인홈은 항상 최상위
    if(parentId){ const par=project.pages.find(x=>x.id===parentId); if(par && par.pageType==='main') return false; } // 메인홈 하위 불가
    const newDepth = parentId ? depthOf(parentId)+1 : 0;
    return newDepth + subtreeHeight(dragPageId) <= MAX_DEPTH;
  }
  function clearDnd(){ document.querySelectorAll('.prow2').forEach(x=>x.classList.remove('dbefore','dafter','din')); document.getElementById('rlist').classList.remove('droproot'); }

  // 레일 상단 프로젝트명 인라인 수정
  function editProjectName(bEl){
    if(!project || bEl.querySelector('input')) return;
    const cur=project.name; const inp=el('input','rinp'); inp.value=cur; inp.maxLength=50;
    bEl.textContent=''; bEl.append(inp); inp.focus(); inp.select();
    let done=false;
    const finish=(commit)=>{ if(done)return; done=true; const v=inp.value.trim();
      if(commit && v && v!==cur){ project.name=v; upsertProject(project); }
      inp.remove();                 // 먼저 떼야 renderBrand의 "수정 중" 가드에 안 걸린다
      renderRail(); renderBrand();
    };
    inp.onkeydown=(e)=>{ if(e.isComposing || e.keyCode===229) return;   // 조합 중 Enter=글자 확정
      if(e.key==='Enter'){ e.preventDefault(); finish(true); } else if(e.key==='Escape'){ finish(false); } };
    inp.onblur=()=>finish(true);
  }

  /* 챗 헤더 홈 아이콘 옆 타이틀 — 랜딩·PPT·eDM(단일 페이지)은 프로젝트명을 여기서 바로 수정.
     웹사이트(multi)는 좌측 레일 상단에 이미 프로젝트명이 있어 중복 → 숨긴다. */
  function renderBrand(){
    const pn=document.getElementById('pname'); if(!pn || pn.querySelector('input')) return;  // 수정 중이면 건드리지 않는다
    if(!project || project.kind==='multi'){ pn.hidden=true; return; }
    pn.hidden=false; pn.textContent=project.name; pn.title=tL('클릭해서 이름 수정');
    pn.onclick=()=>editProjectName(pn);
  }

  function renderRail(){
    if(!project || project.kind!=='multi') return;
    document.getElementById('rail').style.display='flex';
    const rn=document.getElementById('rname'); rn.textContent=project.name; rn.title=tL('클릭해서 이름 수정');
    rn.onclick=()=>editProjectName(rn);
    const rl=document.getElementById('rlist'); rl.innerHTML='';

    const rowOf=(pg,depth)=>{
      const r=el('div','prow2'+(pg.id===(pageRef&&pageRef.id)?' on':''),
        `<span class="dh" title="${tL('드래그로 이동')}">⠿</span><span class="pt">${pg.name}</span><span class="ren" title="${tL('이름 변경')}">✎</span><span class="x" title="${tL('삭제')}">✕</span>`);
      r.style.paddingLeft=(8+depth*15)+'px';
      r.draggable=true; r.dataset.id=pg.id;
      r.querySelector('.pt').onclick=()=>{ persist(); storeFlush().then(()=>{ location.href='?p='+project.id+'&page='+pg.id; }); };
      r.querySelector('.ren').onclick=(e)=>{ e.stopPropagation(); startRename(pg,r); };
      r.querySelector('.x').onclick=(e)=>{ e.stopPropagation();
        if(project.pages.length<=1){ uiAlert(tL('마지막 페이지는 삭제할 수 없어요.')); return; }
        const d=countDesc(pg.id);
        uiConfirm('"'+pg.name+'"'+(d?' (+'+d+')':'')+' · '+tL('삭제하면 되돌릴 수 없어요.'),{title:tL('페이지 삭제'),okText:tL('삭제'),danger:true}).then(ok=>{
          if(!ok) return;
          const wasCur = pageRef && (pg.id===pageRef.id || project.pages.some(x=>x.id===pageRef.id && belongs(pageRef.id,pg.id)));
          deletePage(project.id,pg.id);
          project=getProject(project.id);
          if(wasCur){ storeFlush().then(()=>{ location.href='?p='+project.id+'&page='+project.pages[0].id; }); }
          else { renderRail(); render(); }
        });
      };

      r.addEventListener('dragstart',(e)=>{ dragId=pg.id; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',pg.id); setTimeout(()=>r.classList.add('dragging'),0); });
      r.addEventListener('dragend',()=>{ r.classList.remove('dragging'); dragId=null; clearDnd(); });
      r.addEventListener('dragover',(e)=>{ e.preventDefault(); e.stopPropagation(); if(!dragId||dragId===pg.id) return;
        clearDnd();
        const rect=r.getBoundingClientRect(); const y=(e.clientY-rect.top)/rect.height;
        // 자식으로 넣기 가능? 뎁스 제한 + 메인홈은 부모 불가 + 드래그 서브트리 높이 고려
        const insideDepthOk = (depth+1 + subtreeHeight(dragId)) <= MAX_DEPTH;
        const canInside = insideDepthOk && pg.pageType!=='main';
        const zone = canInside ? (y<0.28?'before':y>0.72?'after':'inside') : (y<0.5?'before':'after');
        r.classList.add(zone==='before'?'dbefore':zone==='after'?'dafter':'din'); r.dataset.zone=zone;
      });
      r.addEventListener('drop',(e)=>{ e.preventDefault(); e.stopPropagation(); const zone=r.dataset.zone||'after'; clearDnd();
        if(!dragId||dragId===pg.id) return;
        let parentId,index;
        if(zone==='inside'){ parentId=pg.id; index=null; }
        else { parentId=pg.parentId||null; const sibs=project.pages.filter(x=>(x.parentId||null)===parentId && x.id!==dragId); const pos=sibs.findIndex(x=>x.id===pg.id); index = zone==='before'?pos:pos+1; }
        if(!canDrop(dragId, parentId)) return;
        persist(); movePage(project.id,dragId,parentId,index); project=getProject(project.id); renderRail(); render();
      });
      return r;
    };
    // pageRef가 pg의 자손인지
    function belongs(childId,ancestorId){ let cur=project.pages.find(x=>x.id===childId); const seen=new Set(); while(cur&&cur.parentId){ if(cur.parentId===ancestorId)return true; if(seen.has(cur.id))break; seen.add(cur.id); cur=project.pages.find(x=>x.id===cur.parentId); } return false; }

    const walk=(nodes,depth)=>{ nodes.forEach(n=>{ rl.append(rowOf(n,depth)); if(n.children.length) walk(n.children,depth+1); }); };
    walk(pageTree(project.pages),0);

    // 루트 빈 영역에 드롭 = 최상위 맨 끝으로
    rl.ondragover=(e)=>{ if(dragId){ e.preventDefault(); rl.classList.add('droproot'); } };
    rl.ondragleave=(e)=>{ if(e.target===rl) rl.classList.remove('droproot'); };
    rl.ondrop=(e)=>{ e.preventDefault(); clearDnd(); if(!dragId||!canDrop(dragId,null)) return; persist(); movePage(project.id,dragId,null,null); project=getProject(project.id); renderRail(); render(); };

    document.getElementById('addPage').onclick=(e)=>{ e.stopPropagation(); persist(); const pg=addPage(project.id,'features',null,'새 페이지'); storeFlush().then(()=>{ location.href='?p='+project.id+'&page='+pg.id; }); };
  }

  // 페이지 이름 인라인 입력 (추가) — 타입 선택 없이 이름부터. 추가 페이지 기본 타입=features
  function depthOf(id){ let d=0, cur=project.pages.find(x=>x.id===id); const seen=new Set(); while(cur&&cur.parentId){ d++; if(seen.has(cur.id))break; seen.add(cur.id); cur=project.pages.find(x=>x.id===cur.parentId); } return d; }
  function startNameEntry(parentId, afterRow){
    document.querySelectorAll('.rinp').forEach(x=>x.closest('.prow2')?.remove()); // 기존 입력 정리
    const depth = parentId!=null ? depthOf(parentId)+1 : 0;
    const row=el('div','prow2'); row.style.paddingLeft=(8+depth*15)+'px';
    row.innerHTML='<input class="rinp" maxlength="40" placeholder="페이지 이름 → Enter">';
    if(afterRow) afterRow.after(row); else document.getElementById('rlist').append(row);
    const inp=row.querySelector('.rinp'); inp.focus();
    let done=false;
    const finish=(commit)=>{ if(done) return; done=true; const v=inp.value.trim();
      if(commit && v){ persist(); const pg=addPage(project.id,'features',parentId,v); storeFlush().then(()=>{ location.href='?p='+project.id+'&page='+pg.id; }); }
      else row.remove();
    };
    inp.onkeydown=(e)=>{ if(e.isComposing || e.keyCode===229) return;   // 조합 중 Enter=글자 확정
      if(e.key==='Enter'){ e.preventDefault(); finish(true); } else if(e.key==='Escape'){ finish(false); } };
    inp.onblur=()=>finish(true);
  }
  // 페이지 이름 인라인 수정
  function startRename(pg,row){
    const span=row.querySelector('.pt'); if(!span) return;
    const inp=el('input','rinp'); inp.value=pg.name; inp.maxLength=40;
    span.replaceWith(inp); inp.focus(); inp.select();
    row.draggable=false;
    let done=false;
    const finish=(commit)=>{ if(done) return; done=true;
      const v=inp.value.trim();
      if(commit && v && v!==pg.name){ renamePage(project.id,pg.id,v); project=getProject(project.id); if(pageRef&&pageRef.id===pg.id) pageRef=project.pages.find(x=>x.id===pg.id); render(); }
      renderRail();
    };
    inp.onkeydown=(e)=>{ if(e.isComposing || e.keyCode===229) return;   // 조합 중 Enter=글자 확정
      if(e.key==='Enter'){ e.preventDefault(); finish(true); } else if(e.key==='Escape'){ finish(false); } };
    inp.onblur=()=>finish(true);
  }

  /* ---- init (저장소 준비 후) ---- */
  storeReady().then(()=>{
  project = projectId ? getProject(projectId) : null;
  pageRef = project ? (project.pages.find(pg => pg.id === pageId) || project.pages[0]) : null;
  renderRail(); renderBrand();
  if(project && pageRef){
    pageType = pageRef.pageType || 'main'; volume = pageRef.volume || 'heavy';
    data = structuredClone(pageRef.data || EMPTY);
    pack = (project.stylePack==='mbm' && typeof MBM_STYLE!=='undefined') ? MBM_STYLE
         : (project.stylePack==='axday' && typeof AXDAY_STYLE!=='undefined') ? AXDAY_STYLE
         : (project.stylePack==='toss' && typeof TOSS_STYLE!=='undefined') ? TOSS_STYLE
         : (project.stylePack==='orbit' && typeof ORBIT_STYLE!=='undefined') ? ORBIT_STYLE
         : (project.stylePack==='saturn' && typeof SATURN_STYLE!=='undefined') ? SATURN_STYLE
         : (project.stylePack==='machine' && typeof MACHINE_STYLE!=='undefined') ? MACHINE_STYLE
         : (project.stylePack==='sfmi' && typeof SFMI_STYLE!=='undefined') ? SFMI_STYLE
         : (project.stylePack==='pastel' && typeof PASTEL_STYLE!=='undefined') ? PASTEL_STYLE
         : (project.stylePack==='rams' && typeof RAMS_STYLE!=='undefined') ? RAMS_STYLE
         : (project.stylePack==='naver' && typeof NAVER_STYLE!=='undefined') ? NAVER_STYLE
         : (project.stylePack==='honors' && typeof HONORS_STYLE!=='undefined') ? HONORS_STYLE
         : (project.stylePack==='pitch' && typeof PITCH_STYLE!=='undefined') ? PITCH_STYLE
         : (project.stylePack==='ppt' && typeof PPT_STYLE!=='undefined') ? PPT_STYLE
         : (project.stylePack==='edm') ? {id:'edm', name:'eDM'}
         : (project.stylePack==='aglass' && typeof AETHER_STYLE!=='undefined') ? AETHER_STYLE
         : (project.stylePack==='krds' && typeof KRDS_STYLE!=='undefined') ? KRDS_STYLE
         : (project.stylePack==='midas' && typeof MIDAS_STYLE!=='undefined') ? MIDAS_STYLE
         : (DARK_PACKS.find(x=>x.id===project.stylePack) || DARK_PACKS[0]);
    motion = project.motion || 'subtle';
    if(pageRef.chat && pageRef.chat.aiDraft && pageRef.chat.aiDraft.length){
      // AI 초안 후속질문 — 초안은 이미 렌더됨(generated). 못 채운 스텝만 이어서 질문.
      chatLog = pageRef.chat.log.slice(); generated = true;
      chatLog.forEach(m => m.r==='bot' ? addBot(locChat(m.t)) : addMe(m.t));
      aiMissing = new Set(pageRef.chat.aiDraft);
      idx = 0; while(effSkip(STEPS[idx])) idx++;
      const step = STEPS[idx] || 'done';
      if(step==='done'){ aiMissing=null; mountWidget('done'); }
      else {
        // 진행 중이던 질문이 로그 마지막에 이미 있으면 다시 묻지 않음(재진입)
        const last = chatLog.length ? chatLog[chatLog.length-1] : null;
        if(!(last && last.r==='bot' && last.t===PROMPT[step])) botBubble(PROMPT[step]);
        mountWidget(step);
      }
      render(); scroll();
    } else if(pageRef.chat && pageRef.chat.log && pageRef.chat.log.length){
      // 저장된 대화 복원 → 나갔다 와도 대화 살아있음
      chatLog = pageRef.chat.log.slice(); idx = pageRef.chat.idx||0; generated = !!pageRef.chat.generated;
      chatLog.forEach(m => m.r==='bot' ? addBot(locChat(m.t)) : addMe(m.t));
      const step = STEPS[idx] || 'done';
      // 콘텐츠가 이미 있으면(외부 주입·이전 초안) 인테이크 재개 대신 편집 모드로
      const hasBody = !!((data.features&&data.features.length) || (data.stats&&data.stats.length) || data.bannerText);
      if(generated || step==='done' || (hasBody && !curMode().slides)){ generated=true; mountWidget('done'); }
      else if(aiPageFlow()) startPageIntake();   // 인테이크 도중 이탈 복귀 — 옛 스텝 위젯 대신 대화형 재개
      else mountWidget(step);
      render(); scroll();
    } else if(curMode().editOnly){
      if(curMode().slides && pageRef.pendingBrief && window.LLM && LLM.aiAvailable()){
        // index에서 브리프만 들고 넘어온 상태 — 여기서 라이브 생성 (좌측 안내 + 우측 장표가 그려짐)
        // render() 호출 금지: 팩 기본 템플릿이 스켈레톤을 덮는다
        startLiveCompose();
      } else {
        // 편집전용(이메일/PPT): 생성 플로우 없이 기존 구성 그대로 편집
        generated=true; idx=STEPS.indexOf('done'); botBubble(`${project.name} — ${tL('편집 중')}`); mountWidget('done'); render();
      }
    } else {
      const hasContent = !!((data.features && data.features.length) || (data.stats && data.stats.length) || data.bannerText); // 페이지 고유 콘텐츠 기준(공유 시드 제외)
      if(hasContent){ generated=true; idx=STEPS.indexOf('done'); botBubble(`📂 ${project.name} · ${pageRef.name} — ${tL('편집 중')}`); mountWidget('done'); }
      else if(aiPageFlow()){ startPageIntake(); }                                              // 메인홈·랜딩·하위 전부 대화형 AI 인테이크
      else if(project && project.kind==='multi' && (pageRef.pageType==='main' || (project.pages[0]&&project.pages[0].id===pageRef.id))){
        pageType='main'; idx=STEPS.indexOf('mainSections'); botBubble(PROMPT.mainSections); mountWidget('mainSections'); } // AI 불가 폴백: 다중=메인홈부터 섹션 선택
      else { idx=STEPS.indexOf('pageType'); botBubble(PROMPT.pageType); mountWidget('pageType'); } // AI 불가 폴백: 페이지 타입부터 손으로
      render();
    }
  } else {
    botBubble(PROMPT.kind); mountWidget('kind'); render();
  }

  // 고정 포맷(PPT 16:9 · eDM 760px): 디바이스 토글 숨김 + PC 기준 고정
  if(curMode().device==='fixed'){ const vp=document.getElementById('vpseg'); if(vp) vp.style.display='none'; setDevice('desktop'); }

  // 템플릿에서 시작 → 편집모드 자동 진입
  if(window.I18N) I18N.apply(document);   // 정적 마크업(data-i18n) 로컬라이징
  // eDM = 재생성 불가·편집전용: 재생성 UI 숨김 + 스타일 배지 잠금 + 편집모드 자동 진입
  const _isEdm = curMode().editOnly;
  if(_isEdm){
    generated=true;
    const rs=document.getElementById('reset'); if(rs) rs.style.display='none';
    badge.style.cursor='default';
    // eDM=편집전용 → 대화 패널은 그대로 유지(생성 위젯 없이 편집 안내만). 자동 편집모드.
    // 라이브 생성 중엔 보류 — 완료 시 startLiveCompose가 직접 편집 진입·initPptChat 수행
    if(!_liveComposing) setTimeout(()=>{ const b=document.getElementById('editBtn'); if(b && !editMode) b.click(); }, 150);
    // PPT: 내용수정 채팅(AI 가능 시) + 통합 되돌리기 버튼 + 진입 순차 등장
    if(curMode().slides && !_liveComposing){ initPptChat(); const hb=document.getElementById('histBtn'); if(hb) hb.onclick=undoAll; syncUndoUI(); if(params.get('edit')) _pptRevealPending=true; }
  } else if(params.get('edit') && generated){ setTimeout(()=>{ const b=document.getElementById('editBtn'); if(b && !editMode) b.click(); }, 150); }

  // PPT: 내보내기 = 단일 버튼 + 형식 모달(PPTX/PDF/HTML) — 젠스파크식
  if(curMode().exportFmt.indexOf('pptx')>=0){
    ['pptxBtn','expBtn','dl'].forEach(id=>{ const b=document.getElementById(id); if(b) b.style.display='none'; });
    // PPT는 항상 편집 상태(텍스트 클릭 즉시 수정)+자동 저장 — 편집 토글·저장 버튼 불필요
    ['editBtn','save'].forEach(id=>{ const b=document.getElementById(id); if(b) b.style.display='none'; });
    const xb=document.getElementById('exportBtn'), modal=document.getElementById('expModal');
    const rangeIn=document.getElementById('expmRange'), goBtn=document.getElementById('expmGo');
    let _expFmt='pptx';
    xb.style.display='';
    xb.onclick=()=>{ document.getElementById('expmCnt').textContent='(1–'+(data.slides||[]).length+')'; modal.hidden=false; };
    document.getElementById('expmClose').onclick=()=>{ modal.hidden=true; };
    modal.addEventListener('click',(e)=>{ if(e.target===modal) modal.hidden=true; });
    modal.querySelectorAll('[data-x]').forEach(b=>{ b.onclick=()=>{ _expFmt=b.getAttribute('data-x'); modal.querySelectorAll('[data-x]').forEach(x=>x.classList.toggle('sel',x===b)); }; });
    modal.querySelectorAll('[name=exprange]').forEach(r=>{ r.onchange=()=>{ rangeIn.disabled=(r.value!=='custom'||!r.checked); if(!rangeIn.disabled) rangeIn.focus(); }; });
    // "1-3, 5" → [0,1,2,4] (0기준, 유효범위 클램프). 빈값/전체=null
    function parseRange(){
      const mode=modal.querySelector('[name=exprange]:checked').value; const N=(data.slides||[]).length;
      if(mode!=='custom') return null;
      const set=new Set(); (rangeIn.value||'').split(',').forEach(part=>{ part=part.trim(); if(!part) return;
        const m=part.match(/^(\d+)\s*-\s*(\d+)$/); if(m){ let a=+m[1],b=+m[2]; if(a>b){const t=a;a=b;b=t;} for(let i=a;i<=b;i++) if(i>=1&&i<=N) set.add(i-1); }
        else if(/^\d+$/.test(part)){ const i=+part; if(i>=1&&i<=N) set.add(i-1); } });
      return [...set].sort((a,b)=>a-b);
    }
    async function doPptx(idxs){
      if(typeof exportPptx!=='function'){ await uiAlert(tL('내보내기 모듈을 불러오지 못했어요.')); return; }
      const o=goBtn.textContent; goBtn.disabled=true;
      try{ await exportPptx(frame.contentDocument, (i,n)=>{ goBtn.textContent=i+'/'+n; }, idxs); }
      catch(e){ console.error('[pptx]',e); await uiAlert(tL('PPTX 내보내기에 실패했어요.')+' '+(e&&e.message||'')); }
      finally{ goBtn.disabled=false; goBtn.textContent=o; }
    }
    function pickSlides(idxs){ return idxs? idxs.map(i=>data.slides[i]).filter(Boolean) : (data.slides||[]); }
    function doPdf(idxs){
      let html=renderDeckFor(pickSlides(idxs));
      html=html.replace('</head>','<style>@page{size:13.333in 7.5in;margin:0}html,body{background:#fff}.ppt-stack{display:block;padding:0;gap:0}.ppt-stack>.slide{margin:0;box-shadow:none;page-break-after:always;break-inside:avoid}</style></head>');
      const f=document.createElement('iframe'); f.style.cssText='position:fixed;left:-99999px;width:1280px;height:720px;border:0';
      f.srcdoc=html; document.body.append(f);
      f.onload=()=>{ setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} setTimeout(()=>f.remove(),60000); },400); };
    }
    function doHtml(idxs){ const html=renderDeckFor(pickSlides(idxs));
      const b=new Blob([html],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=(project&&project.name||'deck')+'.html'; a.click(); URL.revokeObjectURL(a.href); }
    goBtn.onclick=async()=>{
      const idxs=parseRange();
      if(idxs && !idxs.length){ await uiAlert(tL('유효한 페이지 범위를 입력해주세요.')); return; }
      if(_expFmt==='pptx'){ await doPptx(idxs); modal.hidden=true; }
      else if(_expFmt==='pdf'){ modal.hidden=true; doPdf(idxs); }
      else { modal.hidden=true; doHtml(idxs); }
    };
  } else {
    /* 웹사이트·랜딩·eDM: PPT와 같은 방식 — 흩어져 있던 JSON·HTML 버튼을
       "내보내기" 하나로 합치고, 형식은 모달에서 고른다. */
    ['pptxBtn','expBtn','dl'].forEach(id=>{ const b=document.getElementById(id); if(b) b.style.display='none'; });
    /* 웹/랜딩: "링크 만들기" — 페이지 HTML을 워커에 발행해 접속 가능한 공유 URL 생성 (시안 V3-05) */
    if(!curMode().editOnly){
      const lb=document.getElementById('linkBtn');
      lb.style.display='';
      lb.onclick=async ()=>{
        if(!generated){ await uiAlert(tL('먼저 페이지를 생성해주세요.')); return; }
        const base=(window.LLM && LLM.proxyUrl && LLM.proxyUrl())||'';
        if(!base){ await uiAlert(tL('공유 서버 주소가 설정되지 않았어요.')); return; }
        const o=lb.textContent; lb.disabled=true; lb.textContent=tL('링크 만드는 중…');
        /* 공유 스냅샷 자산 절대화 — 로컬(localhost·file)·상대 경로는 공유 페이지(https)에서
           mixed content 차단/404로 이미지가 깨진다 → 프로드 절대주소로 재작성 */
        const PROD_ASSETS='https://midas-drs.pages.dev/app/';
        const absAssets=(h)=>h
          .replace(/(src|href)="https?:\/\/(?:localhost|127\.0\.0\.1)(?::\d+)?\//g, '$1="'+PROD_ASSETS)
          .replace(/(src|href)="file:\/\/[^"]*?\/app\//g, '$1="'+PROD_ASSETS)
          .replace(/(<img[^>]+src=")(bg\/)/g, '$1'+PROD_ASSETS+'$2');
        try{
          const r=await fetch(base+'/publish',{ method:'POST', headers:{'content-type':'application/json'},
            body: JSON.stringify({ html: absAssets(pageHtml()), title: (project&&project.name)||'' }) });
          const j=await r.json().catch(()=>null);
          if(!r.ok || !j || !j.url) throw new Error((j&&(j.message||j.error))||('HTTP '+r.status));
          showLinkModal(j.url, j.expiresDays||90);
        }catch(e){ await uiAlert(tL('링크 생성에 실패했어요.')+' '+(e&&e.message||'')); }
        finally{ lb.disabled=false; lb.textContent=o; }
      };
    }
    function showLinkModal(u, days){
      let m=document.getElementById('linkModal');
      if(!m){
        m=document.createElement('div'); m.className='linkmodal'; m.id='linkModal';
        m.innerHTML='<div class="lm-card"><b class="t">🔗 '+tL('링크가 만들어졌어요!')+'</b>'+
          '<div class="lm-url"><input id="lmUrl" readonly><button class="dl" id="lmCopy">'+tL('복사')+'</button></div>'+
          '<span class="lm-note">'+tL('이 주소만 있으면 누구나 볼 수 있어요.')+' ('+tL('보관')+' '+days+tL('일')+')</span>'+
          '<div class="lm-row"><button class="dl" id="lmClose">'+tL('닫기')+'</button><button class="dl dark" id="lmOpen">'+tL('새 창에서 열기')+'</button></div></div>';
        document.body.append(m);
        m.addEventListener('click',e=>{ if(e.target===m) m.hidden=true; });
        m.querySelector('#lmClose').onclick=()=>{ m.hidden=true; };
      }
      const inp=m.querySelector('#lmUrl'); inp.value=u;
      m.querySelector('#lmOpen').onclick=()=>{ window.open(u,'_blank'); };
      const cp=m.querySelector('#lmCopy');
      cp.onclick=async ()=>{ try{ await navigator.clipboard.writeText(u); cp.textContent=tL('복사됨 ✓'); setTimeout(()=>cp.textContent=tL('복사'),1400); }catch(e){ inp.select(); document.execCommand('copy'); } };
      m.hidden=false; setTimeout(()=>{ inp.select(); },60);
    }
    const xb=document.getElementById('exportBtn'), modal=document.getElementById('expModal');
    const grid=modal.querySelector('.expm-grid'), scope=modal.querySelector('.expm-range');
    const goBtn=document.getElementById('expmGo');
    const FMTS=[{id:'html',ic:'🌐',nm:'HTML',d:'웹에서 열기'},{id:'pdf',ic:'📄',nm:'PDF',d:'인쇄·공유용'}];
    if(curMode().exportFmt.indexOf('json')>=0) FMTS.push({id:'json',ic:'🧩',nm:'JSON',d:'데이터 백업'});
    let fmt='html';

    modal.querySelector('.expm-card>b').textContent=tL('페이지 내보내기');
    grid.style.gridTemplateColumns='repeat('+FMTS.length+',1fr)';
    grid.innerHTML=FMTS.map((f,i)=>'<button data-x="'+f.id+'"'+(i?'':' class="sel"')+'><span class="xi">'+f.ic+'</span>'+f.nm+'<span class="xd">'+tL(f.d)+'</span></button>').join('');
    grid.querySelectorAll('[data-x]').forEach(b=>{ b.onclick=()=>{ fmt=b.getAttribute('data-x');
      grid.querySelectorAll('[data-x]').forEach(x=>x.classList.toggle('sel',x===b)); }; });

    // 다중 페이지 프로젝트만 범위 선택. 단일은 고를 게 없어 숨긴다(.expm-range는 display:flex라 hidden 무효)
    const multi = !!(project && project.kind==='multi' && project.pages.length>1);
    if(multi) scope.innerHTML='<label class="expm-rr"><input type="radio" name="expscope" value="all" checked><span>'+tL('전체 페이지')+'</span> <span class="expm-cnt">('+project.pages.length+')</span></label>'+
                              '<label class="expm-rr"><input type="radio" name="expscope" value="cur"><span>'+tL('현재 페이지만')+'</span></label>';
    else scope.style.display='none';
    const wantAll=()=>{ const r=scope.querySelector('[name=expscope]:checked'); return multi && (!r || r.value==='all'); };

    xb.style.display='';
    xb.onclick=async()=>{ if(!generated){ await uiAlert(tL('먼저 페이지를 생성해주세요.')); return; } modal.hidden=false; };
    document.getElementById('expmClose').onclick=()=>{ modal.hidden=true; };
    modal.addEventListener('click',(e)=>{ if(e.target===modal) modal.hidden=true; });

    const fileBase=()=>(project&&project.name)||data.productName||'page';
    function save(html, ext, type){
      const b=new Blob([html],{type:type}); const a=document.createElement('a');
      a.href=URL.createObjectURL(b); a.download=fileBase()+'.'+ext; a.click(); URL.revokeObjectURL(a.href);
    }
    // 전체 페이지 PDF = 각 페이지를 한 장씩 이어붙이고 페이지 나눔을 넣는다(미리보기용 hidden·nav 스크립트는 빼고)
    function pdfHtml(all){
      persist();
      const pages=(all && project && project.pages.length) ? project.pages : [{data,pageType,volume}];
      const dp=new DOMParser(); let head=''; const secs=[];
      pages.forEach((pg,i)=>{ const doc=dp.parseFromString(renderProjectPage(pg),'text/html');
        if(i===0) head=doc.head.innerHTML; secs.push('<div class="pdfpg">'+doc.body.innerHTML+'</div>'); });
      return '<!doctype html><html lang="ko"><head><meta charset="UTF-8">'+head+
        '<style>@page{margin:0}html,body{background:#fff}.pdfpg{break-after:page;page-break-after:always}.pdfpg:last-child{break-after:auto;page-break-after:auto}</style>'+
        '</head><body>'+secs.join('')+'</body></html>';
    }
    function printHtml(html){
      const f=document.createElement('iframe'); f.style.cssText='position:fixed;left:-99999px;width:1280px;height:900px;border:0';
      f.srcdoc=html; document.body.append(f);
      f.onload=()=>{ setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} setTimeout(()=>f.remove(),60000); },400); };
    }
    goBtn.onclick=()=>{
      const all=wantAll();
      modal.hidden=true;
      if(fmt==='html'){ persist(); save(all?previewHtml():pageHtml(), 'html', 'text/html'); }
      else if(fmt==='pdf'){ printHtml(pdfHtml(all)); }
      else {
        persist();
        const snap = all
          ? { name:(project&&project.name)||'', kind:project&&project.kind, pack:pack.id, pages:project.pages.map(p=>({name:p.name,pageType:p.pageType,volume:p.volume,data:p.data})) }
          : { name:data.productName||'page', pageType, volume, motion, pack:pack.id, data };
        save(JSON.stringify(snap,null,2), 'json', 'application/json');
      }
    };
  }
  });
</script>
</body>
