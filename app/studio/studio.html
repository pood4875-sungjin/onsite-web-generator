<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDAS DRS</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('midas-theme')||'light')</script>
<script>
// 캐시 버스터 로더 — python http.server 휴리스틱 캐시로 팩 스크립트가 스테일해지는 것 방지(로컬 전용이라 비용 없음)
['../bundle.js','../pagetypes.js','../packs.krds.js','../packs.midas.js','../packs.edm.js','../packs.aether.js','../packs.saturn.js','../packs.mbm.js','../packs.axday.js','../packs.toss.js','../packs.orbit.js','../packs.ppt.js','../charts.js','../packs.pitch.js','../packs.honors.js','../packs.naver.js','../packs.rams.js','../packs.pastel.js','../packs.sfmi.js','../packs.machine.js','../export-pptx.js','../llm.js','../edm/promo01.js','../modal.js','../i18n.js'].forEach(function(s){ document.write('<scr'+'ipt src="'+s+'?v='+Date.now()+'"></scr'+'ipt>'); });
</script>
<link rel="stylesheet" href="../ds.css">
<style>
  /* 제너레이터 셸 — 다크 글로우 (사용자 Figma Make App.tsx/ChatPanel 포팅) */
  :root{
    /* DS 매핑 — 라이트/다크 자동 (ds.css) */
    --bg:var(--canvas); --surf:var(--surface); --surf2:var(--canvas-2);
    --line:var(--hairline); --line2:var(--hairline-strong);
    --tx:var(--ink); --tx2:var(--body-mid); --tx3:var(--mute);
    --cta:var(--primary); --accent2:var(--accent);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:transparent;color:var(--tx);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--scrim);pointer-events:none}
  button{font-family:inherit;cursor:pointer}
  .orb{display:none}
  .app{position:relative;z-index:1;display:flex;height:100vh}
  /* 좌측 페이지 레일 (다중) */
  .rail{width:212px;flex:0 0 212px;border-right:1px solid var(--line);background:var(--surf2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;flex-direction:column;padding:0 12px 14px;position:relative}
  /* 레일 타이틀 헤더 높이를 챗 헤더(.chead 60px)와 맞춤 — 두 타이틀 수직 정렬 */
  .rtop{display:flex;align-items:center;gap:8px;height:60px;box-sizing:border-box;padding:0 4px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .rtop .rhome{color:var(--tx2);text-decoration:none;font-size:16px;line-height:1}
  .rtop b{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:5px 7px;margin:-5px -7px;border-radius:8px;transition:background var(--dur) var(--ease)}
  .rtop b:hover{background:var(--surf)}
  .rtop input.rinp{font-size:16px;font-weight:700;width:100%}
  .rlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .pnode{position:relative}
  .prow2{position:relative;display:flex;align-items:center;gap:6px;padding:8px 8px;border-radius:10px;cursor:pointer;color:var(--tx2);font-size:13px;transition:background var(--dur) var(--ease)}
  .prow2:hover{background:color-mix(in srgb,var(--tx) 8%,transparent);color:var(--tx)}
  .prow2.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--tx)}
  .prow2 .dh{flex:0 0 auto;cursor:grab;color:var(--tx3);font-size:11px;line-height:1;opacity:0;transition:var(--dur)}
  .prow2:hover .dh{opacity:.65} .prow2 .dh:active{cursor:grabbing}
  .prow2 .tw{flex:0 0 auto;color:var(--tx3);font-size:10px;width:10px;text-align:center}
  .prow2 .pt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
  .prow2 .ren,.prow2 .addc,.prow2 .x{flex:0 0 auto;opacity:0;color:var(--tx3);font-size:12px;line-height:1;width:18px;height:18px;display:grid;place-items:center;border-radius:6px;transition:var(--dur)}
  .prow2:hover .ren,.prow2:hover .addc,.prow2:hover .x{opacity:.75}
  .prow2 .ren:hover,.prow2 .addc:hover{opacity:1;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .prow2 .x:hover{opacity:1;color:#f87171;background:color-mix(in srgb,#f87171 14%,transparent)}
  /* DnD 상태 */
  .prow2.dragging{opacity:.35}
  .prow2.din{background:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .prow2.dbefore::before,.prow2.dafter::after{content:'';position:absolute;left:6px;right:6px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .prow2.dbefore::before{top:-2px}.prow2.dafter::after{bottom:-2px}
  .rlist.droproot{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 40%,transparent);border-radius:10px}
  .rhint{font-size:10.5px;color:var(--tx3);padding:2px 8px 8px;line-height:1.4}
  .raddbtn{margin-top:10px;border:1px dashed var(--line2);background:none;color:var(--tx2);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
  .raddbtn:hover{color:var(--tx);border-color:var(--accent)}
  .rinp{flex:1;min-width:0;background:var(--surf);border:1px solid var(--accent);border-radius:7px;color:var(--tx);font-family:inherit;font-size:13px;padding:5px 8px;outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
  .ptmenu{position:absolute;left:12px;right:12px;bottom:56px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:6px;display:none;z-index:40;box-shadow:var(--shadow-3)}
  .ptmenu.open{display:block;animation:rise .18s var(--ease)}
  .ptmenu button{display:block;width:100%;text-align:left;border:none;background:none;color:var(--tx);padding:9px 10px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
  .ptmenu button:hover{background:rgba(255,255,255,.08)}

  /* 좌: 챗 */
  .chat{width:var(--chat-w,440px);flex:0 0 var(--chat-w,440px);display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surf2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
  /* 대화창↔프리뷰 리사이저 */
  .splitter{flex:0 0 10px;cursor:col-resize;position:relative;z-index:15;align-self:stretch;background:transparent}
  /* 라인·grip을 시각적 거터(chat 끝 ~ 프리뷰 카드 시작) 중앙에 맞춤 — 프리뷰 좌패딩(16px) 절반만큼 오른쪽으로 */
  .splitter::before{content:'';position:absolute;top:0;bottom:0;left:calc(50% + 8px);transform:translateX(-50%);width:2px;border-radius:2px;background:transparent;transition:background var(--dur) var(--ease)}
  .splitter:hover::before,.splitter.drag::before{background:var(--accent)}
  .splitter::after{content:'';position:absolute;top:50%;left:calc(50% + 8px);transform:translate(-50%,-50%);width:10px;height:36px;border-radius:6px;background:var(--surface);border:1px solid var(--line2);opacity:0;transition:opacity var(--dur) var(--ease)}
  .splitter:hover::after,.splitter.drag::after{opacity:1}
  body.resizing{cursor:col-resize;user-select:none}
  body.resizing iframe{pointer-events:none}
  .chead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .hbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--tx2);text-decoration:none;transition:var(--dur) var(--ease)}
  .hbtn:hover{color:var(--tx);border-color:var(--line2);background:var(--brand-weak)}
  .logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--grad-brand);box-shadow:var(--cta-glow)}
  .brand b{font-size:16px;color:var(--tx);line-height:1.2}
  .brand .wg{font-size:16px;color:var(--tx);font-weight:var(--fw-semi)}
  /* 홈 아이콘 옆 프로젝트명 — 레일 상단(.rtop b)과 같은 클릭수정 어포던스로 통일 */
  .brand b.pname{font-weight:700;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;padding:5px 7px;margin:-5px -7px;border-radius:8px;transition:background var(--dur) var(--ease)}
  .brand b.pname:hover{background:var(--surf)}
  .brand b.pname input.rinp{font-size:16px;font-weight:700;width:100%}
  .reset{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surf);color:var(--tx2);border-radius:999px;padding:6px 12px;font-size:12px}
  .reset:hover{background:rgba(255,255,255,.1)}
  .msgs{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.2) transparent}
  .msgs::-webkit-scrollbar{width:10px}
  .msgs::-webkit-scrollbar-track{background:transparent}
  .msgs::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:8px;border:3px solid transparent;background-clip:padding-box}
  .msgs:hover::-webkit-scrollbar-thumb{background:rgba(0,0,0,.28);background-clip:padding-box}
  :root[data-theme="dark"] .msgs{scrollbar-color:rgba(255,255,255,.16) transparent}
  :root[data-theme="dark"] .msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);background-clip:padding-box}
  :root[data-theme="dark"] .msgs:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);background-clip:padding-box}
  .row{display:flex}.row.me{justify-content:flex-end}
  .bub{max-width:85%;border-radius:16px;padding:10px 15px;font-size:14px;line-height:1.5;animation:rise .35s var(--ease)}
  .bub.bot{border:1px solid var(--line);background:var(--surf);color:var(--tx);border-bottom-left-radius:6px}
  .bub.me{background:var(--primary);color:var(--on-primary);font-weight:500;border-bottom-right-radius:6px}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .widget{animation:rise .3s var(--ease) .1s both}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:9px 15px;text-align:left;color:var(--tx)}
  .chip:hover{border-color:var(--hairline-strong);background:var(--canvas-2)}
  .chip b{display:block;font-size:14px;font-weight:600}
  .chip span{font-size:10px;color:var(--tx3)}
  .card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--surf);border-radius:16px;padding:14px}
  /* 메인홈 섹션 멀티선택 */
  .seclist{gap:6px}
  .secrow{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;background:var(--surf);transition:var(--dur) var(--ease)}
  .secrow:hover{border-color:var(--hairline-strong)}
  .secrow.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .secrow.locked{cursor:default;opacity:.85}
  .secrow .cbx{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;color:#fff;background:transparent}
  .secrow .cbx.on{background:var(--accent);border-color:transparent}
  .secrow .sl{display:flex;flex-direction:column;gap:1px;min-width:0}
  .secrow .sl b{font-size:13.5px;font-weight:600;color:var(--tx)}
  .secrow .sl span{font-size:11.5px;color:var(--tx3)}
  .packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pk{overflow:hidden;border-radius:14px;border:1px solid var(--line);text-align:left;background:none}
  .pk.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
  .pk .sw{height:52px}
  .pk .meta{background:var(--surf);padding:8px 10px}
  .pk .meta b{display:block;font-size:12px;font-weight:600}.pk .meta span{font-size:10px;color:var(--tx3)}
  .mopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .mo{border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:11px;text-align:left;color:var(--tx)}
  .mo.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .mo b{display:block;font-size:13px;font-weight:600}.mo span{font-size:10px;color:var(--tx3)}
  .inp{width:100%;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--tx);font-family:inherit;outline:none}
  .inp::placeholder{color:var(--tx3)} .inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
  textarea.inp{min-height:52px;resize:vertical}
  textarea.inp.ta{min-height:92px;line-height:1.55}
  /* 자유 입력 위젯: 보내기 + 건너뛰기 한 줄. 건너뛰기는 약한 위계(테두리만) */
  .askrow{display:flex;align-items:center;gap:8px}
  .skipbtn{border:1px solid var(--line);background:transparent;color:var(--tx2);border-radius:var(--r-sm);padding:10px 14px;font-size:13px}
  .skipbtn:hover{color:var(--tx);border-color:var(--line2)}
  .item{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.04);border-radius:12px;padding:8px}
  .item .hd{display:flex;align-items:center;gap:6px}
  .num{display:grid;place-items:center;width:20px;height:20px;flex:0 0 20px;border-radius:999px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-size:10px}
  .next{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--r-sm);background:var(--primary);color:var(--on-primary);padding:10px 18px;font-size:14px;font-weight:500}
  .next:hover{filter:brightness(1.05)}
  .row2{display:flex;gap:8px}

  /* 우: 프리뷰 */
  .preview{flex:1;display:flex;flex-direction:column;padding:16px;min-width:0}
  .pvhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px}
  .pvhead .l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2)}
  .badge{margin-left:4px;border:1px solid var(--line);background:var(--surf);color:var(--tx2);border-radius:999px;padding:3px 11px;font-size:11px;cursor:pointer;font-family:inherit}
  .badge:hover{border-color:var(--line2);color:var(--tx)}
  .stylemenu{position:absolute;top:100%;left:70px;margin-top:6px;z-index:60;display:none;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;min-width:280px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-md);box-shadow:var(--shadow-3);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
  .stylemenu.open{display:grid}
  .stylemenu .si{cursor:pointer;border:2px solid transparent;border-radius:10px;overflow:hidden;background:none;padding:0;font-family:inherit}
  .stylemenu .si.on{border-color:var(--accent)}
  .stylemenu .si .sc{height:40px}
  .stylemenu .si .sn{font-size:10.5px;text-align:center;padding:4px 2px;color:var(--tx2);line-height:1.2}
  .dots{display:flex;gap:6px}
  .dot{width:24px;height:24px;border-radius:999px;border:2px solid var(--line2);cursor:pointer;transition:.2s;padding:0}
  .dot.sel{border-color:var(--ink);transform:scale(1.1)}
  .pvbox{position:relative;flex:1;overflow:hidden;border-radius:var(--r-md);border:1px solid var(--line);background:#070a12;box-shadow:var(--shadow-2)}
  .pvbox iframe{position:absolute;top:0;left:0;border:0;background:var(--bg);transform-origin:0 0}
  /* 디바이스 프리뷰: 태블릿·모바일은 실제 폭으로 렌더 → 반응형 확인. 레터박스 + 기기 프레임 */
  .pvbox.dev-tablet,.pvbox.dev-mobile{background:repeating-linear-gradient(45deg,#0b0e18,#0b0e18 10px,#0d1120 10px,#0d1120 20px)}
  .pvbox.dev-tablet iframe,.pvbox.dev-mobile iframe{border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06)}
  .vpseg{display:inline-flex;gap:2px;padding:2px;border-radius:999px;border:1px solid var(--line);background:var(--surf)}
  .vpseg button{width:28px;height:24px;display:grid;place-items:center;border:0;background:none;color:var(--tx2);border-radius:999px;cursor:pointer;padding:0;transition:var(--dur) var(--ease)}
  .vpseg button:hover{color:var(--tx)}
  .vpseg button.on{background:var(--point);color:#fff}
  .vpseg button svg{width:15px;height:15px}
  .empty{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;background:rgba(6,8,16,.82);backdrop-filter:blur(5px);transition:.4s}
  .empty.hide{opacity:0;pointer-events:none}
  .ai-orb{width:66px;height:66px;position:relative;display:grid;place-items:center}
  .ai-orb::after{content:'';width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#3fe0c6,#5b9dff 46%,#8a6bff 82%);box-shadow:0 0 34px rgba(90,157,255,.6);animation:orb-pulse 1.9s ease-in-out infinite}
  @keyframes orb-pulse{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.05);opacity:1}}
  /* AI 생성 오버레이 */
  .genning{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-align:center;background:rgba(7,10,18,.84);backdrop-filter:blur(8px)}
  .genning.on{display:flex;animation:rise .3s var(--ease)}
  .genning .gspin{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:#fff;animation:spin .8s linear infinite}
  .genning b{color:#fff;font-weight:600;font-size:15px}
  .genning .gtext{color:rgba(255,255,255,.58);font-size:13px;min-height:18px}
  .genning .gbar{width:200px;height:4px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .genning .gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3fe0c6,#5b9dff 52%,#8a6bff);box-shadow:0 0 10px rgba(91,157,255,.45);border-radius:999px;transition:width .35s ease}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty .et{font-size:24px;font-weight:600;color:#fff;background:linear-gradient(90deg,#fff 25%,var(--accent) 50%,#fff 75%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:et-shimmer 2.8s linear infinite}
  .empty .et::after{content:'';display:inline-block;width:2px;height:.95em;background:var(--accent);margin-left:4px;vertical-align:-2px;animation:et-caret 1s steps(1) infinite;-webkit-text-fill-color:initial}
  .empty .es{font-family:var(--font-display);font-size:27px;font-weight:600;line-height:1.4;max-width:15em;background:linear-gradient(110deg,#37e0c2 0%,#5b9dff 42%,#a486ff 78%,#e6c6ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  @keyframes et-shimmer{to{background-position:-220% 0}}
  @keyframes et-caret{50%{opacity:0}}
  .dl{border:1px solid var(--line);background:var(--surf);color:var(--tx);border-radius:999px;padding:5px 13px;font-size:12px}
  /* 콘텐츠 언어 스위처 — 누르면 UI+출력물이 그 언어로 */
  #stLangBtn b{font-size:11px;font-weight:700;letter-spacing:.05em}
  .stlangmenu{position:absolute;right:0;top:calc(100% + 8px);min-width:136px;background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(10,12,20,.16);padding:5px;z-index:60;display:flex;flex-direction:column}
  .stlangmenu[hidden]{display:none}
  .stlangmenu button{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 11px;border:0;background:none;border-radius:8px;font-family:inherit;font-size:13px;color:var(--tx);cursor:pointer;text-align:left}
  .stlangmenu button:hover{background:var(--line)}
  .stlangmenu button.on{font-weight:700}
  .stlangmenu button i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--tx2)}

<script>

  const tL = (ko)=> (window.L ? window.L(ko) : ko);   // 로컬라이징 헬퍼
  const MOT = { static:'정적', subtle:'은은', rich:'리치' };
  const PAGETYPE = { '메인홈':'main', '제품 기능소개':'features', '요금 비교':'pricing', '랜딩':'landing' };
  const EMPTY = { productName:'', tagline:'', subcopy:'', primaryCta:'', features:[], stats:[], bannerText:'', bannerCta:'', footerLinks:[], footerCopyright:'', images:{}, sectionOrder:[], hiddenSections:[], shownSections:[] };
  let data = structuredClone(EMPTY), pack = DARK_PACKS[0], motion = 'subtle', generated = false;
  let pageType = 'main', volume = 'heavy';

  // 프로젝트 컨텍스트 (대시보드에서 열림)
  const params = new URLSearchParams(location.search);
  const projectId = params.get('p'), pageId = params.get('page');
  let project = null;   // storeReady() 이후 로드
  let pageRef = null;

  function persist(){
    if(!project || !pageRef) return;
    pageRef.data = structuredClone(data); pageRef.pageType = pageType; pageRef.volume = volume;
    pageRef.chat = { log: chatLog, idx, generated, ...(aiMissing&&aiMissing.size?{aiDraft:[...aiMissing]}:{}) };
    project.stylePack = pack.id; project.motion = motion;
    if((!project.name || project.name==='무제 프로젝트') && data.productName){ project.name = data.productName; renderBrand(); }
    upsertProject(project);
  }

  const STEPS = ['kind','pageType','mainSections','volume','facts','features','stats','banner','footer','done'];
  // 메인홈 섹션 선택지 (Header·Hero는 필수 고정). key=섹션타입, 입력스텝 매핑은 SEC_STEP.
  const MAIN_SECTIONS = [
    {type:'feature', label:'제품 핵심기능', desc:'주요 기능을 카드로 소개'},
    {type:'comparison', label:'비교 (Comparison)', desc:'기존 방식 등과 비교'},
    {type:'testimonial', label:'고객사례 (Case Study)', desc:'사용 사례·고객 신뢰'},
    {type:'blog', label:'블로그·자료 (Blog)', desc:'콘텐츠·자료 탐색'},
    {type:'faq', label:'FAQ (Accordion)', desc:'질문을 접고 펼쳐 안내'},
    {type:'cta', label:'배너 CTA', desc:'행동을 유도하는 배너'},
  ];
  const SEC_STEP = { feature:'features', stat:'stats', cta:'banner' }; // 섹션→입력스텝
  const PROMPT = {
    kind:'안녕하세요 👋 먼저 무엇을 만들지 정해볼까요? 한 장으로 끝나는 페이지인지, 여러 페이지로 이어지는 사이트인지 골라주세요.',
    pageType:'이 페이지는 어떤 유형인가요? 성격에 맞춰 알맞은 템플릿과 섹션을 자동으로 불러올게요.',
    mainSections:'메인 홈을 구성해볼게요. 헤더와 히어로는 기본으로 들어가요. 그 아래 어떤 섹션을 보여줄지 골라주세요 (여러 개 선택 가능).',
    volume:'페이지에 담을 정보량을 골라주세요. 핵심만 간결하게 갈지, 풍성하게 채울지에 따라 섹션 수가 달라져요.',
    facts:'좋아요! 이제 페이지의 얼굴을 만들 차례예요. 제품명과 한 줄 슬로건, 짧은 소개 문구를 적어주세요. 방문자가 3초 안에 “무엇인지” 감 잡게 하는 게 핵심이에요.',
    features:'핵심 기능은 딱 3가지만 보여주는 게 좋아요. 너무 많으면 오히려 안 읽히거든요. 각 기능을 큰 제목 + 짧은 설명으로 적으면 고객이 한눈에 가치를 파악해요.',
    stats:'숫자는 가장 강력한 신뢰 장치예요. 사용자 수·만족도·처리 건수처럼 자랑할 만한 지표 3개를 보여주세요.',
    banner:'행동을 유도할 한마디를 넣어볼까요? 하단 배너에 들어갈 짧고 강한 문구를 적어주세요.',
    footer:'거의 끝났어요! 마지막으로 푸터에 들어갈 링크와 저작권 문구를 정리할게요.',
    done:'🎉 완성됐어요! 오른쪽에서 페이지를 확인하고, 편집 버튼으로 자유롭게 다듬어보세요.',
  };
  Object.keys(PROMPT).forEach(k=>{ PROMPT[k]=tL(PROMPT[k]); });   // 챗 프롬프트 로컬라이징
  let idx = 0;
  const msgs = document.getElementById('msgs');
  const frame = document.getElementById('frame');
  const empty = document.getElementById('empty');
  const badge = document.getElementById('badge');

  function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
  // 대화 로그 — 나갔다 와도 대화 유지 (pageRef.chat에 저장)
  let chatLog = [];
  function addBot(txt){const r=el('div','row');r.append(el('div','bub bot',txt));msgs.append(r);}
  function addMe(txt){const r=el('div','row me');r.append(el('div','bub me',txt));msgs.append(r);}
  function saveChat(){ if(!project||!pageRef) return; pageRef.chat={log:chatLog, idx, generated, ...(aiMissing&&aiMissing.size?{aiDraft:[...aiMissing]}:{})}; upsertProject(project); }
  /* 저장된 봇 발화 재생 로컬라이즈 — 로그는 "그 순간의 UI 언어"로 저장돼 있다.
     unL로 어떤 언어든 한국어 원문으로 되돌린 뒤(tL) 현재 언어로 다시 그린다. 조립형은 패턴 분해 후 세그먼트별 처리 */
  function locChat(t){
    t=String(t||'');
    const un=s=>(window.I18N&&I18N.unL)?I18N.unL(s):s;
    const norm=un(t);
    const d=tL(norm); if(d!==t) return d;
    let m=t.match(/^([✅🪄🌐✏️])\s?(.*)$/u);
    if(m){
      const emo=m[1], body=m[2];
      // 🌐 번역 완료: "메시지 → 언어명 (부가)" — 가운데 언어명은 그대로 두고 앞뒤만 재번역
      let g=body.match(/^(.+?) → (\S+)\s*([（(].+[）)])?$/);
      if(emo==='🌐' && g) return '🌐 '+tL(un(g[1].trim()))+' → '+g[2]+(g[3]?' '+tL(un(g[3])):'');
      // ✅ 완성: "완성문구 N꼬리문구" — 숫자 앞뒤 세그먼트 각각 역변환
      g=body.match(/^(.+?)\s?(\d+)(.+)$/);
      if(emo==='✅' && g) return '✅ '+tL(un(g[1].trim()))+' '+g[2]+tL(un(g[3]));
      const b2=tL(un(body)); if(b2!==body) return emo+' '+b2;
    }
    return t;
  }
  function botBubble(txt){ addBot(txt); chatLog.push({r:'bot',t:txt}); saveChat(); }
  function meBubble(txt){ addMe(txt); chatLog.push({r:'me',t:txt}); saveChat(); }
  function scroll(){msgs.scrollTo({top:msgs.scrollHeight,behavior:'smooth'});}

  const VW = 1280; // 가상 데스크탑 폭 — 페이지를 이 폭으로 렌더 후 프리뷰 칸에 맞게 축소
  const DEVICE_W = { desktop: VW, tablet: 820, mobile: 390 }; // 태블릿·모바일은 실제 폭 → 미디어쿼리 반응형 발동
  let device = 'desktop';
  function fitPreview(){
    const box = frame.parentElement;
    // PPT 썸네일 스트립(좌측 150px)이 떠 있으면 그만큼 오른쪽으로 밀어 렌더
    const tr = document.getElementById('thumbRail');
    const railOff = (tr && tr.style.display!=='none') ? 150 : 0;
    const bw = box.clientWidth - railOff, bh = box.clientHeight;
    const targetW = DEVICE_W[device] || VW;
    let s, left, top;
    if(device === 'desktop'){
      s = bw / targetW; left = railOff; top = 0;         // 폭 맞춤 축소(기존 동작)
    } else {
      s = Math.min((bw - 40) / targetW, (bh - 24) / 720, 1); // 폭·높이 여유에 맞춰, 업스케일 금지
      left = (bw - targetW * s) / 2;                     // 가로 중앙
      top = 12;                                          // 상단 여백(레터박스)
    }
    frame.style.width = targetW + 'px';
    frame.style.height = ((bh - top*2) / s) + 'px';       // 기기 뷰포트 높이(내부 스크롤)
    frame.style.left = left + 'px';
    frame.style.top = top + 'px';
    frame.style.transform = 'scale(' + s + ')';
  }
  function setDevice(d){
    if(curMode().device==='fixed') d='desktop';   // 고정 포맷(PPT·eDM)은 PC 기준만
    device = d;
    document.querySelectorAll('#vpseg button').forEach(b=>b.classList.toggle('on', b.dataset.vp===d));
    const pv = document.querySelector('.pvbox');
    pv.classList.toggle('dev-tablet', d==='tablet');
    pv.classList.toggle('dev-mobile', d==='mobile');
    fitPreview();
  }
  // 다중 사이트: 레일 메뉴트리 → GNB nav 항목 (홈=로고라 최상위 메인홈은 제외)
  // curId 인자로 활성 페이지 지정(미리보기에서 페이지별 렌더 시 사용). 없으면 현재 pageRef.
  function buildNav(curId){
    if(!project || project.kind!=='multi') return null;
    const cur = curId || (pageRef && pageRef.id);
    const isActive = (id)=> id===cur;
    const tops = pageTree(project.pages).filter(n=> n.pageType!=='main');
    if(!tops.length) return null;
    return tops.map(n=>({
      id:n.id, name:n.name, active:isActive(n.id),
      children:(n.children||[]).map(c=>({ id:c.id, name:c.name, active:isActive(c.id) }))
    }));
  }
  // 팩별 출력 — KRDS는 계약 렌더(renderKrdsPage), 그 외는 darkglow(renderComposed)
  function renderWith(d, pt, vol, nav, mot){
    const rd = Object.assign({}, d, nav?{nav}:{}, {pageType: d.pageType || pt});   // 팩이 PAGE_TYPES 구성표를 찾는 키
    if (window.LLM && LLM.fixBrand) LLM.fixBrand(rd);   // 제품명 표기 자가치유 — 과거 저장분의 'GEN NX'도 렌더 시 'MIDAS GEN NX'로
    if(pack && pack.id==='edm' && typeof renderEdmPage==='function') return renderEdmPage(rd);
    if(pack && pack.id==='aglass' && typeof renderAetherPage==='function') return renderAetherPage(rd, {volume:vol, motion:mot});
    if(pack && pack.id==='saturn' && typeof renderSaturnPage==='function') return renderSaturnPage(rd, {volume:vol, motion:mot});

  /* ---- 콘텐츠 언어 스위처 — UI 언어 + 생성된 출력물(덱/사이트)을 함께 그 언어로 ---- */
  (function(){
    const btn=document.getElementById('stLangBtn'), menu=document.getElementById('stLangMenu'), cur=document.getElementById('stLangCur');
    if(!btn||!window.I18N) return;
    // 기준은 "산출물의 언어"(data._clang, 기본 ko) — UI 언어와 별개
    const contentLang=()=>((data&&data._clang)||'ko');
    // 데이터가 비동기 로드라 초기엔 언어를 모른다 — 알기 전엔 '…', 로드되면 즉시 확정(잘못된 KO 선노출 금지)
    const dataReady=()=>!!(data && ((data.slides&&data.slides.length) || data.tagline || data.productName || data._clang));
    const syncLabel=()=>{
      const c=document.getElementById('stLangCur'); if(!c) return;
      if(!dataReady()){ c.textContent='…'; return; }
      const cl=contentLang();
      c.textContent=(I18N.LANGS.find(l=>l[0]===cl)||I18N.LANGS[0])[2];
      menu.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.__lang===cl));
    };
    I18N.LANGS.forEach(l=>{
      const b=document.createElement('button'); b.__lang=l[0];
      b.innerHTML='<span>'+l[1]+'</span><i>'+l[2]+'</i>';
      b.onclick=async e=>{ e.stopPropagation(); menu.hidden=true; if(l[0]===contentLang()) return; await switchContentLang(l[0]); };
      menu.appendChild(b);
    });
    const nt=document.createElement('div'); nt.className='note'; nt.textContent=tL('생성된 결과물의 내용을 이 언어로 번역합니다'); menu.appendChild(nt);
    syncLabel();
    // 데이터 로드를 감지해 확정 — 300ms 간격, 준비되면 즉시 중단(최대 6초)
    (function poll(n){ if(dataReady()||n>20){ syncLabel(); return; } setTimeout(()=>poll(n+1), 300); })(0);
    window.__syncLangLabel=syncLabel;   // 번역 ↺ 복귀 등 외부에서 라벨 재동기
    btn.onclick=e=>{ e.stopPropagation(); syncLabel(); menu.hidden=!menu.hidden; };
    document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.stlang')) menu.hidden=true; }, true);
    /* 스튜디오 언어 버튼 = 산출물(덱·사이트) 내용 번역 전용 — UI 언어는 건드리지 않는다(홈·대시보드 스위처 소관) */
    async function switchContentLang(to){
      btn.disabled=true; const oldHtml=btn.innerHTML; btn.innerHTML='🌐 …';
      const name=(I18N.LANGS.find(x=>x[0]===to)||[])[1]||to;
      // 번역은 수십 초 걸릴 수 있다 — 무반응처럼 보이지 않게 풀스크린 진행 오버레이
      const ov=document.createElement('div');
      ov.style.cssText='position:fixed;inset:0;z-index:400;background:rgba(10,12,20,.55);backdrop-filter:blur(4px);display:grid;place-items:center';
      ov.innerHTML='<div style="background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:22px 30px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--tx)">'
        +'<span style="width:18px;height:18px;border:2.5px solid var(--line);border-top-color:#6c2bff;border-radius:50%;animation:stlspin .8s linear infinite"></span>'
        +tL('콘텐츠를 번역하는 중…')+' → '+name+'</div>';
      document.body.append(ov);
      let ok=false;
      try{
        if(window.LLM && LLM.aiAvailable() && LLM.translatePayload){
          if(curMode().slides && data.slides && data.slides.length){
            // ↺ 복귀 시 언어 기록(_clang)도 같이 돌아가도록 스냅에 동봉
            const snap=JSON.stringify({ __clang:(data._clang||'ko'), slides: data.slides });
            const out=await LLM.translatePayload({ slides: data.slides }, to);
            if(out && Array.isArray(out.slides) && out.slides.length===data.slides.length){
              pushUndo(snap);
              data.slides=out.slides; data._clang=to; persist(); render(); refreshPptPanel(); syncUndoUI(); ok=true;
            }
          } else if(!curMode().editOnly && data && (data.tagline||data.productName)){
            const out=await LLM.translatePayload(data, to);
            if(out && typeof out==='object' && (out.tagline||out.productName)){
              Object.keys(data).forEach(k=>{ delete data[k]; }); Object.assign(data, out); data._clang=to; persist(); render(); ok=true;
            }
          }
        }
      }catch(e){ console.warn('[translate 실패]', e); }
      try{ ov.remove(); }catch(e){}
      btn.disabled=false; btn.innerHTML=oldHtml;
      if(ok){
        syncLabel();   // data._clang 기준 — btn.innerHTML 복원으로 라벨 노드가 새로 만들어져도 안전
        botBubble('🌐 '+tL('콘텐츠를 번역했어요.')+' → '+name+' '+tL('(↺로 되돌릴 수 있어요)'));

    }
  })();

  (function(){
    const app=document.querySelector('.app'), split=document.getElementById('split');
    const KEY='midas-chat-w', MIN=320, PREVIEW_MIN=360;
    const railW=()=>{ const r=document.getElementById('rail'); return (r && r.style.display!=='none') ? r.offsetWidth : 0; };
    const maxW=()=> Math.max(MIN, app.clientWidth - railW() - 6 - PREVIEW_MIN);
    const clamp=(w)=> Math.min(maxW(), Math.max(MIN, w));
    function setW(w,save){ w=clamp(w); app.style.setProperty('--chat-w', w+'px'); fitPreview(); if(save) localStorage.setItem(KEY, w); }
    // 저장값 복원
    const saved=parseInt(localStorage.getItem(KEY),10); if(saved) setW(saved,false);
    let dragging=false;
    split.addEventListener('pointerdown',(e)=>{ dragging=true; split.setPointerCapture(e.pointerId); split.classList.add('drag'); document.body.classList.add('resizing'); e.preventDefault(); });
    split.addEventListener('pointermove',(e)=>{ if(!dragging) return; setW(e.clientX - app.getBoundingClientRect().left - railW(), false); });
    function end(e){ if(!dragging) return; dragging=false; try{split.releasePointerCapture(e.pointerId);}catch(_){} split.classList.remove('drag'); document.body.classList.remove('resizing'); localStorage.setItem(KEY, parseInt(getComputedStyle(app).getPropertyValue('--chat-w'),10)||440); }
    split.addEventListener('pointerup',end); split.addEventListener('pointercancel',end);
    // 더블클릭 = 기본폭 리셋
    split.addEventListener('dblclick',()=>{ localStorage.removeItem(KEY); app.style.removeProperty('--chat-w'); fitPreview(); });
    window.addEventListener('resize',()=>{ const w=parseInt(getComputedStyle(app).getPropertyValue('--chat-w'),10); if(w) setW(w,false); });

  function runGenerate(){

    const steps=['기획 내용 분석 중…','섹션 구조 조립 중…','스타일 적용 중…','마무리 중…'].map(tL);
    empty.classList.add('hide'); g.classList.add('on'); bar.style.width='0'; gt.textContent=steps[0];
    requestAnimationFrame(()=>{ bar.style.width='26%'; });
    let i=0; const iv=setInterval(()=>{ i++; if(i<steps.length){ gt.textContent=steps[i]; bar.style.width=(26+i*24)+'%'; } }, 480);

      const sel=new Set(data.shownSections||[]);
      if(step==='features') return !sel.has('feature');
      if(step==='stats')    return true;                     // 지표는 메인홈 선택지 아님
      if(step==='banner')   return !sel.has('cta');
    }
    return false;
  }
  /* AI 초안 후속질문 모드 — aiMissing(Set)이 있으면 구조 스텝은 건너뛰고
     초안이 못 채운 콘텐츠 스텝만 순서대로 질문. 전부 채우면 done. */
  let aiMissing = null;
  const AI_STRUCT = new Set(['kind','pageType','mainSections','volume']);
  const AI_CONTENT = new Set(['facts','features','stats','banner','footer']);
  function effSkip(step){
    if(shouldSkip(step)) return true;
    if(aiMissing){
      if(AI_STRUCT.has(step)) return true;
      if(AI_CONTENT.has(step)) return !aiMissing.has(step);
    }
    return false;
  }
  function advance(userText){
    if(userText) meBubble(userText);
    if(aiMissing) aiMissing.delete(STEPS[idx]);   // 빈 Set도 유지 — 남은 콘텐츠 스텝 전부 스킵시켜 done으로
    idx++;
    let step = STEPS[idx];
    while(effSkip(step)){ idx++; step = STEPS[idx]; }
    if(step==='done') aiMissing=null;             // 후속질문 모드 종료
    botBubble(PROMPT[step]);
    mountWidget(step);
    if(step==='done'){ runGenerate(); }
    scroll();
  }

  function mountNode(node){
    const old = document.getElementById('activeWidget'); if(old) old.remove();
    const w = el('div','widget'); w.id='activeWidget';
    w.append(node);
    msgs.append(w); scroll();
  }
  function mountWidget(step){ mountNode(buildWidget(step)); }
  function clearWidget(){ const old=document.getElementById('activeWidget'); if(old) old.remove(); }

  function chips(opts, pick){
    const c = el('div','chips');
    opts.forEach(o=>{ const b=el('button','chip',`<b>${tL(o.label)}</b>${o.hint?`<span>${tL(o.hint)}</span>`:''}`); b.onclick=()=>pick(o); c.append(b); });
    return c;
  }
  function nextBtn(label, fn){ const b=el('button','next',label||tL('다음 →')); b.onclick=fn; return b; }

  function applyMainSel(sel){
    data.shownSections = [...sel];
    // 메인홈 선택지에 없는 본문 섹션(stat 등)도 미선택 시 숨김
    const optional = [...MAIN_SECTIONS.map(s=>s.type), 'stat'];
    data.hiddenSections = optional.filter(t=>!sel.has(t));
    render();
  }
  function mainSectionPicker(){
    pageType='main';
    if(project&&pageRef){ pageRef.pageType='main'; if(!pageRef.name||pageRef.name==='새 페이지') pageRef.name='메인홈'; }
    const seeded = (data.shownSections&&data.shownSections.length) ? new Set(data.shownSections) : new Set(['feature','cta']);
    applyMainSel(seeded);
    const wrap=el('div','card seclist');
    // 고정: 헤더·히어로
    ['헤더','히어로'].forEach(l=>{ const r=el('label','secrow locked'); r.innerHTML=`<span class="cbx on" aria-hidden="true">✓</span><span class="sl"><b>${tL(l==='헤더'?'헤더':'히어로')}</b><span>${tL('필수')}</span></span>`; wrap.append(r); });
    MAIN_SECTIONS.forEach(s=>{
      const on=seeded.has(s.type);
      const r=el('label','secrow'+(on?' sel':''));
      r.innerHTML=`<span class="cbx${on?' on':''}">${on?'✓':''}</span><span class="sl"><b>${tL(s.label)}</b><span>${tL(s.desc)}</span></span>`;
      r.onclick=(e)=>{ e.preventDefault(); if(seeded.has(s.type)) seeded.delete(s.type); else seeded.add(s.type);
        r.classList.toggle('sel',seeded.has(s.type)); const c=r.querySelector('.cbx'); c.classList.toggle('on',seeded.has(s.type)); c.textContent=seeded.has(s.type)?'✓':'';
        applyMainSel(seeded); };
      wrap.append(r);
    });
    wrap.append(nextBtn(tL('다음 →'), ()=>{ applyMainSel(seeded); if(project&&pageRef){ upsertProject(project); renderRail(); } advance(`${tL('메인홈')} · ${seeded.size}${tL('개 섹션')}`); }));
    return wrap;
  }
  /* ==== 새 페이지 = 대화형 AI 인테이크 ====
     기존엔 유형→정보량→제품명→기능3개→지표→배너→푸터를 전부 손으로 입력해야 했다.
     이제는 "유형 + 담을 내용" 두 번만 묻고, 부족한 건 AI가 최대 2개 되묻고, 나머지는 초안으로 채운다.
     생성 중에는 우측 프리뷰에 진행 오버레이(#genning)를 띄운다. AI가 없거나 실패하면 옛 스텝 플로우로 폴백. */
  // 페이지 유형 — 공용 레지스트리(pagetypes.js) 기반. 미로드 시 구 3종 폴백
  const PAGE_KINDS = (window.PAGE_TYPES ? Object.keys(PAGE_TYPES).filter(k=>k!=='main').map(k=>({id:k, label:PAGE_TYPES[k].label, hint:PAGE_TYPES[k].use})) : [
    {id:'features', label:'제품 기능소개', hint:'기능·가치 소개'},
    {id:'pricing',  label:'요금 비교',    hint:'플랜·가격표'},
    {id:'landing',  label:'랜딩',        hint:'캠페인·전환 유도'},
  ]);
  // 웹 계열(랜딩·웹사이트) + AI 가용이면 대화형 인테이크 — 메인홈/랜딩도 폼 스텝 대신 대화로 채운다
  function aiPageFlow(){ const m=curMode(); return !!(project && !m.editOnly && !m.slides && window.LLM && LLM.aiAvailable()); }

  function askChips(opts){ return new Promise(res=>{ mountNode(chips(opts, o=>{ clearWidget(); res(o); })); }); }
  // 자유 입력 위젯 — 여러 줄. Enter=전송(조합 중 Enter는 글자 확정이라 무시), Shift+Enter=줄바꿈.
  function askText(ph, skipLabel){
    return new Promise(res=>{
      const wrap=el('div','card');
      const ta=el('textarea','inp ta'); ta.placeholder=tL(ph); ta.rows=4; ta.maxLength=1200;
      const row=el('div','askrow');
      const go=el('button','next',tL('보내기'));
      const skip=skipLabel?el('button','skipbtn',tL(skipLabel)):null;
      const done=(v)=>{ clearWidget(); res(v); };
      go.onclick=()=>{ const v=ta.value.trim(); if(!v) return; done(v); };
      if(skip) skip.onclick=()=>done('');
      ta.addEventListener('keydown',(e)=>{ if(e.isComposing || e.keyCode===229) return;
        if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); go.click(); } });
      row.append(go); if(skip) row.append(skip);
      wrap.append(ta, row); mountNode(wrap); setTimeout(()=>ta.focus(),50);
    });
  }
  // 채팅에 잠깐 띄우는 대기 버블(로그 저장 안 함)
  function pendingBubble(txt){ const r=el('div','row'); r.append(el('div','bub bot working',`<div class="wk-head"><span class="wk-spin"></span><span class="wk-stage">${tL(txt)}</span></div>`)); msgs.append(r); scroll(); return r; }

  // 우측 프리뷰 진행 오버레이 — 실제 AI 호출 동안 계속 떠 있고, 끝나면 stop(ok) 호출
  function genStart(){
    const g=document.getElementById('genning'), gt=document.getElementById('gtext'), bar=document.querySelector('#genning .gbar i');
    const steps=['페이지 성격 파악 중…','핵심 메시지 뽑는 중…','카피 작성 중…','섹션 구성 중…','초안 조립 중…'].map(tL);
    empty.classList.add('hide'); g.classList.add('on'); bar.style.width='8%'; gt.textContent=steps[0];
    let i=0; const iv=setInterval(()=>{ i++; if(i<steps.length){ gt.textContent=steps[i]; bar.style.width=(8+i*20)+'%'; } else clearInterval(iv); }, 2600);
    return (ok)=>{ clearInterval(iv); bar.style.width=ok?'100%':'0';
      setTimeout(()=>{ g.classList.remove('on'); if(!ok) empty.classList.remove('hide'); }, ok?320:0); };
  }

  // 메인홈에서 물려받을 공통값 — 페이지끼리 제품명·CTA·푸터가 어긋나지 않게
  function siteCtx(){
    const home=(project&&project.pages||[]).find(p=>p.pageType==='main') || (project&&project.pages||[])[0];
    const d=(home&&home.data)||{};
    return { productName:d.productName||(project&&project.shared&&project.shared.productName)||'', primaryCta:d.primaryCta||'',
             footerLinks:d.footerLinks||[], footerCopyright:d.footerCopyright||'' };
  }

  const A_LABEL={ productName:'제품명', tagline:'태그라인', subcopy:'소개 문구', primaryCta:'CTA 버튼', features:'기능 카드',
                  stats:'지표 수치', bannerText:'배너 문구', bannerCta:'배너 버튼', footerLinks:'푸터 링크', footerCopyright:'저작권 문구' };

  // 흐름 토큰 — '다시'로 재시작하면 이전 흐름의 남은 await가 위젯을 덮어쓰지 않게 버린다
  let flowSeq=0;
  async function startPageIntake(){
    const my=++flowSeq;
    const dead=()=>my!==flowSeq;
    // 메인홈/랜딩(단일)도 대화형으로 — 유형 선택 없이 바로 내용부터. 하위 페이지만 유형을 묻는다.
    const isMain = !project || project.kind==='single' || (pageRef && (pageRef.pageType||'main')==='main');
    let t;
    if(isMain){
      pageType='main';
      t={ id:'main', label: (project&&project.kind==='single') ? '랜딩페이지' : '메인홈' };
      if(project&&pageRef){ pageRef.pageType='main'; upsertProject(project); }
      botBubble(tL('어떤 페이지를 만들지 자유롭게 적어주세요. 무엇을 소개하는지, 누구에게 보여줄지, 꼭 들어갈 내용이면 충분해요. 나머지는 초안으로 채워드릴게요.'));
    } else {
      idx=STEPS.indexOf('pageType');
      botBubble(PROMPT.pageType);
      t=await askChips(PAGE_KINDS); if(dead()) return;
      pageType=t.id;
      if(window.pageScaffold) Object.assign(data, pageScaffold(t.id, (project&&project.shared)||{}));   // 유형별 기본 섹션 콘텐츠(빈 화면 방지)
      if(project&&pageRef){ pageRef.pageType=t.id; pageRef.name=tL(t.label); upsertProject(project); renderRail(); }
      meBubble(tL(t.label)); render();
      botBubble(tL('이 페이지에 담을 내용을 자유롭게 적어주세요. 목적·대상·꼭 넣을 항목이면 충분해요. 나머지는 초안으로 채워드릴게요.'));
    }
    const plan=await askText('예: 스타터·프로·엔터프라이즈 3개 요금제 비교. 중소기업 대상이고 연간 결제 20% 할인 강조.', '건너뛰기 — 알아서 채워줘'); if(dead()) return;
    if(plan) meBubble(plan);

    // 되묻기 — 결과 품질에 정말 필요한 것만 최대 2개. 실패해도 그냥 진행.
    const answers=[];
    if(plan){
      const tp=pendingBubble('내용 읽는 중…');
      let it=null;
      /* 하위 페이지는 타겟 고객·브랜드 톤이 이미 사이트에서 정해진 것 — 다시 묻지 않는다(프롬프트로 막고 SKIP_Q로 이중 차단).
         메인홈/랜딩은 사이트의 얼굴이라 타겟 질문 허용. */
      const ipl=(isMain ? '' : '기존 사이트의 하위 페이지다. 타겟 고객·대상 독자·브랜드 톤은 사이트 전체에서 이미 정해져 있으니 묻지 말 것.\n')
              + tL(t.label)+' 페이지: '+plan;
      try{ it=await LLM.intake({kind:'web-page', plan:ipl}); }catch(e){ console.warn('[ai] intake 실패(무시)', e); }
      tp.remove(); if(dead()) return;
      const SKIP_Q=/(타겟|대상\s*(고객|독자|층)|고객층|주요\s*고객|브랜드\s*톤|target\s*(audience|customer)|tone)/i;
      const qs=(it&&it.questions||[]).filter(q=>isMain||!SKIP_Q.test(q.q));
      if(qs.length){
        botBubble(tL('좋아요! 더 정확한 초안을 위해 몇 가지만 여쭤볼게요.'));
        for(const q of qs){
          botBubble(q.q);
          const a=await askText('답변을 입력하세요', '건너뛰기'); if(dead()) return;
          if(a){ meBubble(a); answers.push(q.q+' → '+a); }
        }
      }
    }

    // 초안 생성 — 우측 프리뷰에 진행 표시
    const ctx=siteCtx();
    const brief=[
      '사이트: '+((project&&project.name)||''),
      ctx.productName?('제품/서비스: '+ctx.productName):'',
      '이 페이지 유형: '+t.label,
      plan?('페이지 내용:\n'+plan):'페이지 내용: (지정 없음 — 유형에 맞는 일반적인 구성으로)',
      answers.length?('추가 정보:\n'+answers.join('\n')):'',
      '주의: 사이트 전체가 아니라 이 페이지 하나만 작성한다.',
    ].filter(Boolean).join('\n');
    const stop=genStart();
    const wait=pendingBubble('초안 만드는 중…');
    let draft=null;
    try{ draft=await LLM.composeSite({ product:ctx.productName, name:(project&&project.name)||'', plan:brief, kind:'single', lang:(project&&project.lang)||'ko' }); }
    catch(e){ console.warn('[ai] compose-web 실패 → 대화 폴백', e); }
    wait.remove(); stop(!!draft); if(dead()) return;

    if(!draft){
      botBubble(tL('AI 초안 생성에 실패했어요. 대화로 하나씩 채워볼게요.'));
      advance(); return;                                   // pageType 다음(정보량)부터 옛 플로우
    }
    data=Object.assign(structuredClone(EMPTY), {
      productName: draft.productName||ctx.productName||'',
      tagline: draft.tagline||'', subcopy: draft.subcopy||'',
      primaryCta: draft.primaryCta||ctx.primaryCta||'',
      features: draft.features||[], stats: draft.stats||[],
      bannerText: draft.bannerText||'', bannerCta: draft.bannerCta||'',
      footerLinks: (draft.footerLinks&&draft.footerLinks.length)?draft.footerLinks:ctx.footerLinks,
      footerCopyright: draft.footerCopyright||ctx.footerCopyright||'',
    });
    volume='heavy'; generated=true; idx=STEPS.indexOf('done');
    persist(); render(); renderRail();
    const assumed=[...new Set((draft.assumed||[]).map(k=>tL(A_LABEL[k]||'')).filter(Boolean))];
    let msg=tL('✨ 초안을 만들었어요. 오른쪽에서 확인해보세요.');
    if(assumed.length) msg+='\n\n'+tL('참고로')+' '+assumed.join(' · ')+tL('은(는) 내용에 없어서 예시로 채워뒀어요. 편집 버튼을 눌러 실제 내용으로 다듬어보세요!');
    botBubble(msg); mountWidget('done'); scroll();
  }

  function buildWidget(step){
    if(step==='kind') return chips([{id:'single',label:'랜딩페이지',hint:'단일페이지 · 랜딩·공지'},{id:'multi',label:'웹사이트',hint:'다중페이지 · 여러 페이지'}], o=>advance(tL(o.label)));
    if(step==='pageType') return chips(['제품 기능소개','요금 비교','랜딩'].map(p=>({id:p,label:p})), o=>{ pageType=PAGETYPE[o.label]||'features'; if(project&&pageRef){ pageRef.pageType=pageType; pageRef.name=o.label; upsertProject(project); renderRail(); } render(); advance(tL(o.label)); });
    if(step==='mainSections') return mainSectionPicker();
    if(step==='volume') return chips([{id:'compact',label:'컴팩트',hint:'핵심만'},{id:'mid',label:'중간',hint:'균형'},{id:'heavy',label:'헤비',hint:'풍성'}], o=>{ volume=o.id; render(); advance(tL(o.label)); });
    if(step==='facts'){
      const wrap=el('div','card');
      const f=[['productName','제품명 — 예: Onsite'],['tagline','태그라인 — 예: 대화만으로 완성되는 웹페이지'],['subcopy','서브 카피 — 한 줄 설명'],['primaryCta','주 CTA — 예: 무료로 시작하기']];
      f.forEach(([k,ph])=>{ const i=el('input','inp'); i.placeholder=tL(ph); i.value=data[k]; i.oninput=()=>{data[k]=i.value;render();}; wrap.append(i); });
      wrap.append(nextBtn(tL('다음 →'), ()=>advance(`${data.productName||'제품명'} · ${data.tagline||'태그라인'}`)));
      return wrap;
    }
    if(step==='features') return listWidget('features',[['title','기능명 — 예: 대화형 입력'],['desc','한 줄 설명']], it=>`${tL('기능')} ${it.length}${tL('개 입력')}`);
    if(step==='stats') return listWidget('stats',[['value','수치 — 예: 3분'],['label','라벨 — 예: 평균 생성 시간']], it=>`${tL('지표')} ${it.length}${tL('개 입력')}`, true);
    if(step==='banner'){
      const wrap=el('div','card');
      [['bannerText','배너 문구 — 예: 지금 바로 첫 페이지를 만들어보세요'],['bannerCta','배너 버튼 — 예: 무료로 시작하기']].forEach(([k,ph])=>{
        const i=el('input','inp'); i.placeholder=tL(ph); i.value=data[k]; i.oninput=()=>{data[k]=i.value;render();}; wrap.append(i); });
      wrap.append(nextBtn(tL('다음 →'), ()=>advance(data.bannerText||tL('배너 문구 입력'))));
      return wrap;
    }
    if(step==='footer'){
      const wrap=el('div','card');
      const lk=el('input','inp'); lk.placeholder=tL('푸터 링크 (쉼표로 구분) — 예: 이용약관, 개인정보처리방침, 문의'); lk.value=(data.footerLinks||[]).join(', ');
      lk.oninput=()=>{ data.footerLinks=lk.value.split(',').map(s=>s.trim()).filter(Boolean); render(); };
      const cp=el('input','inp'); cp.placeholder=tL('저작권 문구 (선택) — 예: © 2026 Onsite Labs'); cp.value=data.footerCopyright||'';
      cp.oninput=()=>{ data.footerCopyright=cp.value; render(); };
      wrap.append(lk, cp, nextBtn(tL('✓ 생성하기'), ()=>advance(tL('푸터 설정 완료'))));
      return wrap;
    }
    // done
    const d=el('div','card'); d.style.textAlign='center';
    // 편집전용(이메일/PPT): 재생성 없이 편집 안내만 (packMode.doneKo)
    if(curMode().editOnly){
      // PPT 계열은 채팅 온보딩(✏️ 안내)이 같은 내용을 말하므로 카드 문구 생략 — 패널만 갱신
      if(curMode().slides){ refreshPptPanel(); d.style.display='none'; return d; }
      d.append(el('div','',`<span style="color:var(--tx2);font-size:13px">${tL(curMode().doneKo||'우측 편집 버튼으로 수정하세요.')}</span>`));
      return d;
    }
    d.append(el('div','',`<span style="color:var(--tx2);font-size:13px">${tL('우측 편집 버튼으로 텍스트·이미지·섹션 순서를 바꿀 수 있어요.')}</span>`));
    d.append(nextBtn(tL('↺ 새로 만들기'), reset));
    // 웹/랜딩: 자연어 수정 채팅 활성화 (eDM·PPT는 editOnly라 여기 안 옴)
    setTimeout(initWebChat, 0);
    return d;
  }

  /* ---- PPT 슬라이드 관리 패널 (data.slides[] 추가·삭제·순서). 편집전용 done 위젯에 삽입 ---- */
  function scrollToSlide(i){
    try{ const fw=frame.contentWindow, s=frame.contentDocument.querySelectorAll('.ppt-stack > .slide')[i]; if(!s) return;
      const r=s.getBoundingClientRect(); const y=fw.scrollY + r.top - Math.max(0,(fw.innerHeight-r.height)/2);
      fw.scrollTo({top:Math.max(0,y), behavior:'smooth'});
      setTimeout(()=>{ try{ if(Math.abs(fw.scrollY-Math.max(0,y))>40) fw.scrollTo(0,Math.max(0,y)); }catch(e){} },350);   // smooth 미동작 환경 폴백
    }catch(e){}
  }
  // AI가 방금 추가/수정한 슬라이드 인덱스 표시(패널 배지 + 프리뷰 플래시). 수동 조작 시 해제.
  let _pptMarks={};   // {idx:'new'|'mod'}
  function pptMutate(fn){ if(!Array.isArray(data.slides)) data.slides=[]; pushUndo(); _pptMarks={}; fn(data.slides); persist(); render(); refreshPptPanel(); }
  // 프리뷰에서 해당 장들로 시선 유도: 첫 변경 장으로 스크롤 + 잠시 액센트 테두리
  function flashSlides(idxs){
    if(!idxs.length) return;
    setTimeout(()=>{ try{
      const doc=frame.contentDocument, ss=doc.querySelectorAll('.ppt-stack > .slide');
      idxs.forEach(i=>{ const s=ss[i]; if(!s) return;
        s.style.transition='box-shadow .4s ease'; s.style.boxShadow='0 0 0 4px #8b5cf6, 0 12px 40px rgba(0,0,0,.4)';
        setTimeout(()=>{ s.style.boxShadow=''; }, 2600);
      });
      if(ss[idxs[0]]) ss[idxs[0]].scrollIntoView({behavior:'smooth',block:'center'});
    }catch(e){} }, 450);   // srcdoc 로드 대기
  }
  // 라이브 DOM에서 현재 패널을 찾아 교체(init 중 done 위젯이 여러 번 마운트돼 캡처 참조가 분리될 수 있음)
  let _pptFolded=true;   // 기본 접힘 — 필요할 때만 펼쳐 공간 확보
  // 생성 직후 진입: 슬라이드가 하나씩 만들어지는 듯한 순차 등장(1회)
  let _pptRevealPending=false;
  function revealSlides(){
    try{ const ss=[...frame.contentDocument.querySelectorAll('.ppt-stack > .slide')];
      ss.forEach((s,i)=>{
        s.style.opacity='0'; s.style.transform='translateY(22px)';
        s.style.transition='opacity .55s ease, transform .55s ease'; s.style.transitionDelay=(i*0.16)+'s';
        setTimeout(()=>{ s.style.opacity='1'; s.style.transform=''; }, 40);
        setTimeout(()=>{ s.style.transition=''; s.style.transitionDelay=''; }, 1300+i*160);
      });
    }catch(e){}
  }

  // 슬라이드 내비 = 프리뷰 좌측 썸네일 스트립(젠스파크식). 구조 변경 시 재빌드
  function refreshPptPanel(){ rebuildThumbRail(); }
  let _curThumb=0;
  function setCurThumb(i){ _curThumb=i; document.querySelectorAll('#thumbRail .thumb').forEach((t,k)=>t.classList.toggle('cur',k===i)); }

  /* 썸네일 재정렬 DnD — 드롭 판정을 레일 전체에 위임한다.
     썸네일에만 걸면 썸네일 사이 여백(gap 8px)·레일 패딩에 놓을 때 무반응이고,
     드롭라인이 삽입되며 요소가 밀려 커서가 그 여백에 빠지기 쉽다. */
  let _dragI=null, _dropAt=null;
  const _dropline=el('div','dropline');
  function clearThumbDnd(){ _dropline.remove(); _dropAt=null; }
  function wireThumbRailDnd(rail){
    if(rail.__dndWired) return; rail.__dndWired=true;   // 레일 엘리먼트는 재빌드에도 유지 → 1회만 배선
    rail.addEventListener('dragover',(e)=>{
      if(_dragI==null) return;
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      _dropline.remove();   // 측정 전 제거 — 드롭라인 높이가 판정에 끼어들어 흔들리는 것 방지
      const ts=[...rail.querySelectorAll('.thumb')];
      let at=ts.length;
      for(let k=0;k<ts.length;k++){ const rc=ts[k].getBoundingClientRect();
        if(e.clientY < rc.top+rc.height/2){ at=k; break; } }
      _dropAt=at;
      rail.insertBefore(_dropline, ts[at] || rail.querySelector('.thumb-add'));
      // 레일 위·아래 끝에서 자동 스크롤 — 장수가 많아 화면 밖인 위치로도 옮길 수 있게
      const rr=rail.getBoundingClientRect(), edge=48;
      if(e.clientY<rr.top+edge) rail.scrollTop-=16;
      else if(e.clientY>rr.bottom-edge) rail.scrollTop+=16;
    });
    rail.addEventListener('dragleave',(e)=>{ if(!rail.contains(e.relatedTarget)) clearThumbDnd(); });
    rail.addEventListener('drop',(e)=>{
      e.preventDefault(); const from=_dragI, at=_dropAt; clearThumbDnd();
      if(from==null||at==null) return;
      let to=at; if(from<to) to--; if(to===from) return;
      pptMutate(a=>{ const m=a.splice(from,1)[0]; a.splice(to,0,m); });
      setTimeout(()=>{ setCurThumb(to); scrollToSlide(to); },100);
    });
  }

  // 단일 장 렌더용 복사본 — naver 팩은 챕터 컬러가 "앞 간지"에서 상속되므로
  // 한 장만 떼어 그리면 기본색(그린)으로 떨어진다. 상속된 ch를 명시 주입해 본판과 색을 맞춘다.
  function soloSlide(arr, i){ const s=JSON.parse(JSON.stringify(arr[i]));
    if((data.style||'')==='naver' && !s.ch && s.type!=='cover'){
      for(let k=i-1;k>=0;k--){ const p=arr[k]; if(p && p.type==='divider' && p.ch){ s.ch=p.ch; break; } } }
    return s; }
  // 한 장만 가볍게 다시 그림 — 텍스트 blur·툴바 조작 후 좌측 썸네일 즉시 반영(사용자 지시)
  function refreshThumbAt(i){ const t=document.querySelectorAll('#thumbRail .thumb')[i]; if(!t||typeof renderDeckFor!=='function'||!(data.slides&&data.slides[i])) return;
    const f=t.querySelector('iframe'); if(f) f.srcdoc=renderDeckFor([soloSlide(data.slides,i)]); }
  function rebuildThumbRail(){
    const rail=document.getElementById('thumbRail'); if(!rail) return;
    if(!curMode().slides || typeof renderPptDeck!=='function'){ rail.style.display='none'; return; }
    rail.style.display='flex'; rail.innerHTML='';
    const W=132, sc=(W-4)/1280;   // 테두리 2px×2 제외한 내부 폭 기준 — 위아래 빈틈 없이 꽉 채움
    wireThumbRailDnd(rail);
    (data.slides||[]).forEach((s,i)=>{
      const t=el('div','thumb','<span class="tnum">'+(i+1)+'</span><button class="tdup" title="'+tL('복제')+'">⧉</button><button class="tdel" title="'+tL('삭제')+'">✕</button>');
      t.style.width=W+'px';   // 높이는 aspect-ratio 16/9가 결정(비율 정확)
      const f=document.createElement('iframe'); f.setAttribute('scrolling','no');
      f.srcdoc=renderDeckFor([soloSlide(data.slides,i)]);
      f.style.transform='scale('+sc+')';
      t.append(f);
      t.onclick=(e)=>{ if(e.target.closest('.tdel')||e.target.closest('.tdup')) return; setCurThumb(i); scrollToSlide(i); };
      // 복제 — 이 장을 복사해 바로 뒤에 붙여넣기 (위치는 드래그로 조정)
      t.querySelector('.tdup').onclick=(e)=>{ e.stopPropagation();
        pptMutate(a=>{ a.splice(i+1,0,JSON.parse(JSON.stringify(a[i]))); });
        setTimeout(()=>{ setCurThumb(i+1); scrollToSlide(i+1); },150); };
      t.querySelector('.tdel').onclick=(e)=>{ e.stopPropagation();
        if((data.slides||[]).length<=1){ uiAlert(tL('마지막 슬라이드는 삭제할 수 없어요.')); return; }
        uiConfirm(tL('이 슬라이드를 삭제할까요?'),{title:tL('슬라이드 삭제'),okText:tL('삭제'),danger:true}).then(ok=>{ if(ok) pptMutate(a=>a.splice(i,1)); }); };
      // 드래그&드롭으로 원하는 위치에 재배치 (드롭 판정은 wireThumbRailDnd가 레일에서 담당)
      t.draggable=true;
      t.addEventListener('dragstart',(e)=>{ _dragI=i; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(i)); setTimeout(()=>t.classList.add('dragging'),0); });
      t.addEventListener('dragend',()=>{ t.classList.remove('dragging'); _dragI=null; clearThumbDnd(); });
      rail.append(t);
    });
    const add=el('div','thumb-add');
    const ab=el('button','','+ '+tL('추가'));
    const menu=el('div','thumb-menu');
    slidePack().types.forEach(tp=>{ const b=el('button','',tp.label);
      b.onclick=(e)=>{ e.stopPropagation(); menu.classList.remove('open'); pptMutate(a=>a.push(slidePack().make(tp.type))); setTimeout(()=>{ setCurThumb((data.slides||[]).length-1); scrollToSlide((data.slides||[]).length-1); },150); }; menu.append(b); });
    ab.onclick=(e)=>{ e.stopPropagation(); menu.classList.toggle('open'); };
    document.addEventListener('click',(e)=>{ if(!add.contains(e.target)) menu.classList.remove('open'); });
    add.append(ab,menu); rail.append(add);
    setCurThumb(Math.min(_curThumb,(data.slides||[]).length-1));
    fitPreview();   // 레일 노출로 줄어든 폭 반영
  }

  /* ---- 라이브 생성 — index에서 넘어온 pendingBrief를 스튜디오에서 스트리밍 생성.
     좌측 챗이 과정을 안내하고, 우측 뷰어·썸네일 레일에 장표가 한 장씩 실제로 그려진다. ---- */
  let _liveComposing=false;
  // 스트리밍 누적 텍스트에서 "완결된 슬라이드 객체"만 추출 — 중괄호 밸런스 스캔(문자열 내 괄호 무시)
  function partialSlides(full){
    const i=full.indexOf('"slides"'); if(i<0) return [];
    const a=full.indexOf('[', i); if(a<0) return [];
    const out=[]; let depth=0, start=-1, inStr=false, esc=false;
    for(let k=a+1;k<full.length;k++){
      const ch=full[k];
      if(inStr){ if(esc) esc=false; else if(ch==='\\') esc=true; else if(ch==='"') inStr=false; continue; }
      if(ch==='"'){ inStr=true; continue; }
      if(ch==='{'){ if(depth===0) start=k; depth++; }
      else if(ch==='}'){ depth--; if(depth===0 && start>=0){ try{ const o=JSON.parse(full.slice(start,k+1)); if(o && o.type) out.push(o); }catch(e){} start=-1; } }
      else if(ch===']' && depth===0) break;
    }
    return out;
  }
  // 라이브 레일 — "연출이 끝난 장"까지만 표시(_liveShownN). 스트리밍이 앞서가도 레일은 재생 속도를 따라감
  let _liveShownN=0;
  function paintLiveRail(){
    const rail=document.getElementById('thumbRail'); if(!rail) return;
    rail.style.display='flex'; rail.innerHTML='';
    const W=132, sc=(W-4)/1280;
    const done=(data.slides||[]).slice(0, _liveShownN);
    done.forEach((s,i)=>{
      const t=el('div','thumb','<span class="tnum">'+(i+1)+'</span>'); t.style.width=W+'px';
      const f=document.createElement('iframe'); f.setAttribute('scrolling','no');
      f.srcdoc=renderDeckFor([soloSlide(done,i)]); f.style.transform='scale('+sc+')';
      t.append(f); rail.append(t);
    });
    // 라이브 중엔 "지금 그리는 장" 1칸을 스켈레톤으로 — 레일이 비어 보이지 않게
    if(_liveComposing){ const t=el('div','thumb skel','<span class="tnum">'+(done.length+1)+'</span>'); t.style.width=W+'px'; rail.append(t); }
    const cu=rail.children[Math.max(0,done.length-1)]; if(cu) cu.scrollIntoView({block:'nearest'});
    fitPreview();
  }
  // AI 작업 커서 — 사람이 조작하듯 뷰어 위를 빠르게 오가며 클릭 펄스 후 장이 그려짐
  function aiCur(){ return document.getElementById('aiCursor'); }
  function cursorShow(on){ const c=aiCur(); if(c) c.classList.toggle('on', !!on); }
  function cursorTo(fx,fy,click){
    const c=aiCur(); if(!c) return;
    const r=frame.getBoundingClientRect(), pr=frame.parentElement.getBoundingClientRect();
    c.style.transform='translate('+(r.left-pr.left+r.width*fx)+'px,'+(r.top-pr.top+r.height*fy)+'px)';
    if(click){ c.classList.remove('click'); void c.offsetWidth; c.classList.add('click'); }
  }
  function cursorToPx(x,y,click){
    const c=aiCur(); if(!c) return;
    c.style.transform='translate('+x+'px,'+y+'px)';
    if(click){ c.classList.remove('click'); void c.offsetWidth; c.classList.add('click'); }
  }
  // 뷰어 초기 스켈레톤 — 16:9 "빈 장표 카드" 한 장만 (뷰어 전체로 늘어지지 않게)
  function skeletonSlideHtml(){
    const bar=(w,h)=>'<div style="height:'+h+'%;width:'+w+'%;border-radius:10px;background:linear-gradient(100deg,#e9edf4 40%,#f7f9fc 50%,#e9edf4 60%);background-size:200% 100%;animation:s 1.4s linear infinite"></div>';
    return '<!doctype html><html><body style="margin:0;background:#0b0e16;display:flex;justify-content:center;align-items:flex-start;padding:18px 14px;box-sizing:border-box">'
      + '<div style="width:min(96vw,1280px);aspect-ratio:16/9;background:#fff;border-radius:10px;box-sizing:border-box;padding:6% 7%;display:flex;flex-direction:column;gap:5%;box-shadow:0 10px 40px rgba(0,0,0,.35)">'
      // 첫 장이 완결되기 전에도 스트리밍으로 도착하는 제목 글자를 여기 실시간으로 쓴다
      + '<div id="skTitle" style="min-height:14%;font:600 46px/1.3 Pretendard,\'Apple SD Gothic Neo\',sans-serif;color:#141a2a;letter-spacing:-.5px"></div>'
      + bar(66,6) + '<div style="flex:1"></div>' + bar(88,5) + bar(78,5) + bar(56,5)
      + '</div><style>@keyframes s{to{background-position:-200% 0}}</style></body></html>';
  }
  /* 장 리빌 — 텍스트를 숨겼다가 커서가 그 자리로 옮겨가며 하나씩 표시.
     제목류(큰 글씨)는 글자 단위 타이핑. 큐가 밀려 있으면(fast) 가속. done 콜백 필수. */
  let _revealTimer=null, _revealCleanup=null;
  function revealSlideTyping(done, fast, rootEl){
    const doc=frame.contentDocument;
    if(!doc || !doc.body){ if(done) done(); return; }
    const root=rootEl||doc.body;   // 스택 재생 시 "방금 추가된 장"만 리빌 — 앞 장들은 그대로 둔다
    // 모든 텍스트 리프를 숨긴다(개수 제한 없음 — 일부만 숨기면 "이미 써진 글자"가 어색하게 남는다).
    // offsetParent 대신 rect 검사 — SVG 안 글자(차트 라벨·수치)도 포함.
    // "텍스트+<b>류 인라인"이 섞인 문장(마크업 강조)은 부모를 통째로 한 단위로 —
    // 리프만 잡으면 <b>만 숨고 나머지 일반 텍스트가 미리 보인다.
    const INLINE=/^(B|I|EM|STRONG|SPAN|SMALL|U|SUP|SUB)$/;
    const hasDT=e=>[...e.childNodes].some(n=>n.nodeType===3 && n.textContent.trim());
    const all=[...root.querySelectorAll('*')].filter(e=>{ const r=e.getBoundingClientRect(); return r.width>0 && r.height>0; });
    // 텍스트 단위 — 리프, 또는 직접 텍스트를 가진 요소(자식이 블록이어도 그 문장은 이 단위 소속).
    // CSS 생성 텍스트(::before/::after 번호·체크·라벨) — 골격으로 새면 "이미 쳐진 글자"로 보인다
    const psText=e=>{ try{ const gs=doc.defaultView.getComputedStyle; const has=v=>v&&v!=='none'&&v!=='normal'&&/[0-9A-Za-z가-힣✓·]/.test(v);
      return has(gs(e,'::before').content)||has(gs(e,'::after').content); }catch(_){ return false; } };
    let els=all.filter(e=>{
      const hasTxt=e.textContent && e.textContent.trim();
      if(hasTxt && e.children.length===0) return true;
      if(hasTxt && hasDT(e)) return true;
      return psText(e);
    });
    // 인라인 강조(<b> 등)만 품은 부모가 잡혔으면 그 인라인 자식은 제외(이중 처리 방지)
    els=els.filter(e=>!els.some(p=>p!==e && p.contains(e) && [...p.children].every(c=>INLINE.test(c.tagName) || !c.contains(e))));
    // 골격(도형·사진·차트·컨테이너 — 텍스트 단위가 아닌 전부) — 텍스트보다 먼저 위→아래로 슥 깔린다
    const skel=all.filter(e=>els.indexOf(e)<0);
    const byY=(a,b)=>{ const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
      return (Math.abs(ra.top-rb.top)>8 ? ra.top-rb.top : ra.left-rb.left); };
    skel.sort(byY);
    if(!els.length && !skel.length){ if(done) done(); return; }
    // 화면 위→아래(같은 줄이면 왼→오른쪽) 순서로 등장 — DOM 순서는 grid/절대배치에서 뒤섞인다
    els.sort(byY);
    // 요소가 많아도 장 전체 리빌 시간은 일정하게 — 한 개당 간격을 개수로 나눠 가속
    const stepMs = fast ? Math.max(28, Math.min(110, 1400/Math.max(1,els.length)))
                        : Math.max(50, Math.min(270, 3800/Math.max(1,els.length)));
    // 초기 숨김은 srcdoc의 #lvhide(CSS)가 담당 — 여기선 텍스트 원문만 보관
    els.forEach(e=>{ e.__full=e.textContent; });
    // 골격 선등장 — 빈 지면에 도형·박스가 위에서부터 빠르게 깔린 뒤 텍스트가 써진다
    skel.forEach((e,k)=>{ setTimeout(()=>{ e.style.visibility='visible'; }, Math.min(k*(fast?8:16), fast?260:600)); });
    const fr=frame.getBoundingClientRect(), pr=frame.parentElement.getBoundingClientRect();
    const iw=(frame.contentWindow && frame.contentWindow.innerWidth) || 1280, sc=fr.width/iw;
    let i=0, typedN=0;
    const unhide=()=>{ try{ const st=doc.getElementById('lvhide'); if(st) st.remove(); }catch(e){} };   // 통짜 숨김 해제 — 이후엔 전부 기본 표시
    _revealCleanup=()=>{ clearTimeout(_revealTimer);
      // 마크업 섞인 요소는 textContent 복원 금지(굵기 <b>가 날아간다) — 표시만 되살린다
      els.forEach(e=>{ if(e.__full!=null && e.children.length===0) e.textContent=e.__full; e.style.visibility=''; });
      skel.forEach(e=>{ e.style.visibility=''; });
      unhide();
      _revealCleanup=null; };
    function typeText(e, cb){
      const full=e.__full; e.textContent=''; e.style.visibility='visible';
      let k=0;
      (function t(){ if(k>=full.length){ cb(); return; }
        k+=1; e.textContent=full.slice(0,k); _revealTimer=setTimeout(t, fast?14:42); })();
    }
    (function step(){
      if(i>=els.length){ unhide(); _revealCleanup=null; if(done) done(); return; }
      const e=els[i], r=e.getBoundingClientRect();
      cursorToPx(fr.left-pr.left + (r.left+Math.min(r.width*0.4,80))*sc,
                 fr.top-pr.top + (r.top+r.height*0.5)*sc, i%3===0);
      i++;
      const fs=parseFloat((doc.defaultView.getComputedStyle(e).fontSize))||14;
      if(fs>=24 && typedN<2 && e.children.length===0 && e.__full.trim().length>2){
        typedN++;
        _revealTimer=setTimeout(()=>typeText(e, ()=>{ _revealTimer=setTimeout(step, stepMs); }), fast?100:300);
      } else {
        e.style.visibility='visible';
        _revealTimer=setTimeout(step, stepMs);
      }
    })();
  }
  /* 준비 게이트 — 첫 장이 완결될 때까지 풀스크린 프로그레스 모달. 걷히는 순간 바로 1번 장이 그려진다 */
  function showLiveGate(){
    const ov=el('div','livegate');
    ov.innerHTML='<div class="lg-box"><div class="lg-orb"></div><b class="lg-stage">'+tL('브리프를 분석하고 있어요…')+'</b>'
      +'<div class="lg-bar"><i style="width:12%"></i></div>'
      +'<span class="lg-hint">'+tL('세팅이 끝나면 한 장씩 그려져요')+'</span></div>';
    document.body.append(ov);
    const st=ov.querySelector('.lg-stage'), bar=ov.querySelector('.lg-bar i');
    /* 바는 감속 곡선으로 96%에 수렴(단조증가) — 문구는 바 위치에 연동.
       짧은 런은 앞 문구만 보고 끝나고, 긴 런(20장+)일수록 뒷 문구가 자연히 늦게 나온다.
       "첫 장부터 그릴게요"는 92%(체감 ~37초)에서만. */
    /* 문구는 고정 3초 균등 간격으로 7개 순차 — 마지막 문구에서 유지(언제 끝날지 모르는 대기).
       바는 감속 곡선으로 96% 수렴(단조증가) — 문구와 독립. */
    const main=[   // 0·4·8·12·16·20초 균등 — 마지막 "곧, 첫 장부터"는 바 95% 도달 시(오래 걸리는 런에서만)
      tL('분석을 완료했어요'),
      tL('핵심 메시지를 정리하고 있어요…'),
      tL('목차를 구성하고 있어요…'),
      tL('장표 기획 내용을 정리하고 있어요…'),
      tL('기획을 보완하고 있어요…'),
    ];
    const finalMsg=tL('곧, 첫 장부터 그릴게요…');
    let barW=12, pi=0, finalShown=false;
    const tb=setInterval(()=>{ barW=Math.min(96, barW+(96-barW)*0.033); bar.style.width=barW.toFixed(1)+'%';   // 감속 곡선 — 3초 30%·12초 65%·24초 84%·95%≈54초
      if(!finalShown && barW>=95){ finalShown=true; st.textContent=finalMsg; } }, 400);
    const tp=setInterval(()=>{ if(finalShown || pi>=main.length){ clearInterval(tp); return; } st.textContent=main[pi]; pi++; }, 4000);
    return { close:()=>{ clearInterval(tb); clearInterval(tp); bar.style.width='100%'; ov.classList.add('off'); setTimeout(()=>ov.remove(), 320); } };
  }

  /* 재생 큐 — 스트리밍 도착 속도와 무관하게 "한 장 한 장 천천히" 순서대로 연출.
     뷰어는 완성 장 누적 스택 — 새 장은 맨 아래에 추가되고 스크롤이 따라 내려간다. */
  let _slideQ=[], _slidePlaying=false, _liveStreamDone=false, _liveDrainCb=null, _livePbub=null, _livePlayed=[];
  function queueSlide(slide, num){
    _slideQ.push({slide:slide, num:num});
    playNextSlide();
  }
  // 다음 장 대기 스켈레톤 — 완성 스택 맨 아래 "다음 장 자리"를 깔아 쌓이는 흐름이 끊기지 않게
  function appendSkelCard(){
    try{
      const doc=frame.contentDocument, stack=doc && doc.querySelector('.ppt-stack');
      if(!stack || doc.getElementById('liveSkel')) return;
      if(!doc.getElementById('liveSkelKf')){ const st=doc.createElement('style'); st.id='liveSkelKf'; st.textContent='@keyframes lsq{to{background-position:-200% 0}}'; doc.head.append(st); }
      const d=doc.createElement('div'); d.id='liveSkel';
      d.style.cssText='width:var(--slide-w,1280px);height:var(--slide-h,720px);flex:none;border-radius:6px;opacity:.5;background:linear-gradient(100deg,#141926 40%,#1d2436 50%,#141926 60%);background-size:200% 100%;animation:lsq 1.4s linear infinite';
      stack.append(d);
      d.scrollIntoView({behavior:'smooth', block:'end'});
    }catch(e){}
  }
  function playNextSlide(){
    if(_slidePlaying) return;
    const item=_slideQ.shift();
    if(!item){ if(_liveStreamDone && _liveDrainCb){ const cb=_liveDrainCb; _liveDrainCb=null; cb(); } return; }
    _slidePlaying=true;
    if(_livePbub) _livePbub.textContent='✍️ '+item.num+tL('번째 장 작성 중')+(item.slide.title?' — '+item.slide.title:'');
    const fast=_slideQ.length>3;   // 넉 장 이상 밀릴 때만 가속 — 기본은 느긋하게(로딩 시간을 연출로 채움)
    const fin=()=>{ _liveShownN=item.num; paintLiveRail(); _slidePlaying=false;
      if(_liveComposing && _slideQ.length===0 && !_liveStreamDone) appendSkelCard();
      setTimeout(playNextSlide, fast?250:800); };
    try{
      _livePlayed.push(JSON.parse(JSON.stringify(item.slide)));
      frame.onload=()=>{ frame.onload=null;
        let rootEl=null;
        try{
          const doc=frame.contentDocument, secs=doc.querySelectorAll('.ppt-stack > .slide');
          rootEl=secs.length?secs[secs.length-1]:null;
          if(rootEl) doc.defaultView.scrollTo(0, Math.max(0, rootEl.offsetTop-20));   // 새 장 위치로 즉시 스크롤 — 그 자리에서 그려진다
        }catch(e){}
        try{ revealSlideTyping(fin, fast, rootEl); }
        catch(e){ fin(); }
      };
      // 새 장은 "완전 빈 지면"으로 시작 — JS 필터가 놓치는 요소가 미리 보이는 일이 없도록 CSS로 통짜 숨김.
      // reveal이 요소별 인라인 visibility:visible로 걷어낸다(인라인이 이 규칙을 이김).
      frame.srcdoc=renderDeckFor(_livePlayed.map(s=>JSON.parse(JSON.stringify(s))))
        .replace('</head>','<style id="lvhide">.ppt-stack > .slide:last-child *{visibility:hidden}</style></head>');
    }catch(e){ _liveShownN=item.num; paintLiveRail(); _slidePlaying=false; playNextSlide(); }
  }
  async function startLiveCompose(){
    const brief=pageRef.pendingBrief;
    // pack 유실 방어 — 어떤 생성 경로든 프로젝트 스타일 팩이 워커 잠금 분기에 도달해야 한다
    try{ const PK={naver:1,rams:1,pastel:1,sfmi:1,machine:1,pitch:1,honors:1};
      if(brief && (!brief.pack || !PK[brief.pack]) && pack && PK[pack.id]) brief.pack=pack.id; }catch(e){}
    // 생성 언어로 덱 언어 기록 갱신 — 프로젝트 생성 때 박힌 옛 기록이 남아 표지 잠금 언어가 어긋나는 것 방지
    try{ data._clang = (window.I18N && I18N.getLang()) || localStorage.getItem('midas-lang') || data._clang || 'ko'; }catch(e){}
    try{ data._userTouched=false; data._touched={}; }catch(e){}   // 재생성 = 잠금 원복
    _liveComposing=true; generated=true; idx=STEPS.indexOf('done');
    botBubble('🪄 '+tL('네, 장표를 만들기 시작할게요! 오른쪽에서 한 장씩 그려지는 걸 지켜보세요.'));
    const prow=el('div','row'); const pbub=el('div','bub bot'); pbub.textContent=tL('목차를 구성하는 중…');
    prow.append(pbub); msgs.append(prow); scroll();
    _livePbub=pbub; _slideQ=[]; _slidePlaying=false; _liveStreamDone=false; _liveDrainCb=null; _liveShownN=0; _livePlayed=[];
    try{ empty.classList.add('hide'); }catch(e){}   // render()를 안 거치므로 빈 상태 오버레이 직접 숨김
    paintLiveRail(); cursorShow(true); cursorTo(0.3,0.28);
    try{ frame.srcdoc=skeletonSlideHtml(); }catch(e){}
    // 첫 장이 완결될 때까지 풀스크린 프로그레스 — 걷히는 순간 바로 1번 장이 그려진다
    const gate=showLiveGate(); let gateOpen=true;
    const closeGate=()=>{ if(gateOpen){ gateOpen=false; gate.close(); } };
    let n=0;
    const onText=(full)=>{
      const sl=partialSlides(full);
      if(sl.length>n){
        closeGate();   // 첫 장 준비 완료 → 모달 걷고 즉시 그리기 시작
        for(let k=n;k<sl.length;k++) queueSlide(JSON.parse(JSON.stringify(sl[k])), k+1);
        n=sl.length;
        data.slides=sl.map(s=>JSON.parse(JSON.stringify(s)));
      }
    };
    try{
      // 일시 오류(스트림 중단·과부하·JSON 깨짐)는 1회 자동 재시도 — 바로 템플릿 폴백하지 않는다
      let deck=null;
      for(let att=0; att<2 && !deck; att++){
        try{
          if(att>0){
            console.warn('[live compose 재시도]');
            _slideQ=[]; _slidePlaying=false; _liveStreamDone=false; _liveDrainCb=null; _livePlayed=[]; _liveShownN=0; n=0;
            try{ frame.srcdoc=skeletonSlideHtml(); }catch(e){}
          }
          deck=await LLM.composeDeck(brief, onText);
        }catch(e){ if(att>0) throw e; console.warn('[live compose 1차 실패 → 재시도]', e); }
      }
      closeGate();
      // 남은 큐를 다 재생할 때까지 대기 — "한 장 한 장 천천히"가 끝나야 완료 처리
      await new Promise(res=>{ _liveStreamDone=true; _liveDrainCb=res; playNextSlide(); });
      data.slides=deck.slides; data.style=deck.style||data.style; data.accent=deck.accent||data.accent;
      delete pageRef.pendingBrief;
      pageRef.data=JSON.parse(JSON.stringify(data));
      prow.remove();
      botBubble('✅ '+tL('완성!')+' '+deck.slides.length+tL('장을 만들었어요. 슬라이드 텍스트를 클릭하면 바로 고칠 수 있어요.'));
      pageRef.chat={ log:chatLog, idx:idx, generated:true };
      upsertProject(project);
      _liveComposing=false; _livePbub=null; if(_revealCleanup) _revealCleanup(); cursorShow(false); frame.onload=null;
      mountWidget('done'); render(); rebuildThumbRail(); scroll();
      initPptChat(); const hb=document.getElementById('histBtn'); if(hb) hb.onclick=undoAll; syncUndoUI();
      setTimeout(()=>{ const b=document.getElementById('editBtn'); if(b && !editMode) b.click(); }, 250);
    }catch(e){
      console.warn('[live compose 실패 → 템플릿 폴백]', e);
      closeGate();
      _slideQ=[]; _slidePlaying=false; _liveStreamDone=false; _liveDrainCb=null; _livePbub=null; _livePlayed=[];
      prow.remove(); if(_revealCleanup) _revealCleanup(); cursorShow(false); frame.onload=null;
      botBubble('⚠️ '+tL('AI 생성에 실패해 기본 구성으로 시작해요.')+' ('+(e&&e.message||'')+')');
      try{
        const pk=brief&&brief.pack;
        const fb = pk==='machine' && window.machineTemplateDeck ? machineTemplateDeck()
          : pk==='sfmi' && window.sfmiTemplateDeck ? sfmiTemplateDeck()
          : pk==='pastel' && window.pastelTemplateDeck ? pastelTemplateDeck()
          : pk==='rams' && window.ramsTemplateDeck ? ramsTemplateDeck()
                 : pk==='naver' && window.naverTemplateDeck ? naverTemplateDeck()
                 : pk==='honors' && window.honorsTemplateDeck ? honorsTemplateDeck()
                 : pk==='pitch' && window.pitchTemplateDeck ? pitchTemplateDeck()
                 : window.pptTemplateDeck ? pptTemplateDeck((brief&&brief.style)||'ax') : {slides:[]};
        data.slides=fb.slides;
      }catch(e2){}
      delete pageRef.pendingBrief;
      pageRef.data=JSON.parse(JSON.stringify(data));
      pageRef.chat={ log:chatLog, idx:idx, generated:true };
      upsertProject(project);
      _liveComposing=false;
      mountWidget('done'); render(); rebuildThumbRail(); scroll();
      initPptChat();
    }
  }

  /* ---- 웹/랜딩 내용수정 채팅 — PPT 챗 UI 재사용, LLM.editSite로 사이트 콘텐츠 패치 ---- */
  let _webChatOn=false;
  function initWebChat(){
    if(_webChatOn) return; if(curMode().editOnly) return;
    if(!(window.LLM && LLM.aiAvailable() && LLM.editSite)) return;
    const box=document.getElementById('pptChat'), inp=document.getElementById('pptcInp');
    const send=document.getElementById('pptcSend'), undoB=document.getElementById('pptcUndo');
    if(!box) return;
    _webChatOn=true; box.style.display='';
    inp.placeholder=tL('예: 히어로 문구를 더 임팩트 있게');
    addBot(tL('✏️ 말만 하면 고쳐드려요 — 문구·수치·기능 카드·페이지 문구까지. 🎨 디자인(색·글꼴·배치)은 스타일 팩이 자동 관리하고, 직접 고치려면 우측 편집 버튼을 쓰세요.'));
    const chips=[ '히어로 문구를 더 임팩트 있게', '기능 카드를 더 구체적으로', 'CTA 버튼 문구를 바꿔줘', '전체 톤을 더 신뢰감 있게' ];
    const cbox=document.getElementById('pptcChips'); cbox.innerHTML='';
    chips.forEach(c=>{ const b=el('button','pptc-chip',tL(c)); b.onclick=()=>{ inp.value=tL(c); doSend(); }; cbox.append(b); });
    const _webUndo=[];
    function syncU(){ undoB.style.display=_webUndo.length?'':'none'; }
    function swapData(next){ Object.keys(data).forEach(k=>{ delete data[k]; }); Object.assign(data, next); }
    async function doSend(){
      const t=inp.value.trim(); if(!t || send.disabled) return;
      meBubble(t); inp.value=''; send.disabled=true;
      const wk=workingBubble();
      const snap=JSON.stringify(data);
      const t0=Date.now();
      try{
        const res=await LLM.editSite(data, t);
        LLM.recordDur('edit', Date.now()-t0);
        wk.done();
        if(res.site){
          _webUndo.push(snap); if(_webUndo.length>20)_webUndo.shift();
          swapData(res.site);   // data 참조를 유지한 채 내용만 교체 — 다른 클로저가 data를 물고 있음
          persist(); render(); syncU();
          botBubble((res.message||tL('수정했어요.'))+' '+tL('(↺로 되돌릴 수 있어요)'));
        } else {
          botBubble(res.message||tL('요청을 이해하지 못했어요. 페이지 내용 수정을 말씀해주세요.'));
        }
      }catch(e){ wk.done(); botBubble(tL('수정에 실패했어요. 잠시 후 다시 시도해주세요.')+' ('+(e&&e.message||'')+')'); }
      finally{ send.disabled=false; scroll(); }
    }
    send.onclick=doSend;
    inp.onkeydown=(e)=>{ if(e.isComposing || e.keyCode===229) return; if(e.key==='Enter'){ e.preventDefault(); doSend(); } };
    undoB.onclick=()=>{ const s=_webUndo.pop(); if(!s) return; swapData(JSON.parse(s)); persist(); render(); syncU(); botBubble(tL('마지막 수정을 되돌렸어요.')); scroll(); };
    syncU();
  }

  /* ---- PPT 내용수정 채팅 — 내용·구조(추가/분할/삭제/순서) AI 수정. 디자인만 안내로 리다이렉트 ---- */
  // AI 작업중 버블: 단계 메시지 순환 + 경과초 + 진행바. 반환 {row, done()} — done()이 버블 제거.
  function workingBubble(){
    const stages=[ ['지시 해석 중…',12], ['관련 슬라이드 찾는 중…',38], ['문장 새로 쓰는 중…',66], ['덱에 반영 준비 중…',85] ];
    // '보통 N초' = 이 기기 실측(최근 10회 중앙값 기반). 기록 없으면 시간 약속 안 함.
    const est = (window.LLM && LLM.estimateDur) ? LLM.estimateDur('edit') : null;
    const metaTail = est ? tL('초 경과 · 보통')+' '+est+tL('초 안팎') : tL('초 경과');
    const row=el('div','row');
    const bub=el('div','bub bot working',
      `<div class="wk-head"><span class="wk-spin"></span><span class="wk-stage">${tL(stages[0][0])}</span></div>`+
      `<div class="wk-meta"><span class="wk-sec">0</span><span class="wk-tail">${metaTail}</span></div>`+
      `<div class="wk-bar"><i></i></div>`);
    row.append(bub); msgs.append(row); scroll();
    const stEl=bub.querySelector('.wk-stage'), secEl=bub.querySelector('.wk-sec'), barEl=bub.querySelector('.wk-bar i'), tailEl=bub.querySelector('.wk-tail');
    let i=0, sec=0, over=false;
    barEl.style.width=stages[0][1]+'%';
    const stT=setInterval(()=>{ i++; if(i<stages.length){ stEl.textContent=tL(stages[i][0]); barEl.style.width=stages[i][1]+'%'; } else clearInterval(stT); }, 3500);
    const scT=setInterval(()=>{ sec++; secEl.textContent=sec;
      // 예상 초과 → 낡은 약속 대신 정직한 전환
      if(est && !over && sec>est){ over=true; stEl.textContent=tL('조금 더 걸리네요… 거의 다 됐어요'); tailEl.textContent=tL('초 경과'); barEl.style.width='92%'; clearInterval(stT); }
    }, 1000);
    return { row, done(){ clearInterval(stT); clearInterval(scT); row.remove(); } };
  }
  /* ---- 통합 되돌리기(PPT): 텍스트·블록이동·숨김·굵기·슬라이드조작·AI수정 전부 한 스택 ---- */
  const _undoStack=[];
  function pushUndo(prevJson){ _undoStack.push(prevJson||JSON.stringify(data.slides||[])); if(_undoStack.length>40)_undoStack.shift(); syncUndoUI(); }
  function syncUndoUI(){
    const canUndo=_undoStack.length || (pageRef&&pageRef.prevSlides);
    const h=document.getElementById('histBtn'); if(h){ h.style.display=curMode().slides?'':'none'; h.disabled=!canUndo; }
    const u=document.getElementById('pptcUndo'); if(u) u.style.display=canUndo?'':'none';
  }
  function undoAll(){ const s=_undoStack.pop();
    if(s){ const p=JSON.parse(s);
      if(Array.isArray(p)) data.slides=p;
      else { data.slides=p.slides||[]; if(p.__clang!==undefined) data._clang=p.__clang; }   // 번역 스냅 — 언어 기록도 복원
    }
    // 메모리 스택이 비면(새로고침 후) 영구 스냅샷에서 복구 — 마지막 AI 수정 직전 상태
    else if(pageRef && pageRef.prevSlides){ data.slides=structuredClone(pageRef.prevSlides); delete pageRef.prevSlides; }
    else return;
    _pptMarks={}; persist(); render(); refreshPptPanel(); syncUndoUI(); if(window.__syncLangLabel) window.__syncLangLabel(); }

  /* ---- PPT 편집 v2 — 블록(⠿이동·✕숨김) + 텍스트 굵기 툴바 + 슬라이드 호버 [↑↓✕] ----
     오프셋/숨김/굵기는 슬라이드 데이터(_pos/_hide/_fmt)에 저장 → 렌더·뷰어·PPTX 전부 반영 */
  function slideIndexOf(node){ const sl=node.closest('.ppt-stack > .slide'); return sl? [...sl.parentElement.children].indexOf(sl) : -1; }

  // 파일 → 축소 → dataURL (파일창·드롭·붙여넣기 공용)
  function readImgFile(f, cb, done){
    imgTrace('2/4 파일 받음: '+f.name);
    const rd=new FileReader();
    rd.onerror=()=>{ done&&done(); uiAlert&&uiAlert(tL('이미지를 읽지 못했어요.')); };
    rd.onload=()=>{ imgTrace('3/4 읽기 완료'); const im=new Image(); im.onerror=()=>{ done&&done(); uiAlert&&uiAlert(tL('이미지를 불러오지 못했어요.')); };
      im.onload=()=>{ try{
        const MAX=1280, sc=Math.min(1, MAX/Math.max(im.width,im.height));

        imgTrace('4/4 적용 완료');
      }catch(e){ console.error('[img]',e); uiAlert&&uiAlert(tL('이미지 적용 중 오류가 났어요.')+' ('+(e&&e.message||e)+')'); } done&&done(); };

  function pickPptImage(cb){

      document.body.appendChild(inp);
      const done=()=>{ try{ inp.remove(); }catch(e){} };
      inp.addEventListener('cancel',()=>{ imgTrace(tL('선택이 취소됐어요.')); done(); });
      inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f){ imgTrace(tL('선택이 취소됐어요.')); done(); return; } processFile(f,done); };

    const act=w=>{ try{ return !!(w.navigator.userActivation&&w.navigator.userActivation.isActive); }catch(e){ return false; } };

    const pw=(fw && act(fw) && fw.showOpenFilePicker) ? fw : ((act(window)&&window.showOpenFilePicker) ? window : null);
