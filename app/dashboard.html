<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드 · MIDAS Web Generator</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('midas-theme')||'light')</script>
<script src="bundle.js"></script>
<link rel="stylesheet" href="ds.css">
<style>
  /* 대시보드 = 플랫 툴 UI (배경 그라데이션 숨김) */
  .ds-body::before{display:none}
  html,body{background:var(--canvas)}
  body{min-height:100vh;display:grid;grid-template-columns:224px 1fr}
  /* 좌측 SNB */
  .snb{border-right:1px solid var(--hairline);padding:20px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
  .snb .top{display:flex;align-items:center;justify-content:space-between}
  .snb .grp{display:flex;flex-direction:column;gap:2px}
  .snb .gl{font-size:11px;color:var(--mute);padding:0 10px 6px;letter-spacing:.04em}
  .snb a.item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;color:var(--body);font-size:14px;font-weight:var(--fw-med);text-decoration:none;transition:var(--dur) var(--ease)}
  .snb a.item:hover{background:var(--brand-weak);color:var(--ink)}
  .snb a.item.on{background:var(--brand-weak);color:var(--ink);font-weight:var(--fw-semi)}
  .snb a.item svg{width:17px;height:17px;flex:0 0 auto;opacity:.8}
  /* 상단바 */
  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid var(--hairline)}
  .search{display:flex;align-items:center;gap:8px;flex:1;max-width:420px;border:1px solid var(--hairline);border-radius:var(--r-pill);padding:9px 16px;color:var(--mute);font-size:14px;background:var(--surface-solid)}
  .search input{border:none;background:none;outline:none;flex:1;font-family:inherit;font-size:14px;color:var(--ink)}
  .top-bar .r{display:flex;align-items:center;gap:14px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:12px;font-weight:var(--fw-semi)}
  /* 메인 */
  .main{padding:28px 32px 80px;overflow-y:auto}
  .greet{font-size:14px;color:var(--mute);margin-bottom:6px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
  .head h1{font-size:var(--fs-display-sm);font-weight:var(--fw-semi);letter-spacing:var(--tr-display);margin:0}
  /* 통계 카드 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:34px}
  .stat{border:1px solid var(--hairline);border-radius:var(--r-md);padding:18px 20px;background:var(--surface-solid)}
  .stat .l{font-size:13px;color:var(--mute)}
  .stat .v{font-size:34px;font-weight:var(--fw-semi);letter-spacing:-.02em;margin:6px 0 8px;font-family:var(--font-display)}
  .stat .s{font-size:12px;color:var(--mute-soft)}
  /* 하단 그리드 */
  .grid2{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
  .sec-h{font-size:16px;font-weight:var(--fw-semi);margin:0 0 14px}
  .recent{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:12px;border:1px solid var(--hairline);border-radius:var(--r-md);padding:15px 18px;cursor:pointer;transition:var(--dur) var(--ease);background:var(--surface-solid)}
  .row:hover{border-color:var(--hairline-strong);box-shadow:var(--shadow-2)}
  .row .info{flex:1;min-width:0}
  .row .nm{font-size:14px;font-weight:var(--fw-semi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .sb{font-size:12.5px;color:var(--mute);margin-top:3px}
  .row .st{font-size:11px;font-weight:var(--fw-semi);padding:3px 9px;border-radius:var(--r-pill);flex:0 0 auto}
  .st.done{background:color-mix(in srgb,var(--a-green) 16%,transparent);color:#0a8a37}
  .st.prog{background:var(--brand-weak);color:var(--body)}
  .row .time{font-size:12px;color:var(--mute-soft);flex:0 0 auto}
  .side .card{border:1px solid var(--hairline);border-radius:var(--r-md);padding:20px;background:var(--surface-solid)}
  .side .card h3{margin:0 0 8px;font-size:15px;font-weight:var(--fw-semi)}
  .side .card p{margin:0 0 16px;font-size:13px;color:var(--mute);line-height:1.6}
  .empty{border:1px dashed var(--hairline);border-radius:var(--r-md);padding:44px;text-align:center;color:var(--mute);font-size:14px}
  @media (max-width:1000px){ body{grid-template-columns:1fr} .snb{display:none} .stats{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr} }
</style>
</head>
<body class="ds-body">
<aside class="snb">
  <div class="grp">
    <div class="top"><b class="ds-wordmark">MIDAS <span>AX</span></b><button id="themeBtn"></button></div>
  </div>
  <nav class="grp">
    <div class="gl">메뉴</div>
    <a class="item on" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>홈</a>
    <a class="item" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>새 웹사이트</a>
    <a class="item" href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>프로젝트</a>
    <a class="item" href="#" onclick="return false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.3.9a7 7 0 0 0-1.7-1l-.3-2.4h-4l-.3 2.4a7 7 0 0 0-1.7 1L4 5l-2 3.4L4 10a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.3-.9a7 7 0 0 0 1.7 1l.3 2.4h4l.3-2.4a7 7 0 0 0 1.7-1l2.3.9 2-3.4-2-1.6a7 7 0 0 0 .1-1Z"/></svg>설정</a>
  </nav>
</aside>

<div style="display:flex;flex-direction:column;min-width:0">
  <div class="top-bar">
    <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg><input id="q" placeholder="프로젝트 검색"></div>
    <div class="r"><a class="ds-btn ghost" href="index.html" style="padding:8px 16px">+ 새 웹사이트</a><div class="avatar">MA</div></div>
  </div>
  <div class="main">
    <div class="greet">안녕하세요, 오늘도 좋은 작업 되세요 👋</div>
    <div class="head">
      <h1>웹사이트 생성 현황</h1>
      <a class="ds-btn primary" href="index.html">새 웹사이트 만들기</a>
    </div>
    <div class="stats" id="stats"></div>
    <div class="grid2">
      <div>
        <h2 class="sec-h">최근 작업</h2>
        <div class="recent" id="recent"></div>
      </div>
      <div class="side">
        <div class="card">
          <h3>빠른 시작</h3>
          <p>종류와 스타일을 고르고 대화로 채우면 즉시 웹페이지가 생성됩니다.</p>
          <a class="ds-btn primary" href="index.html" style="width:100%">새 웹사이트 만들기</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  mountThemeToggle(document.getElementById('themeBtn'));

  const PTL={main:'메인홈',features:'기능소개',pricing:'요금',landing:'랜딩',notice:'공지'};
  function styleName(sp){ if(sp==='krds'&&window.KRDS_STYLE)return KRDS_STYLE.name; if(sp==='midas'&&window.MIDAS_STYLE)return MIDAS_STYLE.name; return (DARK_PACK_BY_ID[sp]||DARK_PACK_BY_ID.aether).name; }
  function isDone(p){ return p.pages.some(pg=>(pg.chat&&pg.chat.generated) || (pg.data&&((pg.data.features&&pg.data.features.length)||pg.data.bannerText))); }
  function relTime(ts){ const s=Math.floor((Date.now()-ts)/1000); if(s<60)return '방금'; const m=Math.floor(s/60); if(m<60)return m+'분 전'; const h=Math.floor(m/60); if(h<24)return h+'시간 전'; const d=Math.floor(h/24); if(d<7)return d+'일 전'; return Math.floor(d/7)+'주 전'; }

  function statCard(l,v,s){ return `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`; }

  function render(){
    const ps=getProjects().slice().sort((a,b)=>b.createdAt-a.createdAt);
    const total=ps.length, done=ps.filter(isDone).length, prog=total-done;
    const now=new Date();
    const month=ps.filter(p=>{ const d=new Date(p.createdAt); return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth(); }).length;

    document.getElementById('stats').innerHTML=
      statCard('전체 프로젝트', total, `진행 중 ${prog}개 · 완료 ${done}개`)+
      statCard('이번 달 생성', month, `${now.getMonth()+1}월 기준`)+
      statCard('배포 완료', 0, '배포 기능 준비 중')+
      statCard('HTML 내보내기', done, '생성 완료 시 가능');

    const box=document.getElementById('recent');
    const q=(document.getElementById('q').value||'').trim().toLowerCase();
    const list=ps.filter(p=>!q||p.name.toLowerCase().includes(q)).slice(0,8);
    if(!list.length){ box.innerHTML='<div class="empty">'+(total?'검색 결과가 없어요.':'아직 프로젝트가 없어요. <b>새 웹사이트 만들기</b>로 시작해보세요.')+'</div>'; return; }
    box.innerHTML='';
    list.forEach(p=>{
      const d=isDone(p);
      const detail=p.kind==='multi'?`${p.pages.length}개 페이지`:(PTL[p.pages[0]?.pageType]||'페이지');
      const row=document.createElement('div'); row.className='row';
      row.innerHTML=`<div class="info"><div class="nm">${p.name}</div><div class="sb">${d?'생성 완료':'편집 중'} · ${detail} · ${styleName(p.stylePack)}</div></div>
        <span class="st ${d?'done':'prog'}">${d?'완료':'진행 중'}</span>
        <span class="time">${relTime(p.createdAt)}</span>`;
      row.onclick=()=>{ const pg=p.pages[0]; location.href = pg ? `studio/studio.html?p=${p.id}&page=${pg.id}` : 'index.html'; };
      box.append(row);
    });
  }
  document.getElementById('q').oninput=render;
  render();
</script>
</body>
</html>
