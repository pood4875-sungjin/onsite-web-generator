<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRS 데이터 진단</title>
<style>
body{font-family:"Apple SD Gothic Neo","Pretendard",sans-serif;background:#f7f8fb;color:#1c2533;margin:0;padding:40px 20px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:22px}
p.hint{color:#667;font-size:14px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e3e8f0;border-radius:10px;overflow:hidden;font-size:14px;margin:16px 0}
th,td{padding:10px 12px;border-bottom:1px solid #eef1f6;text-align:left;vertical-align:top}
th{background:#fafbfd;font-size:12.5px;color:#8a94a6}
td.ok{color:#1e7f4f;font-weight:700}td.bad{color:#c0392b;font-weight:700}

</style></head><body><div class="wrap">
<h1>DRS 데이터 진단 · 백업</h1>
<p class="hint">이 페이지는 이 브라우저에 저장된 프로젝트를 <b>읽기만</b> 합니다. 아무것도 수정하지 않아요.</p>
<div id="out">읽는 중…</div>
<div class="box">
  <button id="dl">전체 데이터 백업 파일 내려받기 (JSON)</button>
  <span class="hint" style="margin-left:10px">문제 해결 전에 우선 이 백업부터 받아 두세요.</span>
</div>
<div class="box" id="lsbox" style="display:none"></div>
<div class="box" id="restoreBox">
  <b>주간회의 덱 복원</b>
  <p class="hint" style="margin:6px 0 12px">덮어써진 주간회의 PPT(13장 구성)를 재조립본으로 복원합니다. 세부 문구 편집분까지는 못 살리지만 구성·내용은 동일합니다. 현재 3장은 ↺(되돌리기)로 다시 볼 수 있게 보관됩니다.</p>
  <button id="restore">prms2ki98k0 프로젝트에 복원하기</button>
  <span id="restoreMsg" class="hint" style="margin-left:10px"></span>
</div>
<script>
const DECK = [
  { type:'statement', bg:'green', pos:'bottom', eyebrow:'MIDAS DRS', title:'AX Design Generator', sub:'2026년 7월 27일 기준 · 작성: 김성진' },
  { type:'statement', bg:'grey', pos:'center', eyebrow:'01 이게 뭔가요', title:'자연어·기획 자료를 AI가 해석하여,\n검증된 Design Pack을 조합해\n디자인 결과물을 만들어 주는 웹 서비스' },
  { type:'grid', bg:'grey', variant:'card', cols:2, eyebrow:'01 · 이게 뭔가요', title:'내부는 두 부분으로 나뉩니다', items:[
    { head:'AI (클로드)', text:'자연어 해석과 기획. 앤트로픽사 AI 모델이 요청 문장을 해석해 전체 구성(몇 장, 어떤 순서)과 문구 초안을 만듭니다. 토큰 비용이 발생하는 유일한 구간입니다.', image:{label:'AI'} },
    { head:'생성 엔진 (자체 개발)', text:"디자인과 조립. AI가 만든 기획을 받아 실제 화면을 그립니다. '디자인팩'을 바꿔 끼우면 같은 내용도 다른 스타일로 나오며, 이 과정은 비용이 들지 않습니다.", image:{label:'ENGINE'} } ] },
  { type:'process', bg:'white', eyebrow:'02 · 어떻게 돌아가나', title:'비용이 발생하는 구간은 하나입니다', accent:1, steps:[
    { who:'사용자', head:'자연어 입력', text:'"PPT 만들어줘"', tag:'무료' },
    { who:'AI (클로드)', head:'해석 + 기획·문구 작성', text:'장 구성, 제목, 본문 초안', tag:'이 구간만 유료' },
    { who:'생성 엔진', head:'디자인 적용·조립', text:'디자인팩 규칙대로 렌더링', tag:'무료' },
    { who:'사용자', head:'편집·발표·내보내기', text:'클릭 수정, PPTX 저장', tag:'무료' } ] },
  { type:'grid', bg:'white', variant:'card', cols:2, eyebrow:'타겟', title:'누가, 언제 쓰나', items:[
    { head:'사내 구성원', text:'행사·이벤트 랜딩페이지가 급히 필요할 때, 발표 PPT를 빠르게 만들어야 할 때 — 디자이너를 거치지 않고 바로 만듭니다.', image:{label:'TEAM'} },
    { head:'해외 법인 구성원', text:'같은 도구를 그대로 씁니다. 한국어·영어·일본어·중국어 로컬라이징이 이미 적용되어 있어, 요청한 언어로 결과물이 나옵니다.', image:{label:'GLOBAL'} } ] },
  { type:'statement', bg:'green', pos:'center', eyebrow:'LIVE DEMO', title:'시연', sub:'자연어 입력부터 결과물까지, 실제 화면으로 보여드립니다' },
  { type:'list', bg:'white', eyebrow:'03 · 예상 질문', title:'미리 답해 두는 것들', rows:[
    { label:'Q. 서버를 운영해야 하나요?', sub:'중계 서버 하나만 운영합니다. AI 인증 키(API 키)를 보관하고 요청을 대신 전달하는 용도이고, 나머지 기능은 서버 없이 각자 브라우저 안에서 동작합니다.' },
    { label:'Q. 작업물은 어디에 저장되나요?', sub:'각자 브라우저의 로컬 저장소(본인 컴퓨터 안)에 저장됩니다. 회사 서버로 올라가지 않고, 같은 링크를 열어도 작업물은 각자 컴퓨터에 따로 존재합니다. 옮길 때는 백업 → 복원.' } ] },
  { type:'stats', bg:'grey', eyebrow:'03 · 예상 질문', title:'Q. 비용은 얼마나 드나요?', cols:2, items:[
    { value:'약 100원', label:'PPT 1벌(약 14장) 생성 — 정가로도 약 150원' },
    { value:'약 40벌', label:'커피 한 잔 값(4,500원)으로 새로 만들 수 있는 양' } ] },
  { type:'table', bg:'white', eyebrow:'03 · 예상 질문', title:'작업별 비용 상세',
    text:'클로드 소네트 5 기준 읽기 100만 토큰당 $2, 쓰기 $10 (2026년 8월 말까지 프로모션가, 이후 $3/$15), 환율 1,400원/$ 적용',
    columns:['작업','AI 사용','1회 비용(약)'], rows:[
    { cells:['PPT 생성 (14장 안팎)','기획 + 전체 문구 작성','100~150원'] },
    { cells:['웹사이트 생성 (여러 페이지)','기획 + 전체 문구 작성','100~200원'] },
    { cells:['랜딩페이지·eDM 생성','기획 + 문구 작성','50~150원'] },
    { cells:['채팅으로 수정 지시 1회','수정 내용만 다시 작성','50~100원'] },
    { cells:['클릭 편집, 미리보기, 발표 모드','사용 안 함','0원'] },
    { cells:['PPTX·HTML·PDF 내보내기','사용 안 함','0원'] } ] },
  { type:'grid', bg:'grey', variant:'text', cols:4, eyebrow:'04 · 현재 기능', title:'지금 탑재된 것들', items:[
    { head:'결과물 4종', text:'PPT · 웹사이트 · 랜딩페이지 · eDM. 이후 다양하게 확장 가능' },
    { head:'생성 전 되묻기', text:'요청이 불분명하면 대화형으로 먼저 질문해 요구사항을 채움' },
    { head:'생성 + 클릭 편집', text:'모든 글자·버튼 클릭 수정, PPT는 개체 이동·숨김·정렬·서식까지' },
    { head:'채팅 수정', text:'"3번 장을 표로 바꿔줘"처럼 자연어로 수정 지시' },
    { head:'PPT 발표 모드', text:'차트·숫자 등장 효과와 함께 브라우저에서 바로 발표' },
    { head:'내보내기', text:'PPTX·HTML·PDF. 파워포인트에서 열어 이어서 편집 가능' },
    { head:'로컬라이징', text:'한국어·영어·일본어·중국어로 결과물 생성' },
    { head:'백업·이사 + AI 자동 복구', text:'파일 하나로 백업·복원, 어설픈 AI 응답은 3겹 자동 수리' } ] },
  { type:'grid', bg:'white', variant:'num', cols:3, accent:1, eyebrow:'05 · 그래서 앞으로?', title:'엔진은 하나, 디자인팩은 계속 추가', items:[
    { head:'디자인 제너레이터 고도화', text:'새 문서 유형 확장(제안서·보고서 등), 팀 배포 등 기능적 고도화' },
    { head:'디자인팩(디자인 시스템) 구축', text:'테스트 팩을 정식 디자인 시스템 수준으로 — 완성도 높은 결과물' },
    { head:'팀 공유 시 토큰 사용 정리', text:'하루 생성 횟수 제한 등 정책을 정한 뒤 공유 링크 오픈' } ] },
  { type:'list', bg:'grey', eyebrow:'05 · 그래서 앞으로?', title:'역할 분담', rows:[
    { label:'디자이너', sub:'디자인팩(시스템) 구축과 시스템 고도화 — 이 작업 자체도 AI를 활용해 진행' },
    { label:'기획', sub:'AI가 구성·문구 초안을 도와, 기획 담당이 다듬는 방식으로' } ] },
  { type:'closing', title:'Thank you', contacts:[{ k:'TEAM', v:'MIDAS DRS' }] }
];
document.getElementById('restore').onclick=async()=>{
  const msg=document.getElementById('restoreMsg');
  try{
    const db=await openDB(); const list=await getAll(db);
    const p=list.find(x=>x.id==='prms2ki98k0');
    if(!p){ msg.textContent='프로젝트를 못 찾았어요 (prms2ki98k0)'; return; }
    const pg=(p.pages||[]).find(x=>x.id==='pgms2ki98k1')||(p.pages||[])[0];
    if(!pg){ msg.textContent='페이지를 못 찾았어요'; return; }
    pg.data=pg.data||{};
    pg.prevSlides=Array.isArray(pg.data.slides)?pg.data.slides:[];   // 현재 3장은 ↺로 복귀 가능하게 보관
    pg.data.slides=DECK; pg.data.style='pitch';
    pg.chat=pg.chat||{}; pg.chat.generated=true;
    await new Promise((res,rej)=>{ const tx=db.transaction('projects','readwrite'); tx.objectStore('projects').put(p); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
    msg.innerHTML='<b style="color:#1e7f4f">복원 완료!</b> 스튜디오를 새로고침하세요.';
  }catch(e){ msg.textContent='실패: '+e; }
};
</script>
<script>
function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open('onsite-webgen',1);
  r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('projects',{keyPath:'id'}); }catch(e){} };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function getAll(db){ return new Promise((res,rej)=>{ const rq=db.transaction('projects','readonly').objectStore('projects').getAll();
  rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error); }); }
function slidesInfo(pg){
  const d=pg.data||{};
  if(Array.isArray(d.slides)) return d.slides.length+'장 (' + d.slides.map(s=>s.type).join(', ').slice(0,80)+')';
  if(Array.isArray(d.sections)) return '웹 섹션 '+d.sections.length+'개';
  const keys=Object.keys(d);
  return keys.length? '기타 데이터('+keys.slice(0,6).join(',')+')' : '비어 있음';
}
(async()=>{
  let list=[];
  try{ list=await getAll(await openDB()); }catch(e){ document.getElementById('out').textContent='저장소 열기 실패: '+e; }
  window.__ALL=list;
  let html='<table><tr><th>프로젝트</th><th>ID</th><th>팩</th><th>페이지</th><th>내용</th></tr>';
  list.forEach(p=>{ (p.pages||[]).forEach((pg,i)=>{
    const info=slidesInfo(pg);
    const bad=/비어 있음|0장/.test(info);
    html+='<tr><td>'+(i? '':(p.name||'무제'))+'</td><td style="font-size:12px;color:#8a94a6">'+(i? '':p.id)+'<br>'+pg.id+'</td><td>'+(i? '':(p.stylePack||''))+'</td><td>'+(pg.name||'')+'</td><td class="'+(bad?'bad':'ok')+'">'+info+'</td></tr>';
  }); if(!(p.pages||[]).length) html+='<tr><td>'+(p.name||'무제')+'</td><td>'+p.id+'</td><td>'+(p.stylePack||'')+'</td><td colspan=2 class="bad">페이지 없음</td></tr>'; });
  html+='</table><p class="hint">프로젝트 '+list.length+'개. 빨간 줄이 "사라진" 것으로 보이던 항목입니다.</p>';
  document.getElementById('out').innerHTML=html;
  // 구버전 localStorage 사본 — 복구 소스가 될 수 있음
  try{ const ls=localStorage.getItem('onsite-projects-v2');
    if(ls){ const arr=JSON.parse(ls); const b=document.getElementById('lsbox'); b.style.display='block';
      b.innerHTML='<b>이전 저장 사본 발견</b> — 브라우저에 예전 방식으로 저장된 프로젝트 '+arr.length+'개가 더 있습니다. 아래 버튼으로 받아 두세요. <br><br><button class="ghost" id="dl2">이전 사본 내려받기 (JSON)</button>';
      document.getElementById('dl2').onclick=()=>{ const a=document.createElement('a');
        a.href=URL.createObjectURL(new Blob([ls],{type:'application/json'})); a.download='drs-legacy-backup.json'; a.click(); };
    } }catch(e){}
})();
document.getElementById('dl').onclick=()=>{ const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(window.__ALL||[],null,2)],{type:'application/json'}));
  a.download='drs-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); };
</script>
</div></body></html>
