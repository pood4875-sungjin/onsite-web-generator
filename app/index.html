<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 프로젝트 · ONSITE Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
  :root{ --ink:#160211; --ink2:#5b5566; --ink3:#948e9e; --line:#eceaf0; --accent:#5b5bf5; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Manrope',-apple-system,"Pretendard",system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow:hidden;
    background:
      radial-gradient(620px 380px at 44% 108%, rgba(246,150,238,.55), transparent 62%),
      radial-gradient(560px 360px at 66% 112%, rgba(168,150,255,.50), transparent 62%),
      radial-gradient(520px 340px at 26% 116%, rgba(255,158,214,.45), transparent 60%),
      radial-gradient(700px 420px at 82% 120%, rgba(150,180,255,.35), transparent 60%),
      #fff}
  .nav{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px 26px;z-index:5}
  .brand{display:flex;align-items:center;gap:9px}.logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#22d3ee,#818cf8)}
  .brand b{font-size:14px;font-weight:700}
  .navlink{color:var(--ink2);font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:100px;padding:7px 14px;backdrop-filter:blur(6px)}
  .navlink:hover{color:var(--ink);background:#fff}

  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 90px;position:relative}
  .step{display:none;width:100%;max-width:620px;text-align:center;animation:fade .35s cubic-bezier(.22,1,.36,1)}
  .step.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h1{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
  .sub{font-size:18px;color:var(--ink);opacity:.72;margin:0 0 34px}

  /* 카드 (Figma: 반투명 흰 + 흰 테두리 + radius 8) */
  .cards{display:flex;gap:20px;justify-content:center}
  .kc{width:290px;height:186px;background:rgba(255,255,255,.5);border:1px solid #fff;border-radius:8px;padding:22px;cursor:pointer;
    display:flex;flex-direction:column;justify-content:center;text-align:left;backdrop-filter:blur(8px);transition:.18s cubic-bezier(.22,1,.36,1);box-shadow:0 6px 24px rgba(120,80,160,.06)}
  .kc:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(120,80,160,.14);background:rgba(255,255,255,.68)}
  .kc.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,245,.16)}
  .kc .kt{font-size:16px;font-weight:600;margin-bottom:5px}
  .kc .kd{font-size:13px;color:var(--ink2)}

  /* 스텝2 폼 */
  .fields{max-width:420px;margin:0 auto;text-align:left;display:flex;flex-direction:column;gap:11px}
  .fields label{font-size:12px;font-weight:600;color:var(--ink2);margin:6px 0 -5px}
  .opt{color:var(--ink3);font-weight:400}
  .inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;font-family:inherit;outline:none;background:rgba(255,255,255,.7)}
  .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,245,.12);background:#fff}

  /* 스텝3 스타일 */
  .styles{display:flex;gap:14px;justify-content:center}
  .sc{width:180px;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:#fff;transition:.18s}
  .sc:hover{transform:translateY(-2px)}.sc.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,245,.16)}
  .sc .sw{height:100px}.sc .cap{padding:11px 13px;font-size:13px;font-weight:600;text-align:left}

  .navbtns{margin-top:34px;display:flex;gap:10px;justify-content:center}
  .btn{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:100px;padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);font-family:inherit;backdrop-filter:blur(6px)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{filter:brightness(1.2)}
  .btn.ghost{border:none;background:none;color:var(--ink2)}
  .dots{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);display:flex;gap:7px}
  .dots i{width:7px;height:7px;border-radius:999px;background:#d9d2e2;transition:.2s}.dots i.on{width:22px;border-radius:10px;background:var(--ink)}
</style>
</head>
<body>
<div class="nav">
  <div class="brand"><div class="logo"></div><b>ONSITE Studio</b></div>
  <a class="navlink" href="projects.html">내 프로젝트 →</a>
</div>

<div class="wrap">
  <!-- 1: 카드 선택 -->
  <div class="step on" id="st1">
    <h1>어떤 걸 만들까요?</h1>
    <p class="sub">단일 페이지 하나, 아니면 여러 페이지 사이트.</p>
    <div class="cards">
      <div class="kc" data-k="single"><div class="kt">단일 페이지</div><div class="kd">랜딩 · 공지 등 한 장</div></div>
      <div class="kc" data-k="multi"><div class="kt">다중 페이지</div><div class="kd">메인·기능·요금… 사이트 구축</div></div>
    </div>
  </div>

  <!-- 2: 이름 -->
  <div class="step" id="st2">
    <h1>프로젝트 이름</h1>
    <p class="sub">모든 페이지가 공유할 기본값이에요.</p>
    <div class="fields">
      <label>프로젝트 이름</label><input class="inp" id="pname" placeholder="예: 온사이트 제품사이트">
      <label>제품명 <span class="opt">(선택)</span></label><input class="inp" id="product" placeholder="예: Onsite">
      <label>태그라인 <span class="opt">(선택)</span></label><input class="inp" id="tagline" placeholder="예: 현장의 모든 일을 하나로">
      <label>주 버튼 CTA <span class="opt">(선택)</span></label><input class="inp" id="cta" placeholder="예: 무료로 시작하기">
    </div>
    <div class="navbtns"><button class="btn ghost" onclick="go(1)">← 이전</button><button class="btn primary" onclick="go(3)">다음 →</button></div>
  </div>

  <!-- 3: 스타일 -->
  <div class="step" id="st3">
    <h1>스타일을 선택하세요</h1>
    <p class="sub">생성될 페이지의 룩앤필. 나중에 바꿀 수 있어요.</p>
    <div class="styles" id="styles"></div>
    <div class="navbtns"><button class="btn ghost" onclick="go(2)">← 이전</button><button class="btn primary" onclick="finish()">시작하기 →</button></div>
  </div>

  <div class="dots"><i class="on"></i><i></i><i></i></div>
</div>

<script type="module">
  import { createProject, addPage } from './store.js';
  import { DARK_PACKS } from '../core/packs/darkglow/packs.js';

  let kind='single', stylePack='aether';
  window.go=(n)=>{ document.querySelectorAll('.step').forEach(s=>s.classList.remove('on')); document.getElementById('st'+n).classList.add('on');
    document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===n-1)); };

  // 카드 클릭 = 종류 선택 + 바로 다음
  document.querySelectorAll('.kc').forEach(c=>c.onclick=()=>{ kind=c.dataset.k; go(2); setTimeout(()=>document.getElementById('pname').focus(),80); });

  const sz=document.getElementById('styles');
  DARK_PACKS.forEach((p,i)=>{ const c=document.createElement('div'); c.className='sc'+(i===0?' sel':'');
    c.innerHTML=`<div class="sw" style="background:${p.swatch}"></div><div class="cap">${p.name} · ${p.desc}</div>`;
    c.onclick=()=>{ sz.querySelectorAll('.sc').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); stylePack=p.id; }; sz.append(c); });

  window.finish=()=>{
    const shared={ productName:document.getElementById('product').value.trim(), tagline:document.getElementById('tagline').value.trim(), primaryCta:document.getElementById('cta').value.trim() };
    const name=document.getElementById('pname').value.trim() || shared.productName || '무제 프로젝트';
    const p=createProject({ kind, name, shared, stylePack });
    let pg=p.pages[0]; if(!pg){ pg=addPage(p.id,'main'); }
    location.href=`studio/studio.html?p=${p.id}&page=${pg.id}`;
  };
</script>
</body>
</html>
