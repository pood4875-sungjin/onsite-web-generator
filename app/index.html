<link rel="stylesheet" href="ds.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap">
<style>
  body{min-height:100vh;overflow-y:auto}
  .nav{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;z-index:5;pointer-events:none}
  .nav>*{pointer-events:auto}
  .homebtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--surface-solid);color:var(--body);text-decoration:none;transition:var(--dur) var(--ease)}
  .homebtn:hover{color:var(--ink);border-color:var(--hairline-strong);background:var(--brand-weak)}
  .homebtn:focus{outline:none}.homebtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}   /* 클릭 후 남는 포커스 링 제거(키보드 접근성 유지) */
  .homebtn[hidden]{display:none}   /* display:inline-grid가 hidden 속성을 이기는 것 방지 */

  /* ---- 1) 종류 선택 — 단독 풀페이지 ---- */
  .kscreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:104px 24px 96px;text-align:center;animation:fade .3s var(--ease)}
  .kscreen[hidden]{display:none}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kscreen h1{font-size:var(--fs-display-lg);font-weight:var(--fw-semi);letter-spacing:var(--tr-display);line-height:1.28;margin:0 0 40px;color:var(--ink)}
  /* 타이틀 → 카드 4개(한 덩어리) 순으로 아래에서 위로 천천히 페이드인.
     카드는 개별이 아니라 .kcards 컨테이너를 움직인다 — 낱개 스태거는 산만하고,
     컨테이너를 움직이면 카드 :hover의 translateY(-3px)와도 부딪히지 않는다. */
  .kscreen h1{opacity:0;transform:translateY(28px);animation:kc-in .85s cubic-bezier(.22,1,.36,1) 80ms forwards}
  .kcards{opacity:0;transform:translateY(44px);animation:kc-in .9s cubic-bezier(.22,1,.36,1) 240ms forwards}
  @keyframes kc-in{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.kscreen h1,.kcards,.scards{animation:none;opacity:1;transform:none}}
  .kcards{display:flex;gap:18px;justify-content:center;flex-wrap:nowrap;max-width:1180px;width:100%}
  .kc{flex:1 1 0;min-width:0;max-width:340px;cursor:pointer;padding:0;overflow:hidden;text-align:left;font-family:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);transition:var(--dur) var(--ease)}
  .kc:hover{border-color:var(--hairline-strong);transform:translateY(-8px);box-shadow:var(--shadow-2)}
  /* 썸네일 = 영역을 꽉 채우는 창(하단에서 솟는 형태, 아래 모서리는 잘림) */
  .kc .thumb{height:172px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding:22px 26px 0}
  .tb-land{background:radial-gradient(130% 130% at 50% -10%,#001a5e 0%,#2f6bd6 46%,#c3d6f7 100%)}
  .tb-web{background:radial-gradient(130% 130% at 50% -10%,#2e0a80 0%,#6d3bf5 44%,#d0bffb 100%)}
  .tb-mail{background:radial-gradient(130% 130% at 50% -10%,#00401f 0%,#12b46a 46%,#c6f0da 100%)}
  .tb-ppt{background:radial-gradient(130% 130% at 50% -10%,#5e0a0a 0%,#e23b3b 46%,#f7cfcf 100%)}
  .gw{position:relative;border-radius:14px 14px 0 0;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.4);border-bottom:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 12px 34px rgba(0,0,0,.2);overflow:hidden;padding:34px 16px 12px;display:flex;flex-direction:column;gap:10px}
  .gwd{position:absolute;top:13px;left:15px;display:flex;gap:5px}.gwd i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.65)}
  .gwhero{height:44px;border-radius:9px;flex:none;margin-bottom:3px;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.72))}
  .gwbar{height:9px;border-radius:5px;flex:none;background:rgba(255,255,255,.72)}
  .w70{width:70%}.w60{width:60%}.w56{width:56%}.w52{width:52%}.w50{width:50%}.w40{width:40%}.cc{align-self:center}
  /* 창이 썸네일 영역을 가득 채우고 하단에서 잘리는 형태 */
  .gw-land,.gw-mail,.gw-ppt{width:100%;height:100%}
  .gw-mail{max-width:62%}
  .gw-ppt .gwhero{height:40px}
  .gwstack{position:relative;width:100%;height:100%}
  .gws{position:absolute;left:0;bottom:0;width:94%;height:88%;border-radius:14px 14px 0 0;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);border-bottom:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .gws1{z-index:3;padding:32px 15px 10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
  /* 뒤 두 장은 translateY로 올리지 않고 높이를 키운다 — 올리면 바닥이 안 잘려
     사각 하단 모서리가 그대로 드러난다(앞 장처럼 썸네일 하단에서 잘려야 함). */
  .gws2{z-index:2;transform:translateX(10px);height:calc(88% + 11px);opacity:.62}
  .gws3{z-index:1;transform:translateX(20px);height:calc(88% + 22px);opacity:.36}
  .gws1 .gwhero{height:38px;margin-bottom:2px}
  .kc:hover .gw,.kc:hover .gws1{filter:brightness(1.07)}
  .kc .gw,.kc .gws{transition:filter var(--dur) var(--ease)}
  /* 호버 시 썸네일 창이 살짝 확대 — 하단 기준으로 커져 "아래에서 솟는 창" 형태를 유지 */
  .kc .thumb>*{transition:transform .45s cubic-bezier(.22,1,.36,1);transform-origin:50% 100%}
  .kc:hover .thumb>*{transform:scale(1.045)}
  @media (prefers-reduced-motion:reduce){.kc:hover .thumb>*{transform:none}}
  .kc .lab{padding:16px 20px;border-top:1px solid var(--hairline)}
  .kc .kt{font-size:var(--fs-display-xs);font-weight:var(--fw-semi);margin-bottom:3px;letter-spacing:var(--tr-body)}
  /* 설명문은 1줄 고정 — 번역문이 2줄로 넘치면 그 카드만 라벨이 커져 나머지 카드에 빈 공간이 생긴다 */
  .kc .kd{font-size:var(--fs-body-sm);color:var(--body-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:760px){ .kcards{flex-wrap:wrap} .kc{flex:1 1 240px;max-width:none} }

  /* ---- 2) 챗 화면 — 하단 고정 입력창 ---- */
  .cshell[hidden]{display:none}
  .cwrap{max-width:760px;margin:0 auto;padding:96px 24px 170px;display:flex;flex-direction:column;gap:4px;animation:fade .3s var(--ease)}
  .crow{display:flex;margin:6px 0;animation:cin .3s var(--ease)}
  .crow.me{justify-content:flex-end}
  @keyframes cin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* 히어로→챗 핸드오프 — 첫 메시지들이 입력창 자리에서 크게 솟아오르며 등장 */
  .crow.rise{animation:riseIn .6s cubic-bezier(.22,1,.36,1)}
  @keyframes riseIn{from{opacity:0;transform:translateY(52px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.crow.rise{animation:cin .3s var(--ease)}}
  .cbub{max-width:82%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6;letter-spacing:var(--tr-body);white-space:pre-wrap}
  .cbub.bot{background:var(--surface);border:1px solid var(--hairline);color:var(--ink);border-bottom-left-radius:6px}
  .cbub.me{background:var(--ink);color:var(--canvas);border-bottom-right-radius:6px;font-weight:var(--fw-med)}
  .cbub.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mute);margin:0 2px;animation:tdot 1s ease-in-out infinite}
  .cbub.typing i:nth-child(2){animation-delay:.15s}.cbub.typing i:nth-child(3){animation-delay:.3s}
  @keyframes tdot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  .cwidget{margin:8px 0 14px;animation:cin .3s var(--ease)}
  .cwidget.off{opacity:.45;pointer-events:none;filter:saturate(.6)}
  .cwcard{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);padding:16px}
  .cwact{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 0}
  .chiprow.choice{justify-content:flex-end}   /* 선택지=사용자 응답 → 우측 정렬 */
  /* 추천 입력 예시 — 세로 나열, 점선 테두리로 "제안"임을 구분 (ChatGPT 홈 제안 패턴) */
  .chiprow.samples{flex-direction:column;align-items:flex-start;gap:6px}
  .chiprow.samples .ds-chip{background:none;border:1px dashed var(--hairline-strong);color:var(--mute);
    font-size:13px;text-align:left;white-space:normal;line-height:1.45}
  .chiprow.samples .ds-chip:hover{color:var(--body);border-color:var(--body-mid);background:var(--bg-soft,rgba(127,127,127,.06))}
  .chiplabel{font-size:12px;font-weight:var(--fw-med);color:var(--body);margin:0 0 6px}
  .skipchip{background:none;border:1px dashed var(--hairline-strong);color:var(--mute);font-size:12.5px;cursor:pointer;padding:7px 14px;border-radius:var(--r-pill);font-family:inherit;transition:var(--dur) var(--ease)}
  .skipchip:hover{color:var(--body);border-color:var(--body-mid)}

  /* 하단 고정 컴포저 */
  .composer{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 24px 26px;background:linear-gradient(to top,var(--canvas) 62%,transparent)}
  .cbox{max-width:712px;margin:0 auto;   /* .cwrap(760) - 좌우 패딩(48) = 채팅 컬럼과 동일 폭 */display:flex;flex-direction:column;gap:4px;background:var(--surface-solid);border:1px solid var(--hairline);border-radius:20px;padding:8px 12px 12px 16px;box-shadow:var(--shadow-2);transition:var(--dur) var(--ease)}
  .cbox:focus-within{border-color:var(--hairline-strong);box-shadow:var(--shadow-3)}
  .cbox.dis{opacity:.55}
  /* 하단 줄: [+ 첨부] + 힌트 텍스트 왼쪽, 보내기 오른쪽 (Lovable식) */
  .cbrow{display:flex;align-items:center;gap:10px}
  .attbtn{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--hairline);cursor:pointer;background:none;color:var(--body-mid);display:grid;place-items:center;transition:var(--dur) var(--ease)}
  .attbtn:not(:disabled):hover{color:var(--ink);border-color:var(--hairline-strong);background:var(--brand-weak)}
  .attbtn:disabled{opacity:.35;cursor:default}
  /* 음성 입력 — 녹음 중엔 빨간 펄스 */
  .micbtn.rec{color:#e23b3b;border-color:#e23b3b;background:rgba(226,59,59,.08);animation:micPulse 1.2s ease-in-out infinite}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(226,59,59,.35)}50%{box-shadow:0 0 0 7px rgba(226,59,59,0)}}
  .atthint{font-size:11.5px;color:var(--mute);user-select:none;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cbrow .sendbtn{margin-left:auto}
  /* 요약 단계: 입력창이 아래로 사라지고 그 자리에 생성하기 버튼 등장 */
  .cbox.away{transform:translateY(150%);opacity:0;pointer-events:none}
  .cbox{will-change:transform}
  .gencta{display:block;max-width:712px;margin:0 auto;width:100%;padding:16px 20px;font-size:15px;font-weight:700;border-radius:20px;box-shadow:var(--shadow-2);animation:ctaUp .35s var(--ease)}
  .gencta[hidden]{display:none}
  @keyframes ctaUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  .attrow{display:flex;flex-wrap:wrap;gap:6px;padding:2px 4px 0}
  .attchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--body);background:var(--canvas-2);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:5px 7px 5px 11px;max-width:240px}
  .attchip .an{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attchip .ax{border:none;background:none;cursor:pointer;color:var(--mute);font-size:13px;line-height:1;padding:2px 4px}
  .attchip .ax:hover{color:var(--ink)}
  .attchip.busy{opacity:.6}
  #cinput{border:none;outline:none;background:none;resize:none;font-family:inherit;font-size:14px;line-height:1.55;color:var(--ink);max-height:180px;overflow-y:auto;padding:4px 4px 4px;width:100%}
  #cinput::placeholder{color:var(--mute)}
  .sendbtn{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;background:var(--ink);color:var(--canvas);display:grid;place-items:center;transition:var(--dur) var(--ease)}
  .sendbtn:disabled{opacity:.35;cursor:default}
  .sendbtn:not(:disabled):hover{transform:translateY(-1px)}

  /* 스타일 카드 (챗 임베드) */
  .styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .sc{position:relative;border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden;cursor:pointer;background:var(--surface);transition:var(--dur) var(--ease)}
  .sc:hover{border-color:var(--hairline-strong);transform:translateY(-2px)}.sc.sel{border-color:var(--ink)}
  .sc .sw{height:104px;position:relative;overflow:hidden;background:var(--canvas-2)}
  .sc .sw iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;pointer-events:none}
  .sc .sw .fallback{position:absolute;inset:0}
  .sc .cap{padding:9px 11px;font-size:12px;font-weight:var(--fw-med);text-align:left;border-top:1px solid var(--hairline)}
  .sc .rec{position:absolute;top:8px;right:8px;z-index:2;font-size:10.5px;font-weight:600;color:#fff;padding:3px 8px;border-radius:var(--r-pill);background:var(--point);box-shadow:0 4px 12px rgba(108,43,255,.4)}
  /* 템플릿 미리보기 — 카드 호버 시 🔍 버튼 + 풀스크린 오버레이 */
  .tpv-btn{position:absolute;left:8px;bottom:8px;z-index:3;font-size:11px;font-weight:600;color:#fff;padding:5px 10px;border:0;border-radius:var(--r-pill);background:rgba(12,14,20,.72);backdrop-filter:blur(6px);cursor:pointer;opacity:0;transition:opacity .15s}
  .sc:hover .tpv-btn{opacity:1}
  .tpv-btn:hover{background:rgba(12,14,20,.9)}
  #tplPv{position:fixed;inset:0;z-index:120;background:rgba(8,10,16,.78);backdrop-filter:blur(8px);display:none;flex-direction:column;padding:28px clamp(16px,6vw,90px)}
  #tplPv.on{display:flex}
  #tplPv .tpv-head{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:0 2px 12px}
  #tplPv .tpv-head b{font-size:15px;font-weight:600}
  #tplPv .tpv-x{border:0;background:rgba(255,255,255,.14);color:#fff;width:32px;height:32px;border-radius:999px;font-size:14px;cursor:pointer}
  #tplPv .tpv-x:hover{background:rgba(255,255,255,.3)}
  #tplPv iframe{flex:1;min-height:0;width:100%;border:0;border-radius:14px;background:#fff}

  /* 풀페이지 스타일 선택(#sscreen) — 챗 임베드(.styles)와 같은 .sc 카드를 크게 */
  .scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;max-width:1180px;width:100%;text-align:left;
    opacity:0;transform:translateY(44px);animation:kc-in .9s cubic-bezier(.22,1,.36,1) 240ms forwards}
  .scards .sc:hover{transform:translateY(-6px);box-shadow:var(--shadow-2)}
  .scards .sc .sw{height:158px}
  .scards .sc .cap{padding:12px 14px;font-size:13.5px}
  /* PPT는 장표 한 장이 통째로 카드 — 웹처럼 상단 크롭하면 커버 제목이 잘린다.
     액자 비율은 선택한 화면 비율(계약 v1)을 따른다. --sw-ar은 buildStyleCards가 세팅(기본 16/9).
     fitThumb의 cover-fit(Math.max)은 액자와 슬라이드 비율이 같아야 전체가 보인다 — 그래서 액자도 같이 바꾼다. */
  .scards.ppt .sc .sw{height:auto;aspect-ratio:var(--sw-ar,16/9)}
  .styles.ppt .sc .sw{height:auto;aspect-ratio:var(--sw-ar,16/9)}
  /* 사업군 선택(#oscreen) 썸네일 그라데이션 — 종류 카드(파랑/보라/초록/빨강)와 구분되는 색 */
  .tb-org-ent{background:radial-gradient(130% 130% at 50% -10%,#0b1533 0%,#31437a 46%,#cdd6ee 100%)}
  .tb-org-sk{background:radial-gradient(130% 130% at 50% -10%,#5e1a0a 0%,#e0562f 46%,#f7d9cf 100%)}
  .tb-org-ensol{background:radial-gradient(130% 130% at 50% -10%,#043636 0%,#0fa3a3 46%,#c9eeee 100%)}
  .tb-org-per{background:radial-gradient(130% 130% at 50% -10%,#3a2b06 0%,#c9992e 46%,#f3e6c8 100%)}

  /* ---- 홈 히어로 — Genspark식 센터 진입 (타이틀+큰 입력창+샘플) ---- */
  .hero{position:fixed;inset:0;z-index:7;background:var(--canvas);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
  .hero[hidden]{display:none}
  /* 히어로 탑바 — 좌 워드마크 · 우 언어 스위처 (Figma 79-8487) */
  .htop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:22px 30px}
  .hlogo{font-family:'Poppins','Pretendard Variable',Pretendard,sans-serif;font-weight:600;font-size:20px;letter-spacing:-.02em;color:var(--ink);text-decoration:none;cursor:pointer;transition:opacity var(--dur) var(--ease)}
  .hlogo:hover{opacity:.72}
  .hlogo:focus{outline:none}.hlogo:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}
  .hlang{position:relative}

      await loadParser('pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc=new URL('vendor/pdf.worker.min.js', location.href).href;
      const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
      let t=''; const N=Math.min(doc.numPages,30);
      for(let i=1;i<=N;i++){ const pg=await doc.getPage(i); const tc=await pg.getTextContent(); t+=tc.items.map(x=>x.str).join(' ')+'\n'; }
      // 이미지형(스캔·도판) PDF는 글자가 안 뽑힌다 — 조용히 빈 브리프로 가면 "3장 덱" 같은 이상 결과가 됨
      if(t.replace(/\s/g,'').length<80) throw new Error(_L('이 PDF는 이미지형이라 내용을 읽을 수 없어요. 원본 문서(txt·md·docx)로 첨부해주세요.'));
      return t;
    }
    if(ext==='docx'){
      await loadParser('mammoth.browser.min.js','https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js');
      const r=await window.mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});
      return r.value;
    }
    if(ext==='pptx'){
      // pptx = zip + slide XML. JSZip으로 열어 ppt/slides/slideN.xml의 <a:t> 텍스트를 장 순서대로 추출
      await loadParser('jszip.min.js','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
      const zip=await window.JSZip.loadAsync(await f.arrayBuffer());
      const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
        .sort((a,b)=>parseInt(a.match(/\d+/)[0],10)-parseInt(b.match(/\d+/)[0],10));
      let t='';
      for(const n of names.slice(0,60)){
        const xml=await zip.files[n].async('string');
        const runs=[...xml.matchAll(/<a:t>([\s\S]*?)<\/a:t>/g)].map(m=>m[1]
          .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(d)));
        if(runs.length) t+='[Slide '+n.match(/\d+/)[0]+']\n'+runs.join('\n')+'\n\n';
      }
      if(t.replace(/\s/g,'').length<20) throw new Error(_L('이 PPT에서 텍스트를 찾지 못했어요. 내용이 이미지로만 된 파일일 수 있어요.'));
      return t;
    }
    throw new Error(_L('지원하지 않는 형식이에요')+' (.'+ext+')');
  }

  // 선택지 카드 페이저 — 질문 여러 개를 카드 "한 장" 안에서 옆으로 넘기며 처리 (Genspark 인테이크 패턴).
  // questions=[{q,opts:[str]}] → Promise([{q,a}]). 마지막 제출 시 Q/A 정리를 사용자 버블로 남김.
  function askOptionCards(questions){
    return new Promise(res=>{
      const card=el('div','cwcard optcard');
      const head=el('div','oc-head'); const ttl=el('b',''); const prog=el('span','oc-prog');
      head.append(ttl, prog); card.append(head);
      const body=el('div','oc-body'); card.append(body);
      const act=el('div','cwact');
      const skipB=el('button','skipchip',_L('건너뛰기'));
      const nextB=el('button','ds-btn primary',_L('다음'));
      act.append(skipB, nextB); card.append(act);
      const w=widget(card);
      const answers=[];
      let qi=0, selArr=[], pane=null, extra=null;
      function renderQ(){
        const q=questions[qi];
        ttl.innerHTML=_L(q.q)+(q.multi?' <span class="oc-multi">'+_L('여러 개 선택 가능')+'</span>':'');
        prog.textContent=(qi+1)+' / '+questions.length;
        nextB.textContent=_L(qi===questions.length-1?'제출':'다음'); nextB.disabled=true; selArr=[];
        const np=el('div','oc-pane');
        const grid=el('div','oc-grid');
        extra=el('input','ds-input oc-extra'); extra.placeholder=_L('추가 세부 정보 (선택 사항)');
        (q.opts||[]).map(o=> typeof o==='string' ? {id:o,label:o} : o).concat([{id:'__etc',label:_L('기타')}]).forEach(o=>{
          const b=el('button','oc-opt',_L(o.label)); b.__opt=o;
          b.onclick=()=>{
            if(q.multi){ b.classList.toggle('on'); if(o.id==='__etc' && b.classList.contains('on')) extra.focus(); }
            else { grid.querySelectorAll('.oc-opt').forEach(x=>x.classList.remove('on')); b.classList.add('on'); if(o.id==='__etc') extra.focus(); }
            selArr=[...grid.querySelectorAll('.oc-opt.on')].map(x=>x.__opt);
            nextB.disabled=!selArr.length;
          };
          grid.append(b); });
        np.append(grid, extra);
        pane=np; body.append(np); toBottom();
      }
      function advance(save){
        if(save && pane){
          const base=selArr.filter(o=>o.id!=='__etc').map(o=>_L(o.label)).join(' · ');
          const ex=extra.value.trim();
          const text=base + (ex ? (base?' — ':'')+ex : '');
          const one=(!questions[qi].multi && selArr[0] && selArr[0].id!=='__etc') ? selArr[0].id : null;
          if(text) answers.push({key:questions[qi].key||'', q:questions[qi].q, a:text, id:one});
        }
        if(qi>=questions.length-1){
          off(w);
          me(answers.length ? answers.map(x=>'Q: '+_L(x.q)+'\nA: '+_L(x.a)).join('\n\n') : _L('건너뛸게요'));
          res(answers); return;
        }
        qi++;
        const old=pane; if(old){ old.classList.add('out'); setTimeout(()=>old.remove(), 320); pane=null; }
        renderQ();
      }
      skipB.onclick=()=>advance(false);
      nextB.onclick=()=>advance(true);
      renderQ();
    });
  }

  /* 스타일/템플릿 카드 — 기본 미선택, 카드 클릭 = 선택 완료(다음 버튼 없음).
     컨테이너·콜백 주입형. only=Set(팩 id) 주면 그 팩만 그림(3개 추천용). */
  // 썸네일·미리보기 로컬라이징 — 덱/데이터 클론의 문자열 값에 _L 적용(MAP에 있는 문구만 번역됨)
  function locWalk(d){
    try{
      d=JSON.parse(JSON.stringify(d));
      (function w(o){ for(const k in o){ const v=o[k]; if(typeof v==='string') o[k]=_L(v); else if(v&&typeof v==='object') w(v); } })(d);
      return d;
    }catch(e){ return d; }
  }

          try{ const deck=withRatio(Object.assign({},window.PPT_DEFAULT_DECK,{style:s.id})); const f=document.createElement('iframe'); f.setAttribute('scrolling','no'); f.srcdoc=(window.renderPptDeck?renderPptDeck(deck):''); c.querySelector('.sw').append(f); fitThumb(c.querySelector('.sw'),f,24,cv.w); pvBtn(c,()=>renderPptDeck(deck),s.name); }catch(e){}

  // 프로젝트 이름 자동 생성 — AI가 뽑은 이름 → 제품명 → 브리프 첫 구절 → 종류+날짜
  function autoName(){
    const kt=_L((KINDS.find(k=>k.id===S.kind)||{}).kt||'프로젝트');
    const withKind=(s)=>s.endsWith(kt)?s:s+' '+kt;   // "…웹사이트 웹사이트" 중복 방지
    if(S.name) return S.name;
    if(S.product) return withKind(S.product);
    const t=(S.plan||'').replace(/\s+/g,' ').trim();
    if(t){
      let head=t.split(/[.!?·:,\n]/)[0].trim();
      if(head.length>24) head=head.slice(0,24).trim();
      if(head) return withKind(head);
    }
    const d=new Date();
    return kt+' '+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  }

        PPT_RATIOS.forEach(([id,label])=>{ const b=el('button','ds-chip'+(id===S.ratio?' on':''),_L(label));
          b.onclick=()=>{ S.ratio=id; rrow.querySelectorAll('.ds-chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }; rrow.append(b); });
        rows.append(row('화면 비율',rrow));
      }
      if(S.plan) rows.append(row('요약',S.plan.length>90?S.plan.slice(0,90)+'…':S.plan));
      // 되묻기에서 받은 답들 — 무엇을 만들지 여기서 한눈에 확인
      if(S.answers.length){
        const av=el('div','sumans');
        S.answers.forEach(a=>{ av.append(el('div','sa-q',a.q), el('div','sa-a',a.a)); });
        rows.append(row('세부 정보', av));
      }
      const lrow=el('div','chiprow'); lrow.style.margin='0';
      (window.I18N?I18N.LANGS:[['ko','한국어']]).forEach(Lg=>{ const b=el('button','ds-chip'+(Lg[0]===S.lang?' on':''),Lg[1]);
        b.onclick=()=>{ S.lang=Lg[0]; lrow.querySelectorAll('.ds-chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }; lrow.append(b); });
      rows.append(row('언어',lrow));
      card.append(rows);
      const w=widget(card);
      // 컴포저 전환: 입력창이 아래로 사라지고 그 자리에 생성하기 버튼 등장
      cbox.classList.add('away');
      const g=document.getElementById('genCta');
      setTimeout(()=>{ cbox.style.display='none'; g.hidden=false; },340);
      g.onclick=()=>{ S.name=nameIn.value.trim()||autoName();
        g.disabled=true; g.textContent=_L('생성 중…'); off(w); me(_L('생성할게요!')); res(true); };
    });
  }

  /* ---- AI 생성 로딩 모달 — 스트리밍으로 만들어지는 내용이 모달 안에 실시간으로 찍힘 ---- */
  function showAiGen(job){
    job=job||'compose';
    const ov=document.getElementById('aiGen'), st=document.getElementById('aiGenStage'), bar=document.getElementById('aiGenBar'), hint=document.getElementById('aiGenHint');
    const logEl=document.getElementById('aiGenLog'); logEl.hidden=true; logEl.innerHTML='';
    const stages= job==='composeweb'
      ? [ ['소개 내용 분석 중…',14], ['핵심 메시지 뽑는 중…',36], ['카피 작성 중…',60], ['섹션 구성 중…',80], ['초안 조립 중…',90] ]
      : [ ['브리프 분석 중…',14], ['목차·스토리 구성 중…',34], ['슬라이드 문장 작성 중…',58], ['수치·레이아웃 다듬는 중…',76], ['덱 조립 중…',88] ];
    document.querySelector('.aigen-title').textContent=_L(job==='composeweb'?'AI가 페이지 초안을 만들고 있어요':'AI가 장표를 만들고 있어요');
    const est=(window.LLM&&LLM.estimateDur)?LLM.estimateDur(job):null;
    hint.textContent = est ? _L('보통')+' '+est+_L('초 안팎 걸려요. 창을 닫지 마세요.') : _L('창을 닫지 마세요.');
    let i=0, sec=0, timer=null, secT=null, over=false;
    const setStage=(n)=>{ const s=stages[Math.min(n,stages.length-1)]; st.style.opacity=0; setTimeout(()=>{ st.textContent=_L(s[0]); st.style.opacity=1; },180); bar.style.width=s[1]+'%'; };
    ov.hidden=false; requestAnimationFrame(()=>ov.classList.add('on'));
    setStage(0);
    timer=setInterval(()=>{ i++; if(i<stages.length) setStage(i); else clearInterval(timer); }, 2600);
    secT=setInterval(()=>{ sec++; if(est && !over && sec>est){ over=true; clearInterval(timer); st.textContent=_L('조금 더 걸리네요… 거의 다 됐어요'); bar.style.width='94%'; } },1000);
    const t0=Date.now();
    // 스트리밍 라인 — 만들어지는 내용이 모달 안에 실시간으로 쌓인다 ("기다리는 맛")
    const un=(s)=>s.replace(/\\"/g,'"').replace(/\\n/g,' ');
    const seenSet=new Set(); let seenN=0, gotLine=false;
    function pushLine(txt,num){
      if(!gotLine){ gotLine=true; logEl.hidden=false; clearInterval(timer); st.textContent=_L(job==='composeweb'?'페이지 내용을 작성하는 중…':'슬라이드를 한 장씩 작성하는 중…'); }
      const d=el('div','aigen-line');
      if(num!=null) d.append(el('span','n',num+'.'));
      d.append(document.createTextNode(txt));
      logEl.append(d); logEl.scrollTop=logEl.scrollHeight;
      bar.style.width=Math.min(92, 34+(seenSet.size+seenN)*6)+'%';
    }
    const onText = job==='composeweb'
      ? (full)=>{
          let m;
          if((m=/"productName"\s*:\s*"((?:[^"\\]|\\.)*)"/.exec(full)) && m[1]){ const l='📌 '+_L('제품명')+' — '+un(m[1]); if(!seenSet.has(l)){seenSet.add(l); pushLine(l);} }
          if((m=/"tagline"\s*:\s*"((?:[^"\\]|\\.)*)"/.exec(full)) && m[1]){ const l='✍️ '+_L('핵심 카피')+' — '+un(m[1]); if(!seenSet.has(l)){seenSet.add(l); pushLine(l);} }
          [...full.matchAll(/"title"\s*:\s*"((?:[^"\\]|\\.)*)"/g)].map(x=>un(x[1])).slice(0,3).forEach(t=>{ const l='🧩 '+_L('기능 카드')+' — '+t; if(!seenSet.has(l)){seenSet.add(l); pushLine(l);} });
          if(/"stats"\s*:/.test(full)){ const l='📊 '+_L('지표 구성'); if(!seenSet.has(l)){seenSet.add(l); pushLine(l);} }
          if(/"bannerText"\s*:/.test(full)){ const l='🪧 '+_L('배너 문구 작성'); if(!seenSet.has(l)){seenSet.add(l); pushLine(l);} }
          [...full.matchAll(/"name"\s*:\s*"((?:[^"\\]|\\.)*)"/g)].map(x=>un(x[1])).forEach(n=>{ const l='📄 '+_L('하위 페이지')+' — '+n; if(!seenSet.has(l)){seenSet.add(l); pushLine(l);} });
        }
      : (full)=>{
          const titles=[]; const re=/"title"\s*:\s*"((?:[^"\\]|\\.)*)"/g; let m;
          while((m=re.exec(full))) titles.push(un(m[1]));
          for(; seenN<titles.length; seenN++) pushLine(titles[seenN], seenN+1);
        };
    const stop=(ok)=>{ clearInterval(timer); clearInterval(secT);
      if(ok){ if(window.LLM&&LLM.recordDur) LLM.recordDur(job, Date.now()-t0); bar.style.width='100%'; st.textContent=_L('완성! 스튜디오로 이동해요'); }
      else { ov.classList.remove('on'); setTimeout(()=>{ ov.hidden=true; bar.style.width='8%'; },250); }
    };
    stop.onText=onText;
    return stop;
  }

  /* ---- 생성 ---- */
  function planWithAnswers(){
    let t=S.plan||'';
    if(S.answers.length) t+='\n\n[추가 정보]\n'+S.answers.map(a=>a.q+'\n→ '+a.a).join('\n');
    return t;
  }
  async function generate(){
    await storeReady();
    const prod=S.product, plan=planWithAnswers();

    if(S.kind==='edm'){
      const tpl=S.edmTpl||(window.APP_TEMPLATES||[]).find(t=>t.tag==='edm');
      if(!tpl){ (window.uiAlert?uiAlert(_L('사용할 이메일 템플릿이 없어요.')):alert('no eDM template')); return; }
      const p=createProjectFromTemplate(tpl);
      if(S.name) p.name=S.name; if(prod){ p.shared=p.shared||{}; p.shared.productName=prod; } p.lang=S.lang; upsertProject(p);
      await storeFlush(); leaving=true; location.href='studio/studio.html?v='+Date.now()+'&p='+p.id+'&page='+p.pages[0].id+'&edit=1'; return;
    }

    if(S.kind==='ppt'){
      const outlineFromPlan = plan.split('\n').map(s=>s.replace(/^[\s•\-*·]*\d*[.)]?\s*/,'').trim()).filter(s=>s && s.length<=40).slice(0,8);
      // pitch·honors = 별도 팩(레이아웃 체계가 다름). packKind가 있으면 그 팩의 compose/template 경로
      const packKind = S.pptStyle==='pitch' ? 'pitch' : S.pptStyle==='honors' ? 'honors' : S.pptStyle==='naver' ? 'naver' : S.pptStyle==='rams' ? 'rams' : S.pptStyle==='pastel' ? 'pastel' : S.pptStyle==='sfmi' ? 'sfmi' : S.pptStyle==='machine' ? 'machine' : S.pptStyle==='hfd' ? 'hfd' : '';
      const isPitch = !!packKind;
      const brief={ title:S.name||prod||'', audience:'', purpose:'', plan:plan, length:S.len, message:'', outline:outlineFromPlan, style:S.pptStyle, pack:packKind, lang:S.lang, ratio:S.ratio };
      const hasBrief=!!plan;
      // AI 가능하면 생성을 스튜디오로 넘김 — 즉시 이동해서 좌측 챗이 과정을 안내하고
      // 우측에 장표가 한 장씩 실제로 그려진다 (pendingBrief를 스튜디오가 읽어 라이브 생성)
      if(hasBrief && window.LLM && LLM.aiAvailable()){
        const p=createProject({ kind:'single', name:(S.name||brief.title||prod||'무제 PPT'), shared:{productName:prod}, stylePack:packKind||'ppt' });
        const full=getProject(p.id); const pg0=full.pages[0];
        pg0.pageType='ppt'; pg0.name='덱';
        pg0.data={ slides:[], style:S.pptStyle, accent:'blue', _clang:S.lang, _ratio:S.ratio };   // 산출물 언어 — 스튜디오 언어 버튼 기준값 / _ratio — 화면 비율(계약 v1)
        pg0.pendingBrief=brief;
        pg0.chat={ log:[], idx:8, generated:false };
        full.lang=S.lang; upsertProject(full);
        await storeFlush(); leaving=true; location.href='studio/studio.html?v='+Date.now()+'&p='+full.id+'&page='+pg0.id; return;
      }
      let deck=null;
      // 내용 없이 시작하면 전 타입 쇼케이스 덱 — 템플릿을 한 장씩 보며 골라 쓰게
      if(!deck){
        if(packKind==='rams') deck = (hasBrief && window.ramsComposeDeck) ? ramsComposeDeck(brief) : ramsTemplateDeck();
        if(packKind==='pastel') deck = (hasBrief && window.pastelComposeDeck) ? pastelComposeDeck(brief) : pastelTemplateDeck();
        if(packKind==='sfmi') deck = (hasBrief && window.sfmiComposeDeck) ? sfmiComposeDeck(brief) : sfmiTemplateDeck();
        if(packKind==='machine') deck = (hasBrief && window.machineComposeDeck) ? machineComposeDeck(brief) : machineTemplateDeck();
        if(packKind==='hfd') deck = (hasBrief && window.hfdComposeDeck) ? hfdComposeDeck(brief) : hfdTemplateDeck();
        else if(packKind==='naver') deck = (hasBrief && window.naverComposeDeck) ? naverComposeDeck(brief)
                 : (window.naverTemplateDeck ? naverTemplateDeck() : JSON.parse(JSON.stringify(window.NAVER_DEFAULT_DECK||{slides:[]})));
        else if(packKind==='honors') deck = (hasBrief && window.honorsComposeDeck) ? honorsComposeDeck(brief)
                 : (window.honorsTemplateDeck ? honorsTemplateDeck() : JSON.parse(JSON.stringify(window.HONORS_DEFAULT_DECK||{slides:[]})));
        else if(packKind==='pitch') deck = (hasBrief && window.pitchComposeDeck) ? pitchComposeDeck(brief)
                 : (window.pitchTemplateDeck ? pitchTemplateDeck() : JSON.parse(JSON.stringify(window.PITCH_DEFAULT_DECK||{slides:[]})));
        else deck = (hasBrief && window.pptComposeDeck) ? pptComposeDeck(brief)
                 : (window.pptTemplateDeck ? pptTemplateDeck(S.pptStyle)
                 : Object.assign(JSON.parse(JSON.stringify(window.PPT_DEFAULT_DECK||{slides:[]})), {style:S.pptStyle}));
      }
      const p=createProject({ kind:'single', name:(S.name||brief.title||prod||'무제 PPT'), shared:{productName:prod}, stylePack:packKind||'ppt' });
      const full=getProject(p.id); const pg0=full.pages[0];
      pg0.pageType='ppt'; pg0.name='덱'; pg0.data=deck;
      deck._ratio=S.ratio;   // 화면 비율(계약 v1) — 템플릿/비AI 경로도 덱 데이터에 기록
      pg0.chat={ log:[{r:'bot',t:'📊 '+_L(hasBrief?'PPT 초안이 준비됐어요. 편집 모드에서 바로 수정하세요.':'전체 템플릿을 한 장씩 담았어요. 필요 없는 장은 지우고, 채팅으로 내용을 채워보세요.')}], idx:8, generated:true };
      full.lang=S.lang; upsertProject(full);
      await storeFlush(); leaving=true; location.href='studio/studio.html?v='+Date.now()+'&p='+full.id+'&page='+pg0.id+'&edit=1'; return;
    }

    // 랜딩/웹사이트 — AI가 전 필드 초안 + 임의 채움 안내(assumed)
    const shared={ productName:prod };
    const name=S.name || prod || '무제 프로젝트';
    const p=createProject({ kind:S.kind, name, shared, stylePack:S.stylePack, org:S.org });
    p.lang=S.lang; upsertProject(p);
    let pg=p.pages[0]; if(!pg){ pg=addPage(p.id,'main'); }

    if(plan && window.LLM && LLM.aiAvailable()){
      // 모달 안에 실시간 로그 — 카피·기능·페이지 구성이 실제 값과 함께 찍힘
      const stop=showAiGen('composeweb');
      let draft=null;
      try{ draft=await LLM.composeSite({ product:prod, name, plan, kind:S.kind, lang:S.lang }, stop.onText); stop(true); await new Promise(r=>setTimeout(r,650)); }
      catch(e){ stop(false); console.warn('[ai] compose-web 실패 → 대화 플로우 폴백', e); if(window.uiAlert) await uiAlert(_L('AI 초안 생성에 실패해 대화로 채우는 방식으로 시작해요.')+' ('+(e&&e.message||'')+')'); }
      if(draft){
        const full=getProject(p.id); const pg0=full.pages.find(x=>x.id===pg.id)||full.pages[0];
        const seed={ productName:draft.productName||prod||'', tagline:draft.tagline||'', subcopy:draft.subcopy||'', primaryCta:draft.primaryCta||'',
          features:draft.features||[], stats:draft.stats||[], bannerText:draft.bannerText||'', bannerCta:draft.bannerCta||'',
          footerLinks:draft.footerLinks||[], footerCopyright:draft.footerCopyright||'', images:{}, sectionOrder:[], hiddenSections:[], shownSections:[], _clang:S.lang };
        // 세미나·행사 필드 — 첨부 기획서의 세션·일시·장소·마감·FAQ가 초안에 있으면 그대로 시드(집객 팩이 소비)
        ['sessions','eventDate','eventPlace','deadline','faq','ctaTitle','ctaSub'].forEach(k=>{ if(draft[k]!=null && draft[k]!=='') seed[k]=draft[k]; });
        if(S.kind==='multi'){
          pg0.pageType='main'; pg0.name='메인홈';
          seed.shownSections=['feature','cta'];
          seed.hiddenSections=['comparison','testimonial','blog','faq','stat'];
        } else { pg0.pageType='landing'; }
        // 임의로 채운 부분 안내 — 완성본으로 시작하고, 예시 채움 위치를 알려 편집 유도
        const A_LABEL={ productName:'제품명', tagline:'태그라인', subcopy:'소개 문구', primaryCta:'CTA 버튼',
          features:'기능 카드', stats:'지표 수치', bannerText:'배너 문구', bannerCta:'배너 버튼',
          footerLinks:'푸터 링크', footerCopyright:'저작권 문구' };
        const assumed=[...new Set((draft.assumed||[]).map(k=>A_LABEL[k]).filter(Boolean))];
        let msg=_L('✨ 입력한 내용으로 초안을 만들었어요. 오른쪽에서 확인해보세요.');
        if(assumed.length) msg+='\n\n'+_L('참고로')+' '+assumed.join(' · ')+_L('은(는) 내용에 없어서 예시로 채워뒀어요. 편집 버튼을 눌러 실제 내용으로 다듬어보세요!');
        pg0.data=seed; pg0.volume='heavy';
        pg0.chat={ log:[{r:'bot',t:msg}], idx:9, generated:true };

        // 브리프에 IA(메뉴 구성)가 있으면 하위 페이지도 함께 생성 — 좌측 페이지 패널·GNB에 그대로 반영됨
        const ia = (S.kind==='multi' && Array.isArray(draft.pages)) ? draft.pages : [];
        if(ia.length){
          ia.forEach(ip=>{
            const sub=newPage(ip.type, full.shared||{}, null);
            sub.name=ip.name;
            // 유형 스캐폴드(pagetypes.js) 먼저 깔고 → 공통 시드 → AI가 준 유형별 섹션 필드(faq/agenda 등) 순으로 덮음
            const scaf = window.pageScaffold ? pageScaffold(ip.type, full.shared||{}) : {};
            sub.data=Object.assign(sub.data, scaf, {
              productName:seed.productName, primaryCta:seed.primaryCta,
              tagline:ip.tagline||'', subcopy:ip.subcopy||'',
              // 비워두면 팩 기본 예시문("아토믹 생성" 등)이 그대로 보이므로 페이지별 카드 + 공통 지표로 채움
              features:(ip.features&&ip.features.length)?ip.features:seed.features,
              stats:seed.stats, bannerText:seed.bannerText, bannerCta:seed.bannerCta,
              footerLinks:seed.footerLinks, footerCopyright:seed.footerCopyright });
            ['overview','intro','featureRows','gallery','compare','faq','form','infoCards','docs','steps','posts','agenda','speakers','notices','testimonials'].forEach(k=>{ if(ip[k]!=null) sub.data[k]=ip[k]; });
            sub.data.pageType=ip.type;
            sub.volume='heavy';
            // 각 하위 페이지는 히어로만 채워진 골격 → 스튜디오 채팅으로 이어서 채우게 안내
            sub.chat={ log:[{r:'bot',t:_L('이 페이지는 메뉴 구성에 맞춰 만들어둔 골격이에요. 채우고 싶은 내용을 말해주세요.')}], idx:9, generated:true };
            full.pages.push(sub);
          });
          pg0.chat.log[0].t += '\n\n'+_L('메뉴 구성도 읽어서')+' '+ia.map(x=>x.name).join(' · ')+' '+_L('페이지를 함께 만들어뒀어요. 왼쪽 페이지 목록에서 골라 이어서 채우면 돼요.');
        }
        full.name=name; full.lang=S.lang; upsertProject(full);
        await storeFlush(); leaving=true;
        location.href=`studio/studio.html?v=${Date.now()}&p=${full.id}&page=${pg0.id}`; return;
      }
    }
    await storeFlush();
    leaving=true;
    location.href=`studio/studio.html?v=${Date.now()}&p=${p.id}&page=${pg.id}`;
  }

  /* ---- 메인 흐름: 홈 히어로 → 챗 ---- */
  let started=false;   // 첫 입력 이후부터 이탈 확인

  /* 홈 히어로 — 센터 입력창. 첫 전송을 하단 컴포저(askInput 대기중)로 프록시하고 챗으로 전환 */
  const hero=document.getElementById('hero'), hinput=document.getElementById('hinput'), hsend=document.getElementById('hsend');
  FIRST_SAMPLES.forEach(t=>{ const b=el('button','hchip',_L('✏️ ')+_L(t));
    b.onclick=()=>{ hinput.value=_L(t); hinput.dispatchEvent(new Event('input')); hinput.focus(); }; document.getElementById('hchips').append(b); });
  function heroSend(){
    const v=hinput.value.trim(); if(!v && !attachments.length) return;
    hero.classList.add('away'); setTimeout(()=>{ hero.hidden=true; },360);
    _riseN=3;   // 핸드오프: 내 메시지·타이핑 점·첫 답변이 솟아오르며 등장
    cinput.value=v; send();
  }
  hsend.onclick=heroSend;
  document.getElementById('hatt').onclick=()=>cfile.click();   // 히어로 첨부 = 컴포저와 같은 파일 입력 공유
  hinput.addEventListener('keydown',(e)=>{ if(e.isComposing || e.keyCode===229) return;
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); heroSend(); } });
  hinput.addEventListener('input',()=>{ hinput.style.height='auto'; hinput.style.height=Math.min(hinput.scrollHeight,160)+'px';
    hero.querySelector('.hbox').classList.toggle('quiet', !!hinput.value.trim()); });   // 타이핑 시작 = 유도 글로우 잦아듦
  setTimeout(()=>hinput.focus(),250);
  /* ---- 음성 입력 (Web Speech API) — 브라우저 내장 STT, 서버·키 불필요.
     클릭=녹음 시작(빨간 펄스), 말하는 동안 실시간으로 입력창에 받아적고, 다시 클릭=종료.
     미지원 브라우저(파폭 등)는 버튼 자동 숨김. localhost·https에서만 동작. ---- */
  function micToast(btn,msg){
    const t=document.createElement('div');
    t.textContent=msg;
    t.style.cssText='position:fixed;z-index:99;background:#14181B;color:#fff;font-size:13px;padding:9px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .2s';
    document.body.appendChild(t);
    const r=btn.getBoundingClientRect();
    t.style.left=Math.max(8,r.left+r.width/2-t.offsetWidth/2)+'px';
    t.style.top=(r.top-t.offsetHeight-10)+'px';
    requestAnimationFrame(()=>t.style.opacity='1');
    setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),250); },2600);
  }
  function wireSpeech(btn, target){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ btn.hidden=true; return; }
    let rec=null, active=false, base='';
    btn.addEventListener('click',()=>{
      if(btn.disabled) return;
      if(active){ try{rec.stop();}catch(e){} return; }
      rec=new SR();
      rec.lang=({ko:'ko-KR',en:'en-US',ja:'ja-JP',zh:'zh-CN'})[(window.I18N?I18N.getLang():'ko')]||'ko-KR';
      /* continuous=false — 말을 멈추면 브라우저가 알아서 종료하고 최종 문장이 입력창에 확정된다.
         이어 말하려면 다시 누르면 기존 텍스트 뒤에 붙는다. */
      rec.interimResults=true; rec.continuous=false;
      base=target.value ? target.value.replace(/\s+$/,'')+' ' : '';
      rec.onresult=(e)=>{ let t=''; for(let ri=0; ri<e.results.length; ri++) t+=e.results[ri][0].transcript;
        target.value=base+t; target.dispatchEvent(new Event('input')); };
      rec.onend=()=>{ active=false; btn.classList.remove('rec'); target.focus(); };
      rec.onerror=(e)=>{
        active=false; btn.classList.remove('rec');
        const code=e&&e.error;
        if(code==='not-allowed'||code==='service-not-allowed') micToast(btn,_L('마이크 권한을 허용해주세요 (주소창 오른쪽 🎤 아이콘)'));
        else if(code==='network') micToast(btn,_L('음성 인식 서버에 연결하지 못했어요. 네트워크를 확인해주세요'));
        else if(code==='audio-capture') micToast(btn,_L('마이크를 찾을 수 없어요. 연결 상태를 확인해주세요'));
        else if(code!=='no-speech'&&code!=='aborted') micToast(btn,_L('음성 인식에 실패했어요. Chrome/Edge에서 다시 시도해주세요'));
      };
      active=true; btn.classList.add('rec');
      try{ rec.start(); micToast(btn,_L('듣고 있어요 — 말씀이 끝나면 자동으로 입력돼요')); }
      catch(e){ active=false; btn.classList.remove('rec'); micToast(btn,_L('음성 인식을 시작하지 못했어요')); }
    });
  }
  wireSpeech(document.getElementById('hmic'), hinput);
  wireSpeech(document.getElementById('cmic'), cinput);

  // 타이틀 타이핑 연출 — 이름 인사(있으면 2줄) + 한 글자씩. 모션 축소 설정이면 즉시 전체 표시
  let _heroTypeTimer=null;
  function heroGreeting(){
    let name=''; try{ name=(localStorage.getItem('midas-username')||'').trim(); }catch(e){}
    if(!name) name='MDAS';   // 기본 인사 이름 고정(사용자 지정 2026-08-05) — 타이틀 클릭으로 바꾸면 그 이름이 우선
    const lang=(window.I18N?I18N.getLang():'ko');
    if(name){
      if(lang==='en') return 'Hi '+name+',\nwhat would you like to create today?';
      if(lang==='ja') return name+'さん、こんにちは\n今日は何を作りたいですか？';
      if(lang==='zh') return name+'，你好\n今天想做点什么？';
      return name+'님, 안녕하세요\n오늘은 무엇을 만들고 싶으신가요?';
    }
    return _L('무엇을 만들고 싶으신가요?');
  }
  function typeHero(){
    const ht=document.getElementById('htype'), full=heroGreeting();
    const paint=s=>{ ht.innerHTML=s.replace(/\n/g,'<br>'); };
    if(_heroTypeTimer) clearInterval(_heroTypeTimer);
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ paint(full); return; }
    let i=0; _heroTypeTimer=setInterval(()=>{ paint(full.slice(0,++i)); if(i>=full.length) clearInterval(_heroTypeTimer); }, 62);
  }
  typeHero();
  // 타이틀 클릭 → 내 이름 설정 (인사말에 반영)
  document.getElementById('hgreet').onclick=async ()=>{
    let cur=''; try{ cur=localStorage.getItem('midas-username')||''; }catch(e){}
    const v=await uiPrompt(_L('인사말에 쓸 이름을 알려주세요'), {value:cur, placeholder:_L('예: 채현'), okText:_L('저장')});
    if(v===null) return;
    try{ v.trim() ? localStorage.setItem('midas-username', v.trim()) : localStorage.removeItem('midas-username'); }catch(e){}
    typeHero();
  };
  // 언어 스위처 — 우상단 pill. 전환 시 리로드(i18n 계약)
  (function(){
    const btn=document.getElementById('hlangBtn'), menu=document.getElementById('hlangMenu'), cur=document.getElementById('hlangCur');
    if(!btn || !window.I18N) return;
    const now=I18N.getLang();
    cur.textContent=(I18N.LANGS.find(l=>l[0]===now)||I18N.LANGS[0])[2];
    I18N.LANGS.forEach(l=>{
      const b=document.createElement('button');
      b.innerHTML='<span>'+l[1]+'</span><i>'+l[2]+'</i>';
      if(l[0]===now) b.classList.add('on');
      b.onclick=()=>{ I18N.setLang(l[0]); location.reload(); };
      menu.appendChild(b);
    });
    btn.onclick=e=>{ e.stopPropagation(); menu.hidden=!menu.hidden; };
    // 바깥 클릭 닫기 — 캡처 페이즈 pointerdown(다른 핸들러의 stopPropagation에 안 막힘)
    document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.hlang')) menu.hidden=true; }, true);
  })();

  async function flow0(){
    const first=await askInput('만들고 싶은 것을 자유롭게 적어주세요');
    started=true; history.pushState({s:'chat'},'',location.href);

    // 핸드오프 리듬 — 타이핑 점을 잠깐 보여준 뒤 첫 응답 등장 (즉답이면 기계적으로 느껴짐)
    const tp0=typing(); await new Promise(r=>setTimeout(r,750)); tp0.remove();

    // 종류: 입력에서 감지, 애매하면 칩으로 유도 (짧게 말해도 시스템이 제안)
    let kind=detectKind(S._rawInput||first);
    if(!kind){
      bot(_L('좋아요! 어떤 형태로 만들까요?'));
      kind=await askChips([
        {id:'ppt',label:'📊 PPT'},
        {id:'single',label:'📄 랜딩페이지'},
        {id:'multi',label:'🌐 웹사이트'},
        {id:'edm',label:'✉️ 이메일 (eDM)'},
      ]);
    }
    S.kind=kind;
    const k=KINDS.find(x=>x.id===kind);
    // 조각 이어붙이기 금지 — 영어·일본어에서 어순이 깨진다
    bot((window.LF?LF:( (t)=>t ))('좋아요, {kind}를 만들게요!', {kind:_L(k.kt)}));

    if(S.kind!=='edm'){
      // 내용: 첫 입력에 이미 담겨 있으면 그대로 시드, 아니면 브리프 질문 + 예시 칩
      if(hasContent(first)){ S.plan=first; }
      else {
        bot(_L(BRIEF_PROMPT[S.kind]||BRIEF_PROMPT.single));
        sampleChips(SAMPLES[S.kind]);
        S.plan=await askInput(BRIEF_PH[S.kind]||BRIEF_PH.single, '건너뛰기 — 나중에 채울게요');
      }

      // AI 되묻기(내용 기반 질문) + 종류별 기본 질문(분량·목표 등) — 전부 카드 한 장 페이저로
      let aiQs=[], freeQs=[];
      if(S.plan && window.LLM && LLM.aiAvailable()){
        // 대기 구간(2~5초)이 심심하지 않게 — 버블 하나 먼저, 길어지면 시간차로 하나 더
        bot(_L('입력해주신 내용 잘 받았어요! 꼼꼼히 읽어보는 중이에요 📝'));
        const tp=typing();
        const extraT=setTimeout(()=>{ const r=bot(_L('어떤 걸 여쭤보면 초안이 더 정확해질지 정리하고 있어요.')); msgs.insertBefore(r, tp); toBottom(); }, 1800);
        let it=null;
        try{ it=await LLM.intake({kind:S.kind, plan:S.plan}); }catch(e){ console.warn('[ai] intake 실패(무시)', e); }
        clearTimeout(extraT); tp.remove();
        if(it){
          if(it.name && !S.name) S.name=it.name;
          if(it.product && !S.product) S.product=it.product;
          aiQs=it.questions.filter(q=>q.opts && q.opts.length);
          freeQs=it.questions.filter(q=>!q.opts || !q.opts.length);
        }
      }
      const pagerQs=aiQs.concat(FIXED_QS[S.kind]||[]);
      if(pagerQs.length){
        bot(_L('내용 잘 봤어요! 더 정확한 초안을 위해 몇 가지만 여쭤볼게요. 눌러서 고르기만 하면 돼요.'));
        const ans=await askOptionCards(pagerQs);
        ans.forEach(x=>{ if(x.key==='__len'){ if(x.id) S.len=x.id; }
          else if(x.key==='__ratio'){ if(x.id) S.ratio=(window.RATIO?RATIO.norm(x.id):x.id); }   // 화면 비율 — 스타일 썸네일이 이 값으로 그려진다
          else S.answers.push({q:x.q, a:x.a}); });
      }
      for(const q of freeQs){
        bot(q.q);
        const a=await askInput('답변을 입력하세요', '건너뛰기');
        if(a) S.answers.push({q:q.q, a});
      }
    }

    // 스타일: 요약 멘트 → 추천 멘트 → 팩 리스트 (선택은 카드 클릭 한 번)
    if(S.kind==='edm'){ bot(_L('템플릿을 골라주세요.')); }
    else{
      // "「이름」 랜딩페이지를 만드시려는 거군요!" — 질문이 끝났다는 신호 + 이해했다는 확인
      const rc=(function(){
        const lang=(window.I18N?I18N.getLang():'ko');
        const nm=(S.name||S.product||'').trim();
        const K={ppt:{ko:'발표자료(PPT)',en:'a presentation deck',ja:'プレゼン資料',zh:'演示文稿'},
                 single:{ko:'랜딩페이지',en:'a landing page',ja:'ランディングページ',zh:'落地页'},
                 multi:{ko:'웹사이트',en:'a website',ja:'ウェブサイト',zh:'网站'}}[S.kind];
        if(!K) return '';
        const k=K[lang]||K.ko;
        if(lang==='en') return nm?('So you\'re making '+k+' for "'+nm+'" — got it!'):('So you\'re making '+k+' — got it!');
        if(lang==='ja') return nm?('「'+nm+'」の'+k+'を作られるんですね！'):(k+'を作られるんですね！');
        if(lang==='zh') return nm?('您要为「'+nm+'」制作'+k+'，明白了！'):('您要制作'+k+'，明白了！');
        return nm?('「'+nm+'」 '+k+'를 만드시려는 거군요!'):(k+'를 만드시려는 거군요!');
      })();
      if(rc){ bot(rc); await new Promise(r=>setTimeout(r,420)); }
      bot(_L('내용에 어울리는 디자인 스타일을 추천해드릴게요! 마음에 드는 걸 골라주세요.'));
    }
    const st=await askStyleChat(S.kind, recStyles(S.kind, S.plan));
    if(S.kind==='ppt') S.pptStyle=st||'ax';
    else if(S.kind!=='edm') S.stylePack=st||'aether';

    bot(_L('이렇게 만들게요. 이름을 다듬고 생성해주세요!'));
    await askSummary();
    composerOff(_L('생성 중…'));
    await generate();
  }

  if(window.I18N) I18N.apply(document);
  flow0();

  /* ---- 뒤로가기/이탈 ----
     챗이 첫 화면. 첫 입력 전엔 잃을 게 없으니 자유 이탈,
     첫 입력 후엔 pushState 엔트리가 생겨 뒤로가기 → 확인 후 리셋(reload). */
  history.replaceState({s:'entry'},'',location.href);
  window.addEventListener('popstate', async ()=>{
    if(leaving || !started) return;   // 시작 전이면 브라우저에 맡김(이전 페이지로)
    const ok=await uiConfirm(_L('입력한 내용은 사라져요.'), { title:_L('처음부터 다시 시작할까요?'), okText:_L('다시 시작'), danger:true });
    if(ok){ leaving=true; location.reload(); }
    else history.pushState({s:'chat'},'',location.href);   // 취소 → 챗 엔트리 복원
  });

  /* 레일 링크 — 생성 중간이면 이탈 확인 후 원래 목적지로 */
  function confirmLeave(){ return uiConfirm(_L('입력한 내용은 저장되지 않아요.'), { title:_L('프로젝트 생성을 종료할까요?'), okText:_L('나가기'), danger:true }); }
  window.leaveGuard=(e)=>{
    if(leaving || !started) return true;   // 첫 입력 전 = 잃을 게 없음
    e.preventDefault();
    const to=(e.currentTarget && e.currentTarget.href) || 'dashboard.html';
    confirmLeave().then(ok=>{ if(ok){ leaving=true; location.href=to; } });
    return false; };
</script>
