<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 프로젝트 · MIDAS Web Generator</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('midas-theme')||'light')</script>
<script src="bundle.js"></script>
<script src="packs.krds.js"></script>
<script src="packs.midas.js"></script>
<script src="packs.edm.js"></script>
<script src="packs.aether.js"></script>
<script src="packs.ppt.js"></script>
<script src="edm/promo01.js"></script>
<script src="templates.js"></script>
<script src="modal.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="ds.css">
<style>
  body{min-height:100vh;overflow-y:auto}
  .nav{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;z-index:5}
  .nav .r{display:flex;align-items:center;gap:10px}
  .homebtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:var(--r-pill);border:1px solid var(--hairline);background:var(--surface-solid);color:var(--body);text-decoration:none;transition:var(--dur) var(--ease)}
  .homebtn:hover{color:var(--ink);border-color:var(--hairline-strong);background:var(--brand-weak)}

  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:104px 24px 96px}
  .step{display:none;width:100%;max-width:660px;text-align:center;margin-top:auto;margin-bottom:auto;animation:fade .3s var(--ease)}
  .step.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .eyebrow{margin-bottom:14px}
  h1{font-size:var(--fs-display-lg);font-weight:var(--fw-semi);letter-spacing:var(--tr-display);line-height:var(--lh-tight);margin:0 0 12px;color:var(--ink)}
  .sub{font-size:var(--fs-body-lg);color:var(--body-mid);margin:0 0 40px;letter-spacing:var(--tr-body)}

  /* 종류 카드 */
  .cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
  #st1{max-width:980px}
  .kc{width:300px;cursor:pointer;padding:0;overflow:hidden;text-align:left;font-family:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);transition:var(--dur) var(--ease)}
  .kc:hover{border-color:var(--hairline-strong);transform:translateY(-3px);box-shadow:var(--shadow-2)}
  .kc.sel{border-color:var(--ink)}
  .kc .thumb{height:150px;display:flex;align-items:center;justify-content:center;position:relative}
  .kc.single .thumb{background:color-mix(in srgb,var(--a-blue) 12%,var(--canvas))}
  .kc.multi .thumb{background:color-mix(in srgb,var(--a-purple) 12%,var(--canvas))}
  .kc.email .thumb{background:color-mix(in srgb,var(--a-green,#03C75A) 12%,var(--canvas))}
  .kc.email .env{position:relative;width:104px;height:70px;border:1.5px solid color-mix(in srgb,var(--a-green,#03C75A) 55%,var(--ink));border-radius:8px;background:var(--surface);transition:var(--dur) var(--ease)}
  .kc.email .env .flap{position:absolute;top:0;left:0;right:0;height:34px;border-bottom:1.5px solid color-mix(in srgb,var(--a-green,#03C75A) 55%,var(--ink));clip-path:polygon(0 0,50% 78%,100% 0);opacity:.5}
  .kc.email .env .eln{position:absolute;left:14px;right:14px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--a-green,#03C75A) 45%,transparent)}
  .kc.email .env .e1{bottom:26px;right:44px}.kc.email .env .e2{bottom:17px}.kc.email .env .e3{bottom:8px;right:34px;opacity:.6}
  .kc.email .env{animation:thmFloat 3.8s var(--ease) infinite}
  .kc.email:hover .env{transform:translateY(-6px) scale(1.03)}
  @media (prefers-reduced-motion:reduce){.kc.email .env{animation:none}}
  .kc .lab{padding:16px 20px;border-top:1px solid var(--hairline)}
  .kc .kt{font-size:var(--fs-display-xs);font-weight:var(--fw-semi);margin-bottom:3px;letter-spacing:var(--tr-body)}
  .kc .kd{font-size:var(--fs-body-sm);color:var(--body-mid)}
  /* mini page */
  .pg{width:92px;background:var(--surface-solid);border:1px solid var(--hairline);border-radius:var(--r-sm);box-shadow:var(--shadow-2);padding:8px;display:flex;flex-direction:column;gap:5px}
  .pg .d3{display:flex;gap:3px;margin-bottom:2px}.pg .d3 i{width:4px;height:4px;border-radius:50%;background:var(--hairline-strong)}
  .pg .ln{height:5px;border-radius:2px;background:var(--hairline)}.pg .ln.t{width:60%;height:7px;background:var(--hairline-strong)}
  .pg .g2{display:flex;gap:4px;margin-top:2px}.pg .g2 span{flex:1;height:14px;border-radius:3px;background:var(--canvas-2)}
  .single .pg .ln.c{width:42%;background:var(--a-blue);opacity:.75}
  .multi .pg .ln.c{width:42%;background:var(--a-purple);opacity:.75}
  .fan{position:relative;width:126px;height:112px}
  .fan .pg{position:absolute;left:50%;top:50%;transition:transform .5s var(--ease),opacity .4s var(--ease)}
  .fan .f1{transform:translate(-50%,-50%);z-index:3}
  .fan .f2{transform:translate(-72%,-46%) rotate(-8deg);z-index:2;height:98px;filter:brightness(.92)}
  .fan .f3{transform:translate(-28%,-46%) rotate(8deg);z-index:1;height:98px;filter:brightness(.84)}

  /* 썸네일 모션 — 단일=은은한 플로트+생성 라인, 다중=카드 부채 브리딩, hover 시 강조 */
  @keyframes thmFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes thmGen{0%{width:20%;opacity:.5}50%{width:52%;opacity:1}100%{width:20%;opacity:.5}}
  .kc.single .thumb .pg{animation:thmFloat 3.6s var(--ease) infinite}
  .kc.single .thumb .pg .ln.c{animation:thmGen 2.4s var(--ease) infinite}
  .kc.single:hover .thumb .pg{transform:translateY(-7px) scale(1.03)}
  .kc.multi .fan{animation:thmFloat 4s var(--ease) infinite}
  .kc.multi:hover .fan .f1{transform:translate(-50%,-54%)}
  .kc.multi:hover .fan .f2{transform:translate(-86%,-44%) rotate(-13deg)}
  .kc.multi:hover .fan .f3{transform:translate(-14%,-44%) rotate(13deg)}
  @media (prefers-reduced-motion:reduce){.kc.single .thumb .pg,.kc.single .thumb .pg .ln.c,.kc.multi .fan{animation:none}}

  /* step2 */
  .fields{max-width:440px;margin:0 auto;text-align:left;display:flex;flex-direction:column;gap:14px}
  .fields label{font-size:var(--fs-body-sm);font-weight:var(--fw-med);color:var(--body);margin:6px 0 -6px}
  .opt{color:var(--mute);font-weight:var(--fw-reg)}
  .orgchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}

  /* step3 */
  .styles{display:flex;gap:16px;justify-content:center}
  .sc{position:relative;width:218px;border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden;cursor:pointer;background:var(--surface);transition:var(--dur) var(--ease)}
  .sc:hover{border-color:var(--hairline-strong);transform:translateY(-2px)}.sc.sel{border-color:var(--ink)}
  .sc .sw{height:132px;position:relative;overflow:hidden;background:var(--canvas-2)}
  .sc .sw iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;pointer-events:none}
  .sc .sw .fallback{position:absolute;inset:0}
  .sc:hover .sw iframe{filter:saturate(1.05)}
  .sc .cap{padding:12px 14px;font-size:var(--fs-body-sm);font-weight:var(--fw-med);text-align:left;border-top:1px solid var(--hairline)}
  .sc .rec{position:absolute;top:9px;right:9px;z-index:2;font-size:11px;font-weight:600;color:#fff;padding:3px 9px;border-radius:var(--r-pill);background:var(--point);box-shadow:0 4px 12px rgba(108,43,255,.4)}

  .navbtns{margin-top:36px;display:flex;gap:10px;justify-content:center}
  .dots{position:fixed;bottom:36px;left:50%;transform:translateX(-50%)}
</style>
</head>
<body class="ds-body">
<div class="nav">
  <a class="homebtn" href="dashboard.html" data-i18n-title="홈으로" title="홈으로" onclick="return leaveGuard(event)"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/></svg></a>
</div>

<div class="wrap">
  <div class="step on" id="st1">
    <div class="ds-eyebrow eyebrow" data-i18n="새 프로젝트">새 프로젝트</div>
    <h1 data-i18n="어떤 걸 만들까요?">어떤 걸 만들까요?</h1>
    <p class="sub" data-i18n="단일 페이지 하나, 아니면 여러 페이지 사이트.">단일 페이지 하나, 아니면 여러 페이지 사이트.</p>
    <div class="cards">
      <button class="kc single" data-k="single">
        <div class="thumb"><div class="pg"><div class="d3"><i></i><i></i><i></i></div><div class="ln t"></div><div class="ln"></div><div class="ln c"></div><div class="g2"><span></span><span></span></div></div></div>
        <div class="lab"><div class="kt" data-i18n="랜딩페이지">랜딩페이지</div><div class="kd" data-i18n="단일페이지 · 랜딩·공지 한 장">단일페이지 · 랜딩·공지 한 장</div></div>
      </button>
      <button class="kc multi" data-k="multi">
        <div class="thumb"><div class="fan"><div class="pg f3"></div><div class="pg f2"></div><div class="pg f1"><div class="d3"><i></i><i></i><i></i></div><div class="ln t"></div><div class="ln"></div><div class="ln c"></div></div></div></div>
        <div class="lab"><div class="kt" data-i18n="웹사이트">웹사이트</div><div class="kd" data-i18n="다중페이지 · 메인·기능·요금…">다중페이지 · 메인·기능·요금…</div></div>
      </button>
      <button class="kc email" data-k="edm">
        <div class="thumb"><div class="env"><span class="flap"></span><span class="eln e1"></span><span class="eln e2"></span><span class="eln e3"></span></div></div>
        <div class="lab"><div class="kt" data-i18n="이메일">이메일</div><div class="kd" data-i18n="eDM · 템플릿에서 시작">eDM · 템플릿에서 시작</div></div>
      </button>
    </div>
  </div>

  <div class="step" id="st2">
    <div class="ds-eyebrow eyebrow" data-i18n="1 / 2 · 프로젝트 정보">1 / 2 · 프로젝트 정보</div>
    <h1 data-i18n="프로젝트 정보">프로젝트 정보</h1>
    <p class="sub" data-i18n="이름과 사업군을 알려주세요. 사업군에 맞는 스타일을 추천해드려요.">이름과 사업군을 알려주세요. 사업군에 맞는 스타일을 추천해드려요.</p>
    <div class="fields">
      <label data-i18n="프로젝트 이름">프로젝트 이름</label><input class="ds-input" id="pname" data-i18n-ph="예: 온사이트 제품사이트" placeholder="예: 온사이트 제품사이트">
      <label><span data-i18n="제품명 ">제품명 </span><span class="opt" data-i18n="(선택)">(선택)</span></label><input class="ds-input" id="product" data-i18n-ph="예: Onsite" placeholder="예: Onsite">
      <label data-i18n="사업군">사업군</label><div class="orgchips" id="orgchips"></div>
      <label><span data-i18n="사이트 언어 ">사이트 언어 </span><span class="opt" data-i18n="(생성될 페이지 언어)">(생성될 페이지 언어)</span></label><div class="orgchips" id="langchips"></div>
    </div>
    <div class="navbtns"><button class="ds-btn ghost" onclick="go(1)" data-i18n="← 이전">← 이전</button><button class="ds-btn primary" onclick="go(3)" data-i18n="다음 →">다음 →</button></div>
  </div>

  <div class="step" id="st3">
    <div class="ds-eyebrow eyebrow" id="st3eye" data-i18n="2 / 2 · 스타일">2 / 2 · 스타일</div>
    <h1 id="st3h" data-i18n="스타일을 선택하세요">스타일을 선택하세요</h1>
    <p class="sub" id="st3sub" data-i18n="생성될 페이지의 룩앤필. 나중에 바꿀 수 있어요.">생성될 페이지의 룩앤필. 나중에 바꿀 수 있어요.</p>
    <div class="styles" id="styles"></div>
    <div class="navbtns"><button class="ds-btn ghost" onclick="go(2)" data-i18n="← 이전">← 이전</button><button class="ds-btn primary" onclick="finish()" data-i18n="시작하기 →">시작하기 →</button></div>
  </div>

  <div class="ds-dots dots"><i class="on"></i><i></i><i></i></div>
</div>

<script>

  const ORGS=[{id:'enterprise',label:'전사',rec:'midas'},{id:'sk',label:'SK',rec:'aether'},{id:'ensol',label:'엔솔',rec:'krds'},{id:'personal',label:'개인작업',rec:'aether'}];
  let kind='single', stylePack='aether', org='';

  window.go=(n)=>{ document.querySelectorAll('.step').forEach(s=>s.classList.remove('on')); document.getElementById('st'+n).classList.add('on');
    document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===n-1));
    if(n===3){
      const isEdm=kind==='edm';
      document.getElementById('st3eye').textContent = isEdm ? _L('2 / 2 · 템플릿') : _L('2 / 2 · 스타일');
      document.getElementById('st3h').textContent = isEdm ? _L('템플릿을 선택하세요') : _L('스타일을 선택하세요');
      document.getElementById('st3sub').textContent = isEdm ? _L('이메일 템플릿을 골라 시작해요.') : _L('생성될 페이지의 룩앤필. 나중에 바꿀 수 있어요.');
      if(isEdm) renderEdmTemplates(); else renderStyles();
    }
  };

  let edmTpl=null;
  function renderEdmTemplates(){
    const sz=document.getElementById('styles'); sz.innerHTML='';
    const tpls=(window.APP_TEMPLATES||[]).filter(t=>t.tag==='edm');
    if(!edmTpl && tpls.length) edmTpl=tpls[0];
    tpls.forEach(tpl=>{
      const c=document.createElement('div'); c.className='sc'+(tpl===edmTpl?' sel':'');
      c.innerHTML=`<div class="sw"><div class="fallback" style="background:linear-gradient(135deg,#0B1220,#03C75A)"></div></div><div class="cap">${tpl.name}</div>`;
      const sw=c.querySelector('.sw');
      try{ const f=document.createElement('iframe'); f.setAttribute('scrolling','no'); f.srcdoc=(window.renderEdmPage?renderEdmPage(tpl.pages[0].data,{}):''); sw.append(f); fitThumb(sw,f); }catch(e){}
      c.onclick=()=>{ sz.querySelectorAll('.sc').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); edmTpl=tpl; };
      sz.append(c);
    });
  }

  document.querySelectorAll('.kc').forEach(c=>c.onclick=()=>{
    kind=c.dataset.k; go(2); setTimeout(()=>document.getElementById('pname').focus(),80);
  });

  const _L=(k)=>window.L?window.L(k):k;
  const oc=document.getElementById('orgchips');
  ORGS.forEach(o=>{ const b=document.createElement('button'); b.className='ds-chip'; b.textContent=_L(o.label);
    b.onclick=()=>{ org=o.id; oc.querySelectorAll('.ds-chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); stylePack=o.rec; }; oc.append(b); });

  // 사이트(출력) 언어 — 앱 UI 언어와 별개, 프로젝트에 저장
  let siteLang = (window.I18N ? I18N.getLang() : 'ko');
  const lc=document.getElementById('langchips');
  (window.I18N ? I18N.LANGS : [['ko','한국어']]).forEach(L=>{ const b=document.createElement('button'); b.className='ds-chip'+(L[0]===siteLang?' on':''); b.textContent=L[1];
    b.onclick=()=>{ siteLang=L[0]; lc.querySelectorAll('.ds-chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }; lc.append(b); });

  function renderStyles(){
    const sz=document.getElementById('styles'); sz.innerHTML='';
    const orgLabel=(ORGS.find(o=>o.id===org)||{}).label;
    document.getElementById('st3sub').textContent = org ? `${_L(orgLabel)} ${_L('사업군에 맞춰 골라보세요.')}` : _L('생성될 페이지의 룩앤필. 나중에 바꿀 수 있어요.');
    // 스타일팩 = Glow(다크글로우) + KRDS(정부 DS). KRDS는 packs.krds.js 계약 팩.
    const glow=(typeof DARK_PACK_BY_ID!=='undefined'&&DARK_PACK_BY_ID.aether)||{id:'aether',name:'Glow',desc:'다크·글로우',swatch:'linear-gradient(135deg,#0a0e1a,#22d3ee)'};
    const STYLES=[
      { id:'aether', name:'다크 글로우', desc:'다크 · 네온 글로우', swatch:glow.swatch },
      { id:'krds', name:'밝은 신뢰 블루', desc:'라이트 · 선명한 블루', swatch:(typeof KRDS_STYLE!=='undefined'?KRDS_STYLE.swatch:'linear-gradient(135deg,#256ef4,#0b50d0)') },
      { id:'midas', name:'MIDAS AX', desc:'모노크롬 · Poppins', swatch:(typeof MIDAS_STYLE!=='undefined'?MIDAS_STYLE.swatch:'linear-gradient(135deg,#e9eaec,#1b1c1e)') },
      { id:'aglass', name:(typeof AETHER_STYLE!=='undefined'?AETHER_STYLE.name:'Aether Glass'), desc:'다크 글래스 · 그린', swatch:(typeof AETHER_STYLE!=='undefined'?AETHER_STYLE.swatch:'linear-gradient(135deg,#0B1220,#03C75A)') },
    ];
    if(!STYLES.some(s=>s.id===stylePack)) stylePack=STYLES[0].id;
    STYLES.forEach(p=>{ const c=document.createElement('div'); c.className='sc'+(p.id===stylePack?' sel':'');
      const recStyle=(ORGS.find(o=>o.id===org)||{}).rec;
      c.innerHTML=`<div class="sw"><div class="fallback" style="background:${p.swatch}"></div>${p.id===recStyle?`<span class="rec">${_L('추천')}</span>`:''}</div><div class="cap">${_L(p.name)} · ${_L(p.desc)}</div>`;
      const sw=c.querySelector('.sw');
      // 실제 팩으로 렌더한 페이지를 축소해 살짝 보여줌 (렌더 실패 시 그라데이션 폴백 유지)
      try{ const f=document.createElement('iframe'); f.setAttribute('scrolling','no'); f.srcdoc=styleThumb(p.id); sw.append(f); fitThumb(sw,f); }catch(e){}
      c.onclick=()=>{ sz.querySelectorAll('.sc').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); stylePack=p.id; }; sz.append(c); });
  }
  // 미니 프리뷰용 샘플 데이터 + 팩별 렌더
  function styleThumb(id){
    const d=Object.assign((typeof emptyData==='function'?emptyData():{}), {
      productName:'MIDAS AX', tagline:'Design Once.\nScale with AX.',
      subcopy:'사람과 AX가 함께 활용하는 온브랜드 페이지.', primaryCta:'시작하기',
      features:[{title:'빠른 생성',desc:'대화만으로 완성'},{title:'온브랜드',desc:'스타일 팩 적용'},{title:'멀티페이지',desc:'사이트 구축'}],
      stats:[{value:'98%',label:'만족도'},{value:'3분',label:'생성 시간'},{value:'12k+',label:'사용자'}],
    });
    if(id==='krds'&&window.renderKrdsPage) return renderKrdsPage(d,{volume:'compact',motion:'static'});
    if(id==='midas'&&window.renderMidasPage) return renderMidasPage(d,{volume:'compact',motion:'static'});
    if(id==='aglass'&&window.renderAetherPage) return renderAetherPage(d,{volume:'compact',motion:'static'});
    return renderComposed(d, (DARK_PACK_BY_ID[id]||DARK_PACK_BY_ID.aether), 'static', 'main', 'compact');
  }
  function fitThumb(wrap, f){ requestAnimationFrame(()=>{ const s=wrap.clientWidth/1280; f.style.width='1280px'; f.style.height=(wrap.clientHeight/s)+'px'; f.style.transform='scale('+s+')'; }); }

  let leaving=false;
  window.finish=async ()=>{
    await storeReady();   // 저장소 준비(마이그레이션 포함) 후 생성 — 기존 프로젝트 덮어쓰기 방지
    const prod=document.getElementById('product').value.trim();
    const nm=document.getElementById('pname').value.trim();
    // 이메일(eDM): 선택한 템플릿에서 시작 + 입력한 이름/제품명 반영
    if(kind==='edm'){
      const tpl=edmTpl||(window.APP_TEMPLATES||[]).find(t=>t.tag==='edm');
      if(!tpl){ (window.uiAlert?uiAlert(_L('사용할 이메일 템플릿이 없어요.')):alert('no eDM template')); return; }
      const p=createProjectFromTemplate(tpl);
      if(nm) p.name=nm; if(prod){ p.shared=p.shared||{}; p.shared.productName=prod; } p.lang=siteLang; upsertProject(p);
      leaving=true; location.href='studio/studio.html?p='+p.id+'&page='+p.pages[0].id+'&edit=1'; return;
    }
    const shared={ productName:prod };
    const name=nm || shared.productName || '무제 프로젝트';
    const p=createProject({ kind, name, shared, stylePack, org });
    p.lang=siteLang; upsertProject(p);   // 사이트 출력 언어 저장
    let pg=p.pages[0]; if(!pg){ pg=addPage(p.id,'main'); }
    leaving=true;
    location.href=`studio/studio.html?p=${p.id}&page=${pg.id}`;
  };

  if(window.I18N) I18N.apply(document);   // 정적 마크업 로컬라이징

  // 종료 확인 — 디자인 모달(센터 딤). confirm은 동기라 못 쓰므로 항상 막고 async로 처리.
  function confirmLeave(){ return uiConfirm(_L('입력한 내용은 저장되지 않아요.'), { title:_L('프로젝트 생성을 종료할까요?'), okText:_L('나가기'), danger:true }); }
  window.leaveGuard=(e)=>{ if(leaving) return true; e.preventDefault();
    confirmLeave().then(ok=>{ if(ok){ leaving=true; location.href='dashboard.html'; } });
    return false; };

  /* 생성 중 뒤로가기 → 디자인 확인 모달 */
  history.pushState(null,'',location.href);
  window.addEventListener('popstate', ()=>{
    if(leaving) return;
    history.pushState(null,'',location.href); // 일단 페이지 유지
    confirmLeave().then(ok=>{ if(ok){ leaving=true; location.href='dashboard.html'; } });
  });
</script>
</body>
</html>
