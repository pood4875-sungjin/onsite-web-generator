<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONSITE Studio</title>
<style>
  :root{ --ink:#14151a; --ink2:#5b6270; --ink3:#8a8f9c; --line:#e9ebf0; --bg:#fff; --surf:#f7f8fb; --accent:#5b5bf5; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(1200px 700px at 85% -5%, rgba(120,110,255,.10), transparent 60%),
               radial-gradient(900px 600px at 5% 10%, rgba(90,160,255,.06), transparent 55%), #fff;
    min-height:100vh;-webkit-font-smoothing:antialiased}
  .top{display:flex;align-items:center;gap:10px;padding:20px 28px}
  .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#22d3ee,#818cf8)}
  .top b{font-size:15px;font-weight:700}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px 80px}
  .hero{text-align:center;padding:70px 0 30px}
  .hero h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0}
  .prompt{max-width:720px;margin:26px auto 0;background:#fff;border:1px solid var(--line);border-radius:20px;
    box-shadow:0 12px 40px rgba(20,24,29,.06);padding:18px 20px}
  .prompt input{width:100%;border:none;outline:none;font-size:15px;font-family:inherit;color:var(--ink);background:none;padding:2px 0 14px}
  .prompt input::placeholder{color:var(--ink3)}
  .prow{display:flex;align-items:center;gap:8px}
  .pbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;font-size:16px}
  .make{margin-left:auto;border:none;border-radius:100px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:9px 20px;cursor:pointer}
  .make:hover{filter:brightness(1.15)}
  .sec{margin-top:52px}
  .sec .shd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .sec .shd h2{font-size:15px;font-weight:600;margin:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
  .card{cursor:pointer;text-align:left;border:none;background:none;padding:0}
  .thumb{height:150px;border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;transition:.18s}
  .card:hover .thumb{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,24,29,.10)}
  .thumb .mini{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;gap:8px}
  .thumb .mini .mh{height:8px;width:40%;border-radius:4px;background:rgba(255,255,255,.85)}
  .thumb .mini .mt{height:14px;width:70%;border-radius:5px;background:rgba(255,255,255,.95)}
  .thumb .mini .mb{height:8px;width:55%;border-radius:4px;background:rgba(255,255,255,.6)}
  .thumb .mini .mrow{display:flex;gap:6px;margin-top:auto}
  .thumb .mini .mrow i{flex:1;height:34px;border-radius:8px;background:rgba(255,255,255,.5)}
  .card .tt{font-size:14px;font-weight:600;margin:12px 2px 2px}
  .card .ts{font-size:12px;color:var(--ink3);margin:0 2px}
  .empty{color:var(--ink3);font-size:14px;padding:30px;text-align:center;border:1px dashed var(--line);border-radius:14px}
  .del{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:8px;border:none;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;opacity:0;transition:.15s;font-size:13px}
  .card:hover .del{opacity:1} .del:hover{background:rgba(220,38,38,.85)}
</style>
</head>
<body>
<div class="top"><div class="logo"></div><b>ONSITE Studio</b></div>
<div class="wrap">
  <div class="hero">
    <h1>무엇을 만들까요?</h1>
    <div class="prompt">
      <input id="idea" placeholder="아이디어를 설명하세요. (AI 추론은 고도화 예정 — 지금은 예시로 시작)">
      <div class="prow">
        <button class="pbtn" title="첨부">+</button>
        <button class="make" id="makeBtn">새로 만들기 →</button>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="shd"><h2>예시로 시작</h2></div>
    <div class="grid" id="examples"></div>
  </div>

  <div class="sec">
    <div class="shd"><h2>내 프로젝트</h2></div>
    <div class="grid" id="projects"></div>
  </div>
</div>

<script type="module">
  import { getProjects, createProject, deleteProject, PT_LABEL } from './store.js';

  const EXAMPLES = [
    { pageType:'main', title:'제품 메인홈', desc:'히어로·기능·지표·배너', grad:'linear-gradient(135deg,#0e2a3a,#22d3ee)' },
    { pageType:'features', title:'기능 소개', desc:'기능 중심 상세', grad:'linear-gradient(135deg,#1a1030,#a855f7)' },
    { pageType:'pricing', title:'요금 비교', desc:'플랜·지표', grad:'linear-gradient(135deg,#3a1e05,#fb923c)' },
    { pageType:'landing', title:'이벤트 랜딩', desc:'짧은 단일 페이지', grad:'linear-gradient(135deg,#0a1f16,#34d399)' },
  ];

  const miniHTML = `<div class="mini"><div class="mh"></div><div class="mt"></div><div class="mb"></div><div class="mrow"><i></i><i></i><i></i></div></div>`;

  function openPage(proj){ const pg = proj.pages[0]; location.href = `studio/studio.html?p=${proj.id}&page=${pg.id}`; }

  function start(pageType){ const p = createProject({ kind:'single', pageType }); openPage(p); }

  document.getElementById('examples').innerHTML = '';
  EXAMPLES.forEach(ex=>{
    const c = document.createElement('button'); c.className='card';
    c.innerHTML = `<div class="thumb" style="background:${ex.grad}">${miniHTML}</div><div class="tt">${ex.title}</div><div class="ts">${ex.desc}</div>`;
    c.onclick = ()=>start(ex.pageType);
    document.getElementById('examples').append(c);
  });

  document.getElementById('makeBtn').onclick = ()=>start('main');
  document.getElementById('idea').addEventListener('keydown', e=>{ if(e.key==='Enter') start('main'); });

  function renderProjects(){
    const box = document.getElementById('projects');
    const ps = getProjects();
    if(!ps.length){ box.innerHTML = ''; box.append(Object.assign(document.createElement('div'),{className:'empty',textContent:'아직 프로젝트가 없어요. 위에서 예시로 시작하거나 새로 만들어보세요.'})); box.style.display='block'; return; }
    box.style.display='grid'; box.innerHTML='';
    ps.forEach(p=>{
      const d = new Date(p.createdAt); const date = `${d.getMonth()+1}/${d.getDate()}`;
      const kindLabel = p.kind==='multi' ? `사이트 · ${p.pages.length}페이지` : (PT_LABEL[p.pages[0]?.pageType]||'페이지');
      const c = document.createElement('button'); c.className='card';
      c.innerHTML = `<div class="thumb" style="background:linear-gradient(135deg,#0b0f1a,#1b2740)"><button class="del" title="삭제">✕</button>${miniHTML}</div><div class="tt">${p.name}</div><div class="ts">${kindLabel} · ${date}</div>`;
      c.querySelector('.del').onclick = (e)=>{ e.stopPropagation(); if(confirm(`"${p.name}" 삭제할까요?`)){ deleteProject(p.id); renderProjects(); } };
      c.onclick = ()=>openPage(p);
      box.append(c);
    });
  }
  renderProjects();
</script>
</body>
</html>
