<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 프로젝트 · MIDAS Web Generator</title>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('midas-theme')||'light')</script>
<script src="bundle.js"></script>
<link rel="stylesheet" href="ds.css">
<style>
  body{min-height:100vh;overflow-y:auto;background:var(--scrim),var(--canvas);background-attachment:fixed}
  .nav{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;z-index:5}
  .nav .r{display:flex;align-items:center;gap:10px}
  .navlink{color:var(--body);font-size:var(--fs-body-sm);font-weight:var(--fw-med);text-decoration:none;border:1px solid var(--hairline);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px}
  .navlink:hover{color:var(--ink);border-color:var(--hairline-strong)}

  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:104px 24px 96px}
  .step{display:none;width:100%;max-width:660px;text-align:center;margin-top:auto;margin-bottom:auto;animation:fade .3s var(--ease)}
  .step.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .eyebrow{margin-bottom:14px}
  h1{font-size:var(--fs-display-lg);font-weight:var(--fw-semi);letter-spacing:var(--tr-display);line-height:var(--lh-tight);margin:0 0 12px;color:var(--ink)}
  .sub{font-size:var(--fs-body-lg);color:var(--body-mid);margin:0 0 40px;letter-spacing:var(--tr-body)}

  /* 종류 카드 */
  .cards{display:flex;gap:20px;justify-content:center}
  .kc{width:300px;cursor:pointer;padding:0;overflow:hidden;text-align:left;font-family:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);transition:var(--dur) var(--ease)}
  .kc:hover{border-color:var(--hairline-strong);transform:translateY(-3px);box-shadow:var(--shadow-2)}
  .kc.sel{border-color:var(--ink)}
  .kc .thumb{height:150px;display:flex;align-items:center;justify-content:center;position:relative}
  .kc.single .thumb{background:color-mix(in srgb,var(--a-blue) 12%,var(--canvas))}
  .kc.multi .thumb{background:color-mix(in srgb,var(--a-purple) 12%,var(--canvas))}
  .kc .lab{padding:16px 20px;border-top:1px solid var(--hairline)}
  .kc .kt{font-size:var(--fs-display-xs);font-weight:var(--fw-semi);margin-bottom:3px;letter-spacing:var(--tr-body)}
  .kc .kd{font-size:var(--fs-body-sm);color:var(--body-mid)}
  /* mini page */
  .pg{width:92px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-sm);box-shadow:var(--shadow-2);padding:8px;display:flex;flex-direction:column;gap:5px}
  .pg .d3{display:flex;gap:3px;margin-bottom:2px}.pg .d3 i{width:4px;height:4px;border-radius:50%;background:var(--hairline-strong)}
  .pg .ln{height:5px;border-radius:2px;background:var(--hairline)}.pg .ln.t{width:60%;height:7px;background:var(--hairline-strong)}
  .pg .g2{display:flex;gap:4px;margin-top:2px}.pg .g2 span{flex:1;height:14px;border-radius:3px;background:var(--canvas-2)}
  .single .pg .ln.c{width:42%;background:var(--a-blue);opacity:.75}
  .multi .pg .ln.c{width:42%;background:var(--a-purple);opacity:.75}
  .fan{position:relative;width:126px;height:112px}
  .fan .pg{position:absolute;left:50%;top:50%}
  .fan .f1{transform:translate(-50%,-50%);z-index:3}
  .fan .f2{transform:translate(-72%,-46%) rotate(-8deg);z-index:2;opacity:.9;height:98px}
  .fan .f3{transform:translate(-28%,-46%) rotate(8deg);z-index:1;opacity:.75;height:98px}

  /* step2 */
  .fields{max-width:440px;margin:0 auto;text-align:left;display:flex;flex-direction:column;gap:14px}
  .fields label{font-size:var(--fs-body-sm);font-weight:var(--fw-med);color:var(--body);margin:6px 0 -6px}
  .opt{color:var(--mute);font-weight:var(--fw-reg)}
  .orgchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}

  /* step3 */
  .styles{display:flex;gap:16px;justify-content:center}
  .sc{position:relative;width:190px;border:1px solid var(--hairline);border-radius:var(--r-md);overflow:hidden;cursor:pointer;background:var(--surface);transition:var(--dur) var(--ease)}
  .sc:hover{border-color:var(--hairline-strong);transform:translateY(-2px)}.sc.sel{border-color:var(--ink)}
  .sc .sw{height:108px}.sc .cap{padding:12px 14px;font-size:var(--fs-body-sm);font-weight:var(--fw-med);text-align:left}
  .sc .rec{position:absolute;top:10px;right:10px}

  .navbtns{margin-top:36px;display:flex;gap:10px;justify-content:center}
  .dots{position:fixed;bottom:36px;left:50%;transform:translateX(-50%)}
</style>
</head>
<body class="ds-body">
<div class="nav">
  <div class="brand"><b class="ds-wordmark">MIDAS <span>Web Generator</span></b></div>
  <div class="r"><button id="themeBtn"></button><a class="navlink" href="projects.html">내 프로젝트 →</a></div>
</div>

<div class="wrap">
  <div class="step on" id="st1">
    <div class="ds-eyebrow eyebrow">새 프로젝트</div>
    <h1>어떤 걸 만들까요?</h1>
    <p class="sub">단일 페이지 하나, 아니면 여러 페이지 사이트.</p>
    <div class="cards">
      <button class="kc single" data-k="single">
        <div class="thumb"><div class="pg"><div class="d3"><i></i><i></i><i></i></div><div class="ln t"></div><div class="ln"></div><div class="ln c"></div><div class="g2"><span></span><span></span></div></div></div>
        <div class="lab"><div class="kt">단일 페이지</div><div class="kd">랜딩 · 공지 등 한 장</div></div>
      </button>
      <button class="kc multi" data-k="multi">
        <div class="thumb"><div class="fan"><div class="pg f3"></div><div class="pg f2"></div><div class="pg f1"><div class="d3"><i></i><i></i><i></i></div><div class="ln t"></div><div class="ln"></div><div class="ln c"></div></div></div></div>
        <div class="lab"><div class="kt">다중 페이지</div><div class="kd">메인·기능·요금… 사이트 구축</div></div>
      </button>
    </div>
  </div>

  <div class="step" id="st2">
    <div class="ds-eyebrow eyebrow">1 / 2 · 프로젝트 정보</div>
    <h1>프로젝트 정보</h1>
    <p class="sub">이름과 사업군을 알려주세요. 사업군에 맞는 스타일을 추천해드려요.</p>
    <div class="fields">
      <label>프로젝트 이름</label><input class="ds-input" id="pname" placeholder="예: 온사이트 제품사이트">
      <label>제품명 <span class="opt">(선택)</span></label><input class="ds-input" id="product" placeholder="예: Onsite">
      <label>사업군</label><div class="orgchips" id="orgchips"></div>
    </div>
    <div class="navbtns"><button class="ds-btn ghost" onclick="go(1)">← 이전</button><button class="ds-btn primary" onclick="go(3)">다음 →</button></div>
  </div>

  <div class="step" id="st3">
    <div class="ds-eyebrow eyebrow">2 / 2 · 스타일</div>
    <h1>스타일을 선택하세요</h1>
    <p class="sub" id="st3sub">생성될 페이지의 룩앤필. 나중에 바꿀 수 있어요.</p>
    <div class="styles" id="styles"></div>
    <div class="navbtns"><button class="ds-btn ghost" onclick="go(2)">← 이전</button><button class="ds-btn primary" onclick="finish()">시작하기 →</button></div>
  </div>

  <div class="ds-dots dots"><i class="on"></i><i></i><i></i></div>
</div>

<script>
  mountThemeToggle(document.getElementById('themeBtn'));

  const ORGS=[{id:'enterprise',label:'전사',rec:'aether'},{id:'sk',label:'SK',rec:'ember'},{id:'ensol',label:'엔솔',rec:'violet'},{id:'personal',label:'개인작업',rec:'aether'}];
  let kind='single', stylePack='aether', org='';

  window.go=(n)=>{ document.querySelectorAll('.step').forEach(s=>s.classList.remove('on')); document.getElementById('st'+n).classList.add('on');
    document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===n-1)); if(n===3) renderStyles(); };

  document.querySelectorAll('.kc').forEach(c=>c.onclick=()=>{ kind=c.dataset.k; go(2); setTimeout(()=>document.getElementById('pname').focus(),80); });

  const oc=document.getElementById('orgchips');
  ORGS.forEach(o=>{ const b=document.createElement('button'); b.className='ds-chip'; b.textContent=o.label;
    b.onclick=()=>{ org=o.id; oc.querySelectorAll('.ds-chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); stylePack=o.rec; }; oc.append(b); });

  function renderStyles(){
    const sz=document.getElementById('styles'); sz.innerHTML='';
    const rec=(ORGS.find(o=>o.id===org)||{}).rec, orgLabel=(ORGS.find(o=>o.id===org)||{}).label;
    document.getElementById('st3sub').textContent = org ? `${orgLabel} 사업군 추천을 표시했어요.` : '생성될 페이지의 룩앤필. 나중에 바꿀 수 있어요.';
    DARK_PACKS.forEach(p=>{ const c=document.createElement('div'); c.className='sc'+(p.id===stylePack?' sel':'');
      const rb=(p.id===rec)?`<span class="ds-badge rec">★ ${orgLabel} 추천</span>`:'';
      c.innerHTML=`<div class="sw" style="background:${p.swatch}"></div>${rb}<div class="cap">${p.name} · ${p.desc}</div>`;
      c.onclick=()=>{ sz.querySelectorAll('.sc').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); stylePack=p.id; }; sz.append(c); });
  }

  window.finish=()=>{
    const shared={ productName:document.getElementById('product').value.trim() };
    const name=document.getElementById('pname').value.trim() || shared.productName || '무제 프로젝트';
    const p=createProject({ kind, name, shared, stylePack, org });
    let pg=p.pages[0]; if(!pg){ pg=addPage(p.id,'main'); }
    location.href=`studio/studio.html?p=${p.id}&page=${pg.id}`;
  };
</script>
</body>
</html>
