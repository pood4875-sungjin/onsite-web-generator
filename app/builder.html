<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONSITE Web Generator — Builder</title>
<style>
/* ===== DS v1 토큰 (Wanted 기반, 인라인) ===== */
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css");
@import url("https://cdn.jsdelivr.net/npm/wanted-sans@1.0.3/fonts/webfonts/variable/split/WantedSansVariable.css");
:root{
  --brand:oklch(0.563 0.232 257);--brand-hover:oklch(0.484 0.205 258);
  --ink:oklch(0.148 0.004 277);
  --ink-2:oklch(0.259 0.010 273 / 0.88);
  --muted:oklch(0.298 0.010 273 / 0.61);
  --soft:oklch(0.298 0.010 273 / 0.43);
  --line:oklch(0.521 0.018 273 / 0.10);
  --line-2:oklch(0.521 0.018 273 / 0.16);
  --bg:oklch(1 0 0);--bg-2:oklch(0.972 0.002 286);
  --info:oklch(0.563 0.232 257);--info-bg:oklch(0.954 0.022 250);
  --warn:oklch(0.625 0.148 56);--warn-bg:oklch(0.967 0.030 81);
  --danger:oklch(0.546 0.220 27);--danger-bg:oklch(0.951 0.018 18);
  --ok:oklch(0.673 0.211 144);--ok-bg:oklch(0.968 0.052 154);
  --fs-13:13px;--fs-14:14px;--fs-15:15px;--fs-16:16px;--fs-18:18px;
  --fs-22:22px;--fs-28:28px;--fs-34:34px;--fs-44:44px;
  --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:24px;--s-6:32px;--s-7:48px;--s-8:72px;--s-9:104px;
  --radius:12px;--radius-sm:8px;
  --font-sans:"Pretendard JP","Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --font-display:"Wanted Sans Variable","Wanted Sans","Pretendard JP","Pretendard Variable",system-ui,sans-serif;
  --font-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--bg-2);
  letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow:hidden}

/* ===== 앱 셸 ===== */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{height:52px;flex:0 0 52px;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 var(--s-5);z-index:10}
.topbar .brand{font-weight:700;font-size:var(--fs-16)}
.topbar .brand span{color:var(--soft);font-weight:500;margin-left:8px;font-size:var(--fs-14)}
.seg{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:none;background:none;padding:6px 14px;font-size:var(--fs-14);font-weight:500;
  color:var(--muted);border-radius:6px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.top-actions{display:flex;gap:8px}
.tbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-size:var(--fs-14);
  font-weight:500;cursor:pointer}
.tbtn:hover{background:var(--bg-2)}
.tbtn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}

.body{flex:1;display:flex;min-height:0}

/* ===== 좌측 라이브러리 ===== */
.lib{width:300px;flex:0 0 300px;background:var(--bg);border-right:1px solid var(--line);
  overflow-y:auto;padding:var(--s-4)}
.lib .search{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:var(--fs-14);
  margin-bottom:var(--s-4);font-family:inherit}
.cat{margin-bottom:var(--s-5)}
.cat-h{font-size:var(--fs-13);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);
  margin:0 0 var(--s-3) 4px;display:flex;align-items:center;gap:6px}
.cat-h .cnt{color:var(--line);font-weight:500}
.sec-row{margin-bottom:var(--s-3)}
.sec-name{font-size:var(--fs-14);font-weight:600;margin:0 0 6px 4px;color:var(--ink-2)}
.vchips{display:flex;flex-wrap:wrap;gap:5px}
.vchip{font-size:var(--fs-13);border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;
  cursor:grab;color:var(--muted);transition:.1s;user-select:none}
.vchip:hover{border-color:var(--ink);color:var(--ink);background:var(--bg-2)}
.vchip:active{cursor:grabbing}
.vchip.dragging{opacity:.4}

/* ===== 호버 프리뷰 팝오버 ===== */
.preview{position:fixed;z-index:50;width:360px;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 40px rgba(20,22,31,.16);overflow:hidden;pointer-events:none;display:none}
.preview .pv-head{font-size:var(--fs-13);font-weight:600;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line-2);
  font-family:var(--font-mono)}
.preview .pv-body{height:230px;overflow:hidden;position:relative;background:var(--bg-2)}
.preview .pv-scale{position:absolute;top:0;left:0;width:200%;transform:scale(.5);transform-origin:top left;background:#fff}

/* ===== 캔버스 ===== */
.canvas-wrap{flex:1;overflow-y:auto;padding:var(--s-6);min-width:0}
.canvas{max-width:1000px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;
  min-height:calc(100vh - 160px);overflow:hidden;box-shadow:0 1px 3px rgba(20,22,31,.04)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100vh - 200px);
  color:var(--soft);text-align:center;gap:8px;padding:var(--s-6)}
.empty .big{font-size:var(--fs-18);font-weight:600;color:var(--muted)}
.canvas.drag-over{border-color:var(--ink);border-style:dashed}

/* 캔버스 블록 래퍼 */
.block{position:relative;border-bottom:1px dashed transparent}
.block:hover{outline:2px solid var(--info);outline-offset:-2px}
.block-bar{position:absolute;top:0;right:0;z-index:5;display:none;gap:2px;background:var(--ink);border-radius:0 0 0 8px;padding:3px}
.block:hover .block-bar{display:flex}
.block-bar button{border:none;background:none;color:#fff;width:26px;height:24px;border-radius:5px;cursor:pointer;font-size:13px}
.block-bar button:hover{background:rgba(255,255,255,.18)}
.block-tag{position:absolute;top:0;left:0;z-index:5;background:var(--ink);color:#fff;font-size:11px;
  padding:3px 9px;border-radius:0 0 8px 0;font-family:var(--font-mono);display:none}
.block:hover .block-tag{display:block}
.drop-line{height:3px;background:var(--info);margin:0;display:none}
.drop-line.show{display:block}

/* ===== 내보내기 모달 ===== */
.modal-bg{position:fixed;inset:0;background:rgba(20,22,31,.4);z-index:100;display:none;align-items:center;justify-content:center;padding:40px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:820px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal .m-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .m-head h3{margin:0;font-size:var(--fs-16)}
.modal textarea{flex:1;border:none;padding:16px 20px;font-family:var(--font-mono);font-size:12px;line-height:1.6;resize:none;color:var(--ink-2)}
.modal .m-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* ============================================================
   섹션 렌더 스타일 (캔버스/프리뷰 공용) — .sx 스코프
   ============================================================ */
.sx{--brand-contrast:#fff;font-family:var(--font-sans)}
.sx .container{max-width:1000px;margin:0 auto;padding:0 32px}
.sx .band{padding:64px 0}
.sx .band.alt{background:var(--bg-2)}
.sx .eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);margin-bottom:10px}
.sx .h-sec{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.024em;line-height:1.3;margin:0;color:var(--ink)}
.sx .sub{font-size:16px;color:var(--muted);margin-top:10px;max-width:520px}
.sx .center{text-align:center}.sx .center .sub{margin-left:auto;margin-right:auto}
.sx .btn{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:500;padding:11px 20px;
  border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none}
.sx .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.sx .btn.primary:hover{background:var(--brand-hover)}
.sx .row{display:flex;gap:10px}
.sx .grid{display:grid;gap:16px}
.sx .card{border:1px solid var(--line);border-radius:10px;padding:22px}
.sx .k{font-family:var(--font-mono);font-size:13px;color:var(--soft);margin-bottom:12px}
.sx h3{margin:0}
/* 공통/개별 */
.sx .announce{background:var(--bg-2);border-bottom:1px solid var(--line);text-align:center;padding:9px;font-size:14px;color:var(--ink-2)}
.sx .gnb{display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 32px;border-bottom:1px solid var(--line)}
.sx .gnb.trans{background:transparent}
.sx .gnb .logo{font-weight:700}
.sx .gnb nav{display:flex;gap:26px;font-size:15px;color:var(--muted)}
.sx .hero{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:80px 0}
.sx .hero.min{grid-template-columns:1fr;text-align:center}
.sx .hero.bg{grid-template-columns:1fr;text-align:center;background:var(--bg-2);border-radius:0}
.sx .hero h1{font-family:var(--font-display);font-size:42px;font-weight:700;letter-spacing:-.028em;line-height:1.2;margin:0;color:var(--ink)}
.sx .hero .lead{font-size:18px;color:var(--muted);margin:16px 0 28px}
.sx .visual{aspect-ratio:4/3;border-radius:10px;background:var(--bg-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:14px}
.sx .cols-2{grid-template-columns:1fr 1fr}
.sx .cols-3{grid-template-columns:repeat(3,1fr)}
.sx .cols-4{grid-template-columns:repeat(4,1fr)}
.sx .muted{color:var(--muted);font-size:14px}
.sx .num{font-size:42px;font-weight:700;letter-spacing:-.03em}
.sx .quote{font-size:26px;font-weight:500;line-height:1.45;letter-spacing:-.02em;max-width:680px;margin:0 auto;text-align:center}
.sx .who{text-align:center;color:var(--muted);margin-top:18px;font-size:15px}
.sx .cell{border:1px solid var(--line);border-radius:8px;height:60px;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:13px;font-weight:600}
.sx .callout{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.sx .callout b{font-size:14px}
.sx .callout.info{background:var(--info-bg);border-color:transparent}.sx .callout.info b{color:var(--info)}
.sx .callout.warn{background:var(--warn-bg);border-color:transparent}.sx .callout.warn b{color:var(--warn)}
.sx .callout.danger{background:var(--danger-bg);border-color:transparent}.sx .callout.danger b{color:var(--danger)}
.sx .callout.tip{background:var(--ok-bg);border-color:transparent}.sx .callout.tip b{color:var(--ok)}
.sx table.spec{width:100%;border-collapse:collapse;font-size:14px}
.sx table.spec td{border:1px solid var(--line);padding:10px 14px}
.sx table.spec td:first-child{background:var(--bg-2);font-weight:600;width:30%}
.sx .step{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.sx .step .n{flex:0 0 32px;height:32px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.sx .toc{border:1px solid var(--line);border-radius:10px;padding:18px 22px}
.sx .toc a{display:block;padding:6px 0;color:var(--muted);font-size:15px;text-decoration:none;border-bottom:1px solid var(--line-2)}
.sx ul.chk{list-style:none;padding:0;margin:0}
.sx ul.chk li{padding:8px 0 8px 26px;position:relative;font-size:15px}
.sx ul.chk li::before{content:"☐";position:absolute;left:0;color:var(--soft)}
@media(max-width:820px){.lib{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">ONSITE Generator <span>Builder</span></div>
    <div class="seg" id="ptype">
      <button class="on" data-pt="product">제품소개</button>
      <button data-pt="manual">매뉴얼</button>
    </div>
    <div class="top-actions">
      <button class="tbtn" id="clearBtn">비우기</button>
      <button class="tbtn primary" id="exportBtn">HTML 내보내기</button>
    </div>
  </div>

  <div class="body">
    <!-- 좌측 라이브러리 -->
    <aside class="lib">
      <input class="search" id="search" placeholder="섹션 검색…">
      <div id="libList"></div>
    </aside>

    <!-- 캔버스 -->
    <div class="canvas-wrap">
      <div class="canvas" id="canvas">
        <div class="empty" id="empty">
          <div class="big">여기로 섹션을 끌어다 놓으세요</div>
          <div>좌측에서 섹션 케이스를 드래그 → 페이지 조립</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 호버 프리뷰 -->
<div class="preview" id="preview">
  <div class="pv-head" id="pvHead"></div>
  <div class="pv-body"><div class="pv-scale sx" id="pvBody"></div></div>
</div>

<!-- 내보내기 모달 -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="m-head"><h3>생성된 HTML</h3><button class="tbtn" id="modalClose">닫기</button></div>
    <textarea id="exportCode" readonly spellcheck="false"></textarea>
    <div class="m-foot"><button class="tbtn primary" id="copyBtn">복사</button></div>
  </div>
</div>

<script>
/* ============================================================
   섹션 레지스트리 — 각 섹션: {type,label,cat,variants:[{id,label}], render(variant)}
   render → 캔버스/프리뷰 공용 HTML (placeholder 콘텐츠)
   ============================================================ */
const H = {
  eyebrow:(t)=>`<div class="eyebrow">${t}</div>`,
  sample:'설명 텍스트가 들어갑니다. 기획 내용에 맞춰 교체됩니다.',
};
function head(eyebrow,title,sub,center=true){
  return `<div class="${center?'center':''}">${H.eyebrow(eyebrow)}<h2 class="h-sec">${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div>`;
}
const SECTIONS = {
  common:[
    {type:'gnb',label:'Header / GNB',variants:[{id:'solid',label:'솔리드'},{id:'trans',label:'투명오버'},{id:'cta',label:'CTA포함'}],
     render:v=>`<div class="gnb ${v==='trans'?'trans':''}"><div class="logo">ONSITE</div><nav><span>제품</span><span>기능</span><span>요금</span><span>고객사례</span></nav>${v==='cta'?'<a class="btn primary">무료로 시작</a>':'<a class="btn">로그인</a>'}</div>`},
    {type:'hero',label:'Hero',variants:[{id:'split',label:'split'},{id:'center',label:'centered'},{id:'min',label:'minimal'},{id:'bg',label:'bg-image'}],
     render:v=>{const cta=`<div class="row" style="${v==='split'?'':'justify-content:center'}"><a class="btn primary">무료로 시작하기</a><a class="btn">도입 문의 →</a></div>`;
       const txt=`<div>${H.eyebrow('현장 업무 플랫폼')}<h1>현장의 모든 일,<br>하나로 연결됩니다</h1><p class="lead">${H.sample}</p>${cta}</div>`;
       if(v==='split')return `<div class="container"><div class="hero">${txt}<div class="visual">비주얼</div></div></div>`;
       if(v==='bg')return `<div class="hero bg" style="padding:80px 32px"><div class="container">${txt}</div></div>`;
       return `<div class="container"><div class="hero min">${txt}</div></div>`;}},
    {type:'cta',label:'CTA',variants:[{id:'banner',label:'배너'},{id:'card',label:'카드센터'},{id:'form',label:'폼결합'}],
     render:v=>{const inner=`<h2 class="h-sec">지금 시작해보세요</h2><p class="sub" style="margin:10px auto 0">${H.sample}</p>${v==='form'?'<div class="row" style="justify-content:center;margin-top:20px"><input class="btn" style="min-width:220px" placeholder="이메일 입력"><a class="btn primary">시작</a></div>':'<div class="row" style="justify-content:center;margin-top:20px"><a class="btn primary">무료로 시작</a><a class="btn">문의</a></div>'}`;
       if(v==='card')return `<div class="band"><div class="container"><div class="card center" style="padding:48px">${inner}</div></div></div>`;
       return `<div class="band alt center"><div class="container">${inner}</div></div>`;}},
    {type:'faq',label:'FAQ',variants:[{id:'acc',label:'아코디언'},{id:'2col',label:'2열'},{id:'cat',label:'카테고리형'}],
     render:v=>{const q=(t)=>`<div class="card" style="padding:16px 18px"><b>Q. ${t}</b><p class="muted" style="margin:8px 0 0">${H.sample}</p></div>`;
       const items=[q('도입은 어떻게 하나요?'),q('요금제가 궁금해요'),q('보안은 안전한가요?'),q('무료 체험이 있나요?')];
       const g=v==='2col'?'grid cols-2':'grid';
       return `<div class="band"><div class="container">${head('FAQ','자주 묻는 질문','',true)}<div class="${g}" style="margin-top:32px;gap:10px">${items.join('')}</div></div></div>`;}},
    {type:'footer',label:'Footer',variants:[{id:'sitemap',label:'사이트맵'},{id:'simple',label:'심플'},{id:'min',label:'미니멀'}],
     render:v=>{if(v==='min')return `<div style="padding:28px 32px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px">© 2026 ONSITE</div>`;
       const col=(h,a)=>`<div><div style="font-weight:600;margin-bottom:12px;font-size:14px">${h}</div>${a.map(x=>`<div class="muted" style="margin:7px 0">${x}</div>`).join('')}</div>`;
       if(v==='simple')return `<div style="padding:40px 0;border-top:1px solid var(--line)"><div class="container" style="display:flex;justify-content:space-between"><div class="logo" style="font-weight:700">ONSITE</div><div class="muted">© 2026 ONSITE</div></div></div>`;
       return `<div style="padding:56px 0;border-top:1px solid var(--line)"><div class="container" style="display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap"><div class="logo" style="font-weight:700">ONSITE</div>${col('제품',['메신저','업무관리','드라이브'])}${col('리소스',['블로그','고객사례','헬프센터'])}${col('회사',['소개','채용','약관'])}</div></div>`;}},
  ],
  product:[
    {type:'productLineup',label:'제품 라인업',variants:[{id:'c3',label:'3열'},{id:'c4',label:'4열'},{id:'ico',label:'아이콘형'}],
     render:v=>{const n=v==='c4'?4:3;const card=(i)=>`<div class="card"><div class="k">0${i}</div><h3>제품 ${i}</h3><p class="muted" style="margin-top:6px">${H.sample}</p></div>`;
       return `<div class="band"><div class="container">${head('Products','다양한 제품','현장 업무에 필요한 모든 기능')}<div class="grid cols-${n}" style="margin-top:32px">${[1,2,3,4,5,6].map(card).join('')}</div></div></div>`;}},
    {type:'feature',label:'Feature',variants:[{id:'grid',label:'grid'},{id:'alt',label:'좌우교차'},{id:'ico',label:'아이콘형'},{id:'tab',label:'탭형'}],
     render:v=>{if(v==='alt')return `<div class="band"><div class="container"><div class="hero"><div><h2 class="h-sec">핵심 기능</h2><p class="sub">${H.sample}</p></div><div class="visual">스크린샷</div></div></div></div>`;
       const card=(i)=>`<div class="card"><h3>기능 ${i}</h3><p class="muted" style="margin-top:6px">${H.sample}</p></div>`;
       return `<div class="band alt"><div class="container">${head('Features','일의 시작부터 끝까지','')}<div class="grid cols-3" style="margin-top:32px">${[1,2,3].map(card).join('')}</div></div></div>`;}},
    {type:'benefit',label:'Benefit (가치)',variants:[{id:'3up',label:'3-up'},{id:'cross',label:'교차강조'}],
     render:v=>{const it=(i)=>`<div><div class="k">0${i}</div><h3 style="font-size:22px">가치 ${i}</h3><p class="muted" style="margin-top:8px">${H.sample}</p></div>`;
       return `<div class="band"><div class="container">${head('Why Onsite','분산을 줄일수록 본질에 집중','')}<div class="grid cols-3" style="margin-top:40px;gap:40px">${[1,2,3].map(it).join('')}</div></div></div>`;}},
    {type:'process',label:'Process',variants:[{id:'hstep',label:'가로번호'},{id:'timeline',label:'세로타임라인'},{id:'stepper',label:'스테퍼'}],
     render:v=>{const st=(i,t)=>`<div class="center"><div class="num" style="font-size:20px;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px">${i}</div><h3 style="font-size:16px">${t}</h3><p class="muted" style="margin-top:4px">${H.sample}</p></div>`;
       return `<div class="band alt"><div class="container">${head('How it works','3분이면 시작','')}<div class="grid cols-4" style="margin-top:40px">${st(1,'가입')}${st(2,'초대')}${st(3,'설정')}${st(4,'사용')}</div></div></div>`;}},
    {type:'stats',label:'Stats (지표)',variants:[{id:'row',label:'카운터 행'},{id:'card',label:'카드'}],
     render:v=>{const s=(n,l)=>`<div class="center"><div class="num">${n}</div><div class="muted" style="margin-top:8px">${l}</div></div>`;
       return `<div class="band"><div class="container">${head('By the numbers','숫자로 증명','')}<div class="grid cols-4" style="margin-top:40px">${s('1위','국내 순위')}${s('180만+','이용자')}${s('42만+','고객사')}${s('99%','만족도')}</div><p class="muted center" style="margin-top:24px;font-size:13px">출처: 예시</p></div></div>`;}},
    {type:'testimonial',label:'Testimonial',variants:[{id:'single',label:'단일인용'},{id:'carousel',label:'캐러셀'},{id:'wall',label:'로고월'}],
     render:v=>{if(v==='wall'){const c=Array(10).fill('<div class="cell">LOGO</div>').join('');
       return `<div class="band alt"><div class="container center"><p class="sub" style="margin:0 auto 24px">고객사</p><div class="grid" style="grid-template-columns:repeat(5,1fr);gap:8px">${c}</div></div></div>`;}
       return `<div class="band"><div class="container"><p class="quote">“${H.sample}”</p><div class="who"><b>정보화기획조정관</b> · 공공기관</div></div></div>`;}},
    {type:'comparison',label:'Comparison / 요금',variants:[{id:'table',label:'표'},{id:'cards',label:'카드'},{id:'toggle',label:'월년토글'}],
     render:v=>{if(v==='table')return `<div class="band alt"><div class="container">${head('Pricing','요금제 비교','')}<table class="spec" style="margin-top:32px"><tr><td>플랜</td><td>Basic</td><td>Pro</td></tr><tr><td>가격</td><td>무료</td><td>₩9,900</td></tr><tr><td>멤버</td><td>10명</td><td>무제한</td></tr></table></div></div>`;
       const p=(t,pr)=>`<div class="card center"><h3>${t}</h3><div class="num" style="font-size:34px;margin:12px 0">${pr}</div><a class="btn primary">선택</a></div>`;
       return `<div class="band alt"><div class="container">${head('Pricing','요금제','')}<div class="grid cols-3" style="margin-top:32px">${p('Basic','무료')}${p('Pro','₩9,900')}${p('Enterprise','문의')}</div></div></div>`;}},
    {type:'showcase',label:'Showcase',variants:[{id:'shot',label:'스크린샷'},{id:'video',label:'비디오'},{id:'gallery',label:'갤러리'}],
     render:v=>{if(v==='gallery')return `<div class="band"><div class="container">${head('Showcase','제품 화면','')}<div class="grid cols-3" style="margin-top:32px">${Array(3).fill('<div class="visual">이미지</div>').join('')}</div></div></div>`;
       return `<div class="band"><div class="container">${head('Showcase','제품을 직접 확인하세요','')}<div class="visual" style="margin-top:32px;aspect-ratio:16/9">${v==='video'?'동영상':'스크린샷'}</div></div></div>`;}},
    {type:'industry',label:'업종별 활용 ★',variants:[{id:'grid',label:'그리드'},{id:'tab',label:'탭'}],
     render:v=>{const it=(t)=>`<div class="card"><h3 style="font-size:16px">${t}</h3><p class="muted" style="margin-top:4px">${H.sample}</p></div>`;
       return `<div class="band alt"><div class="container">${head('By industry','다양한 업종에서','')}<div class="grid cols-4" style="margin-top:32px;gap:12px">${['제조','IT','서비스','의료','공공','교육','금융','엔터프라이즈'].map(it).join('')}</div></div></div>`;}},
    {type:'integration',label:'Integration',variants:[{id:'grid',label:'로고그리드'},{id:'cat',label:'카테고리별'}],
     render:v=>`<div class="band"><div class="container center">${head('Integrations','쓰던 도구와 연동','')}<div class="row" style="justify-content:center;flex-wrap:wrap;margin-top:32px">${['Slack','GitHub','Jira','Google','Notion'].map(t=>`<div class="cell" style="min-width:120px;height:52px">${t}</div>`).join('')}</div></div></div>`},
    {type:'trust',label:'Trust / 보안',variants:[{id:'cert',label:'인증마크'},{id:'band',label:'밴드'}],
     render:v=>`<div class="band alt"><div class="container hero"><div><div class="eyebrow">Security</div><h2 class="h-sec">글로벌 최고 수준 보안</h2><p class="sub">${H.sample}</p></div><div class="grid cols-3" style="gap:8px">${['ISO 27001','ISMS-P','CSAP','ISO 27701','CSA STAR','ISO 27017'].map(t=>`<div class="cell" style="height:52px">${t}</div>`).join('')}</div></div></div>`},
    {type:'newsroom',label:'뉴스룸',variants:[{id:'c3',label:'3열 카드'},{id:'tab',label:'탭'}],
     render:v=>{const c=(t)=>`<div class="card" style="padding:0;overflow:hidden"><div class="visual" style="aspect-ratio:16/9;border-radius:0;border:none;border-bottom:1px solid var(--line)"></div><div style="padding:16px"><div class="muted" style="font-size:13px;font-weight:600">${t}</div><h3 style="font-size:16px;margin:6px 0">소식 제목이 들어갑니다</h3><div class="muted" style="font-size:13px">2026. 07. 03</div></div></div>`;
       return `<div class="band"><div class="container">${head('Newsroom','새로운 소식','')}<div class="grid cols-3" style="margin-top:32px">${c('공지사항')}${c('활용팁')}${c('이벤트')}</div></div></div>`;}},
  ],
  manual:[
    {type:'toc',label:'TOC / 목차',variants:[{id:'sticky',label:'sticky 사이드'},{id:'inline',label:'인라인 앵커'}],
     render:v=>`<div class="band"><div class="container"><div class="toc" style="max-width:${v==='sticky'?'280px':'100%'}"><div style="font-weight:600;margin-bottom:8px">목차</div><a>1. 시작하기</a><a>2. 기본 설정</a><a>3. 사용 방법</a><a>4. 문제 해결</a></div></div></div>`},
    {type:'prerequisite',label:'Prerequisite / 준비',variants:[{id:'chk',label:'체크리스트'},{id:'callout',label:'콜아웃'}],
     render:v=>{if(v==='callout')return `<div class="band"><div class="container"><div class="callout info"><b>시작하기 전에</b><p class="muted" style="margin:6px 0 0">${H.sample}</p></div></div></div>`;
       return `<div class="band"><div class="container">${head('준비사항','시작 전 확인하세요','',false)}<ul class="chk" style="margin-top:16px"><li>계정이 생성되어 있어야 합니다</li><li>관리자 권한이 필요합니다</li><li>최신 버전으로 업데이트하세요</li></ul></div></div>`;}},
    {type:'step',label:'Step / 절차',variants:[{id:'num',label:'세로번호'},{id:'shot',label:'스샷+텍스트'},{id:'acc',label:'아코디언'}],
     render:v=>{const s=(i,t)=>`<div class="step"><div class="n">${i}</div><div><h3 style="font-size:16px">${t}</h3><p class="muted" style="margin-top:4px">${H.sample}</p>${v==='shot'?'<div class="visual" style="margin-top:12px;aspect-ratio:16/6">스크린샷</div>':''}</div></div>`;
       return `<div class="band"><div class="container">${head('절차','따라 하기','',false)}<div style="margin-top:16px">${s(1,'첫 번째 단계')}${s(2,'두 번째 단계')}${s(3,'세 번째 단계')}</div></div></div>`;}},
    {type:'callout',label:'Callout / 노트',variants:[{id:'info',label:'info'},{id:'warn',label:'warning'},{id:'tip',label:'tip'},{id:'danger',label:'danger'}],
     render:v=>{const map={info:['참고','info'],warn:['주의','warn'],tip:['팁','tip'],danger:['경고','danger']};const[t,c]=map[v]||map.info;
       return `<div class="band"><div class="container"><div class="callout ${c}"><b>${t}</b><p class="muted" style="margin:6px 0 0">${H.sample}</p></div></div></div>`;}},
    {type:'specTable',label:'Spec Table / 사양',variants:[{id:'kv',label:'key-value'},{id:'compare',label:'비교표'}],
     render:v=>`<div class="band"><div class="container">${head('사양','상세 정보','',false)}<table class="spec" style="margin-top:16px"><tr><td>항목 A</td><td>값이 들어갑니다</td></tr><tr><td>항목 B</td><td>값이 들어갑니다</td></tr><tr><td>항목 C</td><td>값이 들어갑니다</td></tr></table></div></div>`},
    {type:'troubleshooting',label:'Troubleshooting',variants:[{id:'acc',label:'아코디언'},{id:'table',label:'증상-원인-해결'}],
     render:v=>{if(v==='table')return `<div class="band"><div class="container">${head('문제 해결','증상별 해결','',false)}<table class="spec" style="margin-top:16px"><tr><td style="background:var(--bg-2);font-weight:600">증상</td><td style="background:var(--bg-2);font-weight:600">해결</td></tr><tr><td>로그인이 안 돼요</td><td>${H.sample}</td></tr><tr><td>알림이 안 와요</td><td>${H.sample}</td></tr></table></div></div>`;
       const q=(t)=>`<div class="card" style="padding:16px 18px"><b>${t}</b><p class="muted" style="margin:8px 0 0">${H.sample}</p></div>`;
       return `<div class="band"><div class="container">${head('문제 해결','자주 있는 문제','',false)}<div class="grid" style="margin-top:16px;gap:10px">${q('로그인이 안 돼요')}${q('알림이 안 와요')}</div></div></div>`;}},
    {type:'media',label:'Media',variants:[{id:'img',label:'캡션이미지'},{id:'video',label:'비디오'},{id:'code',label:'코드블록'}],
     render:v=>{if(v==='code')return `<div class="band"><div class="container"><pre style="background:var(--ink);color:#e8e8e8;padding:18px;border-radius:10px;font-family:var(--font-mono);font-size:13px;overflow:auto">$ onsite init\n$ onsite deploy</pre></div></div>`;
       return `<div class="band"><div class="container"><div class="visual" style="aspect-ratio:16/9">${v==='video'?'동영상':'이미지'}</div><p class="muted center" style="margin-top:10px;font-size:13px">그림 1. 캡션이 들어갑니다</p></div></div>`;}},
  ],
};
const CAT_LABEL={common:'공통',product:'제품소개',manual:'매뉴얼'};

/* ===== 상태 ===== */
let pageType='product';
let canvasBlocks=[]; // {uid,cat,type,variant}
let uidSeq=1;

/* ===== 라이브러리 렌더 ===== */
function findSection(cat,type){return SECTIONS[cat].find(s=>s.type===type);}
function buildLib(filter=''){
  const list=document.getElementById('libList');
  const cats = pageType==='product'?['common','product']:['common','manual'];
  list.innerHTML = cats.map(cat=>{
    const secs=SECTIONS[cat].filter(s=>!filter || s.label.toLowerCase().includes(filter)|| s.variants.some(v=>v.label.toLowerCase().includes(filter)));
    if(!secs.length)return '';
    return `<div class="cat"><div class="cat-h">${CAT_LABEL[cat]} <span class="cnt">${secs.length}</span></div>${
      secs.map(s=>`<div class="sec-row"><div class="sec-name">${s.label}</div><div class="vchips">${
        s.variants.map(v=>`<div class="vchip" draggable="true" data-cat="${cat}" data-type="${s.type}" data-variant="${v.id}">${v.label}</div>`).join('')
      }</div></div>`).join('')
    }</div>`;
  }).join('');
  bindChips();
}

/* ===== 드래그 & 호버 ===== */
let dragData=null;
function bindChips(){
  document.querySelectorAll('.vchip').forEach(chip=>{
    chip.addEventListener('dragstart',e=>{dragData={cat:chip.dataset.cat,type:chip.dataset.type,variant:chip.dataset.variant};chip.classList.add('dragging');});
    chip.addEventListener('dragend',()=>{chip.classList.remove('dragging');dragData=null;hideDropLines();});
    chip.addEventListener('mouseenter',e=>showPreview(chip));
    chip.addEventListener('mousemove',movePreview);
    chip.addEventListener('mouseleave',hidePreview);
  });
}
const preview=document.getElementById('preview'),pvBody=document.getElementById('pvBody'),pvHead=document.getElementById('pvHead');
function showPreview(chip){
  const s=findSection(chip.dataset.cat,chip.dataset.type);
  pvHead.textContent=`${s.label} · ${chip.textContent}`;
  pvBody.innerHTML=s.render(chip.dataset.variant);
  preview.style.display='block';
  // 칩 우측에 초기 배치 (mousemove 전에도 보이게)
  const r=chip.getBoundingClientRect(),w=360,h=270,pad=12;
  let x=r.right+pad,y=r.top;
  if(x+w>innerWidth)x=r.left-w-pad;
  if(y+h>innerHeight)y=innerHeight-h-pad;
  preview.style.left=Math.max(pad,x)+'px';preview.style.top=Math.max(pad,y)+'px';
}
function movePreview(e){
  const pad=14,w=360,h=270;
  let x=e.clientX+pad,y=e.clientY+pad;
  if(x+w>innerWidth)x=e.clientX-w-pad;
  if(y+h>innerHeight)y=innerHeight-h-pad;
  preview.style.left=x+'px';preview.style.top=y+'px';
}
function hidePreview(){preview.style.display='none';}

/* ===== 캔버스 ===== */
const canvas=document.getElementById('canvas');
const EMPTY_HTML=`<div class="empty"><div class="big">여기로 섹션을 끌어다 놓으세요</div><div>좌측에서 섹션 케이스를 드래그 → 페이지 조립</div></div>`;
function renderCanvas(){
  if(!canvasBlocks.length){canvas.innerHTML=EMPTY_HTML;return;}
  canvas.innerHTML=canvasBlocks.map((b,i)=>{
    const s=findSection(b.cat,b.type);
    const vlabel=s.variants.find(v=>v.id===b.variant)?.label||b.variant;
    return `<div class="block" data-uid="${b.uid}" data-idx="${i}">
      <div class="block-tag">${s.label} · ${vlabel}</div>
      <div class="block-bar">
        <button data-act="up" title="위로">↑</button>
        <button data-act="down" title="아래로">↓</button>
        <button data-act="del" title="삭제">✕</button>
      </div>
      <div class="drop-line" data-drop="${i}"></div>
      <div class="sx">${s.render(b.variant)}</div>
    </div>`;
  }).join('') + `<div class="drop-line" data-drop="${canvasBlocks.length}"></div>`;
  canvas.querySelectorAll('.block-bar button').forEach(btn=>{
    btn.addEventListener('click',e=>{
      const uid=+btn.closest('.block').dataset.uid;const act=btn.dataset.act;
      const idx=canvasBlocks.findIndex(b=>b.uid===uid);
      if(act==='del')canvasBlocks.splice(idx,1);
      if(act==='up'&&idx>0)[canvasBlocks[idx-1],canvasBlocks[idx]]=[canvasBlocks[idx],canvasBlocks[idx-1]];
      if(act==='down'&&idx<canvasBlocks.length-1)[canvasBlocks[idx+1],canvasBlocks[idx]]=[canvasBlocks[idx],canvasBlocks[idx+1]];
      renderCanvas();
    });
  });
}
function hideDropLines(){canvas.querySelectorAll('.drop-line').forEach(l=>l.classList.remove('show'));}
function dropIndexFromEvent(e){
  const blocks=[...canvas.querySelectorAll('.block')];
  for(const bl of blocks){const r=bl.getBoundingClientRect();if(e.clientY<r.top+r.height/2)return +bl.dataset.idx;}
  return canvasBlocks.length;
}
canvas.addEventListener('dragover',e=>{
  if(!dragData)return;e.preventDefault();canvas.classList.add('drag-over');
  const idx=dropIndexFromEvent(e);hideDropLines();
  const line=canvas.querySelector(`.drop-line[data-drop="${idx}"]`);if(line)line.classList.add('show');
});
canvas.addEventListener('dragleave',e=>{if(!canvas.contains(e.relatedTarget)){canvas.classList.remove('drag-over');hideDropLines();}});
canvas.addEventListener('drop',e=>{
  if(!dragData)return;e.preventDefault();canvas.classList.remove('drag-over');
  const idx=dropIndexFromEvent(e);
  canvasBlocks.splice(idx,0,{uid:uidSeq++,...dragData});
  hideDropLines();renderCanvas();
});

/* ===== 페이지타입 전환 ===== */
document.getElementById('ptype').addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn)return;
  document.querySelectorAll('#ptype button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  pageType=btn.dataset.pt;buildLib(document.getElementById('search').value.toLowerCase());
});
document.getElementById('search').addEventListener('input',e=>buildLib(e.target.value.toLowerCase()));
document.getElementById('clearBtn').addEventListener('click',()=>{if(canvasBlocks.length&&confirm('캔버스를 비울까요?')){canvasBlocks=[];renderCanvas();}});

/* ===== 내보내기 ===== */
document.getElementById('exportBtn').addEventListener('click',()=>{
  const body=canvasBlocks.map(b=>`  <section class="sx">${findSection(b.cat,b.type).render(b.variant)}</section>`).join('\n');
  const css=document.querySelector('style').textContent.split('/* ====')[0]; // 토큰만 대략
  const doc=`<!DOCTYPE html>\n<html lang="ko"><head><meta charset="UTF-8">\n<title>ONSITE 생성 페이지</title>\n<!-- styles/tokens.css + global.css 링크 권장 -->\n</head>\n<body>\n${body}\n</body></html>`;
  document.getElementById('exportCode').value=doc;
  document.getElementById('modalBg').classList.add('on');
});
document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modalBg').classList.remove('on'));
document.getElementById('copyBtn').addEventListener('click',()=>{
  const ta=document.getElementById('exportCode');ta.select();document.execCommand('copy');
  document.getElementById('copyBtn').textContent='복사됨 ✓';setTimeout(()=>document.getElementById('copyBtn').textContent='복사',1500);
});

/* init */
buildLib();renderCanvas();
</script>
</body>
</html>
